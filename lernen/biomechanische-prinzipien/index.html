<header class="top">
  <h1>Biomechanische Prinzipien</h1>
  <p>Warum springt man mit Ausholbewegung höher, warum stößt man mit langem Weg weiter, warum dreht sich der Salto in der Hocke schneller? Sechs Labore mit Zeitlupe, Diagrammen und Aufgaben. Alle Werte stammen aus vereinfachten Modellen.</p>

<script>
(function(){
'use strict';
/* =============== Physik der Labore (rein rechnerisch) =============== */
const G=9.81;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=x=>{ x=clamp(x,0,1); return x*x*(3-2*x); };

/* 1 Anfangskraft: vollständiger Sprung wie auf einer Kraftmessplatte (Stand, Eintauchen, Abdruck, Flug, Landung) */
const F_ISO=2.0;
function simInit(p){
  const m=p.m, mg=m*G, d=p.d, dt=0.002, kappa=0.8;
  const rho=Math.exp(-p.wait/250), F0eff=F_ISO+(p.F0f-F_ISO)*rho, Fs=F0eff*mg;
  if(Fs<=mg*1.0001) return {ok:false,F0:F0eff,mg,reason:'Die Anfangskraft ist nicht größer als die Gewichtskraft: Es gibt keine Beschleunigung nach oben.'};
  const cm=p.F0f>F_ISO+0.01;
  let cmA=null;
  if(cm){
    const run=tu=>{ const U=0.6, tb0=0.75*tu, Bk=(p.F0f-1)*mg; let v=0,y=0,ymin=0; const T=[],F=[],V=[],Y=[];
      for(let k=0;k<2500;k++){ const t=k*dt, dip=t<tu?-U*mg*Math.pow(Math.sin(Math.PI*t/tu),2):0, f=mg+dip+Bk*smooth((t-tb0)/0.05); T.push(t); F.push(f); V.push(v); Y.push(y); v+=(f-mg)/m*dt; y+=v*dt; if(y<ymin) ymin=y; if(t>tb0&&v>=0){ T.push(t+dt); F.push(f); V.push(v); Y.push(y); break; } }
      return {T,F,V,Y,depth:-ymin}; };
    let lo=0.08,hi=0.9; for(let i=0;i<40;i++){ const mid=(lo+hi)/2; if(run(mid).depth<kappa*d) lo=mid; else hi=mid; } cmA=run((lo+hi)/2);
  }
  const t=[],F=[],v=[],e=[],z=[]; let tt=0,vv=0,yb=cm?cmA.depth:0; const eOf=y=>clamp(y/d,0,1);
  const add=(f,ee,zz)=>{ t.push(tt); F.push(f); v.push(vv); e.push(ee); z.push(zz||0); };
  const marks={}; const tq=0.3;
  for(;tt<tq;tt+=dt) add(mg,eOf(yb),0);
  marks.q=tt;
  if(cm){ marks.cm=tt; const y0=cmA.depth; for(let k=0;k<cmA.T.length;k++){ vv=cmA.V[k]; yb=cmA.Y[k]+y0; add(cmA.F[k],eOf(yb),0); tt+=dt; } vv=Math.max(0,vv); yb=Math.max(0,yb); }
  let fcur=F[F.length-1];
  if(cm&&p.wait>0){ vv=0; for(let k=0;k<Math.round(p.wait/1000/dt);k++){ add(mg,eOf(yb),0); tt+=dt; } fcur=mg; }
  marks.push=tt; const ftar=y=>Fs+(p.F1f*mg-Fs)*Math.min(1,Math.max(0,y)/d); const f0=fcur, tr=Math.abs(Fs-fcur)>0.02*mg?0.03:0; let tp=0,Jp=0,Fpk=0;
  while(yb<d&&tt<marks.push+1.5){ let f=ftar(yb); if(tr>0&&tp<tr) f=f0+(f-f0)*tp/tr; add(f,eOf(yb),0); Fpk=Math.max(Fpk,f); vv+=(f-mg)/m*dt; yb+=Math.max(vv,0)*dt; if(vv<0){ vv=0; } Jp+=f*dt; tt+=dt; tp+=dt; if(tp>0.15&&vv<=1e-6) return {ok:false,F0:F0eff,mg,reason:'Die Kraft fällt unter die Gewichtskraft, bevor der Körper abhebt.'}; }
  if(yb<d) return {ok:false,F0:F0eff,mg,reason:'Die Kraft reicht nicht für einen Absprung.'};
  const vTO=vv; marks.to=tt; const tf=2*vTO/G;
  for(let k=0;k<Math.round(tf/dt);k++){ const s=(k+1)*dt; vv=vTO-G*s; add(0,1,vTO*s-0.5*G*s*s); tt+=dt; }
  marks.land=tt; const tl=0.22, Pl=mg+Math.PI/2*m*vTO/tl; vv=-vTO; let ybl=d;
  for(let k=0;k<Math.round(tl/dt);k++){ const s=(k+1)*dt, f=mg+(Pl-mg)*Math.sin(Math.PI*s/tl); add(f,eOf(ybl),0); vv+=(f-mg)/m*dt; ybl+=vv*dt; tt+=dt; }
  marks.landEnd=tt; const eEnd=eOf(ybl);
  for(let k=0;k<Math.round(0.3/dt);k++){ add(mg,lerp(eEnd,0.8,smooth(k/(0.25/dt))),0); tt+=dt; }
  const h=vTO*vTO/(2*G);
  return {ok:true,dt,t,F,v,e,z,mg,F0:F0eff,vTO,h,tf,tPush:marks.to-marks.push,T:tt,marks,cm,depth:cm?cmA.depth:0,Pland:Pl,Ppush:Fpk,Fmin:Math.min(...F.slice(0,Math.round(marks.push/dt))),Jnet:m*vTO,m,d};
}
/* 2 Beschleunigungsweg: Kraft sinkt mit der Geschwindigkeit (Kraft-Geschwindigkeits-Beziehung) */
function rangeOf(v,a,h0){ const ar=a*Math.PI/180, s=Math.sin(ar), c=Math.cos(ar); return v*c/G*(v*s+Math.sqrt(v*v*s*s+2*G*h0)); }
function simPath(p){
  const dt=0.0005; let t=0,v=0,s=0; const gs=[0],gv=[0]; let nextG=0.01; const ts=[0],vs=[0],ss=[0],Fs=[p.Fmax]; let tHit=null,k=0;
  while(s<3.0&&t<4){ const F=p.Fmax*Math.max(0,1-v/p.vmax); v+=F/p.m*dt; s+=v*dt; t+=dt; k++;

const SEGC=['var(--vel)','var(--pos)','var(--force)'], SEGN=['Beine, Hüfte','Rumpf, Schulter','Arm, Hand'];
function sceneChain(sim,p,t){

  for(let i=0;i<3;i++){ const u=chainU(p,i,t); s+=`<rect x="14" y="${208+i*17}" width="11" height="11" rx="2" style="fill:${SEGC[i]}"/><text x="30" y="${218+i*17}" font-size="11.5" font-weight="700">${SEGN[i]}: ${de(u,1)} m/s</text>`; }
  s+=`<line x1="${bx-8}" x2="${bx+bw+90}" y1="${f1(base-sim.vEnd*k)}" y2="${f1(base-sim.vEnd*k)}" stroke="var(--acc)" stroke-width="2" stroke-dasharray="5 4"/><text x="${bx+bw+12}" y="${f1(base-sim.vEnd*k-5)}" font-size="11" font-weight="700" style="fill:var(--acc)">Maximum der Summe: ${de(sim.vEnd,1)} m/s</text>`;

const TUCK={ // Gelenkpunkte relativ zum Körperschwerpunkt (m): Kopf, Schulter, Hüfte, Knie, Knöchel, Ellbogen, Hand
  lay:{head:[0,0.86],sh:[0,0.6],hip:[0,0],kn:[0,-0.46],an:[0,-0.92],el:[0,0.88],ha:[0,1.14]},

function sceneSalto(sim,p,t){
  const i=Math.min(sim.t.length-1,Math.round(t/0.002)), k=92, gy=240; const th=sim.th[i]*Math.PI/180, lam=sim.lam[i]; let s=ground(gy);

  const J=n=>[lerp(TUCK.lay[n][0],TUCK.tuck[n][0],lam),lerp(TUCK.lay[n][1],TUCK.tuck[n][1],lam)];
  const R=pt=>{ const x=pt[0],y=pt[1]; const rx=x*Math.cos(th)+y*Math.sin(th), ry=-x*Math.sin(th)+y*Math.cos(th); return [cx+rx*k,cy-ry*k]; };
  const hd=R(J('head')),sh=R(J('sh')),hp=R(J('hip')),kn=R(J('kn')),an=R(J('an')),el=R(J('el')),ha=R(J('ha'));
  // Flugbahn
  const tr=[]; for(let j=0;j<=30;j++){ const q=sim.tf*j/30; tr.push([x0+vx*q*k*1.9,gy-(0.98+p.vy*q-0.5*G*q*q)*k]); } s+=`<path d="${pathOf(tr)}" fill="none" stroke="var(--ref)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  s+=`<path d="M${f1(an[0])} ${f1(an[1])} L${f1(kn[0])} ${f1(kn[1])} L${f1(hp[0])} ${f1(hp[1])} L${f1(sh[0])} ${f1(sh[1])}" ${bodyStroke}/><path d="M${f1(sh[0])} ${f1(sh[1])} L${f1(el[0])} ${f1(el[1])} L${f1(ha[0])} ${f1(ha[1])}" stroke="var(--body-c)" stroke-width="5" stroke-linecap="round" fill="none"/><circle cx="${f1(hd[0])}" cy="${f1(hd[1])}" r="9" style="fill:var(--body-c)"/><circle cx="${f1(cx)}" cy="${f1(cy)}" r="3" style="fill:var(--acc)"/>`;
  s+=`<text x="12" y="20" font-size="11.5" font-weight="700">Drehung ${de(sim.th[i],0)}° · ω = ${de(sim.w[i],1)} rad/s</text><text x="12" y="36" font-size="11" class="tx2">I = ${de(sim.I[i],1)} kg·m²</text><text x="12" y="52" font-size="11" class="tx2">L = ${de(p.L,0)} kg·m²/s (konstant)</text>`;
  return SVGH(s,'Salto: Körperhaltung und Drehung in der Flugphase');
}
function scenePirouette(sim,p,t){

  mission:{t:'Erreiche mit der 7,26-kg-Kugel mindestens 20 m Wurfweite.',ok:(s,p)=>s.R>=20},
  plots:(s,p,ref)=>{ const gs=s.gs, P1={x:[0,3],y:[0,Math.ceil(Math.max(...s.gv,ref?Math.max(...ref.sim.gv):0)/5)*5],xl:'Beschleunigungsweg in m',yl:'v in m/s',series:[],mk:[{x:p.s,y:s.vEnd,c:C_F}],vl:[{x:p.s,c:C_F}],cx:t=>{ if(!s.tPush) return p.s; if(t>=s.tPush) return p.s; const i=Math.min(s.ss.length-1,Math.round(t/s.tPush*(s.ss.length-1))); return s.ss[i]; },leg:[{c:C_V,t:'v(s)'}]};
    if(ref){ P1.series.push({x:ref.sim.gs,y:ref.sim.gv,c:C_R,dash:'5 4',w:2}); P1.leg.push({c:C_R,t:'Vergleich',dash:'5 4'}); } P1.series.push({x:gs,y:s.gv,c:C_V});
    const xs=[],ys=[]; for(let q=0.3;q<=3.0001;q+=0.05){ xs.push(q); ys.push(rangeOf(s.vAt(q),p.alpha,p.h0)); }
    const P2={x:[0,3],y:[0,Math.ceil(Math.max(...ys)/5)*5],xl:'Beschleunigungsweg in m',yl:'Wurfweite in m',series:[{x:xs,y:ys,c:C_F}],mk:[{x:p.s,y:s.R,c:C_F}],vl:[{x:p.s,c:C_F}],cx:P1.cx}; return [P1,P2]; },
  scene:scenePath, info:(s,p)=>`Weg ${de(p.s,2)} m · v = ${de(s.vEnd,1)} m/s · Wurfweite <b>${de(s.R,1)} m</b>`};

/* ---- 3 Teilimpulse ---- */
LABS.chain={n:3,short:'Teilimpulse',pick:'Teil\u00ADimpulse',title:'Prinzip der zeitlichen Koordination von Teilimpulsen',
  stmt:'Die Teilimpulse der beteiligten Körperteile müssen zeitlich so abgestimmt sein, dass sich ihre Geschwindigkeitsbeiträge zum Zeitpunkt der Endgeschwindigkeit möglichst gut addieren.',
  ex:'Wurf, Stoß, Schlag, Sprungwurf: Beine, Rumpf, Arm, Hand nacheinander',
  def:()=>({A:[4,4.5,5],D:[0.30,0.20,0.12],t:[0,0.30,0.50]}),
  sliders:[],
  presets:[{t:'Nacheinander',d:'ohne Überlappung',set:{t:[0,0.30,0.50]}},{t:'Alle gleichzeitig',d:'Einsatz bei t = 0',set:{t:[0,0,0]}},{t:'Arm zu spät',d:'Hand setzt nach dem Rumpf ein',set:{t:[0,0.05,0.28]}},{t:'Abgestimmt',d:'Maxima fallen zusammen',set:'opt'}],
  sim:p=>simChain(p), base:p=>simChain(p), T:s=>s.T,
  kpis:(s,p)=>[[de(s.vEnd,1)+' m/s','Endgeschwindigkeit (Maximum der Summe)'],[de(s.eff*100,0)+' %','Anteil der Summe aller Einzelmaxima'],[de(s.tRel*1000,0)+' ms','Zeitpunkt des Maximums'],[de(s.sumA,1)+' m/s','Summe der Einzelmaxima (Höchstwert)']],
  verdict:(s,p)=>{ const sp=Math.max(...s.peaks)-Math.min(...s.peaks); return `Die Endgeschwindigkeit beträgt ${de(s.vEnd,1)} m/s, das sind ${de(s.eff*100,0)} % des Höchstwerts ${de(s.sumA,1)} m/s. Die Geschwindigkeitsmaxima der drei Teilimpulse liegen ${de(sp*1000,0)} ms auseinander. ${s.eff>0.97?'Sie fallen fast zusammen: Die Beiträge addieren sich voll.':'Je weiter die Maxima auseinanderliegen, desto weniger addieren sie sich.'} Annahme des Modells: Jedes Gelenk liefert einen Beitrag, der anwächst und wieder abklingt. In manchen Büchern wird die Abstimmung anders beschrieben (zum Beispiel „der nächste Teilimpuls setzt ein, wenn der vorherige sein Maximum erreicht hat“). Prüfe die Formulierung deines Buches.`; },
  observe:['Beginne mit „Nacheinander“: Das Maximum ist nur so hoch wie der größte Einzelbeitrag.','Verschiebe den Einsatz von Rumpf und Arm mit den Reglern und beobachte die Summenkurve.','Wo liegen bei „Abgestimmt“ die Maxima der drei Kurven?'],
  mission:{t:'Erreiche mindestens 95 % der größtmöglichen Endgeschwindigkeit.',ok:(s)=>s.eff>=0.95},
  plots:(s,p,ref)=>{ const ts=s.ts.map(x=>x*1000), ymax=Math.ceil(s.sumA/2)*2+1; const ser=[]; if(ref) ser.push({x:ref.sim.ts.map(x=>x*1000),y:ref.sim.Sm,c:C_R,dash:'5 4',w:2});
    for(let i=0;i<3;i++) ser.push({x:ts,y:s.U[i],c:[C_V,C_P,C_F][i],w:2});
    ser.push({x:ts,y:s.Sm,c:C_INK,w:3.2});
    return [{x:[0,Math.ceil(s.T*1000/100)*100],y:[0,ymax],xl:'Zeit in ms',yl:'v in m/s',series:ser,hl:[{y:s.sumA,c:C_R,l:'Summe der Maxima'}],mk:[{x:s.tRel*1000,y:s.vEnd,c:'var(--acc)'}],cx:t=>t*1000,leg:[{c:C_V,t:'Beine'},{c:C_P,t:'Rumpf'},{c:C_F,t:'Arm'},{c:C_INK,t:'Summe'}]}]; },

const CURVE_PRE=[{t:'Ideal',d:'schnell aufbauen, hoch bleiben',f:[1,1,1,1,1,1,1]},{t:'Stetig ansteigend',d:'langsam aufbauen',f:[0.3,0.45,0.6,0.75,0.9,1,1]},{t:'Kraftloch',d:'Einbruch in der Mitte',f:[1,1,1,0.4,1,1,1]},{t:'Früher Gipfel',d:'Kraft fällt ab',f:[1,1,0.8,0.6,0.45,0.35,0.3]},{t:'Später Anstieg',d:'zu spät aktiviert',f:[0.1,0.2,0.35,0.55,0.8,1,1]}];
LABS.curve={n:4,short:'Beschleunigungsverlauf',pick:'Verlauf',title:'Prinzip der optimalen Tendenz im Beschleunigungsverlauf',
  stmt:'Bei Bewegungen auf hohe Endgeschwindigkeit soll der Kraft- und Beschleunigungsverlauf bis zum Ende hoch bleiben. Kraftlöcher, frühe Gipfel und ein später Kraftaufbau kosten Kraftstoß.',
  ex:'Stoßen, Werfen, Schlagen, Sprinten: Kraft steigt schnell an und bricht nicht ein',
  def:()=>({f:[1,1,1,1,1,1,1]}),sliders:[],
  presets:CURVE_PRE.map(q=>({t:q.t,d:q.d,set:{f:q.f}})),
  sim:p=>simCurve(p.f), base:p=>simCurve([1,1,1,1,1,1,1]), T:s=>CURVE_T+0.02,
  kpis:(s,p,b)=>[[de(s.vEnd,1)+' m/s','Endgeschwindigkeit'],[de(s.vEnd/b.vEnd*100,0)+' %','Anteil vom Ideal'],[de(s.J,0)+' N·s','Kraftstoß ∫F dt'],[de(Math.max(...s.F),0)+' N','größte Kraft']],
  verdict:(s,p,b)=>`Mit diesem Kraftverlauf erreicht das Gerät ${de(s.vEnd,1)} m/s, das sind ${de(s.vEnd/b.vEnd*100,0)} % des Ideals. Der Kraftstoß ∫F dt (Fläche unter der Kurve) bestimmt die Geschwindigkeit: v = ∫F dt / m. Die gestrichelte Linie zeigt, wie schnell die Kraft höchstens aufgebaut werden kann (Aktivierung der Muskeln). Das Ideal folgt dieser Linie und bleibt dann hoch.`,
  observe:['Wähle nacheinander alle Kurven und vergleiche die Endgeschwindigkeit.','Ziehe einzelne Punkte im Diagramm nach oben oder unten oder nutze die Pfeiltasten.','Was kostet ein Kraftloch, was ein früher Gipfel?'],
  mission:{t:'Gestalte den Verlauf so, dass du mindestens 97 % des Ideals erreichst.',ok:(s,p,b)=>s.vEnd/b.vEnd>=0.97},
  plots:(s,p,ref)=>{ const tm=s.ts.map(x=>x*1000), cap=s.ts.map(capF), nodes=p.f.map((f,i)=>({x:i*CURVE_T/(CURVE_N-1)*1000,y:s.node[i],i,v:f}));
    const P1={x:[0,CURVE_T*1000*1.05],y:[0,CURVE_FMAX*1.1],xl:'Zeit in ms',yl:'Kraft in N',series:[{x:tm,y:cap,c:C_R,dash:'5 4',w:2}],pts:nodes,cx:t=>t*1000,leg:[{c:C_F,t:'Kraft F'},{c:C_R,t:'mögliche Kraft',dash:'5 4'}]};
    if(ref) P1.series.push({x:ref.sim.ts.map(x=>x*1000),y:ref.sim.F,c:C_R,w:2,op:.7}); P1.series.push({x:tm,y:s.F,c:C_F});
    const P2={x:[0,CURVE_T*1000*1.05],y:[0,13],xl:'Zeit in ms',yl:'v in m/s',series:[{x:tm,y:s.v,c:C_V}],cx:t=>t*1000}; return [P1,P2]; },
  scene:sceneCurve, edit:true, info:(s,p)=>`Endgeschwindigkeit <b>${de(s.vEnd,1)} m/s</b> · Kraftstoß ${de(s.J,0)} N·s`};

/* ---- 5 Gegenwirkung ---- */
LABS.react={n:5,short:'Gegenwirkung',pick:'Gegen\u00ADwirkung',title:'Prinzip der Gegenwirkung',
  stmt:'Kräfte treten immer paarweise auf: Die Kraft von A auf B ist so groß wie die Kraft von B auf A (actio = reactio). Um Kraft wirksam einzusetzen, braucht man ein festes Widerlager.',
  ex:'Abstoßen vom Boden, Startblock, Stemmschritt, Stand beim Stoßen, Rückstoß',
  def:()=>({mode:'push',M:70,m:6,u:12,dur:0.25,mu:0.3,acap:6.5,tb:0.35,mus:0.5,Ms:75}),
  modes:[['push','Rückstoß beim Werfen'],['sprint','Sprintstart']],
  slidersBy:{push:[sl('M','Masse des Werfers','in kg',45,100,1,0),sl('m','Masse des Balls','in kg (Medizinball)',1,12,0.5,1),sl('mu','Haftreibungszahl μ des Bodens','0,05 Eis, 0,3 glatter Hallenboden, 0,8 Gummi oder Spikes',0,1,0.05,2)],
    sprint:[sl('mus','Haftreibungszahl μ der Bahn','0,35 nass, 0,6 trocken, 1,0 Spikes',0.2,1.2,0.05,2),sl('acap','Muskelbedingte Beschleunigung','größte Beschleunigung, die die Beine erzeugen, in m/s²',4,9,0.25,2),sl('Ms','Masse des Läufers','in kg',50,100,1,0)]},
  presetsBy:{push:[{t:'Eis',d:'μ = 0,05',set:{mu:0.05}},{t:'Glatter Hallenboden',d:'μ = 0,3',set:{mu:0.3}},{t:'Gummiboden',d:'μ = 0,8',set:{mu:0.8}}],sprint:[{t:'Nasse Bahn',d:'μ = 0,35',set:{mus:0.35}},{t:'Trockene Bahn',d:'μ = 0,6',set:{mus:0.6}},{t:'Spikes',d:'μ = 1,0',set:{mus:1.0}}]},
  sim:p=>p.mode==='push'?simReact(p):simSprint({mu:p.mus,acap:p.acap,tb:p.tb,M:p.Ms}), base:p=>null,
  T:(s,p)=>p.mode==='push'?s.T:Math.max(s.free.t10,s.block.t10)+0.1,
  kpis:(s,p)=>p.mode==='push'?[[de(s.vBall,2)+' m/s','Geschwindigkeit des Balls'],[de(s.vRecoil,2)+' m/s','Rückstoß des Werfers'],[de(s.frac*100,0)+' %','Anteil der möglichen Ballgeschwindigkeit'],[de(s.muCrit,2),'nötige Haftreibungszahl μ']]:[[de(s.free.t10,2)+' s','10 m ohne Startblock'],[de(s.block.t10,2)+' s','10 m mit Startblock'],[de(s.free.t10-s.block.t10,2)+' s','Gewinn durch den Block'],[de(s.aLim,1)+' m/s²','Grenze durch Reibung']],
  verdict:(s,p)=>p.mode==='push'?`Die Kraftmessplatte unter dem Werfer misst die waagerechte Reaktionskraft des Bodens: Sie folgt der nötigen Kraft, bis die Grenze μ·N erreicht ist (${de(s.cap,0)} N), danach ist sie gedeckelt und der Werfer rutscht. Der Werfer bringt den Ball relativ zu sich auf ${de(p.u,0)} m/s. Wenn der Boden nicht genug Haftung bietet (μ unter ${de(s.muCrit,2)}), rutscht der Werfer zurück: Die Gegenkraft des Balls schiebt ihn nach hinten und der Ball erreicht nur ${de(s.vBall,2)} m/s im Bodensystem. Der Impuls bleibt erhalten: m·v_Ball + M·v_Werfer = 0, solange der Boden nichts beiträgt. Mit fester Haftung wirkt der Boden als Widerlager.`:`Die waagerechte Platte zeigt ${de(s.block.FX[3],0)} N mit Block, ohne Block höchstens ${de(s.capF,0)} N (μ·m·g). Ohne Block begrenzt die Haftreibung die Beschleunigung auf ${de(s.aLim,1)} m/s². Der Startblock liefert eine Gegenkraft unabhängig vom Boden und hilft deshalb vor allem bei geringer Haftung (hier ${de(s.free.t10-s.block.t10,2)} s). Bei guter Haftung (μ ≥ ${de(p.acap/G,2)}) bremst die Reibung nicht, der Gewinn verschwindet.`,
  observe:['Senke die Haftreibungszahl: Ab welchem μ rutscht der Werfer und wo wird die Plattenkurve gedeckelt?','Prüfe die Impulsbilanz: Wie groß sind m·v_Ball und M·v_Werfer?','Im Sprintstart: Wie hoch ist die waagerechte Plattenkraft mit und ohne Block? Bei welchem μ bringt der Block nichts mehr?'],
  mission:{t:'Werfer: Wähle μ so, dass er nicht rutscht. Sprint: Finde ein μ, bei dem der Block mehr als 0,2 s bringt.',ok:(s,p)=>p.mode==='push'?s.frac>=0.999:(s.free.t10-s.block.t10>0.2)},
  plots:(s,p)=>{ if(p.mode==='push'){ const t=s.t.map(x=>x*1000), X=[0,Math.round(s.T*1000/100)*100], fm=Math.ceil(Math.max(...s.REQ,s.cap)/100)*100+60;
      return [{x:X,y:[Math.floor(Math.min(...s.VP)-1),Math.ceil(Math.max(...s.VB)+1)],xl:'Zeit in ms',yl:'v in m/s',series:[{x:t,y:s.VB,c:C_F},{x:t,y:s.VP,c:C_V}],hl:[{y:0,c:C_R}],cx:q=>q*1000,leg:[{c:C_F,t:'Ball'},{c:C_V,t:'Werfer'}]},
        {x:X,y:[0,fm],xl:'Zeit in ms',yl:'F waagerecht in N',series:[{x:t,y:s.REQ,c:C_R,dash:'5 4',w:2},{x:t,y:s.FR,c:C_P}],hl:[{y:s.cap,c:C_P,l:'Grenze μ·N'}],cx:q=>q*1000,leg:[{c:C_P,t:'Kraftmessplatte'},{c:C_R,t:'nötige Kraft',dash:'5 4'}]}]; }
    const X=[0,Math.max(s.free.t10,s.block.t10)]; return [{x:X,y:[0,10],xl:'Zeit in s',yl:'Weg in m',series:[{x:s.free.T,y:s.free.S,c:C_R},{x:s.block.T,y:s.block.S,c:C_F}],cx:q=>q,leg:[{c:C_R,t:'ohne Block'},{c:C_F,t:'mit Block'}]},{x:X,y:[0,Math.ceil(s.M*p.acap*1.1/100)*100],xl:'Zeit in s',yl:'F waagerecht in N',series:[{x:s.free.T,y:s.free.FX,c:C_R},{x:s.block.T,y:s.block.FX,c:C_F}],hl:[{y:s.capF,c:C_P,l:'Haftgrenze μ·m·g'}],cx:q=>q,leg:[{c:C_R,t:'Platte, ohne Block'},{c:C_F,t:'Platte, mit Block'}]}]; },
  scene:(s,p,t)=>p.mode==='push'?sceneReact(s,p,t):sceneSprint(s,p,t),
  info:(s,p)=>p.mode==='push'?`Ball <b>${de(s.vBall,2)} m/s</b> · Rückstoß ${de(s.vRecoil,2)} m/s`:`10 m: ohne Block ${de(s.free.t10,2)} s · <b>mit Block ${de(s.block.t10,2)} s</b>`};

LABS.rot={n:6,short:'Impulserhaltung',pick:'Drehimpuls',title:'Prinzip der Impulserhaltung (Drehimpulserhaltung)',

  verdict:(s,p)=>p.mode==='salto'?`Der Drehimpuls bleibt in der Luft konstant (${de(p.L,0)} kg·m²/s). In der Hocke sinkt I von ${de(s.Il,0)} auf ${de(s.It,0)} kg·m², die Drehgeschwindigkeit steigt auf das ${de(s.Il/s.It,1)}-fache. Insgesamt dreht sich der Körper um ${de(s.total,0)}°. ${s.stand?'Das passt zu einer aufrechten Landung.':s.n<1?'Das reicht nicht für eine ganze Drehung: Mehr Drehimpuls oder länger in der Hocke bleiben.':'Der Körper landet nicht aufrecht: Öffne die Hocke früher oder später.'} Die Kraftmessplatte zeigt in der Flugphase null: Es wirkt keine äußere Kraft und kein äußeres Drehmoment, deshalb bleibt L konstant. Der Drehimpuls entsteht nur beim Absprung. Hinweis: Der Salto ist hier nur ein Rechenmodell. Übe ihn nie ohne Anleitung und Hilfestellung.`:`Der Drehimpuls bleibt erhalten: L = I·ω. Das Trägheitsmoment sinkt um den Faktor ${de(s.ratio,1)}, die Drehzahl steigt deshalb von ${de(s.w0,1)} auf ${de(s.wIn,1)} Umdrehungen pro Sekunde. Die Rotationsenergie wächst um denselben Faktor, denn die Muskeln leisten Arbeit beim Heranziehen der Arme.`,
  observe:['Salto: Öffne die Hocke zu früh oder zu spät und beobachte die Landung.','Welche Größe ändert sich in der Luft, welche bleibt gleich?','Pirouette: Warum steigt die Rotationsenergie, obwohl der Drehimpuls gleich bleibt?'],

  PRINC.forEach(q=>{ h+=`<div class="card pcard"><h3 style="margin-top:0">${q.n}. ${esc(q.name)}</h3><div class="rule"><b>${esc(q.stmt)}</b></div><p style="margin:4px 0"><b>Typisch:</b> ${esc(q.ex)}</p><p style="margin:4px 0"><b>Physik dahinter:</b> ${esc(q.idea)}</p><p class="note"><b>Häufige Fehlvorstellung:</b> ${esc(q.err)}</p><div class="btnrow"><button type="button" class="btn primary" data-act="openlab" data-lab="${q.lab}">Im Labor ausprobieren</button></div></div>`; });
  h+=`<div class="card"><h2>Wo begegnet mir welches Prinzip?</h2><p class="lead">Tippe ein Feld an, dann erscheint die Erklärung.</p><div class="tscroll"><table class="mx"><thead><tr><th></th>${MXC.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>`;
  MATRIX.forEach((r,i)=>{ h+=`<tr><th scope="row">${esc(r[0])}</th>${[1,2,3,4,5,6].map(c=>r[1][c]?`<td><button type="button" data-act="mx" data-r="${i}" data-c="${c}" aria-pressed="${S.mx&&S.mx[0]===i&&S.mx[1]===c}" aria-label="${esc(r[0])}: ${esc(MXC[c-1])}">✓</button></td>`:'<td class="no"></td>').join('')}</tr>`; });
  h+=`</tbody></table></div>`; if(S.mx){ const r=MATRIX[S.mx[0]]; h+=`<div class="fb info" role="status"><b>${esc(r[0])}, ${esc(MXC[S.mx[1]-1])}:</b> ${esc(r[1][S.mx[1]])}</div>`; }
  h+=`<p class="note">Mehrere Prinzipien wirken in einer Bewegung gleichzeitig. Die Zuordnung zeigt, wo das Prinzip besonders gut zu beobachten ist.</p></div>`;
  $('#pane-over').innerHTML=h;
}

function sliderHTML(L,p){
  if(S.lab==='chain'){ const A=p.A; return `<div class="grid2">${[1,2].map(i=>`<div class="sl"><label class="fl" for="lc_${i}">Einsatz ${i===1?'Rumpf, Schulter':'Arm, Hand'}: <output id="lco_${i}">${de(p.t[i]*1000,0)} ms</output><small>Beginn des Teilimpulses nach dem Start der Beine</small></label><input type="range" id="lc_${i}" data-arr="t" data-idx="${i}" min="0" max="0.6" step="0.01" value="${p.t[i]}"></div>`).join('')}</div><details class="mode"><summary>Weitere Einstellungen: Stärke der Teilimpulse</summary><div class="grid2">${[0,1,2].map(i=>`<div class="sl"><label class="fl" for="la_${i}">${['Beine, Hüfte','Rumpf, Schulter','Arm, Hand'][i]}: <output id="lao_${i}">${de(A[i],1)} m/s</output><small>größter Geschwindigkeitsbeitrag</small></label><input type="range" id="la_${i}" data-arr="A" data-idx="${i}" min="1" max="8" step="0.5" value="${A[i]}"></div>`).join('')}</div></details>`; }
  if(S.lab==='curve') return `<p class="note">Ziehe die orangen Punkte im Diagramm (Ansicht „Diagramm“ oder „Beides“) nach oben oder unten. Mit den Pfeiltasten verstellst du den fokussierten Punkt. Wert 100 % bedeutet: so viel Kraft wie in diesem Moment höchstens möglich ist.</p><div class="legendrow">${p.f.map((f,i)=>`<span>Punkt ${i+1}: <b id="cf_${i}">${Math.round(f*100)} %</b></span>`).join('')}</div>`;
  const defs=L.slidersBy?L.slidersBy[p.mode]:L.sliders; return `<div class="grid2">${defs.map(q=>`<div class="sl"><label class="fl" for="lp_${q.k}">${q.label}: <output id="lo_${q.k}">${de(p[q.k],q.dec)}</output><small>${q.hint}</small></label><input type="range" id="lp_${q.k}" data-lp="${q.k}" min="${q.min}" max="${q.max}" step="${q.step}" value="${p[q.k]}"></div>`).join('')}</div>`;
}

function refreshLab(){ compute(); const e=$('#live'); if(e) e.innerHTML=liveHTML(); drawViewer(); }
function protocol(){ const L=curL(), p=curP(), k=L.kpis(S.sim,p,S.base).map(x=>x[1]+': '+x[0]); return [`Protokoll Labor ${L.n}: ${L.title}`,'Einstellungen: '+JSON.stringify(p).replace(/[{}"]/g,'').replace(/,/g,', '),...k,'Hinweis: vereinfachtes Lernmodell.'].join('\n'); }
function copyText(txt,btn,label){ const done=()=>{ if(btn){ const o=label||btn.textContent; btn.textContent='Kopiert'; setTimeout(()=>btn.textContent=o,1500); } }; if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,()=>{}); else { const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){} ta.remove(); } }

/* =============== Kraftmessplatte lesen =============== */
const FPCURVES=[{n:1,p:{m:75,F0f:2.3,F1f:1.1,d:0.5,wait:400}},{n:2,p:{m:75,F0f:2.3,F1f:1.1,d:0.5,wait:0}},{n:3,p:{m:75,F0f:2.0,F1f:1.1,d:0.5,wait:0}}];
const FPQ=[
 {q:'Welche Kurve gehört zum Sprung ohne Eintauchen (Squat Jump, Start aus der Hocke)?',opts:['Kurve 1','Kurve 2','Kurve 3'],ok:2,why:'Bei Kurve 3 sinkt die Kraft vor dem Abdruck nicht unter das Körpergewicht: Es gibt keine Abwärtsbewegung, die Kraft steigt direkt aus der Ruhe an.'},
 {q:'Bei welcher Kurve wartet die Person lange am tiefsten Punkt, bevor sie sich abdrückt?',opts:['Kurve 1','Kurve 2','Kurve 3'],ok:0,why:'Bei Kurve 1 liegt nach dem Eintauchen eine waagerechte Strecke bei der Gewichtskraft, erst danach steigt die Kraft an. Die Vorspannung ist verloren, die Sprunghöhe ist geringer als bei Kurve 2.'},
 {q:'Kurve 2: Lies die Flugzeit ab (Kraft = 0) und berechne die Sprunghöhe mit h = g·t²/8. Wie hoch springt die Person?',opts:['etwa 35 cm','etwa 70 cm','etwa 140 cm'],ok:0,why:'Die Flugzeit beträgt etwa 0,53 s. Aufwärts und abwärts dauern je die Hälfte, deshalb h = g·(t/2)²/2 = g·t²/8 ≈ 35 cm. Mit g·t²/2 (etwa 140 cm) würde man so tun, als sei die ganze Zeit Fallzeit.'}
];
function fpHTML(){
  let h=`<div class="card"><h2>Kraftmessplatte lesen</h2><p class="lead">Eine Kraftmessplatte misst die Kraft des Bodens auf den Körper (Bodenreaktionskraft). Drei Sprünge derselben Person wurden aufgezeichnet. Die rote gestrichelte Linie ist die Gewichtskraft.</p><div id="fpChart"></div>`;
  FPQ.forEach((q,i)=>{ const st=S.fp[i]; h+=`<h3>${i+1}. ${esc(q.q)}</h3>${q.opts.map((o,j)=>`<button type="button" class="opt${st!=null?(j===q.ok?' right':j===st?' wrong':''):''}" data-act="fpq" data-i="${i}" data-j="${j}" ${st!=null?'disabled':''}>${esc(o)}</button>`).join('')}`; if(st!=null) h+=`<div class="fb ${st===q.ok?'ok':'no'}" role="status">${st===q.ok?'Richtig. ':'Nicht ganz. '}${esc(q.why)}</div>`; });
  return h+`<div class="btnrow"><button type="button" class="btn sm" data-act="openlab" data-lab="init">Im Labor 1 nachstellen</button></div></div>`;
}
function fillFp(){ const el=$('#fpChart'); if(!el) return; const W=Math.max(280,Math.round(el.clientWidth||340)); const sims=FPCURVES.map(c=>simInit(c.p));
  const panels=sims.map((s,i)=>({x:[0,2.8],y:[0,3000],xl:'Zeit in s',yl:'Kraft in N',series:[{x:s.t,y:s.F,c:C_F}],hl:[{y:s.mg,c:C_R,l:i===0?'Gewichtskraft':''}],leg:[{c:C_F,t:'Kurve '+FPCURVES[i].n}]}));
  el.innerHTML=renderPanels(W,Math.min(540,Math.round(W*0.95)+70),panels).svg; }

  let h=`<div class="card"><h2>Diagnose: Welches Prinzip steckt dahinter?</h2><p class="lead">Lies die Situation und wähle das Prinzip, das sie am besten erklärt. Danach siehst du die Begründung und kannst den Versuch im Labor nachstellen.</p>${S.score.n?`<span class="badge info">Richtig: ${S.score.ok} von ${S.score.n}</span>`:''}</div>`;
  h+=fpHTML();
  DIAG.forEach((d,i)=>{ const st=S.diag[i]; h+=`<div class="card"><h3 style="margin-top:0">Situation ${i+1}</h3><p style="margin:2px 0 8px">${esc(d.t)}</p>${PRINC.map((q,j)=>`<button type="button" class="opt${st?(j===d.ok?' right':j===st.c?' wrong':''):''}" data-act="diag" data-i="${i}" data-j="${j}" ${st?'disabled':''}>${q.n}. ${esc(q.name.replace('Prinzip der ','').replace('Prinzip des ',''))}</button>`).join('')}`;
    if(st) h+=`<div class="fb ${st.c===d.ok?'ok':'no'}" role="status">${st.c===d.ok?'Richtig. ':'Nicht ganz. Gemeint ist: '+esc(PRINC[d.ok].name)+'. '}${esc(d.why)}</div><div class="btnrow"><button type="button" class="btn sm" data-act="openlab" data-lab="${d.lab}">Im Labor ausprobieren</button></div>`; h+='</div>'; });
  $('#pane-diag').innerHTML=h; fillFp();
}

/* =============== Reiter: Info und Aufgaben =============== */
function renderInfo(){
  let h=`<div class="card"><h2>Formeln</h2><div class="eqn">Kraftstoß: J = ∫F dt = m·Δv<br>Arbeit: W = F·s = ½·m·v²<br>Wurfweite: x = (v·cos α/g)·(v·sin α + √(v²·sin²α + 2·g·h₀))<br>Sprunghöhe aus der Flugzeit: h = g·t²/8<br>Haftreibung: F ≤ μ·N<br>Drehimpuls: L = I·ω (konstant ohne äußeres Drehmoment)</div><p class="note">Alle Labore rechnen eindimensional oder mit einer Drehachse, ohne Luftwiderstand, mit vereinfachten Kraftverläufen. Die Zahlen sollen Prinzipien zeigen, nicht einzelne Athletinnen und Athleten messen.</p></div>`;
  h+=`<div class="card"><h2>So liest du eine Kraftmessplatte</h2><ul class="plain"><li><b>Gewichtslinie:</b> Im ruhigen Stand zeigt die Platte die Gewichtskraft m·g.</li><li><b>Unter der Gewichtslinie:</b> Der Körper wird nach unten beschleunigt (zum Beispiel beim Eintauchen).</li><li><b>Über der Gewichtslinie:</b> Der Körper wird nach oben beschleunigt (Abbremsen und Abdruck).</li><li><b>Null:</b> Der Körper ist in der Luft. Die Dauer ist die Flugzeit, daraus folgt h = g·t²/8.</li><li><b>Fläche:</b> Die Fläche zwischen Kurve und Gewichtslinie ist der Kraftstoß und gleich m·Δv. Oberhalb positiv, unterhalb negativ.</li><li><b>Landung:</b> Die Spitze liegt meist weit über dem Körpergewicht, weil der Körper in kurzer Zeit abgebremst wird.</li></ul><p class="note">Echte Platten messen oft drei Richtungen. Hier wird in Labor 1 und 6 die senkrechte und in Labor 5 die waagerechte Kraft gezeigt.</p></div>`;
  h+=`<div class="card"><h2>Rechner: Sprunghöhe aus der Flugzeit</h2><label class="fl" for="fl">Flugzeit: <output id="flo">${de(S.flight,2)} s</output></label><input type="range" id="fl" data-fl="1" min="0.3" max="0.8" step="0.01" value="${S.flight}"><p id="flr" style="margin:6px 0"><b>${de(G*S.flight*S.flight/8*100,0)} cm</b> Sprunghöhe (Schwerpunkt, Absprung und Landung auf gleicher Höhe)</p></div>`;
  h+=`<div class="card"><h2>Praxisideen mit Sicherheitshinweisen</h2><div class="warn">Sicherheit zuerst: Aufsichtspflicht, Geräteaufbau, Gruppengröße und Abbruchkriterien richten sich nach der Schule und den Sicherheitsbestimmungen. Das musst du für deine Halle und Gruppe selbst prüfen. Wer nicht mitmachen kann, übernimmt Messen, Filmen oder Auswerten.</div>${PRAXIS.map(q=>`<details class="task"><summary>${esc(q.t)}</summary><p><b>Auftrag:</b> ${esc(q.w)}</p><p><b>Sicherheit:</b> ${esc(q.s)}</p></details>`).join('')}</div>`;
  h+=`<div class="card"><h2>Annahmen und Grenzen</h2><ul class="plain"><li>Die Modelle sind stark vereinfacht: Kraftverläufe sind einfache Kurven, Körper werden als Punkte oder wenige Glieder behandelt.</li><li>Die Anfangskraft wird vorgegeben. Wie groß sie wird, hängt von Dehnungsreflex und Sehnenelastizität ab, das wird nicht berechnet.</li><li>Teilimpulse sind vorgegebene Geschwindigkeitsbeiträge, die Wechselwirkung zwischen den Gliedern wird nicht simuliert.</li><li>Die Figuren dienen der Anschauung, die Bewegungen sind nicht anatomisch genau.</li><li>Keine Aussagen über einzelne Personen und keine Trainingsvorgaben.</li></ul></div>`;
  h+=`<div class="card"><h2>Begriffe</h2><dl class="gl">${GLOS.map(([t,d])=>`<dt>${esc(t)}</dt><dd>${esc(d)}</dd>`).join('')}</dl></div>`;
  h+=`<div class="card"><h2>Aufgaben</h2><p class="note">Die Punktzahlen sind ein Vorschlag. Notengebung und Bewertungsmaßstab richten sich nach den Beschlüssen eurer Fachkonferenz.</p>`;
  ITASKS.forEach((t,i)=>{ h+=`<details class="task"><summary><span class="badge">AFB ${t.afb}</span>${i+1}. ${esc(t.t)} <span class="badge">${t.p} P</span></summary><p><b>${t.op}:</b> ${esc(t.text)}</p><div class="btnrow"><button type="button" class="btn sm" data-act="itask" data-load="${t.load}">Passende Einstellung öffnen</button></div><details><summary style="cursor:pointer;min-height:40px;display:flex;align-items:center;font-weight:700">Erwartungshorizont</summary><div class="sol"><ul class="plain">${t.sol.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></details></details>`; });
  h+='</div>';
  h+=`<div class="card"><details class="mode"><summary>Hinweise für die Lehrkraft</summary><p><b>Einsatz:</b> Überblick und Matrix zum Einstieg, je Gruppe ein Labor mit Mission, Diagnoseaufgaben im Plenum, danach Praxisphase mit Video und Auswertung.</p><p><b>Typische Fehlvorstellungen:</b> „Mehr Kraft heißt immer mehr Endgeschwindigkeit, egal wie lange oder auf welchem Weg“; „Gegenkräfte heben sich auf“; „Der Drehimpuls wächst beim Anziehen der Arme“; „Alle Muskeln gleichzeitig anspannen ist am besten“.</p><p><b>Einordnung:</b> Die Prinzipienliste folgt der verbreiteten Fassung nach Hochmuth. Formulierungen, Reihenfolge und Zahl der Prinzipien weichen in Lehrwerken ab. Die Zuordnung zu Kompetenzbereichen und Themenfeldern im Kerncurriculum Sport und in den Vorgaben zum Abitur musst du auf nibis.de prüfen.</p><p><b>Bewertung:</b> Die Punktevorschläge sind unverbindlich. Notengebung bleibt deine Verantwortung und folgt den Fachkonferenzbeschlüssen.</p><p><b>Datenschutz:</b> Die App speichert nichts. Videos von Schülerinnen und Schülern nur mit Einverständnis und nach Schulvorgaben anfertigen und löschen.</p></details></div>`;
  $('#pane-info').innerHTML=h;

/* =============== Steuerung =============== */
function renderTab(){ ({over:renderOver,lab:renderLab,diag:renderDiag,info:renderInfo}[S.tab])(); }
function showTab(t){
  S.tab=t; $$('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t)); ['over','lab','diag','info'].forEach(k=>{ $('#pane-'+k).hidden=k!==t; });
  const vis=t==='lab'; $('#viewer').hidden=!vis; if(!vis) stopPlay();
  if(vis) compute(); renderTab(); if(vis) drawViewer(); window.scrollTo({top:0});
}
function openLab(id){ S.lab=id; S.tcur=0; stopPlay(); showTab('lab'); }
function applyPreset(i){ const L=curL(), p=curP(); const q=(L.presetsBy?L.presetsBy[p.mode]:L.presets)[i]; if(q.set==='opt'){ p.t=chainOptimum(p); } else { Object.keys(q.set).forEach(k=>{ p[k]=Array.isArray(q.set[k])?q.set[k].slice():q.set[k]; }); } S.tcur=0; stopPlay(); compute(); renderLab(); drawViewer(); }
document.addEventListener('input',e=>{
  const t=e.target; if(t.id==='scrub'){ stopPlay(); setT(t.value/1000*S.T); return; }
  if(t.id==='spd'){ S.speed=parseFloat(t.value); return; }
  if(t.dataset.fl){ S.flight=parseFloat(t.value); $('#flo').textContent=de(S.flight,2)+' s'; $('#flr').innerHTML=`<b>${de(G*S.flight*S.flight/8*100,0)} cm</b> Sprunghöhe (Schwerpunkt, Absprung und Landung auf gleicher Höhe)`; return; }
  const p=curP();
  if(t.dataset.lp){ p[t.dataset.lp]=parseFloat(t.value); const q=(curL().slidersBy?curL().slidersBy[p.mode]:curL().sliders).find(x=>x.k===t.dataset.lp); const o=$('#lo_'+t.dataset.lp); if(o) o.textContent=de(p[t.dataset.lp],q.dec); refreshLab(); return; }
  if(t.dataset.arr){ const i=+t.dataset.idx; p[t.dataset.arr][i]=parseFloat(t.value); const o=$((t.dataset.arr==='t'?'#lco_':'#lao_')+i); if(o) o.textContent=t.dataset.arr==='t'?de(p.t[i]*1000,0)+' ms':de(p.A[i],1)+' m/s'; refreshLab(); return; }
});
document.addEventListener('click',e=>{
  const v=e.target.closest('[data-v]'); if(v){ const k=v.dataset.v;
    if(k==='play'){ if(S.play) stopPlay(); else startPlay(); } else if(k==='rewind'){ stopPlay(); setT(0); }
    else if(k==='view'){ S.vview=v.dataset.m; drawViewer(); } else if(k==='fold'){ const c=$('#viewer').classList.toggle('collapsed'); v.setAttribute('aria-pressed',c); v.textContent=c?'▼':'▲'; }
    return; }
  const tb=e.target.closest('.tab'); if(tb){ showTab(tb.dataset.tab); return; }
  const a=e.target.closest('[data-act]'); if(!a) return; const act=a.dataset.act;
  switch(act){
    case 'openlab': openLab(a.dataset.lab); break;
    case 'pick': S.lab=a.dataset.lab; S.tcur=0; stopPlay(); compute(); renderLab(); drawViewer(); break;
    case 'mode': curP().mode=a.dataset.m; S.tcur=0; stopPlay(); compute(); renderLab(); drawViewer(); break;
    case 'preset': applyPreset(+a.dataset.i); break;
    case 'ref': S.ref[S.lab]={sim:S.sim,p:JSON.parse(JSON.stringify(curP()))}; renderLab(); drawViewer(); break;
    case 'unref': delete S.ref[S.lab]; renderLab(); drawViewer(); break;
    case 'reset': { const m=curP().mode; S.P[S.lab]=curL().def(); if(m) S.P[S.lab].mode=m; delete S.ref[S.lab]; S.tcur=0; stopPlay(); compute(); renderLab(); drawViewer(); break; }
    case 'copy': copyText(protocol(),a); break;
    case 'mx': S.mx=[+a.dataset.r,+a.dataset.c]; renderOver(); break;
    case 'fpq': { const i=+a.dataset.i, j=+a.dataset.j; if(S.fp[i]!=null) break; S.fp[i]=j; S.score.n++; if(j===FPQ[i].ok) S.score.ok++; renderDiag(); break; }
    case 'diag': { const i=+a.dataset.i, j=+a.dataset.j; if(S.diag[i]) break; S.diag[i]={c:j}; S.score.n++; if(j===DIAG[i].ok) S.score.ok++; renderDiag(); break; }
    case 'itask': { const l=a.dataset.load; if(l==='over'||l==='lab'){ showTab(l==='lab'?'lab':'over'); } else openLab(l); break; }
  }
});

let drag=-1;
function setCtl(i,val){ const f=curP().f; f[i]=Math.max(0,Math.min(1,val)); const e=$('#cf_'+i); if(e) e.textContent=Math.round(f[i]*100)+' %'; refreshLab(); }
function ctlAt(ev){ const ch=$('#vChart'), r=ch.getBoundingClientRect(), c=S.ctx[0]; if(!c) return -1; let best=-1,bd=900; $$('#vChart .ctl').forEach(el=>{ const cx=+el.getAttribute('cx')+r.left, cy=+el.getAttribute('cy')+r.top; const d=(cx-ev.clientX)**2+(cy-ev.clientY)**2; if(d<bd){ bd=d; best=+el.dataset.i; } }); return best; }
function dragTo(ev){ if(drag<0) return; const ch=$('#vChart'), r=ch.getBoundingClientRect(), c=S.ctx[0]; const py=ev.clientY-r.top-c.T; const val=(c.ph-py)/c.ph*(c.y[1]-c.y[0])+c.y[0]; const cap=capF(drag*CURVE_T/(CURVE_N-1)); setCtl(drag,val/cap); }
const chEl=document.getElementById('vChart');
chEl.addEventListener('pointerdown',ev=>{ if(S.lab==='curve'){ const i=ctlAt(ev); if(i>=0){ drag=i; try{ chEl.setPointerCapture(ev.pointerId); }catch(e){} ev.preventDefault(); dragTo(ev); return; } }
  pickT(ev); chEl.dataset.dn='1'; try{ chEl.setPointerCapture(ev.pointerId); }catch(e){} });
chEl.addEventListener('pointermove',ev=>{ if(drag>=0) dragTo(ev); else if(chEl.dataset.dn==='1') pickT(ev); });
['pointerup','pointercancel'].forEach(n=>chEl.addEventListener(n,()=>{ drag=-1; chEl.dataset.dn=''; }));
function pickT(ev){ if(S.lab==='path') return; const r=chEl.getBoundingClientRect(), y=ev.clientY-r.top, n=S.ctx.length; if(!n) return; const pi=Math.min(n-1,Math.max(0,Math.floor(y/(r.height/n)))), c=S.ctx[pi]; if(!c||!c.cx) return; const x=(ev.clientX-r.left-c.L)/c.pw*(c.x[1]-c.x[0])+c.x[0]; const sl=(c.cx(1)-c.cx(0)); if(!sl) return; stopPlay(); setT((x-c.cx(0))/sl); }
chEl.addEventListener('keydown',ev=>{ const el=ev.target.closest&&ev.target.closest('.ctl'); if(!el) return; const i=+el.dataset.i, f=curP().f; if(ev.key==='ArrowUp'||ev.key==='ArrowRight'){ setCtl(i,f[i]+0.05); } else if(ev.key==='ArrowDown'||ev.key==='ArrowLeft'){ setCtl(i,f[i]-0.05); } else return; ev.preventDefault(); const ne=$(`#vChart .ctl[data-i="${i}"]`); if(ne) ne.focus(); });
let rsz=null; window.addEventListener('resize',()=>{ clearTimeout(rsz); rsz=setTimeout(()=>{ if(S.tab==='lab') drawViewer(); if(S.tab==='diag') fillFp(); },120); });
$('[data-v="view"][data-m="scene"]').setAttribute('aria-pressed',S.vview==='scene'); $('[data-v="view"][data-m="both"]').setAttribute('aria-pressed',S.vview==='both');

/* =============== Start =============== */
(function init(){ showTab('over'); })();
})();
</script>
