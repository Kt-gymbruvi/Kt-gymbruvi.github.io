<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zirkeltraining-Planer</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ecf0f3;--panel:#ffffff;--ink:#182230;--muted:#5b6774;--line:#d5dce3;--soft:#f2f5f7;
  --acc:#f2552c;--acc-ink:#fff;--ok:#2b8a3e;--warn:#e67700;
  --fig:#182230;--fig2:#a7b2bd;--mat:#bfdcf5;--box:#e9c99b;--boxs:#9a7445;--wall:#ced4da;--prop:#343a40;--prop2:#8a939b;--floor:#b4bdc6;
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f151b;--panel:#18212a;--ink:#e8eef3;--muted:#9aa8b5;--line:#2f3c48;--soft:#202b35;--fig:#e8eef3;--fig2:#5e6c79;--mat:#24415c;--box:#7a5c37;--boxs:#c69c66;--wall:#3a4652;--prop:#cfd6dc;--prop2:#7c8893;--floor:#3f4b57;--acc:#ff6a43}}
:root[data-theme="dark"]{--bg:#0f151b;--panel:#18212a;--ink:#e8eef3;--muted:#9aa8b5;--line:#2f3c48;--soft:#202b35;--fig:#e8eef3;--fig2:#5e6c79;--mat:#24415c;--box:#7a5c37;--boxs:#c69c66;--wall:#3a4652;--prop:#cfd6dc;--prop2:#7c8893;--floor:#3f4b57;--acc:#ff6a43}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3{font-family:var(--cond);line-height:1.05;margin:0}
.top{max-width:1240px;margin:0 auto;padding:12px 14px 6px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.top h1{font-size:1.9rem;font-weight:700}
.top h1 span{color:var(--acc)}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;margin-left:auto}
.tabs button{border:0;background:none;border-radius:9px;padding:7px 13px;font-family:var(--cond);font-weight:600;font-size:1.05rem;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.tabs .cnt{display:inline-block;min-width:1.5em;border-radius:999px;background:var(--acc);color:#fff;font-size:.85rem;padding:0 5px;margin-left:4px}

.equipbar{max-width:1240px;margin:0 auto;padding:4px 14px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lab{font-size:.85rem;color:var(--muted);font-weight:600}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:.9rem;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip:disabled{opacity:1;cursor:default}
.chip .dot{width:10px;height:10px;border-radius:50%}
main{max-width:1240px;margin:0 auto;padding:4px 14px 40px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input[type=search]{flex:1;min-width:160px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 11px}
.filters select{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.ex.in{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.ex .fig{display:block;width:100%;height:auto;background:var(--soft);cursor:pointer}
.ex .b{padding:9px 11px 11px;display:grid;gap:5px;flex:1}
.ex h3{font-size:1.2rem;font-weight:700;cursor:pointer}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.gtag{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:.8rem;color:var(--ink)}
.gtag i{width:9px;height:9px;border-radius:50%;display:inline-block}
.lvl{letter-spacing:1px;color:var(--acc);font-weight:700}
.lvl b{color:var(--line)}
.add{margin-top:auto;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:7px;font-family:var(--cond);font-weight:700;font-size:1rem}
.ex.in .add{background:var(--acc);color:#fff;border-color:var(--acc)}
.na{position:absolute;top:8px;left:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;font-size:.72rem;font-weight:700;padding:2px 8px;color:var(--muted)}
.empty{border:2px dashed var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted)}
/* circuit */
.cgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:980px){.cgrid{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.panel h2{font-size:1.4rem;font-weight:700;margin-bottom:10px}
.stack{display:grid;gap:12px;align-content:start}
.gen{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.field{display:grid;gap:4px}
.field select{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:8px 9px}
.step{display:flex;align-items:center;gap:4px;background:var(--soft);border-radius:10px;padding:3px;justify-content:space-between}
.step button{width:34px;height:32px;border:0;border-radius:8px;background:var(--panel);font-weight:700;font-size:1.1rem}
.step b{font-family:var(--cond);font-size:1.2rem;text-align:center;flex:1}
.big{border:0;border-radius:14px;background:var(--acc);color:#fff;font-family:var(--cond);font-weight:700;font-size:1.35rem;padding:12px 18px;width:100%}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;font-family:var(--cond);font-weight:700;font-size:1.02rem}
.btn.dark{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.note{font-size:.85rem;color:var(--muted);margin:8px 0 0}
.list{display:grid;gap:7px}
.st{display:grid;grid-template-columns:34px 74px minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--soft);border-radius:12px;padding:6px 8px}
.st.locked{box-shadow:inset 0 0 0 2px var(--acc)}
.st .n{font-family:var(--cond);font-weight:700;font-size:1.5rem;text-align:center}
.st svg{width:74px;height:auto;display:block;background:var(--panel);border-radius:8px}
.st .nm{font-weight:700;line-height:1.2}
.st .warn{color:var(--warn);font-size:.78rem;font-weight:600}
.st .acts{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:150px}
.ib{width:32px;height:32px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-size:.95rem;padding:0;display:grid;place-items:center}
.ib[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
.ib:disabled{opacity:.35}
@media (max-width:520px){.st{grid-template-columns:28px 60px minmax(0,1fr)}.st svg{width:60px}.st .acts{grid-column:1/-1;max-width:none;justify-content:flex-start}}
.cov{display:grid;gap:6px}
.cov .r{display:grid;grid-template-columns:110px 1fr 32px;align-items:center;gap:8px;font-size:.9rem}
.cov .bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.cov .bar i{display:block;height:100%;border-radius:999px}
.cov .z{color:var(--warn);font-weight:700}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kpi{background:var(--soft);border-radius:12px;padding:8px 10px}
.kpi b{display:block;font-family:var(--cond);font-size:1.6rem;line-height:1.1}
.kpi span{font-size:.8rem;color:var(--muted)}
.alert{background:color-mix(in srgb,var(--warn) 12%,var(--panel));border:1px solid var(--warn);border-radius:12px;padding:8px 11px;font-size:.9rem;margin-top:10px}
.saved{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.saved li{display:flex;gap:6px;align-items:center;background:var(--soft);border-radius:10px;padding:6px 8px}
.saved li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved small{color:var(--muted)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row input{flex:1;min-width:140px;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:8px 10px}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;break-inside:avoid}
.card .hd{display:flex;align-items:center;gap:10px;padding:10px 12px;color:#fff}
.card .hd .no{font-family:var(--cond);font-weight:700;font-size:2.2rem;line-height:1;background:rgba(255,255,255,.22);border-radius:10px;padding:2px 10px}
.card .hd h3{font-size:1.45rem}
.card .hd small{display:block;font-size:.85rem;opacity:.9;font-family:var(--body)}
.card svg{display:block;width:100%;height:auto;background:var(--soft)}
.card .bd{padding:10px 12px 12px;display:grid;gap:8px;font-size:.95rem}
.card ul{margin:0;padding-left:1.1em}
.card .var{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card .var div{background:var(--soft);border-radius:10px;padding:6px 8px;font-size:.88rem}
.card .var b{display:block;font-family:var(--cond);font-size:.95rem}
.card .sf{border-left:4px solid var(--warn);padding:4px 8px;font-size:.88rem;background:color-mix(in srgb,var(--warn) 8%,var(--panel));border-radius:0 8px 8px 0}
.cardsHead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.safetybox{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:.92rem}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,15,20,.55);display:grid;place-items:center;z-index:20;padding:14px}
.modal>.box{background:var(--panel);border-radius:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:0}
.modal svg{display:block;width:100%;height:auto;background:var(--soft)}
.modal .bd{padding:14px;display:grid;gap:10px}
.modal h2{font-size:1.8rem}
.x{position:sticky;top:8px;float:right;margin:8px 8px 0 0;width:38px;height:38px;border-radius:50%;border:0;background:var(--panel);font-size:1.3rem;box-shadow:0 1px 4px rgba(0,0,0,.2);z-index:2}
/* player */
.player{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
.player .ptop{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--cond);font-weight:600;font-size:1.15rem}
.player .phase{font-family:var(--cond);font-weight:700;font-size:1.3rem;padding:3px 12px;border-radius:999px;color:#fff;background:var(--acc)}
.player.rest .phase{background:var(--ok)}
.player.prep .phase{background:#1c7ed6}
.player .pmain{flex:1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:center;min-height:0}
@media (max-width:760px){.player .pmain{grid-template-columns:1fr;align-content:center}}
.player .pfig svg{width:100%;max-height:52vh;display:block;background:var(--panel);border-radius:18px}
.player h2{font-size:clamp(1.8rem,5vw,3rem)}
.player .clock{font-family:var(--cond);font-weight:700;font-size:clamp(4rem,14vw,8rem);line-height:1;font-variant-numeric:tabular-nums}
.player .prog{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0 10px}
.player .prog i{display:block;height:100%;background:var(--acc)}
.player.rest .prog i{background:var(--ok)}
.player .next{color:var(--muted);font-weight:600}
.player .pctl{display:flex;gap:8px;justify-content:center;margin-top:10px}
.player .pctl button{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 18px;font-family:var(--cond);font-weight:700;font-size:1.2rem;min-width:70px}
.player .pctl .main{background:var(--ink);color:var(--panel);border-color:var(--ink);min-width:130px}
.player ul{margin:6px 0 0;padding-left:1.1em;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:640px){.tabs{margin-left:0;width:100%}.tabs button{flex:1;padding:7px 4px}.equipbar,.filters.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.equipbar .chip,.filters.scroll .chip,.equipbar .lab{flex:none;white-space:nowrap}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.ex h3{font-size:1.05rem}.ex .meta span:last-child{display:none}}
@media print{.top,.equipbar,.cardsHead .btns,#toast{display:none!important}body{background:#fff}.card{border:1px solid #999}}
</style>

</head>
<body>
<nav class="lernangebot-leiste" style="all:initial;display:flex;align-items:center;gap:12px;box-sizing:border-box;width:100%;padding:8px 16px;background:#0b1f4d;font:700 16px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><a href="../" style="all:initial;color:#ffc928;font:inherit;cursor:pointer;text-decoration:none">← Lernangebote</a></nav>

{id:'wadenheben',name:'Wadenheben',g:'beine',s:[],eq:[],lvl:1,period:1300,

{id:'gobletSquat',name:'Goblet Squat',g:'beine',s:['gesaess','rumpf'],eq:['db'],lvl:2,period:1900,props:['db1'],

const SEG={to:32,ua:15,fa:14,th:24,sh:23,hd:9.5,hr:6.3,ft:6};
const GROUND=100,BAR_Y=8;
const KEYS=['t','a1','e1','a2','e2','k1','s1','k2','s2','air','pt','gl','hd','dx'];
const rad=d=>d*Math.PI/180;
const dv=(a,l)=>[Math.sin(rad(a))*l,Math.cos(rad(a))*l];
const angOf=(x,y)=>Math.atan2(x,y)*180/Math.PI;
function ik2(tx,ty,l1,l2,sign){
  const dd=Math.hypot(tx,ty)||0.001,ux=tx/dd,uy=ty/dd;

  return [angOf(kx,ky),angOf(ux*d-kx,uy*d-ky)];
}
function resolve(p,view){

      if(k[0]==='f'){const[a,b]=ik2(x,y,SEG.th,SEG.sh,sg);r['k'+k[1]]=a;r['s'+k[1]]=b;}
      else{const[a,b]=ik2(x,y,SEG.ua,SEG.fa,sg);r['a'+k[1]]=a;r['e'+k[1]]=b;}}

  for(const k of ['air','pt','gl','dx'])r[k]=r[k]||0;

}
function bodyPts(r,view){

  P.E1=add(P.S,dv(r.a1,SEG.ua));P.W1=add(P.E1,dv(r.e1,SEG.fa));
  P.E2=add(P.S,dv(r.a2,SEG.ua));P.W2=add(P.E2,dv(r.e2,SEG.fa));
  P.K1=add(P.H,dv(r.k1,SEG.th));P.A1=add(P.K1,dv(r.s1,SEG.sh));
  P.K2=add(P.H,dv(r.k2,SEG.th));P.A2=add(P.K2,dv(r.s2,SEG.sh));

const ANCH={f1:'A1',f2:'A2',h1:'W1',h2:'W2',hip:'H',sh:'S',t1:'T1'};
function prepare(ex){

  const an=ANCH[ex.anchor||'f1'];
  let mn=1e9,mx=-1e9;

/* ---------- Generator ---------- */
function orderAlt(list){
  const rem=shuffle(list.slice()),seq=[];
  while(rem.length){
    const prev=seq[seq.length-1];
    let cand=rem.filter(e=>!prev||REGION[e.g]!==REGION[prev.g]);
    if(!cand.length)cand=rem;
    const cnt={};rem.forEach(e=>cnt[REGION[e.g]]=(cnt[REGION[e.g]]||0)+1);
    const mx=Math.max(...cand.map(e=>cnt[REGION[e.g]]));
    const best=cand.filter(e=>cnt[REGION[e.g]]===mx),ch=pick(best);
    seq.push(ch);rem.splice(rem.indexOf(ch),1);
  }
  return seq;
}
function generate(){
  const n=S.gen.n,focus=S.gen.focus;
  const pool=EX.filter(e=>avail(e)&&e.lvl<=S.gen.lvl);

  const lockedIds=new Set(locked.map(e=>e.id));
  const slots=Math.max(0,n-locked.length);
  const prio=['beine','ruecken','brust','rumpf','gesaess','schultern','arme','ausdauer'];
  const covered=new Set(locked.map(e=>e.g));
  let targets=prio.slice(0,Math.min(8,n)).filter(g=>!covered.has(g));
  if(focus!=='ganz'){
    if(!targets.includes(focus)&&!covered.has(focus))targets.unshift(focus);
    const goal=Math.max(2,Math.round(n*0.4));
    let have=locked.filter(e=>e.g===focus).length+targets.filter(g=>g===focus).length;
    const extra=[];while(have<goal){extra.push(focus);have++;}
    targets=[...targets.slice(0,Math.max(0,slots-extra.length)),...extra];
  }
  const rr=shuffle(prio.filter(g=>g!=='ausdauer').concat(['ausdauer']));let i=0;
  while(targets.length<slots){targets.push(rr[i%rr.length]);i++;}
  targets=targets.slice(0,slots);
  const used=new Set(lockedIds),picks=[];
  for(const g of targets){
    let c=pool.filter(e=>!used.has(e.id)&&e.g===g);
    if(!c.length)c=pool.filter(e=>!used.has(e.id)&&e.s.includes(g));
    if(!c.length)c=pool.filter(e=>!used.has(e.id));
    if(!c.length)break;
    const e=pick(c);used.add(e.id);picks.push(e);
  }
  S.circuit=orderAlt([...locked,...picks]).map(e=>({id:e.id,lock:lockedIds.has(e.id)}));
  save();render();
  if(picks.length<slots)toast('Nicht genug passende Übungen. Mehr Material oder ein höheres Niveau zulassen.');
  else toast(`${S.circuit.length} Stationen zusammengestellt.`);
}
function swap(idx){

  let c=EX.filter(e=>avail(e)&&!ids.has(e.id)&&e.g===cur.g);
  if(!c.length)c=EX.filter(e=>avail(e)&&!ids.has(e.id)&&e.s.includes(cur.g));
  if(!c.length){toast('Keine Alternative mit dem vorhandenen Material.');return;}
  S.circuit[idx]={id:pick(c).id,lock:false};save();render();
}

    <div class="var"><div><b>Leichter</b>${e.easy}</div><div><b>Schwerer</b>${e.hard}</div></div>
    <div class="sf">${e.safe}</div></div></article>`;}).join('')}</div>`:'<div class="empty">Noch keine Stationen im Zirkel.</div>'}
  <div class="safetybox"><b>Für alle Stationen:</b> Vorher aufwärmen. Technik geht vor Tempo. Bei Schmerzen, Schwindel oder starker Atemnot sofort abbrechen und Bescheid geben.</div>`;
  const pb=$('#printBtn');pb.onclick=()=>{try{window.print();}catch(e){toast('Drucken ist hier nicht möglich. Nutze die Druckfunktion des Browsers.');}};
}

/* ---------- Detail modal ---------- */
function openDetail(id){
  const e=byId[id];
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="box" role="dialog" aria-modal="true" aria-label="${esc(e.name)}"><button class="x" aria-label="Schließen">×</button>${figEl(e)}
    <div class="bd"><h2>${e.name}</h2>
    <div class="meta">${gtag(e.g)}${e.s.map(g=>`<span>+ ${GROUPS[g].short||GROUPS[g].name}</span>`).join('')}${lvlHTML(e.lvl)}<span>${eqText(e)}</span></div>
    <ul style="margin:0;padding-left:1.1em">${e.cues.map(x=>`<li>${x}</li>`).join('')}</ul>
    <div class="var" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="kpi"><span>Leichter</span><div>${e.easy}</div></div><div class="kpi"><span>Schwerer</span><div>${e.hard}</div></div></div>
    <div class="alert" style="margin:0">${e.safe}</div>
    <button class="big" data-toggle="${e.id}">${inC(e.id)?'Aus dem Zirkel entfernen':'+ Zum Zirkel hinzufügen'}</button></div></div>`;
  const close=()=>{m.remove();document.removeEventListener('keydown',k);};
  const k=ev=>{if(ev.key==='Escape')close();};
  m.addEventListener('click',ev=>{if(ev.target===m||ev.target.closest('.x'))close();else if(ev.target.closest('[data-toggle]'))setTimeout(close,0);});
  document.addEventListener('keydown',k);
  document.body.appendChild(m);observe(m);m.querySelector('.x').focus();
}

/* ---------- Player ---------- */
let P=null,ac=null,wake=null;
function beep(n,len,f){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+i*(len+0.1);o.frequency.value=f||880;o.type='square';g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.22,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+len);o.connect(g).connect(ac.destination);o.start(t0);o.stop(t0+len+0.02);}}catch(e){}}
async function lock(on){try{if(on&&'wakeLock' in navigator&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null);}if(!on&&wake){await wake.release();wake=null;}}catch(e){}}
function buildSteps(){
  const st=S.settings,n=S.circuit.length,steps=[{type:'prep',dur:10,i:0,r:0}];
  for(let r=0;r<st.rounds;r++){for(let i=0;i<n;i++){steps.push({type:'work',dur:st.work,i,r});if(i<n-1&&st.rest>0)steps.push({type:'rest',dur:st.rest,i:i+1,r});}
    if(r<st.rounds-1&&st.roundRest>0)steps.push({type:'rround',dur:st.roundRest,i:0,r:r+1});}
  return steps;
}
function startPlayer(){
  if(!S.circuit.length)return;
  const el=document.createElement('div');el.className='player prep';el.setAttribute('role','dialog');el.setAttribute('aria-label','Training');
  el.innerHTML=`<div class="ptop"><span id="pPos"></span><span class="phase" id="pPhase"></span><button class="btn" id="pClose">✕ Beenden</button></div>
  <div class="pmain"><div class="pfig"><svg viewBox="0 0 120 106" id="pFig"></svg></div>
  <div><div class="next" id="pPre"></div><h2 id="pName"></h2><div class="clock" id="pClock"></div><div class="prog"><i id="pBar"></i></div><div class="next" id="pNext"></div><ul id="pCues"></ul></div></div>
  <div class="pctl"><button id="pPrev" aria-label="Zurück">⏮</button><button class="main" id="pPlay">Pause</button><button id="pSkip" aria-label="Weiter">⏭</button></div>`;
  document.body.appendChild(el);
  P={el,steps:buildSteps(),k:0,rem:10,run:true,lastT:performance.now(),tick:null};
  P.rem=P.steps[0].dur;
  el.querySelector('#pClose').onclick=stopPlayer;
  el.querySelector('#pPlay').onclick=()=>{P.run=!P.run;P.lastT=performance.now();el.querySelector('#pPlay').textContent=P.run?'Pause':'Weiter';lock(P.run);};
  el.querySelector('#pSkip').onclick=()=>gotoStep(P.k+1);
  el.querySelector('#pPrev').onclick=()=>gotoStep(Math.max(0,P.k-1));
  lock(true);beep(1,0.15,660);showStep();
  const fr=now=>{if(!P)return;
    if(P.run){P.rem-=(now-P.lastT)/1000;const sec=Math.ceil(P.rem);if(sec!==P.lastSec&&sec<=3&&sec>0){beep(1,0.09,660);}P.lastSec=sec;if(P.rem<=0)gotoStep(P.k+1);}
    P.lastT=now;
    const s=P.steps[P.k];if(!s){return;}
    const ex=byId[S.circuit[s.i].id];
    $('#pFig').innerHTML=figureSVG(ex,s.type==='work'&&P.run&&!reduce?(now%ex.period)/ex.period:0.25);
    $('#pClock').textContent=fmt(Math.max(0,P.rem));
    $('#pBar').style.width=(100*(1-Math.max(0,P.rem)/s.dur))+'%';
    requestAnimationFrame(fr);};
  requestAnimationFrame(fr);
}
function gotoStep(k){
  if(!P)return;
  if(k>=P.steps.length){beep(1,0.9,520);P.el.querySelector('#pPhase').textContent='Geschafft!';P.el.querySelector('#pName').textContent='Zirkel beendet';P.el.querySelector('#pNext').textContent='Jetzt locker auslaufen und dehnen.';P.el.querySelector('#pCues').innerHTML='';P.run=false;P.rem=0;P.k=P.steps.length;lock(false);return;}
  P.k=k;P.rem=P.steps[k].dur;P.lastSec=null;
  const s=P.steps[k];if(s.type==='work')beep(1,0.5,990);else beep(2,0.15,880);
  showStep();
}
function showStep(){
  const s=P.steps[P.k],n=S.circuit.length,ex=byId[S.circuit[s.i].id];
  P.el.className='player '+(s.type==='work'?'':s.type==='prep'?'prep':'rest');
  $('#pPhase').textContent={prep:'Vorbereitung',work:'Belastung',rest:'Wechsel',rround:'Pause'}[s.type];
  $('#pPos').textContent=`Station ${s.i+1} von ${n}, Durchgang ${s.r+1} von ${S.settings.rounds}`;
  $('#pPre').textContent=s.type==='work'?'':'Gleich:';
  $('#pName').textContent=ex.name;
  $('#pCues').innerHTML=ex.cues.map(c=>`<li>${c}</li>`).join('');
  const nx=P.steps.slice(P.k+1).find(x=>x.type==='work');
  $('#pNext').textContent=s.type==='work'&&nx?`Danach: ${byId[S.circuit[nx.i].id].name}`:(s.type!=='work'?ex.easy?`Leichter: ${ex.easy}`:'':'Letzte Station!');
}
function stopPlayer(){if(!P)return;P.el.remove();P=null;lock(false);}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&P&&P.run)lock(true);});

/* ---------- Events ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('button,[data-open]');if(!t)return;const d=t.dataset;
  if(d.tab){S.tab=d.tab;save();render();window.scrollTo(0,0);}
  else if(d.eq){S.equip[d.eq]=!S.equip[d.eq];save();render();}
  else if(d.focus){S.focus=d.focus;save();render();}
  else if(t.id==='onlyAvail'){S.onlyAvail=!S.onlyAvail;save();render();}
  else if(d.toggle){const id=d.toggle;if(inC(id))S.circuit=S.circuit.filter(c=>c.id!==id);else{if(S.circuit.length>=30){toast('Maximal 30 Stationen.');return;}S.circuit.push({id,lock:false});toast(`${byId[id].name} hinzugefügt (Station ${S.circuit.length}).`);}save();render();}
  else if(d.open){openDetail(d.open);}
  else if(d.gen){S.gen.n=Math.min(20,Math.max(3,S.gen.n+ +d.d));save();render();}
  else if(d.set){const k=d.set;S.settings[k]=Math.min(+d.max,Math.max(+d.min,S.settings[k]+ +d.d));save();render();}
  else if(t.id==='genBtn')generate();
  else if(d.up!=null){const i=+d.up;[S.circuit[i-1],S.circuit[i]]=[S.circuit[i],S.circuit[i-1]];save();render();}
  else if(d.down!=null){const i=+d.down;[S.circuit[i+1],S.circuit[i]]=[S.circuit[i],S.circuit[i+1]];save();render();}
  else if(d.lock!=null){const c=S.circuit[+d.lock];c.lock=!c.lock;save();render();}
  else if(d.swap!=null)swap(+d.swap);
  else if(d.rm!=null){S.circuit.splice(+d.rm,1);save();render();}
  else if(t.id==='clearC'){if(confirm('Alle Stationen entfernen?')){S.circuit=[];save();render();}}
  else if(t.id==='startBtn'||t.id==='startBtn2')startPlayer();
  else if(t.id==='saveBtn'){const nm=($('#saveName').value||'').trim();if(!S.circuit.length){toast('Der Zirkel ist leer.');return;}if(!nm){toast('Bitte einen Namen eingeben.');$('#saveName').focus();return;}
    S.saved=S.saved.filter(s=>s.name!==nm);S.saved.unshift({name:nm,circuit:S.circuit.map(c=>({...c})),settings:{...S.settings},at:Date.now()});S.saved=S.saved.slice(0,30);save();render();toast('Gespeichert.');}
  else if(d.load!=null){const s=S.saved[+d.load];S.circuit=s.circuit.filter(c=>byId[c.id]).map(c=>({...c}));S.settings={...S.settings,...s.settings};save();render();toast(`„${s.name}“ geladen.`);}
  else if(d.delsave!=null){if(confirm('Gespeicherten Zirkel löschen?')){S.saved.splice(+d.delsave,1);save();render();}}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('svg[data-open],h3[data-open]'))openDetail(e.target.dataset.open);});
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2400);}

render();
})();
</script></body></html>
