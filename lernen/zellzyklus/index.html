<script>
(function(){
'use strict';
/* =============== Inhalte (Index 0 = Klasse 9, Index 1 = Oberstufe) =============== */
const LISTS={
  mit:[['g1','g2','pro','meta','ana','telo','cyto'],['g1','s','g2','pro','prometa','meta','anaA','anaB','telo','cyto']],
  mei:[['g1','g2','pro1','meta1','ana1','telo1','meta2','ana2','end'],['g1','s','g2','pro1','prometa1','meta1','ana1','telo1','inter','pro2','meta2','ana2','telo2','end']]
};
/* n: Name, sh: Kurzname, d: Beschreibung, c: Chromosomenzahl als Vielfaches von n, ci: Chromatiden je Chromosom, dna: DNA-Menge je Zelle, note: Hinweis zur Zählung */
const ST={
 mit:{
  g1:{n:['Interphase (vor der Verdopplung)','G1-Phase'],sh:['Interphase','G1'],
    d:[`Der Zellkern ist unversehrt. Die Chromosomen liegen als dünne, lange Fäden (Chromatin) im Kern und sind im Mikroskop kaum zu sehen. Jedes Chromosom besteht aus einem Chromatid (Ein-Chromatid-Chromosom). Die Zelle wächst und arbeitet.`,
       `Zellwachstum und Stoffwechsel. Die Chromosomen sind dekondensiert (Chromatin), jedes besteht aus einem DNA-Doppelstrang (ein Chromatid), DNA-Menge 2C. Am G1/S-Kontrollpunkt (Restriktionspunkt) fällt die Entscheidung, ob die Zelle in den Teilungszyklus eintritt oder in G0 verbleibt.`],
    hint:`Rundum intakter Kern, keine sichtbaren Chromosomen.`,c:2,ci:'1',dna:'2C'},
  s:{n:['','S-Phase'],sh:['','S'],
    d:[``,`Semikonservative Replikation der DNA: Die DNA-Menge steigt von 2C auf 4C. Es entstehen zwei identische Schwesterchromatiden, die durch Cohesin zusammengehalten werden. Auch das Zentrosom wird verdoppelt (tierische Zelle).`],
    hint:`Kern intakt, DNA wird verdoppelt.`,c:2,ci:'1→2',dna:'2C→4C'},
  g2:{n:['Interphase (nach der Verdopplung)','G2-Phase'],sh:['Interphase','G2'],
    d:[`Die DNA wurde verdoppelt. Jedes Chromosom besteht nun aus zwei identischen Chromatiden (Zwei-Chromatid-Chromosom). Die Chromosomen sind aber noch dünne Fäden im Zellkern.`,
       `Kontrolle auf vollständige und fehlerfreie Replikation (G2/M-Kontrollpunkt). Die Zelle bildet Proteine für die Mitose, Cyclin B bindet an CDK1 (MPF) und löst den Eintritt in die M-Phase aus. Jedes Chromosom hat zwei Schwesterchromatiden, DNA-Menge 4C.`],
    hint:`Kern intakt, doppelte DNA, Chromosomen noch nicht verdichtet.`,c:2,ci:'2',dna:'4C'},
  pro:{n:['Prophase','Prophase'],sh:['Prophase','Pro'],
    d:[`Die Chromosomen verkürzen und verdicken sich (Kondensation). Sie sind jetzt als X-förmige Zwei-Chromatid-Chromosomen sichtbar. Die Kernhülle beginnt sich aufzulösen, der Spindelapparat entsteht.`,
       `Das Chromatin kondensiert (Kondensine), die Schwesterchromatiden bleiben am Zentromer verbunden. Die Zentrosomen wandern zu den Zellpolen, Mikrotubuli bilden die Spindel (Asterstrahlen). Der Nucleolus verschwindet, die Kernhülle beginnt zu zerfallen.`],
    hint:`Chromosomen verdichtet und X-förmig, Kernhülle löst sich auf, Pole bilden sich.`,c:2,ci:'2',dna:'4C'},
  prometa:{n:['','Prometaphase'],sh:['','Prometa'],
    d:[``,`Die Kernhülle ist aufgelöst. Spindelmikrotubuli heften an die Kinetochore (Proteinkomplexe am Zentromer). Jedes Schwesterchromatid wird von einem anderen Pol erfasst (bipolare Anheftung), die Chromosomen werden zur Äquatorialebene bewegt.`],
    hint:`Keine Kernhülle mehr, Chromosomen wandern zur Mitte.`,c:2,ci:'2',dna:'4C'},
  meta:{n:['Metaphase','Metaphase'],sh:['Metaphase','Meta'],
    d:[`Die Chromosomen liegen alle in der Äquatorialebene, der Mitte der Zelle. An jedem Chromosom setzen Spindelfasern von beiden Polen an. Jetzt sind die Chromosomen am besten zu erkennen und zu zählen.`,
       `Alle Chromosomen bilden die Metaphaseplatte, die Kinetochore der Schwesterchromatiden zeigen zu entgegengesetzten Polen. Der Spindelkontrollpunkt (SAC) prüft, ob alle Kinetochore korrekt angeheftet sind. Erst dann wird über den APC/C die Separase aktiviert.`],
    hint:`Einzelne X-Chromosomen reihen sich in der Mitte auf, kein Partner.`,c:2,ci:'2',dna:'4C'},
  ana:{n:['Anaphase',''],sh:['Anaphase',''],
    d:[`Die Zwei-Chromatid-Chromosomen werden am Zentromer getrennt. Die Chromatiden (jetzt Ein-Chromatid-Chromosomen) werden von den Spindelfasern zu den entgegengesetzten Polen gezogen. Beide Zellhälften erhalten identische Chromosomensätze.`,``],
    hint:`V-förmige Chromatiden wandern zu beiden Polen, die Zentromere voran.`,c:4,ci:'1',dna:'4C',note:'je Pol 2n'},
  anaA:{n:['','Anaphase A'],sh:['','Ana A'],
    d:[``,`Die Separase spaltet das Cohesin, die Schwesterchromatiden trennen sich und sind nun eigenständige Chromosomen. Die Kinetochor-Mikrotubuli verkürzen sich (Depolymerisation), die Chromosomen wandern zu den Polen.`],
    hint:`Chromatiden getrennt, erster Teil der Wanderung.`,c:4,ci:'1',dna:'4C',note:'je Pol 2n'},
  anaB:{n:['','Anaphase B'],sh:['','Ana B'],
    d:[``,`Die Pole entfernen sich voneinander: Überlappende Polarmikrotubuli verlängern sich und werden von Motorproteinen auseinandergeschoben. Die Zelle streckt sich.`],
    hint:`Chromatiden nahe an den Polen, Zelle gestreckt.`,c:4,ci:'1',dna:'4C',note:'je Pol 2n'},
  telo:{n:['Telophase','Telophase'],sh:['Telophase','Telo'],
    d:[`Die Chromosomen sind an den Polen angekommen und werden wieder dünn. Um jeden Chromosomensatz bildet sich eine neue Kernhülle, die Spindel löst sich auf. Die Zelle beginnt sich in der Mitte einzuschnüren (Tierzelle) beziehungsweise eine Zellplatte zu bilden (Pflanzenzelle).`,
       `Die Chromosomen dekondensieren, Kernhüllen und Nucleoli bilden sich neu, der Spindelapparat wird abgebaut. Die Zytokinese beginnt: Ein Aktin-Myosin-Ring schnürt die Tierzelle ein (Teilungsfurche), in der Pflanzenzelle bildet der Phragmoplast mit Golgi-Vesikeln die Zellplatte.`],
    hint:`Zwei neue Kerne an den Polen, Einschnürung in der Mitte.`,c:4,ci:'1',dna:'4C',note:'je Kern 2n'},
  cyto:{n:['Ergebnis: zwei Tochterzellen','Zytokinese abgeschlossen'],sh:['Ergebnis','Ende'],
    d:[`Das Cytoplasma hat sich geteilt. Es sind zwei Tochterzellen entstanden, jede mit dem vollständigen diploiden Chromosomensatz aus Ein-Chromatid-Chromosomen. Beide sind genetisch identisch mit der Mutterzelle. Pflanzenzelle: Zwischen den Zellen entsteht eine neue Zellwand.`,
       `Zwei genetisch identische Tochterzellen (2n, 2C), jede wieder in der G1-Phase. Bei der Pflanzenzelle ist aus der Zellplatte eine neue Zellwand mit Mittellamelle entstanden. Die Tochterzellen können erneut in den Zyklus eintreten oder in G0 übergehen.`],
    hint:`Zwei vollständige Zellen, jeweils mit Kern.`,c:2,ci:'1',dna:'2C',note:'je Tochterzelle'}
 },
 mei:{
  g1:{n:['Interphase (vor der Verdopplung)','G1-Phase'],sh:['Interphase','G1'],
    d:[`Eine diploide Zelle (2n) mit Chromosomenpaaren. In jedem Paar stammt ein Chromosom von der Mutter (rot), das andere vom Vater (blau). Sie sind noch dünne Fäden im Kern, jedes Chromosom hat ein Chromatid.`,
       `Diploide Zelle (2n, 2C). Je Paar ein mütterliches und ein väterliches Chromosom (homolog). Die Chromosomen sind dekondensiert. Die Zelle liegt vor der Replikation, die der Meiose vorausgeht.`],
    hint:`Intakter Kern, Chromosomen als Fäden.`,c:2,ci:'1',dna:'2C'},
  s:{n:['','S-Phase'],sh:['','S'],
    d:[``,`Die DNA wird einmal repliziert (2C auf 4C). Es gibt in der Meiose nur diese eine Replikation für zwei Teilungen.`],
    hint:`DNA wird verdoppelt.`,c:2,ci:'1→2',dna:'2C→4C'},
  g2:{n:['Interphase (nach der Verdopplung)','G2-Phase'],sh:['Interphase','G2'],
    d:[`Die DNA wurde verdoppelt. Jedes Chromosom besteht aus zwei identischen Chromatiden. Diese Verdopplung findet nur einmal statt, obwohl danach zwei Teilungen folgen.`,
       `Replikation abgeschlossen: Jedes Chromosom hat zwei Schwesterchromatiden, 4C. Für die Meiose gibt es nur diese eine S-Phase.`],
    hint:`Doppelte DNA, Kern intakt.`,c:2,ci:'2',dna:'4C'},
  pro1:{n:['Prophase I','Prophase I'],sh:['Prophase I','Pro I'],
    d:[`Die Chromosomen verdichten sich. Die homologen Chromosomen (mütterlich und väterlich) lagern sich paarweise aneinander. Dabei können Chromosomenstücke ausgetauscht werden (Crossing-over). Die Kernhülle löst sich auf.`,
       `Längste Phase der Meiose. Homologe Chromosomen paaren sich (Synapsis) zu Bivalenten (Tetraden aus vier Chromatiden). Im Synaptonemalkomplex findet Crossing-over zwischen Nicht-Schwesterchromatiden statt, die Überkreuzungsstellen heißen Chiasmata. Unterstadien: Leptotän, Zygotän, Pachytän, Diplotän, Diakinese.`],
    hint:`Homologe liegen paarweise zusammen, orange Markierung zeigt Stückaustausch.`,c:2,ci:'2',dna:'4C',note:'n Bivalente'},
  prometa1:{n:['','Prometaphase I'],sh:['','Prometa I'],
    d:[``,`Die Kernhülle zerfällt, Spindelfasern heften an die Kinetochore. Die beiden Schwesterkinetochore eines Homologen zeigen zum selben Pol (monopolare Anheftung), die beiden Homologen zu entgegengesetzten Polen. Chiasmata halten die Homologen noch zusammen.`],
    hint:`Bivalente wandern zur Mitte, Kernhülle fehlt.`,c:2,ci:'2',dna:'4C',note:'n Bivalente'},
  meta1:{n:['Metaphase I','Metaphase I'],sh:['Metaphase I','Meta I'],
    d:[`Die homologen Chromosomenpaare liegen paarweise in der Äquatorialebene. Welches Chromosom eines Paares zu welchem Pol zeigt, ist zufällig. Mit dem Knopf „Neu würfeln“ siehst du andere Möglichkeiten.`,
       `Die Bivalente liegen in der Äquatorialebene. Die Ausrichtung jedes Bivalents ist zufällig und unabhängig von den anderen (2ⁿ Möglichkeiten, interchromosomale Rekombination). Jeder Homologe heftet mit beiden Schwesterkinetochoren an einen Pol.`],
    hint:`Homologe Paare (zwei X nebeneinander) in der Mitte.`,c:2,ci:'2',dna:'4C',note:'n Bivalente'},
  ana1:{n:['Anaphase I','Anaphase I'],sh:['Anaphase I','Ana I'],
    d:[`Die Chromosomen eines Paares werden voneinander getrennt und zu entgegengesetzten Polen gezogen. Sie bleiben dabei Zwei-Chromatid-Chromosomen. Die Chromosomenzahl pro Zellhälfte wird halbiert (Reduktion).`,
       `Die homologen Chromosomen trennen sich (Reduktionsteilung). Die Schwesterchromatiden bleiben am Zentromer verbunden: Arm-Cohesin wird gespalten, zentromerisches Cohesin bleibt geschützt. Jeder Pol erhält einen haploiden Chromosomensatz aus Zwei-Chromatid-Chromosomen.`],
    hint:`Ganze X-Chromosomen wandern zu den Polen, Chromatiden bleiben zusammen.`,c:2,ci:'2',dna:'4C',note:'je Pol n'},
  telo1:{n:['Ende der Meiose I: zwei Zellen','Telophase I und Zytokinese'],sh:['Ende Meiose I','Telo I'],
    d:[`Es sind zwei Zellen mit je n Chromosomen entstanden (haploid). Jedes Chromosom besteht noch aus zwei Chromatiden. Zwischen Meiose I und II gibt es keine erneute DNA-Verdopplung.`,
       `Zwei haploide Zellen (n, 2C je Zelle). Jedes Chromosom besteht noch aus zwei Chromatiden, die wegen des Crossing-over nicht mehr identisch sein müssen. Zwischen den Teilungen findet keine S-Phase statt.`],
    hint:`Zwei Zellen, jede mit halb so vielen X-Chromosomen.`,c:1,ci:'2',dna:'2C',note:'je Zelle'},
  inter:{n:['','Interkinese'],sh:['','Inter'],
    d:[``,`Kurze Pause zwischen den Teilungen ohne DNA-Replikation. Die Chromosomen dekondensieren je nach Organismus nur teilweise.`],
    hint:`Zwei haploide Zellen, X-Chromosomen noch zweiteilig.`,c:1,ci:'2',dna:'2C',note:'je Zelle'},
  pro2:{n:['','Prophase II'],sh:['','Pro II'],
    d:[``,`Die Chromosomen kondensieren erneut, in jeder Zelle bildet sich eine neue Spindel, meist senkrecht zur Spindel der Meiose I.`],
    hint:`Zwei Zellen, neue Spindeln.`,c:1,ci:'2',dna:'2C',note:'je Zelle'},
  meta2:{n:['Metaphase II','Metaphase II'],sh:['Metaphase II','Meta II'],
    d:[`In beiden Zellen ordnen sich die Chromosomen einzeln in der Mitte an, jetzt ohne Partner. Es sieht aus wie in der Mitose, aber es sind nur halb so viele Chromosomen.`,
       `In beiden haploiden Zellen liegen die Chromosomen einzeln in der Äquatorialebene, die Kinetochore der Schwesterchromatiden zeigen zu entgegengesetzten Polen. Der Ablauf entspricht der Mitose, aber mit n statt 2n Chromosomen.`],
    hint:`Zwei Zellen, einzelne X-Chromosomen in der Mitte.`,c:1,ci:'2',dna:'2C',note:'je Zelle'},
  ana2:{n:['Anaphase II','Anaphase II'],sh:['Anaphase II','Ana II'],
    d:[`Die Chromatiden jedes Chromosoms werden getrennt und zu den Polen gezogen.`,
       `Das zentromerische Cohesin wird gespalten, die Schwesterchromatiden wandern zu entgegengesetzten Polen. Wegen des Crossing-over können sie sich genetisch unterscheiden.`],
    hint:`In beiden Zellen wandern Chromatiden auseinander.`,c:2,ci:'1',dna:'2C',note:'je Zelle'},
  telo2:{n:['','Telophase II'],sh:['','Telo II'],
    d:[``,`Kernhüllen bilden sich, die Chromosomen dekondensieren, die Zytokinese läuft in beiden Zellen.`],
    hint:`Vier neue Kerne bilden sich.`,c:1,ci:'1',dna:'1C',note:'je Kern'},
  end:{n:['Ergebnis: vier Zellen','Ergebnis: vier haploide Zellen'],sh:['Ergebnis','Ende'],
    d:[`Aus einer diploiden Zelle sind vier haploide Zellen mit Ein-Chromatid-Chromosomen entstanden. Sie sind genetisch verschieden: durch die zufällige Verteilung der Chromosomen und durch Crossing-over.`,
       `Vier haploide Zellen (n, 1C), genetisch unterschiedlich durch interchromosomale Rekombination (2ⁿ Anordnungen der Homologen) und intrachromosomale Rekombination (Crossing-over). Beim Menschen entstehen Keimzellen. Bei der Eizellbildung ist die Teilung ungleich, nur eine Eizelle bleibt, das ist hier vereinfacht.`],
    hint:`Vier kleine Zellen, jede mit einem Chromosom je Paar.`,c:1,ci:'1',dna:'1C',note:'je Zelle'}
 }
};

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

  const rod=th=>({a1:th+PI,a2:th}), vee=(tr,b)=>({a1:tr-b,a2:tr+b});

  { let s=base(); nuc(s,0,{op:1}); cen(s,0,{cv:1,cp:0,dup:0.5}); E.s={sc:s,ch:chromatin(CX,CY,1,0.55,false)}; }

    const ch=pairCh((p,h)=>pcx(p)+(h?7:-7),(p,h)=>CY); s.xm.forEach((m,p)=>{ const a=ch[(2*p+0)*2+0], b=ch[(2*p+1)*2+1]; const ca=cutPt(ch[(2*p+0)*2+1]), cb=cutPt(ch[(2*p+1)*2+0]); m.x=(ca.x+cb.x)/2; m.y=(ca.y+cb.y)/2; m.op=R.co[p]?1:0; }); E.pro1={sc:s,ch}; }

  h+=`<div class="card"><h2>Annahmen und Grenzen</h2><ul class="plain"><li>Das Modell zeigt zwei oder drei Chromosomenpaare. Echte Zellen haben viel mehr (Mensch: 23 Paare), die Chromosomen sind viel kleiner.</li><li>Die Zeitabläufe, Größenverhältnisse und die Form der Zellen sind schematisch.</li><li>Das Crossing-over wird an einer Stelle je Paar gezeigt. In Wirklichkeit gibt es oft mehrere Austauschstellen.</li><li>Die Dauer der Phasen, die Cyclinkurven und die Beispieldaten sind Beispiele, keine Messwerte.</li><li>Gezeigt werden Tierzelle (mit Furche) und Pflanzenzelle (mit Zellplatte) für die Mitose, die Meiose ist als Tierzelle dargestellt.</li></ul></div>`;
  h+=`<div class="card"><h2>Aufgaben (${lv===0?'Klasse 9':'Oberstufe'})</h2><p class="note">Die Punktzahlen sind ein Vorschlag. Notengebung und Bewertungsmaßstab richten sich nach den Beschlüssen eurer Fachkonferenz.</p>`;
  TASKS[lv].forEach((t,i)=>{ h+=`<details class="task"><summary><span class="badge">AFB ${t.afb}</span>${i+1}. ${esc(t.t)} <span class="badge">${t.p} P</span></summary><p><b>${t.op}:</b> ${esc(t.text)}</p><div class="btnrow"><button type="button" class="btn sm" data-act="itask" data-p="${t.load[0]}" data-i="${t.load[1]}">Passende Ansicht öffnen</button></div><details><summary style="cursor:pointer;min-height:40px;display:flex;align-items:center;font-weight:700">Erwartungshorizont</summary><div class="sol"><ul class="plain">${t.sol.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></details></details>`; });
  h+=`</div><div class="card"><details class="mode"><summary>Hinweise für die Lehrkraft</summary><p><b>Einsatz:</b> Klasse 9: Zellzyklus als Einstieg, Mitose Schritt für Schritt mit „Bei jeder Phase anhalten“, danach Meiose und Vergleich. Oberstufe: zusätzlich Kontrollpunkte, DNA-Diagramm, Prophase I im Detail und Rekombination.</p><p><b>Typische Fehlvorstellungen:</b> „Die Chromosomen verdoppeln sich in der Prophase“ (die DNA wird in der S-Phase repliziert); „In der Anaphase I trennen sich Chromatiden“ (es sind die Homologen); „Die Meiose hat zwei Verdopplungen“ (nur eine); „Chromosomen paaren sich auch in der Mitose“.</p><p><b>Einordnung:</b> Die Zuordnung zu Themenschwerpunkten und Kompetenzbereichen im Kerncurriculum Biologie (Sek I und Sek II) und in den Vorgaben zum Abitur musst du auf nibis.de prüfen. Die Begriffe (zum Beispiel Ein-Chromatid-Chromosom) können je nach Schulbuch abweichen.</p><p><b>Bewertung:</b> Die Punktevorschläge sind unverbindlich. Notengebung bleibt deine Verantwortung und folgt den Fachkonferenzbeschlüssen.</p><p><b>Datenschutz:</b> Die App speichert nichts.</p></details></div>`;
  $('#pane-info').innerHTML=h;
}

/* =============== Steuerung =============== */
function renderTab(){ ({cyc:renderCyc,mit:renderPath,mei:renderPath,cmp:renderCmp,train:renderTrain,info:renderInfo}[S.tab])(); }
function showTab(t){
  if(S.tab==='mit'||S.tab==='mei') stopPlay();
  S.tab=t; $$('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t)); ['cyc','mit','mei','cmp','train','info'].forEach(k=>{ $('#pane-'+k).hidden=k!==t; });
  const vis=t==='mit'||t==='mei'; if(vis){ S.path=t; S.u=Math.min(S.u,list().length-1); } $('#viewer').hidden=!vis;
  if(!S.keys) buildKeys(); renderTab(); if(vis) drawViewer(); window.scrollTo({top:0});
}
function setLevel(lv){ if(lv===S.level) return; stopPlay(); S.level=lv; S.n=2; S.co=lv===1; S.alleles=true; S.u=0; S.quiz=null; S.view=(lv===1&&window.innerWidth>=900)?'both':'cell'; $$('#lvl button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.lv===lv)); buildKeys(); showTab(S.tab); }
function rebuild(){ stopPlay(); buildKeys(); renderTab(); drawViewer(); }
document.addEventListener('input',e=>{ const t=e.target;
  if(t.id==='scrub'){ stopPlay(); S.u=t.value/1000*(list().length-1); drawViewer(); updateStageUI(); return; }
  if(t.id==='spd'){ S.speed=parseFloat(t.value); return; }
  if(t.id==='rpos'){ S.ring.pos=t.value/1000; S.ring.sel=null; updateRing(); return; }
  if(t.id==='cT'){ S.cycT=+t.value; $('#ocT').textContent=S.cycT+' h'; $('#ctable').innerHTML=cycTable(); return; }
  if(t.dataset.pop){ S.pop[t.dataset.pop]=+t.value; $('#opT').textContent=S.pop.T+' h'; $('#opg').textContent=S.pop.g+' %'; drawCycCharts(); return; }
  if(t.dataset.cmp){ S.cmpN=+t.value; $('#ocmpn').textContent=S.cmpN; $('#cmpres').innerHTML=cmpRes(); return; }
  if(t.dataset.rk!=null){ S.root.k[+t.dataset.rk]=Math.max(0,+t.value||0); const act=document.activeElement&&document.activeElement.id; $('#roothtml').innerHTML=rootHTML(); const el=act?document.getElementById(act):null; if(el){ el.focus(); try{ el.setSelectionRange(el.value.length,el.value.length); }catch(_){} } return; }
  if(t.dataset.rt){ S.root.T=Math.max(1,+t.value||16); const act=document.activeElement&&document.activeElement.id; $('#roothtml').innerHTML=rootHTML(); const el=act?document.getElementById(act):null; if(el){ el.focus(); } return; }
});
document.addEventListener('change',e=>{ const t=e.target; if(t.id==='spd'){ S.speed=parseFloat(t.value); return; }
  if(t.dataset.sh==='co'){ S.co=t.checked; rebuild(); } else if(t.dataset.sh==='alleles'){ S.alleles=t.checked; drawViewer(); const g=$('#pane-mei'); renderPath(); }
  else if(t.dataset.sh==='labels'){ S.labels=t.checked; drawViewer(); } else if(t.dataset.sh==='pause'){ S.pauseEach=t.checked; } });
document.addEventListener('click',e=>{
  const v=e.target.closest('[data-v]'); if(v){ const k=v.dataset.v; const L=list();
    if(k==='play'){ if(S.play) stopPlay(); else startPlay(); } else if(k==='prev'){ goStage(Math.ceil(S.u-1.001)); } else if(k==='next'){ goStage(Math.floor(S.u+1.001)); }
    else if(k==='view'){ S.view=v.dataset.m; drawViewer(); } else if(k==='fold'){ const c=$('#viewer').classList.toggle('collapsed'); v.setAttribute('aria-pressed',c); v.textContent=c?'▼':'▲'; }
    return; }
  const lvb=e.target.closest('#lvl button'); if(lvb){ setLevel(+lvb.dataset.lv); return; }
  const tb=e.target.closest('.tab'); if(tb){ showTab(tb.dataset.tab); return; }
  const ph=e.target.closest('[data-ph]'); if(ph&&S.tab==='cyc'){ const k=ph.dataset.ph; if(k==='g0'){ S.ring.sel='g0'; } else { const id=+k, W=CYC.show, tot=W.reduce((a,b)=>a+b,0); S.ring.sel=S.level===0?(id===0?0:3):id; S.ring.pos=W.slice(0,id).reduce((a,b)=>a+b,0)/tot+0.4*W[id]/tot; $('#rpos').value=Math.round(S.ring.pos*1000); } updateRing(); return; }
  const a=e.target.closest('[data-act]'); if(!a) return; const act=a.dataset.act;
  switch(act){
    case 'stage': goStage(+a.dataset.i); break;
    case 'cell': S.cell=a.dataset.k; renderPath(); drawViewer(); break;
    case 'dice': S.seed++; rebuild(); break;
    case 'npairs': S.n=+a.dataset.k; rebuild(); break;
    case 'pro1': S.pro1=+a.dataset.i; $$('[data-act="pro1"]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.i===S.pro1)); $('#pro1svg').innerHTML=pro1SVG(S.pro1); $('#pro1txt').textContent=PRO1[S.pro1].d; break;
    case 'popset': S.pop.T=+a.dataset.t; S.pop.g=+a.dataset.g; $('#pT').value=S.pop.T; $('#pg').value=S.pop.g; $('#opT').textContent=S.pop.T+' h'; $('#opg').textContent=S.pop.g+' %'; drawCycCharts(); break;
    case 'rootex': S.root.k=ROOT_EX.k.slice(); $('#roothtml').innerHTML=rootHTML(); break;
    case 'qa': { const i=+a.dataset.i; if(S.quiz.ans!=null) break; S.quiz.ans=i; const sc=S.score[S.level]; sc.n++; if(S.quiz.opts[i].ok) sc.ok++; renderTrain(); break; }
    case 'qnext': newQuiz(); S.quiz.lv=S.level; renderTrain(); break;
    case 'mc': { const i=+a.dataset.i, j=+a.dataset.j, st=S.mcq[S.level]; if(st[i]!=null) break; st[i]=j; const sc=S.score[S.level]; sc.n++; if(j===MCQ[S.level][i].ok) sc.ok++; renderTrain(); break; }
    case 'itask': { const p=a.dataset.p, i=+a.dataset.i; if(p==='cyc'||p==='cmp'){ showTab(p); } else { showTab(p); S.u=Math.min(i,list().length-1); drawViewer(); updateStageUI(); } break; }
  }
});
let rsz=null; window.addEventListener('resize',()=>{ clearTimeout(rsz); rsz=setTimeout(()=>{ if(S.tab==='mit'||S.tab==='mei') drawViewer(); if(S.tab==='cyc') drawCycCharts(); },120); });
$$('#lvl button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.lv===S.level));
/* =============== Start =============== */
(function init(){ buildKeys(); showTab('cyc'); })();
})();
</script>
