<style>

}

    --sc-bg1:#1B2433; --sc-bg2:#0F2F35; --sc-pre1:#2E6272; --sc-pre2:#1F4655; --sc-post1:#34456C; --sc-post2:#244048; --sc-cleft:#4B4526; --sc-mem:#86B8F2; --sc-memL:#1B2B45; --sc-ves1:#7D6D40; --sc-ves2:#5E5230; --sc-vesS:#D6B968; --sc-ach1:#FFD0E4; --sc-ach2:#E0488A; --sc-achS:#FFB35C; --sc-g1:#6FCF86; --sc-g2:#2E9B4F; --sc-gS:#A8E8B6; --sc-y1:#D9E463; --sc-y2:#97AC2B; --sc-yS:#E4F08B; --sc-lum:#8EC5E6; --sc-ache:#4CC26C; --sc-acheS:#A8E8B6; --sc-arr1:#FFF3A6; --sc-arr2:#E8B92E; --sc-arrS:#FFE27A; --sc-sq:#DCE6F7; --sc-cur:#FFC53D;
    --ach:#FF8A4C; --ca:#6EA0FF; --na:#C58AE6; --ache:#FF7BA8; --cht:#5FD07A; --rec:#B58CF0; --ap:#FFC53D;
    --tox:#FF8F85; --tox-bg:#4A1E1C; --ant:#4FD1BF; --ant-bg:#10382F; --warn:#F2C25B; --warn-bg:#3A2F12; --info:#9DB7FF; --info-bg:#1E2C5C;
  }
}

  --bg:#0E1520; --panel:#162131; --panel-2:#1C2A3D; --ink:#E8EDF5; --ink-soft:#A5B2C6; --line:#2C3C54; --nav:#DCE6F7; --nav-ink:#0E1520; --focus:#8AB4FF;
  --sc-bg1:#1B2433; --sc-bg2:#0F2F35; --sc-pre1:#2E6272; --sc-pre2:#1F4655; --sc-post1:#34456C; --sc-post2:#244048; --sc-cleft:#4B4526; --sc-mem:#86B8F2; --sc-memL:#1B2B45; --sc-ves1:#7D6D40; --sc-ves2:#5E5230; --sc-vesS:#D6B968; --sc-ach1:#FFD0E4; --sc-ach2:#E0488A; --sc-achS:#FFB35C; --sc-g1:#6FCF86; --sc-g2:#2E9B4F; --sc-gS:#A8E8B6; --sc-y1:#D9E463; --sc-y2:#97AC2B; --sc-yS:#E4F08B; --sc-lum:#8EC5E6; --sc-ache:#4CC26C; --sc-acheS:#A8E8B6; --sc-arr1:#FFF3A6; --sc-arr2:#E8B92E; --sc-arrS:#FFE27A; --sc-sq:#DCE6F7; --sc-cur:#FFC53D;
  --ach:#FF8A4C; --ca:#6EA0FF; --na:#C58AE6; --ache:#FF7BA8; --cht:#5FD07A; --rec:#B58CF0; --ap:#FFC53D;
  --tox:#FF8F85; --tox-bg:#4A1E1C; --ant:#4FD1BF; --ant-bg:#10382F; --warn:#F2C25B; --warn-bg:#3A2F12; --info:#9DB7FF; --info-bg:#1E2C5C;
}
html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 8px); }
*,*::before,*::after{ box-sizing:border-box; }
[hidden]{ display:none !important; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.5; }
button,input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
.top{ max-width:1000px; margin:0 auto; padding:14px clamp(12px,3vw,24px) 4px; }
.top h1{ font-family:var(--display); font-weight:800; font-size:clamp(1.55rem,5vw,2.3rem); line-height:1.08; margin:0; letter-spacing:-.02em; }
.top p{ margin:6px 0 0; color:var(--ink-soft); max-width:72ch; }
.tabs{ max-width:1000px; margin:8px auto 0; padding:0 clamp(12px,3vw,24px); display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
.tabs::-webkit-scrollbar{ display:none; }
.tab{ flex:none; border:2px solid var(--line); background:var(--panel); border-radius:12px; padding:.35em 1em; font-weight:700; font-size:.95rem; cursor:pointer; min-height:46px; color:var(--ink-soft); }
.tab[aria-selected="true"]{ background:var(--nav); border-color:var(--nav); color:var(--nav-ink); }

/* Schema-Betrachter (angeheftet) */
.viewer{ position:sticky; top:0; z-index:20; max-width:1000px; margin:10px auto 0; padding:0 clamp(12px,3vw,24px); }
.vbox{ background:var(--panel); border:2px solid var(--ink); border-radius:14px; overflow:hidden; box-shadow:0 6px 0 -2px color-mix(in srgb,var(--ink) 16%,transparent); }
.vbar{ display:flex; gap:6px; padding:6px 8px; border-bottom:1px solid var(--line); align-items:center; background:var(--panel-2); }
.vbar .btn{ min-height:40px; padding:.1em .7em; font-size:.9rem; min-width:40px; }
.vbar .lbl{ flex:1; min-width:0; font-weight:700; font-size:.92rem; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.vbar .lbl small{ display:block; font-weight:400; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; }
.vwrap{ display:flex; justify-content:center; background:var(--panel); }
.viewer.collapsed .vwrap,.viewer.collapsed .vinfo{ display:none; }
#schema{ display:block; width:100%; height:auto; max-height:min(54vh,500px); }
@media (max-width:700px){ #schema{ max-height:38vh; } .vinfo{ font-size:.8rem; padding:4px 10px; min-height:28px; } .vbar .lbl{ font-size:.85rem; } }
.vinfo{ padding:6px 12px; font-size:.88rem; min-height:32px; border-top:1px solid var(--line); background:var(--panel); color:var(--ink-soft); }
.vinfo b{ color:var(--ink); }
.vinfo .tg{ display:inline-block; border-radius:99px; padding:0 9px; font-weight:700; font-size:.78rem; margin-right:4px; }
.tg.tox{ background:var(--tox-bg); color:var(--tox); } .tg.ant{ background:var(--ant-bg); color:var(--ant); }

.wrap{ max-width:1000px; margin:0 auto; padding:12px clamp(12px,3vw,24px) 40px; }
.card{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:14px; }
.card h2{ font-family:var(--display); font-weight:800; font-size:1.25rem; margin:0 0 8px; line-height:1.2; }
.card h3{ font-family:var(--display); font-weight:800; font-size:1.05rem; margin:14px 0 4px; line-height:1.25; }
.lead{ margin:0 0 10px; max-width:74ch; }
.note{ font-size:.9rem; color:var(--ink-soft); margin:6px 0; max-width:80ch; }
.btnrow{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; align-items:center; }
.btn{ font-weight:700; border-radius:10px; border:2px solid var(--line); background:var(--panel); padding:.4em .9em; cursor:pointer; min-height:46px; }
.btn.primary{ background:var(--nav); border-color:var(--nav); color:var(--nav-ink); }
.btn:hover:not(:disabled){ border-color:var(--ink); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn[aria-pressed="true"]{ background:var(--nav); color:var(--nav-ink); border-color:var(--nav); }
.seg{ display:inline-flex; flex-wrap:wrap; border:2px solid var(--line); border-radius:10px; overflow:hidden; }
.seg button{ border:0; background:var(--panel); padding:.35em .85em; font-weight:700; cursor:pointer; min-height:42px; border-right:1px solid var(--line); }
.seg button:last-child{ border-right:0; }
.seg button[aria-pressed="true"]{ background:var(--nav); color:var(--nav-ink); }
input[type=range]{ width:100%; accent-color:var(--nav); min-height:34px; }
select,input[type=text]{ width:100%; border:2px solid var(--line); border-radius:10px; padding:.5em .65em; background:var(--panel); min-height:46px; }
label.fl{ display:block; font-weight:700; font-size:.9rem; color:var(--ink-soft); margin:8px 0 3px; }
.ck{ display:flex; gap:8px; align-items:center; min-height:40px; cursor:pointer; }
.ck input{ width:22px; height:22px; accent-color:var(--nav); flex:none; }
.grid2{ display:grid; gap:10px; grid-template-columns:1fr; }
@media (min-width:700px){ .grid2{ grid-template-columns:1fr 1fr; } }
.fb{ padding:8px 12px; border-radius:10px; margin-top:8px; font-size:.95rem; }
.fb.ok{ background:var(--ant-bg); color:var(--ant); } .fb.no{ background:var(--tox-bg); color:var(--tox); } .fb.tip{ background:var(--warn-bg); color:var(--warn); } .fb.info{ background:var(--info-bg); color:var(--info); }
.warn{ background:var(--warn-bg); color:var(--warn); border-radius:12px; padding:10px 14px; margin:8px 0; font-size:.93rem; }
.badge{ display:inline-block; font-size:.78rem; font-weight:700; border-radius:99px; padding:1px 10px; border:1px solid var(--line); background:var(--panel-2); margin-right:4px; white-space:nowrap; }
.badge.ok{ background:var(--ant-bg); color:var(--ant); border-color:transparent; } .badge.no{ background:var(--tox-bg); color:var(--tox); border-color:transparent; } .badge.tip{ background:var(--warn-bg); color:var(--warn); border-color:transparent; } .badge.info{ background:var(--info-bg); color:var(--info); border-color:transparent; }

/* Schrittliste */
.steps{ list-style:none; margin:8px 0 0; padding:0; position:relative; }
.stp{ display:flex; gap:12px; padding:0 0 12px; position:relative; }
.stp::before{ content:""; position:absolute; left:17px; top:36px; bottom:0; width:3px; background:var(--line); }
.stp:last-child::before{ display:none; }
.stp .n{ flex:none; width:36px; height:36px; border-radius:50%; background:var(--panel); border:3px solid var(--nav); font-family:var(--display); font-weight:800; display:grid; place-items:center; cursor:pointer; z-index:1; }
.stp .b{ flex:1; min-width:0; border:2px solid var(--line); border-radius:12px; padding:8px 12px; background:var(--panel); cursor:pointer; text-align:left; }
.stp.cur .b{ border-color:var(--nav); box-shadow:0 0 0 2px var(--nav) inset; }
.stp.cur .n{ background:var(--nav); color:var(--nav-ink); }
.stp.bad .n{ border-color:var(--tox); } .stp.bad.cur .n{ background:var(--tox); border-color:var(--tox); color:#fff; }
.stp h3{ margin:0 0 2px; font-size:1.02rem; }
.stp p{ margin:2px 0; font-size:.93rem; }
.stp .key{ font-size:.85rem; color:var(--ink-soft); }
.st-chip{ display:inline-block; font-size:.76rem; font-weight:700; border-radius:99px; padding:0 9px; margin-left:6px; vertical-align:2px; }
.st-chip.ok{ background:var(--panel-2); color:var(--ink-soft); border:1px solid var(--line); }
.st-chip.schwach{ background:var(--warn-bg); color:var(--warn); } .st-chip.aus{ background:var(--tox-bg); color:var(--tox); } .st-chip.dauer{ background:var(--tox-bg); color:var(--tox); } .st-chip.folge{ background:var(--panel-2); color:var(--ink-soft); border:1px dashed var(--ink-soft); }
.st-chip.ang{ background:var(--tox); color:#fff; }
.bar{ height:6px; border-radius:3px; background:var(--panel-2); overflow:hidden; margin-top:4px; max-width:260px; }
.bar i{ display:block; height:100%; background:var(--nav); }
.stp.bad .bar i{ background:var(--tox); }

/* Karten für Gifte/Gegengifte */
.cgrid{ display:grid; gap:10px; grid-template-columns:1fr; }
@media (min-width:640px){ .cgrid{ grid-template-columns:1fr 1fr; } }
.opt{ text-align:left; border:2px solid var(--line); border-radius:14px; padding:10px 12px; background:var(--panel); cursor:pointer; display:block; width:100%; }
.opt b{ font-family:var(--display); font-size:1.02rem; display:block; }
.opt span{ display:block; font-size:.88rem; color:var(--ink-soft); }
.opt.tox[aria-pressed="true"]{ border-color:var(--tox); box-shadow:0 0 0 2px var(--tox) inset; background:var(--tox-bg); }
.opt.ant[aria-pressed="true"]{ border-color:var(--ant); box-shadow:0 0 0 2px var(--ant) inset; background:var(--ant-bg); }
.rate{ border-radius:12px; padding:10px 14px; margin-top:8px; border-left:8px solid var(--line); background:var(--panel-2); }
.rate h3{ margin:0 0 2px; }
.rate.gut{ border-color:var(--ant); background:var(--ant-bg); } .rate.teil{ border-color:#C58A00; background:var(--warn-bg); } .rate.stuetz{ border-color:var(--info); background:var(--info-bg); } .rate.nutz{ border-color:var(--ink-soft); } .rate.schad{ border-color:var(--tox); background:var(--tox-bg); }
.kpi{ display:grid; gap:8px; grid-template-columns:repeat(3,1fr); margin:8px 0; }
.kpi div{ border:1px solid var(--line); border-radius:12px; padding:6px 10px; background:var(--panel); }
.kpi b{ display:block; font-family:var(--display); font-size:1.35rem; line-height:1.1; }
.kpi small{ color:var(--ink-soft); font-size:.8rem; line-height:1.2; display:block; }
@media (max-width:420px){ .kpi b{ font-size:1.15rem; } }
.tbl{ width:100%; border-collapse:collapse; font-size:.9rem; }
.tbl th,.tbl td{ text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
.tscroll{ overflow-x:auto; max-width:100%; }
.mx{ border-collapse:separate; border-spacing:3px; font-size:.82rem; }
.mx th{ font-weight:700; padding:2px 4px; text-align:left; vertical-align:bottom; }
.mx thead th{ text-align:center; font-size:.76rem; }
.mx td button{ width:44px; height:44px; border:2px solid transparent; border-radius:8px; font-weight:800; cursor:pointer; font-size:.9rem; }
.mx .gut{ background:var(--ant-bg); color:var(--ant); } .mx .teil{ background:var(--warn-bg); color:var(--warn); } .mx .stuetz{ background:var(--info-bg); color:var(--info); } .mx .nutz{ background:var(--panel-2); color:var(--ink-soft); } .mx .schad{ background:var(--tox-bg); color:var(--tox); }
.mx td button[aria-pressed="true"]{ border-color:var(--ink); }
.mxl{ display:flex; flex-wrap:wrap; gap:6px 12px; font-size:.84rem; margin-top:6px; }
.chart{ width:100%; display:block; }
.chart text{ fill:var(--ink); font-family:var(--body); }
.chart .ax{ stroke:var(--line); } .chart .tx2{ fill:var(--ink-soft); }
.legendrow{ display:flex; flex-wrap:wrap; gap:4px 14px; font-size:.86rem; margin:4px 0; }
.legendrow i{ display:inline-block; width:22px; height:0; border-top:3px solid; vertical-align:middle; margin-right:5px; }
details.task{ border-top:1px solid var(--line); padding:6px 0; }
details.task>summary,details.mode>summary{ cursor:pointer; font-weight:700; min-height:44px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
details.task .sol{ background:var(--panel-2); border-radius:10px; padding:2px 12px 8px; margin-top:8px; }
ul.plain{ margin:4px 0 0; padding-left:1.2em; } ul.plain li{ margin:3px 0; }
.gl dt{ font-family:var(--display); font-weight:800; margin-top:10px; } .gl dd{ margin:2px 0 0; max-width:75ch; }
.legend{ display:grid; gap:8px 14px; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); font-size:.92rem; }
.legend div{ display:flex; gap:10px; align-items:flex-start; } .legend b{ font-family:var(--display); }
.sw{ flex:none; width:18px; height:18px; border-radius:5px; border:2px solid var(--ink); margin-top:2px; }
.case{ border:2px solid var(--line); border-radius:14px; padding:10px 14px; margin-bottom:10px; background:var(--panel); }
.sym{ background:var(--panel-2); border-radius:10px; padding:8px 12px; font-size:.95rem; }
@media print{ .tabs,.btnrow,.viewer .vbar{ display:none !important; } .viewer{ position:static; } }

/* ===== Schema (Lehrbuchstil) ===== */
.sv text{ font-family:var(--body); fill:var(--ink); }
.sv .lab{ font-size:12.5px; font-weight:700; } .sv .lab2{ font-size:10px; fill:var(--ink-soft); }
.sv .leader{ stroke:var(--ink); stroke-width:1; fill:none; }
.sv .mem{ fill:none; stroke:var(--sc-mem); stroke-width:11; stroke-linejoin:round; } .sv .memL{ fill:none; stroke:var(--sc-memL); stroke-width:7; stroke-linejoin:round; }
.sv .cleftF{ fill:var(--sc-cleft); }
.sv .ves{ fill:url(#gVes); stroke:var(--sc-vesS); stroke-width:1.6; }
.sv .ach{ fill:url(#gAch); stroke:var(--sc-achS); stroke-width:1.2; transition:opacity .6s, transform 1.2s ease-in-out; }
.sv .chy{ fill:var(--sc-y2); stroke:var(--sc-yS); stroke-width:1.3; } .sv .chyT{ fill:var(--sc-y1); stroke:var(--sc-yS); stroke-width:1.3; }
.sv .chyC{ fill:var(--sc-yS); } .sv .chyL{ fill:var(--sc-lum); stroke:var(--sc-yS); stroke-width:1; }
.sv .cht{ fill:var(--sc-g2); stroke:var(--sc-gS); } .sv .chyT.cht{ fill:var(--sc-g1); }
.sv .vgc .chy{ fill:var(--sc-y2); } 
.sv .chg{ fill:var(--sc-g2); stroke:var(--sc-gS); stroke-width:1.4; } .sv .chgT{ fill:var(--sc-g1); stroke:var(--sc-gS); stroke-width:1.4; } .sv .chgL{ fill:var(--sc-lum); stroke:var(--sc-gS); }
.sv .rcp{ fill:var(--sc-y1); stroke:var(--sc-yS); stroke-width:1.2; }
.sv .naA,.sv .caArrow{ stroke:var(--ink); stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.sv .ionP rect,.sv .naP rect{ fill:#fff; stroke:#C8CED8; stroke-width:1; } .sv .ionP text,.sv .naP text{ fill:#1B1B1B; font-size:11.5px; font-weight:700; }
.sv .ion{ fill:var(--ca); stroke:#fff; stroke-width:1; } .sv .ion.cal{ stroke:var(--ant); stroke-width:1.6; }
.sv .snare{ stroke:var(--ink); stroke-width:1.8; fill:none; }
.sv .omega{ fill:url(#gVes); stroke:var(--sc-mem); stroke-width:2.4; }
.sv .ache{ fill:var(--sc-ache); stroke:var(--sc-acheS); stroke-width:1.4; stroke-linejoin:round; }
.sv .fragP{ fill:url(#gAch); stroke:var(--sc-achS); stroke-width:1.1; }
.sv .warr{ fill:url(#gArr); stroke:var(--sc-arrS); stroke-width:1.6; stroke-linejoin:round; }
.sv .sq rect{ fill:var(--sc-sq); stroke:var(--panel); stroke-width:1.4; transition:fill .3s; } .sv .sq text{ fill:var(--nav-ink); font-size:13px; font-weight:800; }
.sv .sq text{ fill:#fff; } :root[data-theme="dark"] .sv .sq text{ fill:#0E1520; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .sv .sq text{ fill:#0E1520; } }
.sv.c1 .sq1 rect,.sv.c2 .sq2 rect,.sv.c3 .sq3 rect,.sv.c4 .sq4 rect,.sv.c5 .sq5 rect,.sv.c6 .sq6 rect,.sv.c7 .sq7 rect,.sv.c8 .sq8 rect,.sv.c9 .sq9 rect{ fill:var(--sc-cur); }
.sv.c1 .sq1 text,.sv.c2 .sq2 text,.sv.c3 .sq3 text,.sv.c4 .sq4 text,.sv.c5 .sq5 text,.sv.c6 .sq6 text,.sv.c7 .sq7 text,.sv.c8 .sq8 text,.sv.c9 .sq9 text{ fill:#1B1B1B !important; }

<script>
(function(){

/* =============== Hilfen =============== */
const $=(s,r=document)=>r.querySelector(s);

/* =============== Die neun Schritte (Nummerierung wie in der Lehrbuchabbildung) =============== */
const STEPS=[
 {n:1,t:'Aktionspotenzial erreicht die Endigung',where:'Axonende (Präsynapse)',
  d:'Das Aktionspotenzial läuft über die Axonmembran bis in die Endigung. Spannungsgesteuerte Na⁺-Kanäle öffnen nacheinander, die Membran depolarisiert.',key:'Na⁺-Kanäle des Axons'},
 {n:2,t:'Ca²⁺-Einstrom',where:'Präsynaptische Membran',
  d:'Die Depolarisation öffnet spannungsgesteuerte Ca²⁺-Kanäle. Ca²⁺ strömt aus dem Spalt in die Endigung, denn außen ist die Konzentration viel höher.',key:'Ca²⁺-Kanäle'},
 {n:3,t:'Vesikel verschmelzen mit der Membran',where:'Präsynaptische Membran',
  d:'Ca²⁺ aktiviert den Ca-Sensor Synaptotagmin. SNARE-Proteine ziehen Vesikel und präsynaptische Membran zusammen, die Vesikel verschmelzen mit ihr (Exozytose).',key:'SNARE-Proteine, Vesikel'},
 {n:4,t:'Freisetzung des Transmitters',where:'Präsynaptische Membran',
  d:'Die verschmolzenen Vesikel entleeren ihren Inhalt: Acetylcholin (ACh) gelangt in den synaptischen Spalt.',key:'Acetylcholin (ACh)'},
 {n:5,t:'Diffusion durch den Spalt',where:'Synaptischer Spalt',
  d:'ACh diffundiert durch den nur etwa 20 bis 50 nm breiten synaptischen Spalt. Die Strecke ist so kurz, dass es nur Bruchteile einer Millisekunde dauert.',key:'Diffusion'},
 {n:6,t:'ACh bindet, Na⁺-Kanäle öffnen',where:'Postsynaptische Membran',
  d:'ACh bindet an die nikotinischen Rezeptoren, die zugleich ligandengesteuerte Na⁺-Kanäle sind. Die Kanäle öffnen, Na⁺ strömt ein (K⁺ strömt aus).',key:'nikotinischer ACh-Rezeptor'},
 {n:7,t:'EPSP und postsynaptisches Aktionspotenzial',where:'Postsynaptische Membran (Muskelfaser)',
  d:'Der Na⁺-Einstrom depolarisiert die Membran: Endplattenpotenzial (EPP, an Nervenzellen EPSP). Überschreitet es den Schwellenwert, öffnen spannungsgesteuerte Na⁺-Kanäle und ein Aktionspotenzial läuft über die Muskelfaser.',key:'Schwellenwert, Na⁺-Kanäle'},
 {n:8,t:'Abbau des ACh',where:'Synaptischer Spalt',
  d:'Die Acetylcholinesterase (AChE) spaltet ACh in Acetat und Cholin. Die Rezeptorkanäle schließen, das EPP klingt ab. Ohne Abbau bliebe die Membran dauerhaft depolarisiert.',key:'Acetylcholinesterase (AChE)'},
 {n:9,t:'Wiederaufnahme und Recycling',where:'Präsynapse',
  d:'Cholin wird über einen Na⁺-abhängigen Transporter in die Endigung aufgenommen. Dort entsteht mit Acetyl-CoA neues ACh, das in Vesikel verpackt wird. Die Vesikelmembran wird per Endozytose recycelt, Ca²⁺ wird abgepumpt.',key:'Cholin-Transporter, Cholin-Acetyltransferase'}
];

/* =============== Gifte =============== */
const POISONS=[
 {id:'TTX',name:'Tetrodotoxin (TTX)',q:'Kugelfisch (Fugu), Kaliforniermolch',step:1,art:'blockiert Natriumkanäle',
  w:'TTX verschließt von außen die Pore spannungsgesteuerter Na⁺-Kanäle. In der Endigung kommt kein (oder nur ein schwaches) Aktionspotenzial an. Auch die Na⁺-Kanäle der Muskelfaser sind betroffen.',
  s:'Kribbeln um den Mund, Taubheit, aufsteigende Lähmung, Atemlähmung bei vollem Bewusstsein.'},
 {id:'CTX',name:'ω-Conotoxin',q:'Gift der Kegelschnecken',step:2,art:'bindet fest an Ca²⁺-Kanäle',
  w:'ω-Conotoxin bindet spezifisch an präsynaptische spannungsgesteuerte Ca²⁺-Kanäle und verschließt sie. Das Aktionspotenzial kommt an, aber es strömt kein Ca²⁺ ein. Vesikel verschmelzen nicht.',
  s:'Lähmung der Muskeln, Taubheit, Atemlähmung.'},
 {id:'MG',name:'Magnesium-Überdosis',q:'Medikament (Magnesiumsulfat) in zu hoher Dosis',step:2,art:'konkurriert mit Ca²⁺',
  w:'Mg²⁺ konkurriert mit Ca²⁺ um den Eintritt durch die Ca²⁺-Kanäle (kompetitive Hemmung). Je mehr Mg²⁺, desto weniger Ca²⁺ strömt ein, desto weniger ACh wird freigesetzt.',
  s:'Erloschene Reflexe, Muskelschwäche, flache Atmung.'},
 {id:'BoNT',name:'Botulinumtoxin',q:'Bakterium Clostridium botulinum (verdorbene Konserven); in sehr kleiner Dosis als Medikament',step:3,art:'zerschneidet SNARE-Proteine',
  w:'Das Toxin gelangt in die Nervenendigung und spaltet dort SNARE-Proteine (je nach Typ zum Beispiel SNAP-25). Vesikel und Membran können nicht mehr verschmelzen. Der Block hält Wochen bis Monate, bis neue SNARE-Proteine gebildet sind.',
  s:'Doppelbilder, hängende Lider, Schluckstörung, absteigende schlaffe Lähmung, Atemlähmung.'},
 {id:'CUR',name:'Curare (Tubocurarin)',q:'Pfeilgift südamerikanischer Pflanzen; Muskelrelaxantien vom Curare-Typ in der Narkose',step:6,art:'konkurriert mit ACh um den Rezeptor',
  w:'Curare besetzt die ACh-Bindestellen des nikotinischen Rezeptors, öffnet den Kanal aber nicht (kompetitiver Antagonist). ACh kann nicht mehr binden, es entsteht kein ausreichendes EPP.',
  s:'Schlaffe Lähmung, zuerst Augen- und Gesichtsmuskeln, zuletzt das Zwerchfell.'},
 {id:'BGT',name:'α-Bungarotoxin',q:'Gift des Vielbindigen Kraits (Schlange)',step:6,art:'bindet fast irreversibel an den Rezeptor',
  w:'α-Bungarotoxin bindet an den nikotinischen ACh-Rezeptor und löst sich kaum wieder. Bei Gleichgewicht verdrängt auch viel ACh das Toxin nicht. Die gebundenen Rezeptoren fallen aus.',
  s:'Hängende Lider, Schluckstörung, schlaffe Lähmung, Atemlähmung. Oft kaum Schmerz an der Bissstelle.'},
 {id:'SUX',name:'Succinylcholin',q:'Muskelrelaxans in der Narkose (bei Enzymmangel oder Überdosis ein Gift)',step:6,art:'ACh-ähnlicher Dauerreiz',
  w:'Succinylcholin öffnet wie ACh die Rezeptorkanäle, wird aber nicht von der AChE abgebaut, sondern langsam von der Plasma-Cholinesterase. Die Membran bleibt depolarisiert, die Na⁺-Kanäle der Muskelfaser sind inaktiviert: Depolarisationsblock.',
  s:'Zuerst kurze Muskelzuckungen, dann schlaffe Lähmung.'},
 {id:'OP',name:'Organophosphat (E 605, Sarin)',q:'Insektizid (E 605, Parathion), Nervenkampfstoff (Sarin)',step:8,art:'hemmt die Acetylcholinesterase',
  w:'Organophosphate phosphorylieren die Acetylcholinesterase und hemmen sie dauerhaft. ACh wird nicht mehr abgebaut, es häuft sich im Spalt an, die Membran bleibt depolarisiert, die Na⁺-Kanäle der Muskelfaser sind inaktiviert.',
  s:'Speichelfluss, Schwitzen, enge Pupillen, Muskelzuckungen, danach Lähmung, Atemnot.'}
];
const POI=Object.fromEntries(POISONS.map(p=>[p.id,p]));

/* =============== Gegengifte (Maßnahmen) =============== */
const ANTIS=[
 {id:'NEO',name:'Neostigmin',k:'reversibler Acetylcholinesterase-Hemmer',w:'Hemmt die AChE vorübergehend. ACh bleibt länger und in höherer Konzentration im Spalt.'},
 {id:'ATR',name:'Atropin',k:'Antagonist an muskarinischen ACh-Rezeptoren',w:'Blockiert muskarinische ACh-Rezeptoren (zum Beispiel an Herz, Drüsen, glatter Muskulatur). Die Muskelendplatte besitzt nikotinische Rezeptoren.'},
 {id:'OXI',name:'Obidoxim',k:'Reaktivator der Acetylcholinesterase',w:'Entfernt den Phosphatrest von der blockierten AChE und stellt sie wieder her. Nur wirksam, solange das Enzym nicht „gealtert“ ist.'},
 {id:'AS',name:'Antiserum (Antitoxin)',k:'Antikörper gegen ein bestimmtes Gift',w:'Antikörper binden freie Giftmoleküle im Blut. Schon gebundenes Gift wird kaum noch erreicht.'},
 {id:'CAL',name:'Calciumgluconat',k:'Calcium-Salz zur Infusion',w:'Erhöht die Ca²⁺-Konzentration im Blut und im Spalt. Das Ca²⁺ kann mit Konkurrenten um die Ca²⁺-Kanäle mithalten.'},
 {id:'BEA',name:'Künstliche Beatmung',k:'unterstützende Maßnahme (Intensivmedizin)',w:'Sichert Atmung und Sauerstoffversorgung, solange die Atemmuskeln ausfallen. Sie wirkt nicht an der Synapse.'},
 {id:'ACH',name:'Acetylcholin spritzen',k:'Überträgerstoff selbst',w:'Zusätzliches ACh soll fehlende oder blockierte Übertragung ausgleichen. Es wird innerhalb von Millisekunden abgebaut.'}
];

/* Bewertung [Kategorie, Begründung] je Gift und Gegengift */
const BEA_T='Die Atemmuskeln fallen aus, das Herz schlägt weiter. Beatmung hält den Menschen am Leben, bis das Gift abgebaut oder ausgeschieden ist. Sie ist wichtig, ändert aber nichts an der Synapse.';
const RATE={

/* =============== Modell der Synapse (vereinfachte Simulation) =============== */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const SIM={dt:0.25,P0:0.35,Aq:17,tauN:40,fF:0.12,tauF:100,kE:0.9,kd:0.004,tauM:3,G:145,thr:25,Vh:18,kh:4,tauhI:12,tauhR:3,ref:3,N0:40,kdOn:0.002,kdOff:0.002};
function baseParams(){ return {naBlock:0,caBlock:0,mg:0,snareBlock:0,E:1,recBlock:0,cur:0,sux:0,ca_up:1,bolus:0,suxOnset:250}; }
/* Gifte: Dosisstufen 0 niedrig, 1 mittel, 2 hoch */
const DOSE={
  TTX:{key:'naBlock',v:[0.385,0.45,0.55]},
  CTX:{key:'caBlock',v:[0.15,0.35,0.55]},
  MG:{key:'mg',v:[0.25,0.55,1.2]},
  BoNT:{key:'snareBlock',v:[0.45,0.72,0.9]},
  CUR:{key:'cur',v:[0.8,2.0,4]},
  BGT:{key:'recBlock',v:[0.35,0.53,0.7]},
  SUX:{key:'sux',v:[0.38,0.45,1.5]},
  OP:{key:'Eblock',v:[0.5,0.88,0.99]}
};
const TIMEF={AS:[0.3,0.8,1],OXI:[0.85,0.45,0.05]};
function makeParams(poison,dose,anti,timing){
  const p=baseParams();
  if(poison){ const d=DOSE[poison]; const val=d.v[dose]; if(d.key==='Eblock') p.E=1-val; else p[d.key]=val; }
  if(anti==='NEO'){ p.E*=0.15; if(poison==='SUX') p.sux*=2.5; }
  if(anti==='OXI'&&poison==='OP'){ p.E=p.E+(1-p.E)*TIMEF.OXI[timing]; }
  if(anti==='AS'){ if(poison==='BoNT') p.snareBlock*=TIMEF.AS[timing]; if(poison==='BGT') p.recBlock*=TIMEF.AS[timing]; }
  if(anti==='CAL') p.ca_up=4;
  if(anti==='ACH') p.bolus=8;
  return p;
}
function derived(p){
  const avail=1-p.naBlock; const v=Math.max(0,Math.min(1,(avail-0.3)/0.4));
  const Cfac=(1-p.caBlock)/(1+p.mg/p.ca_up);
  return {v,Cfac,S:1-p.snareBlock,R:1-p.recBlock,Keff:1+p.cur,thrScale:1/(1-0.9*p.naBlock),kdeg:SIM.kE*p.E+SIM.kd};
}
/* Reizzeiten: konstant (f Hz) oder Rampe (f0 -> f1) in ms */
function stimTimes(proto){
  const out=[]; const T=proto.T/1000;
  if(proto.type==='const'){ const f=proto.f; for(let k=0;;k++){ const t=(k+0.5)/f; if(t>=T) break; out.push(t*1000); } }
  else if(proto.type==='single'){ out.push(proto.t0||2); }
  else { const f0=proto.f0,f1=proto.f1; for(let k=0;;k++){ // phi(t)=f0 t + (f1-f0) t^2/(2T) = k+0.5
      const a=(f1-f0)/(2*T), b=f0, c=-(k+0.5); let t; if(Math.abs(a)<1e-9) t=-c/b; else t=(-b+Math.sqrt(b*b-4*a*c))/(2*a); if(t>=T) break; out.push(t*1000); } }
  return out;
}
function freqAt(proto,tms){ const t=tms/1000,T=proto.T/1000; if(proto.type==='const') return proto.f; if(proto.type==='ramp') return proto.f0+(proto.f1-proto.f0)*t/T; return 0; }
/* Hauptsimulation. opts: dt, burn (ms Einschwingen), keepTrace */
function simulate(p,proto,opts){
  opts=opts||{}; const dt=opts.dt||SIM.dt, d=derived(p); const burn=opts.burn||0; const T=proto.T;
  const stim=stimTimes(proto).map(t=>t+burn); const N=Math.round((T+burn)/dt);
  let a=0,n=1,F=0,D=0,V=0,h=1,prevV=0,refUntil=-1e9,si=0; let bolusDone=false;
  const res={stim:stim.map(t=>t-burn),ap:[],Q:[],trace:null,a:null,Vmax:0,aPeak:0};
  const keep=opts.keepTrace; if(keep){ res.trace=new Float32Array(N); res.a=new Float32Array(N); res.t0=burn; res.dt=dt; }
  const eDec=Math.exp(-d.kdeg*dt), eN=1-Math.exp(-dt/SIM.tauN), eF=Math.exp(-dt/SIM.tauF), eHi=1-Math.exp(-dt/SIM.tauhI), eHr=1-Math.exp(-dt/SIM.tauhR); const rnd=mulberry32(opts.seed||12345);
  const delay=opts.delay||0; const pend=[];
  const thr=SIM.thr*d.thrScale;
  for(let i=0;i<N;i++){
    const t=i*dt;
    while(si<stim.length&&stim[si]<=t+1e-9){ pend.push(stim[si]+delay); si++; }
    while(pend.length&&pend[0]<=t+1e-9){ pend.shift();
      let pr=SIM.P0*d.v*Math.pow(Math.max(0,d.Cfac),3)*d.S*(1+F); pr=Math.min(pr,0.9);
      const nr=Math.round(n*SIM.N0); let k=0; if(opts.det) k=nr*pr; else for(let j=0;j<nr;j++) if(rnd()<pr) k++; const Q=k/SIM.N0; n=Math.max(0,n-Q); F+=SIM.fF*d.v; a+=Q*SIM.Aq; res.Q.push(Q); }
    if(p.bolus&&!bolusDone&&t>=(burn+200)){ a+=p.bolus; bolusDone=true; }
    a*=eDec; n+=(1-n)*eN; F*=eF;
    let s=0; if(p.sux){ s=p.sux*(opts.noOnset?1:(1-Math.exp(-(t-burn>0?t-burn:0)/p.suxOnset))); }
    const at=a+s; const act=at*at/(at*at+d.Keff*d.Keff);
    D+=dt*(SIM.kdOn*act*(1-D)-SIM.kdOff*D); if(D<0)D=0;
    V+=dt*(SIM.G*act*d.R*(1-D)-V)/SIM.tauM;
    const hinf=1/(1+Math.exp((V-SIM.Vh)/SIM.kh)); h+=(hinf-h)*(hinf<h?eHi:eHr);
    if(V>=thr&&prevV<thr&&h>=0.5&&t>refUntil){ if(t>=burn||opts.countBurn){ res.ap.push(t-burn); } refUntil=t+SIM.ref; h=0.12; }
    prevV=V; if(t>=burn){ if(V>res.Vmax) res.Vmax=V; if(a+s>res.aPeak) res.aPeak=a+s; }
    if(keep){ res.trace[i]=V; res.a[i]=a+s; }
  }
  return res;
}
/* Fensterfrequenz (Hz) */
function windows(times,T,w){ const n=Math.ceil(T/w); const out=new Array(n).fill(0); times.forEach(t=>{ const k=Math.min(n-1,Math.floor(t/w)); out[k]++; }); return out.map(c=>c*1000/w); }

/* =============== Analyse: Einzelreiz und Messung =============== */
const VR=-80, THR_MV=-55;
const vdisp=v=>v<=55?v:55+8*Math.tanh((v-55)/40);
const SC_CACHE={};
let NORMREF=null;
function normRef(){ if(!NORMREF){ const r=simulate(makeParams(null,0,null,0),{type:'single',T:45,t0:2},{dt:0.05,burn:200,keepTrace:true,delay:0.7,det:true,noOnset:true}); NORMREF={V:r.Vmax,a:r.aPeak,Q:r.Q[0]}; } return NORMREF; }
const sstat=(f,lo=0.8,hi=0.2)=>f>=lo?'ok':f>=hi?'schwach':'aus';
function singleImpulse(par){
  const key=JSON.stringify(par); if(SC_CACHE[key]) return SC_CACHE[key];
  const nr=normRef(), d=derived(par);
  const r=simulate(par,{type:'single',T:45,t0:2},{dt:0.05,burn:200,keepTrace:true,delay:0.7,det:true,noOnset:true});
  const dt=0.05, i0=Math.round(200/dt), n=Math.round(45/dt);
  const t=[],V=[],A=[],pre=[],ca=[];
  const apT=r.ap.length?r.ap[0]:null;
  const vAt=(i)=>r.trace[i0+i];
  for(let i=0;i<n;i+=2){ const ms=i*dt; t.push(ms); V.push(vAt(i)); A.push(r.a[i0+i]);
    const x=ms-2; const sh=x<0?0:(x<0.35?x/0.35:Math.exp(-(x-0.35)/0.5)-0.18*Math.exp(-(x-0.35)/2)); pre.push(-70+110*d.v*clamp(sh,-0.1,1.05));
    const cx=(ms-2.7)/0.55; ca.push(d.v*d.Cfac*Math.exp(-cx*cx)); }
  const vEnd=vAt(n-1);
  const plateau=vEnd>15;
  const fired=r.ap.length>0;
  const q=(r.Q[0]||0)/nr.Q;
  // Kennzahlen je Schritt (0 bis 8): Anteil der normalen Funktion
  const f=[d.v, d.v*d.Cfac, q, q, r.aPeak/nr.a, r.Vmax/nr.V, 0, par.E, 1];
  const fid20=runSet(par,{type:'const',f:20,T:3000},false).fid;
  f[6]=fid20;
  const raw=[sstat(f[0]),sstat(f[1]),sstat(f[2]),sstat(f[3]),sstat(f[4]),plateau?'dauer':sstat(f[5]),0,0,0];
  raw[6]=plateau?'dauer':(fid20>=0.85?'ok':fid20>=0.15?'schwach':'aus');
  raw[7]=f[7]>=0.8?'ok':f[7]>=0.2?'schwach':'aus';
  raw[8]=(par.E<0.5)?'schwach':'ok';
  const st=raw.slice();
  // Folgen: der erste ausgefallene Schritt der Kette (1 bis 6) macht alle späteren zur Folge
  let firstAus=-1; for(let i=0;i<=5;i++){ if(raw[i]==='aus'){ firstAus=i; break; } }
  if(firstAus>=0){ for(let j=firstAus+1;j<=6;j++) st[j]='folge'; }
  if(firstAus>=0&&firstAus<=3){ st[7]='folge'; st[8]='folge'; }
  else if(st[7]==='aus'||raw[7]==='schwach'){ st[8]=raw[8]; }
  const res={t,V,A,pre,ca,apT,f,st,plateau,fired,Vmax:r.Vmax,d,
    reach:(()=>{ for(let i=0;i<6;i++) if(raw[i]==='aus') return i+1; return 6; })()};
  SC_CACHE[key]=res; return res;
}
const STLABEL={ok:'normal',schwach:'abgeschwächt',aus:'fällt aus',dauer:'dauerhaft aktiv',folge:'bleibt aus (Folge)'};
function stLabel(i,s,poisonId){ if(s==='schwach'&&i===6) return 'unzuverlässig (nicht jeder Reiz löst ein AP aus)'; if(s==='schwach'&&i===7) return 'gehemmt'; if(s==='aus'&&i===7) return 'blockiert'; if(s==='schwach'&&i===8) return 'weniger Cholin'; if(s==='dauer'&&(i===5||i===6)) return 'Dauerdepolarisation'; return STLABEL[s]; }

/* =============== Messung (Frequenz) =============== */
const MEAS_CACHE={};
function protoOf(S){ return S.proto==='ramp'?{type:'ramp',f0:5,f1:100,T:3000}:{type:'const',f:S.freq,T:3000}; }
function runSet(par,proto,keep){
  const key=JSON.stringify([par,proto,!!keep]); if(MEAS_CACHE[key]) return MEAS_CACHE[key];
  const r=simulate(par,proto,{dt:0.25,seed:7,keepTrace:!!keep,delay:0}); const out={stim:r.stim,ap:r.ap,fid:r.stim.length?r.ap.length/r.stim.length:0,hz:windows(r.ap,proto.T,250),pre:windows(r.stim,proto.T,250),trace:r.trace,a:r.a,dt:0.25,Vmax:r.Vmax};
  // Übertragungsgrenze: erstes Fenster, ab dem die Treue unter 50 % fällt
  let lim=null; if(proto.type==='ramp'){ for(let i=0;i<out.hz.length;i++){ if(out.pre[i]>0&&out.hz[i]/out.pre[i]<0.5){ lim=freqAt(proto,(i)*250); break; } } } out.limit=lim;
  if(Object.keys(MEAS_CACHE).length>60) for(const k of Object.keys(MEAS_CACHE).slice(0,20)) delete MEAS_CACHE[k];
  MEAS_CACHE[key]=out; return out;
}
function measure(S,keepTrace){
  const proto=protoOf(S); const pN=makeParams(null,0,null,0);
  const pG=S.poison?makeParams(S.poison,S.dose,null,0):null;
  const pA=(S.anti&&S.poison)?makeParams(S.poison,S.dose,S.anti,S.timing):(S.anti?makeParams(null,0,S.anti,S.timing):null);
  const out={proto,normal:runSet(pN,proto,false),poison:pG?runSet(pG,proto,false):null,anti:pA?runSet(pA,proto,false):null};
  out.active=pA?'anti':pG?'poison':'normal';
  const act=out.active==='anti'?pA:out.active==='poison'?pG:pN; out.activeTrace=runSet(act,proto,true);
  return out;
}

    s+=`<text x="${L-30}" y="${y0+PH/2}" font-size="10" font-weight="700" text-anchor="middle" transform="rotate(-90 ${L-30} ${y0+PH/2})">${p.unit}</text>`;

function freqCard(title,withRaster){

function fillCharts(){

  const r=rating(); const c=CAT[r[0]]; const m=measure(S);

  let eff=`Im Modell ändert sich die Übertragungstreue von <b>${a} %</b> auf <b>${b} %</b>${d>=5?' (besser)':d<=-5?' (schlechter)':' (kaum verändert)'}.`;

  const m={proto,normal:runSet(makeParams(null,0,null,0),proto,false),poison:runSet(makeParams(c.p,dose,null,0),proto,false),anti:null};
  S.case={idx,p:c.p,t:c.t,dose,m,stage:'diag',gp:null,ga:null,fbP:null,fbA:null,scored:false};
}

  h+=`<div class="card"><h2>Aufgaben</h2><p class="note">Die Punktzahlen sind ein Vorschlag. Notengebung und Bewertungsmaßstab richten sich nach den Beschlüssen eurer Fachkonferenz.</p>`;

  <p><b>Typische Fehlvorstellungen:</b> „Ein Gegengift hebt jedes Gift auf“; „mehr ACh hilft immer“; „Atropin hilft an der Muskelendplatte“; „der Muskel fällt aus, weil das Aktionspotenzial im Nerv fehlt“. Das Frequenzdiagramm macht sichtbar, ob und ab welcher Frequenz die Übertragung zusammenbricht.</p>
  <p><b>Einordnung:</b> Die Zuordnung zu Kompetenzbereichen (Fachwissen, Erkenntnisgewinnung, Bewertung) und zu den Themenschwerpunkten des Zentralabiturs musst du am aktuellen Kerncurriculum und an den Vorgaben auf nibis.de prüfen.</p>
  <p><b>Bewertung:</b> Die Punktevorschläge sind unverbindlich. Notengebung bleibt deine Verantwortung und folgt den Fachkonferenzbeschlüssen.</p></details></div>`;
  $('#pane-info').innerHTML=h;
}

/* =============== Steuerung =============== */
function setStep(n){ S.step=clamp(n,0,9); A.f=1; refresh(false); }
function setPlayBtn(on){ S.play=on; const b=$('[data-v="play"]'); if(b){ b.setAttribute('aria-pressed',on?'true':'false'); b.textContent=on?'⏸':'▶'; b.setAttribute('aria-label',on?'Anhalten':'Ablauf abspielen'); } }
function stopPlay(){ if(A.raf){ cancelAnimationFrame(A.raf); A.raf=0; } if(A.rm){ clearTimeout(A.rm); A.rm=0; } A.mode=null; setPlayBtn(false); }
function startPlay(){ stopPlay();
  if(S.step===0||(S.step>=9&&A.f>=1)){ S.step=1; A.f=0; stepChanged(); }
  else if(A.f>=1){ S.step++; A.f=0; stepChanged(); }
  runAnim('all'); }
function reduceMotion(){ return window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
function updVinfo(){
  const k=S.step; const sig=schemaState().sig;
  let tags=''; if(S.poison) tags+=`<span class="tg tox">Gift: ${esc(POI[S.poison].name)}, ${DOSENAME[S.dose]}</span>`; if(S.anti) tags+=`<span class="tg ant">Gegengift: ${esc(ANT[S.anti].name)}</span>`;
  let txt=''; if(k>0){ const st=sig.st[k-1]; if(S.poison||S.anti) txt=` <b>${esc(stLabel(k-1,st))}.</b> ${S.poison&&POI[S.poison].step===k?'Hier greift das Gift an. ':''}`; txt+=` <span class="cap">${esc(A.cap)}</span>`; }
  const h=tags+txt+(!tags&&k===0?'Normale Synapse ohne Gift. Tippe ▶ für den ganzen Ablauf oder eine Nummer für einen einzelnen Schritt.':'');
  if(h!==A.vinfo){ $('#vinfo').innerHTML=h; A.vinfo=h; }
}
function updateViewer(){
  const k=S.step;
  const lbl=$('#vlbl'); if(k===0) lbl.innerHTML=`Überblick<small>▶ spielt alle Schritte ab</small>`; else lbl.innerHTML=`Schritt ${k}: ${esc(STEPS[k-1].t)}<small>${esc(STEPS[k-1].where)}</small>`;
  frame();
}
function refresh(full){
  updateViewer(); if(full!==false) renderTab(); else { if(S.tab==='flow'||S.tab==='tox'){ $$('.stp').forEach(el=>{ const n=+el.querySelector('.n').dataset.n; el.classList.toggle('cur',n===S.step); }); } fillCharts(); }
}
function renderTab(){ ({flow:renderFlow,tox:renderTox,anti:renderAnti,meas:renderMeas,train:renderTrain,info:renderInfo}[S.tab])(); requestAnimationFrame(fillCharts); }
function setFold(c){ const v=$('#viewer'); v.classList.toggle('collapsed',c); const b=$('[data-v="fold"]'); b.setAttribute('aria-pressed',c); b.textContent=c?'▼':'▲'; }
function showTab(t){
  if(t==='meas'&&window.innerWidth<700){ S.autoFold=true; setFold(true); } else if(S.autoFold){ S.autoFold=false; setFold(false); }
  S.tab=t; $$('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  ['flow','tox','anti','meas','train','info'].forEach(k=>{ $('#pane-'+k).hidden=k!==t; });
  $('#viewer').hidden=(t==='train'||t==='info'); if(t==='train'||t==='info') stopPlay();
  updateViewer(); renderTab(); window.scrollTo({top:0});
}
function applyLoad(l){
  stopPlay(); S.poison=null; S.anti=null; S.step=0; A.f=1; S.timing=0; S.dose=1;
  if(l==='flow'){ showTab('flow'); return; }
  const p=l.split(':'); if(p[0]==='tox'){ S.poison=p[1]; showTab('tox'); }
  else if(p[0]==='anti'){ S.poison=p[1]; S.anti=p[2]; showTab('anti'); }
  else if(p[0]==='meas'){ S.poison=p[1]; S.freq=50; S.proto='const'; showTab('meas'); }
}
document.addEventListener('click',e=>{
  const v=e.target.closest('[data-v]'); if(v){ const k=v.dataset.v;
    if(k==='next'){ playStep(S.step>=9?1:S.step+1); } else if(k==='prev'){ playStep(S.step<=1?9:S.step-1); }
    else if(k==='play'){ if(S.play) stopPlay(); else startPlay(); }
    else if(k==='seg'){ const n=+v.dataset.n; if(A.mode==='all'){ stopPlay(); S.step=n; A.f=0; stepChanged(); runAnim('all'); } else playStep(n); }
    else if(k==='speed'){ A.sp=(A.sp+1)%SPEEDS.length; v.textContent='Tempo '+SPEEDNAME[A.sp]; }
    else if(k==='fold'){ const c=$('#viewer').classList.toggle('collapsed'); v.setAttribute('aria-pressed',c); v.textContent=c?'▼':'▲'; }
    return; }
  const tb=e.target.closest('.tab'); if(tb){ showTab(tb.dataset.tab); return; }
  const a=e.target.closest('[data-act]'); if(!a) return; const act=a.dataset.act;
  switch(act){
    case 'step': playStep(+a.dataset.n); if(a.dataset.n!=='0') window.scrollTo({top:0,behavior:reduceMotion()?'auto':'smooth'}); break;
    case 'playall': window.scrollTo({top:0}); stopPlay(); S.step=1; A.f=0; stepChanged(); runAnim('all'); break;
    case 'poison': S.poison=a.dataset.id||null; S.timing=0; stopPlay(); S.step=S.poison?POI[S.poison].step:0; A.f=S.step?0:1; updateViewer(); renderTab(); if(S.step) runAnim('one'); break;
    case 'dose': S.dose=+a.dataset.n; updateViewer(); renderTab(); break;
    case 'anti': S.anti=a.dataset.id||null; S.timing=0; if(S.anti&&S.poison){ const r=RATE[S.poison][S.anti]; } updateViewer(); renderTab(); break;
    case 'timing': S.timing=+a.dataset.n; updateViewer(); renderTab(); break;
    case 'pair': S.poison=a.dataset.p; S.anti=a.dataset.a; S.timing=0; updateViewer(); renderTab(); window.scrollTo({top:0}); break;
    case 'goto': showTab(a.dataset.tab); break;
    case 'proto': S.proto=a.dataset.v; renderTab(); break;
    case 'zoom': S.zoom=a.dataset.v==='1'; renderTab(); break;
    case 'copy': { const t=protocolText(); const done=()=>{ a.textContent='Kopiert'; setTimeout(()=>a.textContent='Messprotokoll kopieren',1500); }; if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done,()=>{}); else { const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(err){} ta.remove(); } break; }
    case 'newcase': newCase(); renderTrain(); requestAnimationFrame(fillCharts); break;
    case 'checkp': { const c=S.case; if(!c.gp) { c.fbP=null; break; } c.fbP={ok:c.gp===c.p}; S.score.n++; c.pts=c.fbP.ok?2:0; renderTrain(); requestAnimationFrame(fillCharts); break; }
    case 'checka': { const c=S.case; if(!c.ga) break; const cat=RATE[c.p][c.ga][0]; const add={gut:3,teil:2,stuetz:(c.p==='TTX'||c.p==='CTX'||c.p==='SUX')?3:1,nutz:0,schad:0}[cat]; c.fbA={cat}; c.pts+=add; S.score.pts+=c.pts; renderTrain(); requestAnimationFrame(fillCharts); break; }
    case 'showcase': { const c=S.case; S.poison=c.p; S.dose=c.dose; S.anti=c.ga; S.timing=0; S.step=POI[c.p].step; A.f=1; showTab('anti'); break; }
    case 'itask': applyLoad(a.dataset.load); break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target, f=t.dataset&&t.dataset.f; if(!f) return;
  if(f==='gp'&&S.case) S.case.gp=t.value; if(f==='ga'&&S.case) S.case.ga=t.value;
});
document.addEventListener('input',e=>{
  const t=e.target, f=t.dataset&&t.dataset.f; if(!f) return;
  if(f==='freq'){ S.freq=+t.value; const lb=$('label[for="fr"] b'); if(lb) lb.textContent=S.freq+' Hz'; const m=measure(S); fillCharts(); const k=$('#pane-meas .kpi'); if(k) k.outerHTML=kpiHTML(m).split('<p class="note">')[0]; }
  if(f==='zoomAt'){ S.zoomAt=+t.value; const lb=$('label[for="za"] b'); if(lb) lb.textContent=S.zoomAt+' ms'; fillCharts(); }
});
let rsz=null; window.addEventListener('resize',()=>{ clearTimeout(rsz); rsz=setTimeout(fillCharts,120); });

/* =============== Start =============== */
(function init(){
  $('#schemaHost').innerHTML=buildSchema();
  showTab('flow');
})();
})();
</script>
