<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lernangebote</title>
    <meta name="description" content="Simulationen, Erklärungen und Übungen für Biologie und Sport" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <script src="../gemeinsam/design.js"></script>
    <link rel="stylesheet" href="../gemeinsam/tokens.css" />
    <link rel="stylesheet" href="../gemeinsam/grundlage.css" />
    <link rel="stylesheet" href="lernen.css" />
  </head>
  <body>
    <header class="navleiste">
      <div class="navleiste-innen">
        <a class="zurueck" href="../" aria-label="Zurück zur Startseite Lehrraum"><span id="zurueck-symbol" aria-hidden="true">‹</span>Lehrraum</a>
        <span class="navleiste-titel" aria-hidden="true">Lernangebote</span>
        <button class="rund-knopf" id="design-knopf" type="button" aria-label="Hell oder dunkel umschalten"></button>
      </div>
    </header>

    <main class="lernen">
      <nav class="baum" id="baum" aria-label="Nach Fach, Jahrgang und Thema filtern"></nav>
      <section class="spalte" aria-labelledby="ueberschrift">
        <div class="kopfzeile">
          <div class="titelblock">
            <p class="pfad" id="pfad"></p>
            <h1 id="ueberschrift">Alle Lernangebote</h1>
          </div>
          <button class="knopf zweit klein" id="qr-auswahl" type="button" title="QR-Code zu dieser Auswahl für den Beamer">QR zu dieser Auswahl</button>
        </div>
        <div class="werkzeugleiste">
          <label class="suchfeld">
            <span class="unsichtbar">Lernangebote durchsuchen</span>
            <span id="such-symbol"></span>
            <input id="suche" type="search" placeholder="Suchen, z. B. Herz, Enzym …" autocomplete="off" />
          </label>
          <select id="sortierung" class="sortierung" aria-label="Sortieren">
            <option value="jahrgang">Nach Jahrgang</option>
            <option value="name">A–Z</option>
            <option value="datum">Neueste zuerst</option>
          </select>
        </div>
        <div class="lehrkraft karte-flaeche" id="lehrkraft" hidden></div>
        <p class="lehrkraft-meldung" id="lehrkraft-meldung" role="status" hidden></p>
        <div class="karten" id="karten"></div>
      </section>
    </main>

    <div class="speicherleiste glas" id="speicherleiste" hidden>
      <span id="aenderungen-zahl"></span>
      <span id="speicher-meldung" role="status"></span>
      <button type="button" class="knopf klein" id="speichern">Speichern</button>
      <button type="button" class="knopf zweit klein" id="verwerfen">Verwerfen</button>
    </div>

    <dialog id="qr-dialog" aria-labelledby="qr-titel">
      <h2 id="qr-titel"></h2>
      <div id="qr-bild"></div>
      <p id="qr-adresse"></p>
      <button type="button" id="qr-schliessen" class="knopf">Schließen</button>
    </dialog>

    <script src="../gemeinsam/symbole.js"></script>
    <script src="angebote.js"></script>
    <script src="../js/qrcode.min.js"></script>
    <script src="../gemeinsam/sitzung.js"></script>
    <script src="datenbank.js"></script>
    <script src="lernen.js"></script>
  </body>
</html>
