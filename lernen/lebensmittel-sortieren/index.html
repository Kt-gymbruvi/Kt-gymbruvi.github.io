<!DOCTYPE html>
<html data-theme="light" lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lebensmittel sortieren</title>
<style>
:root{
  --bg:#f6f4ef; --panel:#ffffff; --ink:#2b2a26; --muted:#6f6b62; --line:#e3ded3;
  --accent:#4f7a5a; --accent-ink:#ffffff; --accent-soft:#e6efe7; --warn:#b5652f; --danger:#a8423a;
  --radius:14px; --shadow:0 1px 2px rgba(40,35,25,.06),0 4px 14px rgba(40,35,25,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior-x:none}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- Kopfzeile ---------- */
header.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;margin-right:8px}
.brand .dot{width:26px;height:26px;border-radius:8px;background:var(--accent);display:inline-grid;place-items:center;color:#fff;font-size:15px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{padding:10px 14px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600;min-height:44px;display:flex;align-items:center}
nav.tabs a.active{background:var(--accent-soft);color:var(--accent)}
.spacer{flex:1}
.group-name{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.group-name input{border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:170px;background:#fff}

/* ---------- Buttons ---------- */
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;min-height:44px;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:#cfc8b8}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.small{min-height:36px;padding:6px 10px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid transparent;background:transparent;display:inline-grid;place-items:center;color:var(--muted);font-size:18px}
.iconbtn:hover{background:#f1eee7;color:var(--ink)}

/* ---------- Sortieransicht ---------- */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:#fbfaf6}
.toolbar .hint{color:var(--muted);font-size:14px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;padding:6px 12px;border-radius:10px;background:#fff3e6;color:var(--warn);border:1px solid #f0d6bb}
.sortwrap{display:grid;grid-template-columns:330px 1fr;height:calc(100vh - 130px);min-height:520px}
.pool{border-right:1px solid var(--line);background:#efece4;overflow:auto;padding:12px;display:flex;flex-direction:column}
.pool h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:2px 4px 10px;display:flex;justify-content:space-between}
.pool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;align-content:start;flex:1 0 auto;min-height:120px;border-radius:12px;padding:2px}
.board{overflow:auto;padding:14px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;align-items:start}
.cat{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);border-top:6px solid var(--c);display:flex;flex-direction:column;min-height:190px}
.cat-head{display:flex;align-items:center;gap:6px;padding:8px 8px 4px 8px}
.cdot{width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 0 0 1px var(--line);flex:none}
.cat-name{flex:1;min-width:0;border:1px solid transparent;border-radius:8px;padding:6px 8px;font-weight:700;font-size:17px;background:transparent}
.cat-name:hover{border-color:var(--line)}
.cat-name:focus{border-color:var(--c);outline:none;background:#fff}
.count{min-width:30px;height:26px;border-radius:13px;background:color-mix(in srgb,var(--c) 18%,#fff);color:#333;font-weight:700;font-size:14px;display:inline-grid;place-items:center;padding:0 8px}
.reason{margin:0 10px 6px;width:calc(100% - 20px);border:1px dashed var(--line);border-radius:10px;padding:8px;resize:vertical;min-height:44px;font-size:14px;background:#fcfbf8}
.reason.missing{border-color:#e0b48f;background:#fff8f1}
.cat-body{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;padding:8px 10px 12px;align-content:start;min-height:110px;border-radius:0 0 var(--radius) var(--radius)}
.cat-body:empty::before{content:"Lebensmittel hierher ziehen";color:#b0a998;font-size:14px;grid-column:1/-1;text-align:center;padding:30px 0;border:2px dashed var(--line);border-radius:10px}
.newcat{min-height:190px;border:2px dashed #cfc7b5;border-radius:var(--radius);display:grid;place-items:center;color:var(--muted);font-weight:700;background:transparent;font-size:17px}
.newcat:hover{background:#fff;border-color:var(--accent);color:var(--accent)}
.drop-hover{outline:3px solid var(--accent);outline-offset:2px;background:var(--accent-soft)!important}

/* Lebensmittelkarte */
.fcard{position:relative;background:#fff;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.08);border:2px solid transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;touch-action:manipulation;display:flex;flex-direction:column;overflow:hidden}
.fcard .pic{aspect-ratio:1/1;display:grid;place-items:center;background:#fbfaf7}
.fcard .pic img,.fcard .pic svg{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.fcard .nm{font-size:13px;font-weight:600;padding:4px 6px 6px;text-align:center;line-height:1.15;min-height:2.4em;display:flex;align-items:center;justify-content:center;word-break:break-word;hyphens:auto}
.fcard .info{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.92);font-weight:700;font-size:14px;color:var(--muted);display:grid;place-items:center;font-family:Georgia,serif;font-style:italic}
.fcard.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fcard.newbadge::after{content:"neu";position:absolute;top:4px;left:4px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:8px}
.fcard.dragging{opacity:.3}
.ghost{position:fixed;z-index:1000;pointer-events:none;width:96px;transform:translate(-50%,-60%) rotate(-3deg);box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:.95}
.locked .fcard{cursor:not-allowed}

/* ---------- Allgemeine Seiten ---------- */
.page{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
.page h1{font-size:24px;margin:4px 0 4px}
.page .sub{color:var(--muted);margin:0 0 18px}
.panel{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.panel h2{font-size:18px;margin:0 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-weight:600}
label.field input,label.field select,label.field textarea{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;color:var(--ink);font-weight:400;min-height:44px}
label.check{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:600}
label.check input{width:22px;height:22px;accent-color:var(--accent)}
textarea{width:100%}
.q{margin-bottom:16px}
.q label{font-weight:700;display:block;margin-bottom:6px}
.q textarea{border:1px solid var(--line);border-radius:10px;padding:10px;min-height:80px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#f3f1ea;border-radius:20px;padding:4px 10px 4px 4px;font-size:14px}
.chip .mini{width:28px;height:28px;border-radius:50%;overflow:hidden;background:#fff;display:grid;place-items:center}
.chip .mini img,.chip .mini svg{width:100%;height:100%;object-fit:contain}
.sumcat{border-left:6px solid var(--c);padding:8px 12px;margin-bottom:10px;background:#fcfbf8;border-radius:8px}
.sumcat h3{margin:0 0 6px;font-size:16px}
.sumcat .why{color:var(--muted);font-size:14px;margin:4px 0 8px;font-style:italic}
.warnbox{background:#fff6ec;border:1px solid #f0d6bb;color:#7a4a22;padding:10px 12px;border-radius:10px;font-size:14px}
.infobox{background:var(--accent-soft);border:1px solid #cfe0d1;color:#2f5138;padding:10px 12px;border-radius:10px;font-size:14px}

/* Vergleich */
.cmpgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{color:var(--muted);font-weight:600}
.tag{display:inline-block;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
.tag.diff{background:#fde9dc;color:#8b4a1e}
.tag.same{background:#e6efe7;color:#2f5138}
.tag.c{color:#fff}

/* Lehrkraft */
.subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.subtabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pitem{display:grid;grid-template-columns:70px 1fr;gap:10px;background:#fff;border-radius:12px;padding:8px;border:1px solid var(--line);align-items:center}
.pitem.out{opacity:.55}
.pitem .th{width:70px;height:70px;border-radius:8px;background:#fbfaf7;overflow:hidden;display:grid;place-items:center}
.pitem .th img,.pitem .th svg{width:100%;height:100%;object-fit:contain}
.pitem .nm{font-weight:700;margin-bottom:2px}
.pitem .meta{font-size:12px;color:var(--muted);margin-bottom:4px}
.pitem .acts{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.pitem label.mini{display:flex;align-items:center;gap:4px;font-size:13px;min-height:36px;padding:0 4px}
.pitem label.mini input{width:20px;height:20px;accent-color:var(--accent)}
.upload-zone{border:2px dashed #cfc7b5;border-radius:12px;padding:16px;text-align:center;color:var(--muted);background:#fcfbf8}
.upload-zone.drag{border-color:var(--accent);background:var(--accent-soft)}

/* Modal */
.modal-back{position:fixed;inset:0;background:rgba(30,28,22,.45);z-index:500;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:18px;max-width:720px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
.modal header h2{margin:0;font-size:19px;flex:1}
.modal .mbody{padding:16px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff;flex-wrap:wrap}
.detail{display:grid;grid-template-columns:220px 1fr;gap:18px}
.detail .big{width:220px;height:220px;background:#fbfaf7;border-radius:14px;display:grid;place-items:center;overflow:hidden}
.detail .big img,.detail .big svg{width:100%;height:100%;object-fit:contain}
.nutr td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.na{color:#a19a8b;font-style:italic}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.swatch.on{box-shadow:0 0 0 3px var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:900;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
.banner{background:#fff6ec;border-bottom:1px solid #f0d6bb;color:#7a4a22;padding:8px 16px;font-size:14px}

/* Responsiv: Tablet hochkant & schmal */
@media (max-width: 900px){
  .sortwrap{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto}
  .pool{border-right:0;border-bottom:1px solid var(--line);max-height:none}
  .pool-grid{display:flex;overflow-x:auto;gap:10px;padding-bottom:8px;min-height:150px}
  .pool-grid .fcard{width:100px;flex:none}
  .board{overflow:visible}
  .detail{grid-template-columns:1fr}
  .detail .big{width:100%;height:220px}
  .cmpgrid,.grid2{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr 1fr}
}
@media print{
  header.top,.toolbar,.noprint{display:none!important}
}
</style>

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function shade(hex,amt){let c=hex.replace("#","");if(c.length===3)c=c.split("").map(x=>x+x).join("");let n=parseInt(c,16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function lbl(text,x,y,w,size,color){
  const parts=String(text||"").split("-");
  const lines = parts.length>1 ? [parts[0]+"-",parts.slice(1).join("-")] : [text];
  const fs = size || Math.min(13, Math.max(7, (w*1.55)/Math.max(...lines.map(l=>l.length))));
  return lines.map((l,i)=>`<text x="${x}" y="${y+(i-(lines.length-1)/2)*fs*1.05}" text-anchor="middle" dominant-baseline="middle" font-family="system-ui,Arial,sans-serif" font-weight="800" font-size="${fs.toFixed(1)}" fill="${color||'#fff'}">${esc(l)}</text>`).join("");
}

const LS = {
  ok:true,
  get(k,def){try{const v=localStorage.getItem(k);return v==null?def:JSON.parse(v);}catch(e){this.ok=false;return def;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){this.ok=false;warnStorage("Speichern im Browser nicht möglich (Speicher voll oder gesperrt). Bitte Daten exportieren.");return false;}}
};
const ImageStore = {
  db:null, mem:new Map(), ok:false,
  async init(){
    try{
      this.db = await new Promise((res,rej)=>{const r=indexedDB.open("lms-bilder",1);r.onupgradeneeded=()=>r.result.createObjectStore("img");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
      this.ok=true;
      const all = await this._tx("readonly",st=>new Promise((res,rej)=>{const out=[];const cur=st.openCursor();cur.onsuccess=()=>{const c=cur.result;if(c){out.push([c.key,c.value]);c.continue();}else res(out);};cur.onerror=()=>rej(cur.error);}));
      all.forEach(([k,v])=>this.mem.set(k,v));
    }catch(e){this.ok=false;}
  },
  _tx(mode,fn){return new Promise((res,rej)=>{const tx=this.db.transaction("img",mode);const st=tx.objectStore("img");let out;Promise.resolve(fn(st)).then(v=>out=v,rej);tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});},
  get(id){return this.mem.get(id)||null;},
  async put(id,dataUrl){this.mem.set(id,dataUrl);if(this.ok){try{await this._tx("readwrite",st=>{st.put(dataUrl,id);});}catch(e){warnStorage("Bild konnte nicht dauerhaft gespeichert werden (Speicher voll?). Bitte Daten exportieren.");}}},
  async del(id){this.mem.delete(id);if(this.ok){try{await this._tx("readwrite",st=>{st.delete(id);});}catch(e){}}},
  async clear(){this.mem.clear();if(this.ok){try{await this._tx("readwrite",st=>{st.clear();});}catch(e){}}}
};

function toast(msg,ms=2600){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms);}
function modal({title,body,buttons=[],wide=false,onClose}){
  const root=document.getElementById("modalRoot");
  const back=document.createElement("div");back.className="modal-back";
  back.innerHTML=`<div class="modal" role="dialog" aria-modal="true" style="${wide?'max-width:980px':''}"><header><h2>${esc(title)}</h2><button class="iconbtn" data-x aria-label="Schließen">✕</button></header><div class="mbody"></div>${buttons.length?'<footer></footer>':''}</div>`;
  const mb=back.querySelector(".mbody"); if(typeof body==="string") mb.innerHTML=body; else mb.appendChild(body);
  const close=()=>{back.remove();onClose&&onClose();};
  back.querySelector("[data-x]").onclick=close;
  back.addEventListener("pointerdown",e=>{if(e.target===back)back._down=true;});
  back.addEventListener("click",e=>{if(e.target===back&&back._down)close();back._down=false;});
  const ft=back.querySelector("footer");
  buttons.forEach(b=>{const el=document.createElement("button");el.className="btn "+(b.cls||"");el.textContent=b.label;el.onclick=async()=>{const r=b.onClick?await b.onClick(back):true;if(r!==false)close();};ft.appendChild(el);});
  root.appendChild(back);
  const f=back.querySelector("input,textarea,select"); if(f) setTimeout(()=>f.focus(),30);
  return {el:back,close};
}
function confirmBox(text,okLabel="OK",danger=false){
  return new Promise(res=>{modal({title:"Bitte bestätigen",body:`<p>${esc(text)}</p>`,onClose:()=>res(false),buttons:[{label:"Abbrechen",onClick:()=>{res(false);}},{label:okLabel,cls:danger?"primary danger":"primary",onClick:()=>{res(true);}}]});});
}
let downloadsNS = null;
async function saveFile(filename, text, mime){
  if(downloadsNS){
    try{ await downloadsNS.save({filename, data:text}); toast("Datei gespeichert."); return; }
    catch(e){ if(e&&e.code==="declined") return; if(e&&e.code==="rate_limited"){toast("Bitte kurz warten und erneut versuchen.");return;} }
  }
  try{
    const url=URL.createObjectURL(new Blob([text],{type:mime||"application/octet-stream"}));
    const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  }catch(e){}
  // Rückfallebene, falls der Download blockiert ist: Inhalt kopieren
  if(text.length < 3_000_000){
    modal({title:"Datei speichern",body:`<p>Der Download wurde gestartet. Falls keine Datei erscheint (z. B. in einer geschützten Umgebung), kannst du den Inhalt kopieren und als <b>${esc(filename)}</b> speichern.</p>`,
      buttons:[{label:"Schließen"},{label:"Inhalt kopieren",cls:"primary",onClick:async()=>{try{await navigator.clipboard.writeText(text);toast("Kopiert.");}catch(e){toast("Kopieren nicht möglich.");}return false;}}]});
  }
}
function readFileAsText(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsText(file);});}
function fileSlug(s){return (s||"ergebnis").toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"ergebnis";}
function today(){const d=new Date();return d.toISOString().slice(0,10);}

/* Bild verkleinern (spart Speicher) -> dataURL (WebP, sonst JPEG) */
const OK_TYPES=["image/jpeg","image/png","image/webp"];
async function processImage(file){
  if(file.type && !OK_TYPES.includes(file.type)) throw new Error("Format nicht unterstützt: "+file.type);
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("Bild nicht lesbar"));i.src=url;});
    const max=640, sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement("canvas");cv.width=Math.round(img.naturalWidth*sc);cv.height=Math.round(img.naturalHeight*sc);
    const cx=cv.getContext("2d");cx.fillStyle="#ffffff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
    let out=cv.toDataURL("image/webp",0.82); if(!out.startsWith("data:image/webp")) out=cv.toDataURL("image/jpeg",0.85);
    return out;
  }finally{URL.revokeObjectURL(url);}
}
function nameFromFile(f){return f.name.replace(/\.[^.]+$/,"").replace(/[_\-]+/g," ").replace(/\s+/g," ").trim().replace(/^./,c=>c.toUpperCase()).slice(0,60)||"Neues Produkt";}

function addCat(withItem){

  return c;

  if(session.timerOver) return;

  session.cats.forEach(c=>c.items=c.items.filter(x=>x!==id));
  if(target!=="pool"){
    const c=session.cats.find(x=>x.id===target); if(!c) return;
    const i = beforeId ? c.items.indexOf(beforeId) : -1;
    if(i>=0) c.items.splice(i,0,id); else c.items.push(id);

/* ---------- Drag & Drop (Maus, Stift, Touch) ----------
   Maus/Stift: sofort ziehen (ab 6 px Bewegung).
   Touch: kurz gedrückt halten (180 ms), dann ziehen – so bleibt Wischen zum Scrollen möglich. */
let drag=null;
document.addEventListener("pointerdown",e=>{
  if(ui.view!=="sortieren") return;
  const card=e.target.closest(".fcard"); if(!card || e.target.closest(".info")) return;
  if(e.button!==undefined && e.button>0) return;
  if(drag) endDrag(true);
  drag={id:card.dataset.id,card,x:e.clientX,y:e.clientY,pid:e.pointerId,type:e.pointerType,active:false,armed:e.pointerType!=="touch",ghost:null,over:null,cancelled:false};
  if(e.pointerType==="touch"){ drag.timer=setTimeout(()=>{ if(drag&&!drag.cancelled){drag.armed=true; beginDrag(drag.x,drag.y);} },180); }
});
document.addEventListener("pointermove",e=>{
  if(!drag || e.pointerId!==drag.pid) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!drag.active){
    if(drag.type==="touch"){ if(!drag.armed && Math.hypot(dx,dy)>8){drag.cancelled=true;clearTimeout(drag.timer);drag=null;} return; }
    if(Math.hypot(dx,dy)>6) beginDrag(e.clientX,e.clientY); else return;
  }
  moveGhost(e.clientX,e.clientY);
});
function beginDrag(x,y){
  if(session.timerOver){drag=null;return;}
  drag.active=true;
  const g=drag.card.cloneNode(true); g.classList.add("ghost"); g.classList.remove("sel"); document.body.appendChild(g); drag.ghost=g;
  drag.card.classList.add("dragging");
  try{ if(navigator.vibrate) navigator.vibrate(15); }catch(e){}
  moveGhost(x,y);
}
function moveGhost(x,y){
  drag.ghost.style.left=x+"px"; drag.ghost.style.top=y+"px"; drag.lx=x; drag.ly=y;
  const el=document.elementFromPoint(x,y); const z=el&&el.closest("[data-drop]");
  if(drag.over&&drag.over!==z) drag.over.classList.remove("drop-hover");
  if(z) z.classList.add("drop-hover"); drag.over=z;
  // automatisch scrollen am Rand
  const edge=60;
  if(y<edge) window.scrollBy(0,-12); else if(y>innerHeight-edge) window.scrollBy(0,12);
  const board=document.querySelector(".board"); if(board){const r=board.getBoundingClientRect(); if(x>r.left&&x<r.right){ if(y<r.top+edge&&y>r.top) board.scrollBy(0,-12); else if(y>r.bottom-edge&&y<r.bottom) board.scrollBy(0,12);} }
}
document.addEventListener("touchmove",e=>{ if(drag && (drag.active||drag.armed)) e.preventDefault(); },{passive:false});
window.addEventListener("blur",()=>{ if(drag) endDrag(true); });
document.addEventListener("pointerleave",()=>{ if(drag&&drag.active) endDrag(true); });
document.addEventListener("contextmenu",e=>{ if(e.target.closest&&e.target.closest(".fcard")) e.preventDefault(); });
document.addEventListener("pointerup",e=>{
  if(!drag || e.pointerId!==drag.pid) return;
  clearTimeout(drag.timer);
  if(drag.active){
    const z=drag.over; const id=drag.id;
    let before=null;
    const el=document.elementFromPoint(drag.lx,drag.ly); const oc=el&&el.closest(".fcard");
    if(oc && oc.dataset.id!==id && z && z.contains(oc)) before=oc.dataset.id;
    endDrag();
    if(z) moveTo(id,z.dataset.drop,before);
  } else {
    const id=drag.id; drag=null; onTapCard(id);
  }
});
document.addEventListener("pointercancel",e=>{ if(drag && e.pointerId===drag.pid){ if(!drag.active) {clearTimeout(drag.timer);drag=null;} } });
function endDrag(abort){
  if(!drag) return;
  clearTimeout(drag.timer);
  if(drag.ghost) drag.ghost.remove();
  if(drag.over) drag.over.classList.remove("drop-hover");
  if(drag.card) drag.card.classList.remove("dragging");
  drag=null;
}
function onTapCard(id){
  if(session.timerOver) return;
  if(ui.sel && ui.sel!==id){
    const m=placedMap(); const zSel=m[ui.sel]||"pool", zTap=m[id]||"pool";
    if(zSel!==zTap){ moveTo(ui.sel,zTap,id); return; }
  }
  ui.sel = ui.sel===id?null:id;
  document.querySelectorAll(".fcard").forEach(c=>c.classList.toggle("sel",c.dataset.id===ui.sel));
}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if(drag) endDrag(); if(ui.sel){ui.sel=null;document.querySelectorAll(".fcard.sel").forEach(c=>c.classList.remove("sel"));} }
  if((e.key==="Enter"||e.key===" ") && document.activeElement && document.activeElement.classList.contains("fcard")){e.preventDefault();onTapCard(document.activeElement.dataset.id);}
});

function compareSources(){
  const list=[{key:"current",label:"Aktuelle Sortierung",snap:makeSnapshot("Aktuelle Sortierung")}];
  session.snapshots.forEach(s=>list.push({key:s.id,label:(s.group?s.group+" – ":"")+s.name,snap:s}));
  return list;
}
function renderCompare(v){
  const src=compareSources();
  if(!ui.cmpA||!src.find(s=>s.key===ui.cmpA)) ui.cmpA = src[1]?src[1].key:"current";
  if(!ui.cmpB||!src.find(s=>s.key===ui.cmpB)) ui.cmpB = src.length>2?src[2].key:"current";
  const A=src.find(s=>s.key===ui.cmpA).snap, B=src.find(s=>s.key===ui.cmpB).snap;
  const opts=sel=>src.map(s=>`<option value="${s.key}" ${s.key===sel?"selected":""}>${esc(s.label)}</option>`).join("");
  const colOf=(snap)=>{const m={};snap.cats.forEach(c=>c.items.forEach(it=>m[it.id]={cat:c.name,color:c.color,mates:new Set(c.items.map(x=>x.id).filter(x=>x!==it.id))}));return m;};
  const mA=colOf(A), mB=colOf(B);
  const allIds=[...new Set([...Object.keys(mA),...Object.keys(mB)])];
  const nameOf=id=>(P(id)?.name)||([...A.cats,...B.cats].flatMap(c=>c.items).find(i=>i.id===id)||{}).name||id;
  let same=0;
  const rows=allIds.map(id=>{
    const a=mA[id], b=mB[id]; let status="";
    if(a&&b){const inter=[...a.mates].filter(x=>b.mates.has(x)).length;const uni=new Set([...a.mates,...b.mates]).size;const j=uni?inter/uni:1;
      if(j>=0.999){status=`<span class="tag same">gleiche Partner</span>`;same++;} else if(j<0.5) status=`<span class="tag diff">anders zusammengestellt</span>`; else status=`<span class="tag" style="background:#f3f1ea">teilweise gleich</span>`;}
    else status=`<span class="tag" style="background:#f3f1ea">nur in einer Sortierung</span>`;
    const cell=x=>x?`<span class="tag c" style="background:${x.color}">${esc(x.cat)}</span>`:'<span class="na">–</span>';
    return `<tr><td>${esc(nameOf(id))}</td><td>${cell(a)}</td><td>${cell(b)}</td><td>${status}</td></tr>`;
  }).join("");
  const side=(snap)=>`${snap.cats.length?snap.cats.map(c=>`<div class="sumcat" style="--c:${c.color}"><h3>${esc(c.name)} <span class="count" style="--c:${c.color}">${c.items.length}</span></h3>${c.reason?.trim()?`<div class="why">„${esc(c.reason)}“</div>`:""}<div class="chips">${c.items.map(it=>chip(it.id,it.name)).join("")}</div></div>`).join(""):'<p class="na">Noch keine Gruppen.</p>'}`;
  v.innerHTML=`<div class="page">
    <h1>Sortierungen vergleichen</h1>
    <p class="sub">Haltet beim Sortieren eine Sortierung fest (📌) oder ladet die Ergebnisdatei einer anderen Gruppe. Es gibt kein Richtig oder Falsch – es geht um die Kriterien.</p>
    <div class="panel row noprint">
      <label class="field" style="flex:1;min-width:220px">Sortierung A<select id="selA">${opts(ui.cmpA)}</select></label>
      <label class="field" style="flex:1;min-width:220px">Sortierung B<select id="selB">${opts(ui.cmpB)}</select></label>
      <div class="row" style="align-self:flex-end">
        <button class="btn" id="impRes">Ergebnis einer anderen Gruppe laden</button>
        <input type="file" id="impResFile" accept=".json,application/json" class="hidden" multiple>
        ${session.snapshots.length?`<button class="btn danger" id="delSnaps">Festgehaltene löschen</button>`:""}
      </div>
    </div>
    ${src.length<2?`<div class="infobox" style="margin-bottom:16px">Es gibt noch keine festgehaltene Sortierung. Geht zu „Sortieren“ und tippt auf „📌 Sortierung festhalten“, sortiert dann nach einem anderen Kriterium neu – oder ladet das Ergebnis einer anderen Gruppe.</div>`:""}
    <div class="cmpgrid">
      <div class="panel"><h2>A: ${esc(A.group?A.group+" – ":"")}${esc(A.name)}</h2>${side(A)}</div>
      <div class="panel"><h2>B: ${esc(B.group?B.group+" – ":"")}${esc(B.name)}</h2>${side(B)}</div>
    </div>
    <div class="panel">
      <h2>Lebensmittel im Vergleich</h2>
      <p class="sub" style="margin-bottom:8px">${same} von ${allIds.length} Lebensmitteln stehen in beiden Sortierungen mit genau denselben Partnern zusammen.</p>
      <div style="overflow:auto"><table class="t"><thead><tr><th>Lebensmittel</th><th>Gruppe in A</th><th>Gruppe in B</th><th>Zusammenstellung</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="na">Noch nichts sortiert.</td></tr>'}</tbody></table></div>
    </div>
    <div class="panel"><h2>Zum Besprechen</h2><ul style="margin:0;padding-left:20px"><li>Welches Kriterium steckt jeweils hinter A und B?</li><li>Welche Lebensmittel wechseln die Gruppe – und warum?</li><li>Für welchen Zweck ist welche Sortierung besonders nützlich (Einkaufen, Ernährung, Lagerung …)?</li></ul></div>
  </div>`;
  v.querySelector("#selA").onchange=e=>{ui.cmpA=e.target.value;render();};
  v.querySelector("#selB").onchange=e=>{ui.cmpB=e.target.value;render();};
  const f=v.querySelector("#impResFile"); v.querySelector("#impRes").onclick=()=>f.click();
  f.onchange=async()=>{let n=0;for(const file of f.files){try{const j=JSON.parse(await readFileAsText(file));n+=importResult(j);}catch(e){toast("Datei konnte nicht gelesen werden: "+file.name);}}f.value="";if(n){saveSession();toast(`${n} Sortierung(en) geladen.`);render();}};
  const ds=v.querySelector("#delSnaps"); if(ds) ds.onclick=async()=>{if(await confirmBox("Alle festgehaltenen und geladenen Sortierungen löschen?","Löschen",true)){session.snapshots=[];saveSession();render();}};
}
function chip(id,name){const p=P(id);return `<span class="chip"><span class="mini">${p?picHTML(p):""}</span>${esc(p?p.name:name)}</span>`;}
function importResult(j){
  if(!j||j.typ!=="lebensmittel-sortieren-ergebnis") { toast("Das ist keine Ergebnisdatei dieser Anwendung."); return 0; }
  let n=0;
  const add=(s)=>{session.snapshots.push(Object.assign({},s,{id:uid("s"),group:s.group||j.gruppe||"Andere Gruppe"}));n++;};
  if(j.aktuell) add(Object.assign({name:"Endstand"},j.aktuell));
  (j.festgehalten||[]).forEach(add);
  return n;
}

  draw();

  tb.querySelector("#allIn").onclick=()=>{products.forEach(p=>p.inPool=true);saveProducts();teacherProducts(tb);};
  tb.querySelector("#noneIn").onclick=()=>{products.forEach(p=>p.inPool=false);saveProducts();teacherProducts(tb);};
  const mi=tb.querySelector("#multiIn"), ci=tb.querySelector("#camIn");
  tb.querySelector("#multi").onclick=()=>mi.click(); tb.querySelector("#cam").onclick=()=>ci.click();
  mi.onchange=async()=>{await bulkUpload([...mi.files]);mi.value="";};
  ci.onchange=async()=>{await bulkUpload([...ci.files]);ci.value="";};
  tb.querySelector("#newP").onclick=()=>editProduct(null,()=>teacherProducts(tb));
  const uz=tb.querySelector("#uz");
  uz.addEventListener("dragover",e=>{e.preventDefault();uz.classList.add("drag");});
  uz.addEventListener("dragleave",()=>uz.classList.remove("drag"));
  uz.addEventListener("drop",async e=>{e.preventDefault();uz.classList.remove("drag");await bulkUpload([...e.dataTransfer.files]);});
}
async function bulkUpload(files){
  files=files.filter(f=>f&&f.size);
  if(!files.length) return;
  const created=[], failed=[];
  toast(`${files.length} Bild(er) werden verarbeitet …`,1500);
  for(const f of files){
    try{
      const data=await processImage(f); const imgId=uid("img"); await ImageStore.put(imgId,data);
      const p=normProduct({id:uid("p"),name:nameFromFile(f),custom:true,imageId:imgId,art:{t:"box",c:"#8a8f5c",l:nameFromFile(f)}});
      products.push(p); created.push(p);
    }catch(e){failed.push(f.name+" ("+e.message+")");}
  }
  saveProducts();
  if(failed.length) toast("Nicht übernommen: "+failed.join(", "),5000);
  if(created.length) nameReviewDialog(created);
  render();
}
function nameReviewDialog(list){
  const body=`<p>Bitte die Namen prüfen. Weitere Angaben (Zutaten, Nährwerte) über „Bearbeiten“.</p>
   ${list.map(p=>`<div class="row" style="margin-bottom:8px;flex-wrap:nowrap"><div style="width:56px;height:56px;flex:none;border-radius:8px;overflow:hidden;background:#fbfaf7">${picHTML(p).replace("<img","<img style='width:100%;height:100%;object-fit:contain'")}</div>
   <input data-nm="${p.id}" value="${esc(p.name)}" maxlength="80" style="flex:1;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 10px">
   <select data-un="${p.id}" style="min-height:44px;border:1px solid var(--line);border-radius:10px"><option value="g">g</option><option value="ml">ml</option></select></div>`).join("")}`;
  modal({title:`${list.length} neue Produkte`,body,buttons:[{label:"Übernehmen",cls:"primary",onClick:(el)=>{
    el.querySelectorAll("[data-nm]").forEach(i=>{const p=P(i.dataset.nm);if(p)p.name=i.value.trim()||p.name;});
    el.querySelectorAll("[data-un]").forEach(s=>{const p=P(s.dataset.un);if(p)p.unit=s.value;});
    saveProducts();render();
  }}]});
}
async function removeProduct(id){
  const p=P(id); if(p.imageId && !products.some(x=>x!==p&&x.imageId===p.imageId)) await ImageStore.del(p.imageId);
  products=products.filter(x=>x.id!==id);
  session.cats.forEach(c=>c.items=c.items.filter(x=>x!==id));
  saveProducts();saveSession();
}
function editProduct(id,after){
  const isNew=!id;
  const p = isNew ? normProduct({id:uid("p"),name:"",custom:true,art:{t:"box",c:"#5f8a8b",l:""}}) : structuredClone(P(id));
  let newImg=undefined; // undefined = unverändert, null = entfernen, string = neues Bild
  const body=document.createElement("div");
  const artOpts=ART_TYPES.map(([k,l])=>`<option value="${k}" ${p.art.t===k?"selected":""}>${l}</option>`).join("");
  body.innerHTML=`
   <div class="detail" style="grid-template-columns:200px 1fr">
     <div>
       <div class="big" id="ePic" style="width:200px;height:200px"></div>
       <div class="row" style="margin-top:8px">
         <button class="btn small" id="eUp">Bild hochladen</button>
         <button class="btn small" id="eCam">📷 Foto</button>
         <button class="btn small danger" id="eRm">Bild entfernen</button>
       </div>
       <input type="file" id="eUpIn" accept="image/jpeg,image/png,image/webp" class="hidden">
       <input type="file" id="eCamIn" accept="image/jpeg,image/png,image/webp" capture="environment" class="hidden">
       <div id="artBox" style="margin-top:10px">
         <label class="field">Illustration (ohne Foto)<select id="eArt">${artOpts}</select></label>
         <label class="field" style="margin-top:6px">Farbe<input type="color" id="eCol" value="${p.art.c||"#5f8a8b"}"></label>
         <label class="field" style="margin-top:6px">Aufschrift<input id="eLbl" value="${esc(p.art.l||"")}" maxlength="20"></label>
       </div>
     </div>
     <div>
       <label class="field">Produktname<input id="eName" value="${esc(p.name)}" maxlength="80" required></label>
       <label class="field" style="margin-top:10px">Zutatenliste (von der Verpackung übertragen)<textarea id="eIng" rows="3" placeholder="leer = keine Angabe">${esc(p.ingredients)}</textarea></label>
       <div class="row" style="margin-top:10px">
         <label class="field">Bezugsgröße<select id="eUnit"><option value="g" ${p.unit==="g"?"selected":""}>pro 100 g</option><option value="ml" ${p.unit==="ml"?"selected":""}>pro 100 ml</option></select></label>
         <label class="field" style="flex:1">Verarbeitungsgrad (NOVA)<select id="eNova"><option value="">nicht eingeordnet</option>${[1,2,3,4].map(n=>`<option value="${n}" ${p.nova===n?"selected":""}>${NOVA_TEXT[n]}</option>`).join("")}</select></label>
       </div>
       <p style="margin:12px 0 4px;font-weight:700">Nährwerte – nur verifizierte Werte von der Verpackung, leer lassen wenn unbekannt</p>
       <div class="grid3">${NUTR_FIELDS.map(f=>`<label class="field">${f[1]} (${f[2]})<input data-n="${f[0]}" inputmode="decimal" value="${p.nutrition[f[0]]??""}"></label>`).join("")}</div>
       <label class="field" style="margin-top:10px">Quelle der Angaben<input id="eSrc" value="${esc(p.source)}" placeholder="z. B. Verpackung, Foto vom 16.11.2026"></label>
     </div>
   </div>`;
  const pic=body.querySelector("#ePic");
  const curImg=()=> newImg===undefined ? (p.imageId&&ImageStore.get(p.imageId)) : newImg;
  const drawPic=()=>{
    const im=curImg();
    p.art={t:body.querySelector("#eArt").value,c:body.querySelector("#eCol").value,l:body.querySelector("#eLbl").value,
      ...(P(p.id)&&P(p.id).art.t===body.querySelector("#eArt").value?Object.fromEntries(Object.entries(P(p.id).art).filter(([k])=>!["t","c","l"].includes(k))):{})};
    pic.innerHTML= im?`<img src="${im}" alt="">`:artSVG(p.art);
    body.querySelector("#eRm").disabled=!im;
  };
  ["#eArt","#eCol","#eLbl"].forEach(s=>body.querySelector(s).addEventListener("input",drawPic));
  const pick=async(input)=>{const f=input.files[0];input.value="";if(!f)return;try{newImg=await processImage(f);drawPic();}catch(e){toast(e.message);}};
  body.querySelector("#eUp").onclick=()=>body.querySelector("#eUpIn").click();
  body.querySelector("#eCam").onclick=()=>body.querySelector("#eCamIn").click();
  body.querySelector("#eUpIn").onchange=e=>pick(e.target);
  body.querySelector("#eCamIn").onchange=e=>pick(e.target);
  body.querySelector("#eRm").onclick=()=>{newImg=null;drawPic();};
  drawPic();
  modal({title:isNew?"Neues Produkt":"Produkt bearbeiten",body,wide:true,buttons:[{label:"Abbrechen"},{label:"Speichern",cls:"primary",onClick:async()=>{
    const name=body.querySelector("#eName").value.trim(); if(!name){toast("Bitte einen Namen eingeben.");return false;}
    const nut={}; let bad=false;
    body.querySelectorAll("[data-n]").forEach(i=>{const raw=i.value.trim().replace(",",".");if(raw===""){nut[i.dataset.n]=null;return;}const n=Number(raw);if(!isFinite(n)||n<0){bad=true;i.style.borderColor="var(--danger)";}else nut[i.dataset.n]=n;});
    if(bad){toast("Bitte nur Zahlen bei den Nährwerten.");return false;}
    p.name=name;p.ingredients=body.querySelector("#eIng").value.trim();p.unit=body.querySelector("#eUnit").value;
    const nv=body.querySelector("#eNova").value;p.nova=nv?Number(nv):null;p.nutrition=nut;p.source=body.querySelector("#eSrc").value.trim();
    if(newImg!==undefined){
      const oldId=p.imageId;
      if(newImg){const nid=uid("img");await ImageStore.put(nid,newImg);p.imageId=nid;} else p.imageId=null;
      if(oldId && !products.some(x=>x.id!==p.id&&x.imageId===oldId)) await ImageStore.del(oldId);
    }
    const i=products.findIndex(x=>x.id===p.id); if(i>=0) products[i]=normProduct(p); else products.push(normProduct(p));
    saveProducts(); after&&after(); renderHeader();
  }}]});
}
function teacherLesson(tb){
  const m=settings.modes, d=settings.details;
  tb.innerHTML=`
  <div class="panel"><h2>Titel</h2><input id="lt" value="${esc(settings.title)}" maxlength="60" style="width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:10px"></div>
  <div class="panel"><h2>Lernmodi</h2>
    <p class="sub">Freies Sortieren ist immer aktiv. Die gewählten Zusatzmodi erscheinen bei den Schülerinnen und Schülern als Schaltflächen.</p>
    <label class="check"><input type="checkbox" data-m="timer" ${m.timer?"checked":""}> B · Sortieren unter Zeitdruck – Dauer <input id="tm" type="number" min="1" max="60" value="${settings.timerMin}" style="width:80px;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:6px"> Minuten</label>
    <label class="check"><input type="checkbox" data-m="late" ${m.late?"checked":""}> C · Neue Lebensmittel nachreichen (Produkte mit „später“ erscheinen erst auf Knopfdruck)</label>
    <label class="check"><input type="checkbox" data-m="reasons" ${m.reasons?"checked":""}> D · Begründungsmodus (jede Gruppe braucht eine Begründung)</label>
    <label class="check"><input type="checkbox" data-m="compare" ${m.compare?"checked":""}> E · Vergleichsmodus (Sortierungen festhalten und vergleichen)</label>
  </div>
  <div class="panel"><h2>Detailansicht für Schülerinnen und Schüler</h2>
    <label class="check"><input type="checkbox" data-d="ingredients" ${d.ingredients?"checked":""}> Zutatenliste</label>
    <label class="check"><input type="checkbox" data-d="nutrition" ${d.nutrition?"checked":""}> Nährwerttabelle</label>
    <label class="check"><input type="checkbox" data-d="nova" ${d.nova?"checked":""}> Verarbeitungsgrad (NOVA)</label>
    <p class="sub" style="margin:6px 0 0">Tipp: Für den ersten Durchgang ausschalten, damit die Gruppen eigene Kriterien finden – später einschalten.</p>
  </div>
  <div class="panel"><h2>Arbeitsfläche</h2>
    <p class="sub">Leert Gruppen, festgehaltene Sortierungen und Reflexion auf diesem Gerät – z. B. für die nächste Gruppe. Produkte und Bilder bleiben.</p>
    <button class="btn danger" id="resetS">Arbeitsfläche zurücksetzen</button>
  </div>
  <div class="panel"><h2>PIN für den Lehrkraftbereich</h2>
    <p class="sub">Einfacher Schutz gegen versehentliche Änderungen (kein Sicherheitsschutz). Leer = kein PIN.</p>
    <div class="row"><input id="pinSet" type="password" inputmode="numeric" value="${esc(settings.pin)}" maxlength="12" style="min-height:44px;border:1px solid var(--line);border-radius:10px;padding:10px"><button class="btn" id="pinSave">PIN speichern</button></div>
  </div>`;
  tb.querySelector("#lt").oninput=e=>{settings.title=e.target.value||"Lebensmittel sortieren";saveSettings();renderHeader();};
  tb.querySelectorAll("[data-m]").forEach(c=>c.onchange=()=>{settings.modes[c.dataset.m]=c.checked;saveSettings();renderHeader();});
  tb.querySelector("#tm").onchange=e=>{settings.timerMin=Math.max(1,Math.min(60,Number(e.target.value)||5));e.target.value=settings.timerMin;saveSettings();};
  tb.querySelectorAll("[data-d]").forEach(c=>c.onchange=()=>{settings.details[c.dataset.d]=c.checked;saveSettings();});
  tb.querySelector("#resetS").onclick=async()=>{if(await confirmBox("Arbeitsfläche auf diesem Gerät zurücksetzen? Nicht exportierte Ergebnisse gehen verloren.","Zurücksetzen",true)){session=newSession();saveSession();toast("Arbeitsfläche ist leer.");}};
  tb.querySelector("#pinSave").onclick=()=>{settings.pin=tb.querySelector("#pinSet").value.trim();saveSettings();ui.teacherUnlocked=true;toast(settings.pin?"PIN gespeichert.":"PIN entfernt.");};
}
function teacherData(tb){
  tb.innerHTML=`
  <div class="panel"><h2>Stundenpaket exportieren</h2>
    <p class="sub">Enthält alle Produkte, eigene Fotos und die Einstellungen der Stunde. Auf den Schüler-Tablets über „Stundenpaket laden“ einspielen – so haben alle Gruppen denselben Lebensmittelpool.</p>
    <div class="row"><button class="btn primary" id="expPkg">Stundenpaket speichern (.json)</button>
    <button class="btn" id="expPkgNoImg">Nur Produktdaten, ohne Fotos</button></div>
  </div>
  <div class="panel"><h2>Stundenpaket laden</h2>
    <p class="sub">„Ersetzen“ übernimmt Produkte und Einstellungen vollständig. „Ergänzen“ fügt nur Produkte hinzu, die noch fehlen.</p>
    <div class="row"><button class="btn primary" id="impRep">Laden &amp; ersetzen</button><button class="btn" id="impAdd">Laden &amp; ergänzen</button></div>
    <input type="file" id="impIn" accept=".json,application/json" class="hidden">
  </div>
  <div class="panel"><h2>Speicher auf diesem Gerät</h2><p id="stInfo" class="sub">wird ermittelt …</p>
    <div class="infobox">Alle Daten liegen nur in diesem Browser auf diesem Gerät. Beim Löschen der Browserdaten sind sie weg – exportiert das Stundenpaket als Sicherung.</div>
  </div>
  <div class="panel"><h2>Auf Ausgangszustand zurücksetzen</h2>
    <p class="sub">Löscht eigene Produkte, Fotos, Einstellungen und die Arbeitsfläche auf diesem Gerät und stellt den Standardbestand (${DEFAULT_PRODUCTS.length} Lebensmittel) wieder her.</p>
    <button class="btn danger" id="factory">Alles zurücksetzen</button>
  </div>`;
  let mode="replace"; const fi=tb.querySelector("#impIn");
  tb.querySelector("#expPkg").onclick=()=>exportPackage(true);
  tb.querySelector("#expPkgNoImg").onclick=()=>exportPackage(false);
  tb.querySelector("#impRep").onclick=()=>{mode="replace";fi.click();};
  tb.querySelector("#impAdd").onclick=()=>{mode="merge";fi.click();};
  fi.onchange=async()=>{const f=fi.files[0];fi.value="";if(!f)return;try{const j=JSON.parse(await readFileAsText(f));await importPackage(j,mode);}catch(e){toast("Datei konnte nicht gelesen werden.");}};
  tb.querySelector("#factory").onclick=async()=>{if(await confirmBox("Wirklich alles zurücksetzen? Eigene Produkte und Fotos werden gelöscht.","Alles zurücksetzen",true)){
    await ImageStore.clear();products=DEFAULT_PRODUCTS.map(normProduct);settings=structuredClone(DEFAULT_SETTINGS);session=newSession();saveProducts();saveSettings();saveSession();ui.teacherUnlocked=false;toast("Zurückgesetzt.");render();}};
  (async()=>{
    const imgs=products.filter(p=>p.imageId).length; let s=`${products.length} Produkte, ${imgs} mit Foto. Bildspeicher: ${ImageStore.ok?"verfügbar":"<b>nicht verfügbar</b> – Fotos gehen beim Schließen verloren"}.`;
    try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();s+=` Belegt: ca. ${(e.usage/1048576).toFixed(1)} MB.`;}}catch(e){}
    const el=tb.querySelector("#stInfo"); if(el) el.innerHTML=s;
  })();
}
function exportPackage(withImages){
  const images={}; if(withImages) products.forEach(p=>{if(p.imageId){const d=ImageStore.get(p.imageId);if(d)images[p.imageId]=d;}});
  const pkg={typ:"lebensmittel-sortieren-paket",version:1,exportiert:new Date().toISOString(),
    einstellungen:Object.assign({},settings,{pin:""}),produkte:products.map(p=>withImages?p:Object.assign({},p,{imageId:null})),bilder:images};
  saveFile(`stundenpaket-${fileSlug(settings.title)}-${today()}.json`,JSON.stringify(pkg),"application/json");
}
async function importPackage(j,mode){
  if(!j||j.typ!=="lebensmittel-sortieren-paket"||!Array.isArray(j.produkte)){toast("Das ist kein Stundenpaket dieser Anwendung.");return;}
  const imgs=j.bilder||{};
  for(const [k,v] of Object.entries(imgs)){ if(typeof v==="string"&&v.startsWith("data:image/")) await ImageStore.put(k,v); }
  const incoming=j.produkte.map(normProduct).map(p=>(p.imageId&&!ImageStore.get(p.imageId))?Object.assign(p,{imageId:null}):p);
  if(mode==="replace"){
    products=incoming;
    if(j.einstellungen){const pin=settings.pin;settings=Object.assign(structuredClone(DEFAULT_SETTINGS),j.einstellungen);settings.modes=Object.assign({},DEFAULT_SETTINGS.modes,j.einstellungen.modes||{});settings.details=Object.assign({},DEFAULT_SETTINGS.details,j.einstellungen.details||{});settings.pin=pin;}
    session=newSession();
  } else {
    let n=0; incoming.forEach(p=>{if(!P(p.id)){products.push(p);n++;}}); toast(`${n} Produkte ergänzt.`);
  }
  saveProducts();saveSettings();saveSession();
  if(mode==="replace") toast(`Stundenpaket geladen: ${products.length} Produkte.`);
  render();
}

(async function init(){
  await ImageStore.init();
  if(!ImageStore.ok) warnStorage("Hinweis: Dieser Browser erlaubt keinen dauerhaften Bildspeicher. Eigene Fotos bitte über „Sichern & Laden“ exportieren.");
  try{localStorage.setItem("lms.test","1");localStorage.removeItem("lms.test");}catch(e){warnStorage("Hinweis: Speichern im Browser ist hier nicht möglich. Ergebnisse bitte vor dem Schließen exportieren.");}
  route();
  if(session.timerEnd && !session.timerOver && Date.now()>session.timerEnd){ session.timerEnd=null; saveSession(); render(); }
})();
</script>
