  <p>Wie schwanken Räuber und Beute? Simuliere das Lotka-Volterra-Modell, prüfe die drei Regeln, greife ein, erweitere das Modell und vergleiche es mit Daten. Alle Zahlen sind Modellwerte.</p>

<script>
(function(){
'use strict';
/* =============== Modellkern: Räuber-Beute (rein rechnerisch, ohne DOM) =============== */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const PDEF={model:'lv',a:0.8,b:0.04,c:0.1,d:0.5,K:400,th:0.1,R:0,x0:100,y0:10,T:60};
/* Funktionelle Antwort: Beute pro Räuber und Zeit; xe = erreichbare Beute oberhalb des Rückzugsraums R */
function respF(p,x){ const xe=Math.max(x-p.R,0); return p.model==='hol'?p.b*xe/(1+p.b*p.th*xe):p.b*xe; }
function growth(p,x){ return p.model==='lv'?p.a*x:p.a*x*(1-x/p.K); }
function deriv(p,x,y,hv){ const f=respF(p,x); return [growth(p,x)-f*y-hv*x, p.c*f*y-p.d*y-hv*y]; }
const hvAt=(harv,t)=>harv&&harv.on&&t>=harv.t0&&(harv.t1==null||t<harv.t1)?harv.h:0;
function integrate(p,o){
  o=o||{}; const dt=o.dt||0.025, T=p.T, n=Math.ceil(T/dt+1e-9), harv=o.harv, ev=(o.events||[]).slice().sort((a,b)=>a.t-b.t);
  const t=new Float64Array(n+1), X=new Float64Array(n+1), Y=new Float64Array(n+1);
  let x=p.x0,y=p.y0,ei=0,div=false;
  for(let i=0;i<=n;i++){
    const tt=i*dt;
    while(ei<ev.length&&ev[ei].t<=tt+1e-9){ x*=ev[ei].kx; y*=ev[ei].ky; ei++; }
    t[i]=tt; X[i]=x; Y[i]=y;
    if(i===n) break;
    const h0=hvAt(harv,tt), h1=hvAt(harv,tt+dt/2), h2=hvAt(harv,tt+dt);
    const k1=deriv(p,x,y,h0), k2=deriv(p,x+dt/2*k1[0],y+dt/2*k1[1],h1), k3=deriv(p,x+dt/2*k2[0],y+dt/2*k2[1],h1), k4=deriv(p,x+dt*k3[0],y+dt*k3[1],h2);
    x+=dt/6*(k1[0]+2*k2[0]+2*k3[0]+k4[0]); y+=dt/6*(k1[1]+2*k2[1]+2*k3[1]+k4[1]);
    if(x<0)x=0; if(y<0)y=0;
    if(!(x<1e7&&y<1e7)){ div=true; for(let j=i+1;j<=n;j++){ t[j]=j*dt; X[j]=Math.min(x,1e7); Y[j]=Math.min(y,1e7); } break; }
  }
  return {t,X,Y,n,dt,T,div};
}
/* Gleichgewicht (innere Ruhelage) bei konstanter zusätzlicher Verlustrate hv beider Arten */
function equilibrium(p,hv){
  hv=hv||0; const dd=p.d+hv; let xe;
  if(p.model==='hol'){ const den=p.b*(p.c-p.th*dd); if(den<=0) return null; xe=dd/den; } else xe=dd/(p.c*p.b);
  const xs=xe+p.R; if(p.model!=='lv'&&xs>=p.K) return null;
  const g=growth(p,xs)-hv*xs, ys=g*p.c/dd;
  return (ys>0&&xs>0)?{x:xs,y:ys}:null;
}
function classify(p,hv){
  hv=hv||0; const E=equilibrium(p,hv); if(!E) return {kind:'none'};
  const ex=1e-5*E.x, ey=1e-5*E.y; const dx=(a,b)=>deriv(p,a,b,hv);
  const J=[[(dx(E.x+ex,E.y)[0]-dx(E.x-ex,E.y)[0])/(2*ex),(dx(E.x,E.y+ey)[0]-dx(E.x,E.y-ey)[0])/(2*ey)],[(dx(E.x+ex,E.y)[1]-dx(E.x-ex,E.y)[1])/(2*ex),(dx(E.x,E.y+ey)[1]-dx(E.x,E.y-ey)[1])/(2*ey)]];
  const tr=J[0][0]+J[1][1], det=J[0][0]*J[1][1]-J[0][1]*J[1][0], disc=tr*tr-4*det;
  let kind; if(det<=0) kind='saddle'; else if(Math.abs(tr)<1e-5*Math.sqrt(det)) kind='center'; else if(tr<0) kind=disc<0?'spiral':'node'; else kind='unstable';
  return {kind,E,tr,det,omega:det>0?Math.sqrt(det):0,T0:det>0?2*Math.PI/Math.sqrt(det):null,damp:tr/2};
}
/* Phase aus den Vorzeichen der Änderungen: 1 Beute↑ Räuber↓, 2 beide↑, 3 Beute↓ Räuber↑, 4 beide↓ */
function phaseOf(p,x,y,hv){ const d=deriv(p,x,y,hv); return d[0]>=0?(d[1]>=0?2:1):(d[1]>=0?3:4); }
/* Spitzen, Perioden, Mittelwerte über volle Zyklen */
function cycleStats(sim,E,t0,t1){
  const {t,X,Y,dt}=sim; const i0=Math.max(1,Math.floor((t0||0)/dt)), i1=Math.min(t.length-2,Math.floor((t1==null?sim.T:t1)/dt));
  const thr=E?E.x:0, pk=[];
  for(let i=i0;i<=i1;i++){ if(X[i]>X[i-1]&&X[i]>=X[i+1]&&X[i]>thr) pk.push(i); }
  let a=i0,b=i1,period=null,cycles=0;

  s+='</svg>';
  return {svg:s,ctx:{L,R,TP,ph,pw,T,xs,ysl,ysr}};
}

/* Phasendiagramm: Beute waagerecht, Räuber senkrecht */
function renderPhaseChart(W,H,o){
  const p=o.p, sim=o.sim, L=46,R=12,TP=12,B=34, pw=W-L-R, ph=H-TP-B;
  let mx=maxOf(sim.X), my=maxOf(sim.Y);
  (o.nest||[]).forEach(n=>{ mx=maxOf(n.X,mx); my=maxOf(n.Y,my); });
  if(o.ghost){ mx=maxOf(o.ghost.X,mx); my=maxOf(o.ghost.Y,my); }
  if(o.stoch){ mx=maxOf(o.stoch.xs,mx); my=maxOf(o.stoch.ys,my); }
  if(o.data){ mx=maxOf(o.data.x,mx); my=maxOf(o.data.y,my); }
  const E=o.eqNow, E0=o.eq0; if(E){ mx=Math.max(mx,E.x*1.15); my=Math.max(my,E.y*1.15); } if(E0){ mx=Math.max(mx,E0.x*1.1); my=Math.max(my,E0.y*1.1); }
  const xm=niceCeil(mx*1.05), ym=niceCeil(my*1.05);
  const xs=x=>L+pw*Math.min(1.04,x/xm), ys=y=>TP+ph-ph*Math.min(1.04,Math.max(0,y/ym));
  const hv=o.hv||0;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Phasendiagramm: Räuberzahl gegen Beutezahl, die Bahn läuft gegen den Uhrzeigersinn">`;
  const yc=x=>{ if(x<=p.R+1e-9) return Infinity; const f=respF(p,x); return f>0?(growth(p,x)-hv*x)/f:Infinity; };
  const ycl=x=>{ const v=yc(x); return Math.min(ym,Math.max(0,isFinite(v)?v:ym)); };
  // Quadranten nach Nullklinen
  if(E&&o.show.nulls){
    const N=50, left=[], right=[]; for(let i=0;i<=N;i++){ left.push(E.x*i/N); right.push(E.x+(xm-E.x)*i/N); }
    const poly=(xsA,lo,hi)=>{ const top=xsA.map(x=>[xs(x),ys(lo?0:ycl(x))]); return top; };
    const reg=(xa,below,cls)=>{ const crv=xa.map(x=>[xs(x),ys(ycl(x))]); const base=below?[[xs(xa[xa.length-1]),ys(0)],[xs(xa[0]),ys(0)]]:[[xs(xa[xa.length-1]),ys(ym)],[xs(xa[0]),ys(ym)]]; return `<path d="${pathOf(crv.concat(base))}Z" style="fill:var(--q${cls})"/>`; };
    s+=reg(left,true,1)+reg(right,true,2)+reg(right,false,3)+reg(left,false,4);
    const mid=(a,b)=>(a+b)/2;
    [[1,E.x/2,ycl(E.x/2)/2],[2,mid(E.x,xm),ycl(mid(E.x,xm))/2],[3,mid(E.x,xm),mid(ycl(mid(E.x,xm)),ym)],[4,E.x/2,mid(ycl(E.x/2),ym)]].forEach(([k,x,y])=>{ s+=`<text x="${f1(xs(x))}" y="${f1(ys(y)+7)}" text-anchor="middle" font-size="22" font-weight="800" style="fill:var(--ink-soft)" opacity=".5">${ROM[k]}</text>`; });
  }
  // Raster, Achsen
  const sx=niceStep(xm,5), sy=niceStep(ym,4);
  for(let v=0;v<=xm+1e-9;v+=sx){ s+=`<line class="gl" x1="${f1(xs(v))}" x2="${f1(xs(v))}" y1="${TP}" y2="${TP+ph}"/><text x="${f1(xs(v))}" y="${TP+ph+15}" text-anchor="middle" font-size="10.5" class="tx2">${de(v,0)}</text>`; }
  for(let v=0;v<=ym+1e-9;v+=sy){ s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${f1(ys(v))}" y2="${f1(ys(v))}"/><text x="${L-5}" y="${f1(ys(v)+3.5)}" text-anchor="end" font-size="10.5" class="tx2">${de(v,v<10&&v>0?1:0)}</text>`; }
  s+=`<rect x="${L}" y="${TP}" width="${pw}" height="${ph}" fill="none" class="axl"/><text x="${f1(L+pw/2)}" y="${H-4}" text-anchor="middle" font-size="11" style="fill:var(--prey)" font-weight="700">Beute (Individuen)</text><text x="12" y="${f1(TP+ph/2)}" text-anchor="middle" font-size="11" style="fill:var(--pred)" font-weight="700" transform="rotate(-90 12 ${f1(TP+ph/2)})">Räuber (Individuen)</text>`;
  // Richtungsfeld
  if(o.show.field){ const nx=9,ny=6; for(let i=0;i<nx;i++) for(let j=0;j<ny;j++){ const x=xm*(i+0.5)/nx, y=ym*(j+0.5)/ny, d=deriv(p,x,y,hv); let ux=d[0]/xm*pw, uy=-d[1]/ym*ph; const l=Math.hypot(ux,uy)||1; ux/=l; uy/=l; const cx=xs(x), cy=ys(y), a=[cx-ux*6,cy-uy*6], b=[cx+ux*6,cy+uy*6]; s+=`<path d="M${f1(a[0])} ${f1(a[1])} L${f1(b[0])} ${f1(b[1])} M${f1(b[0]-ux*4+uy*3)} ${f1(b[1]-uy*4-ux*3)} L${f1(b[0])} ${f1(b[1])} L${f1(b[0]-ux*4-uy*3)} ${f1(b[1]-uy*4+ux*3)}" fill="none" stroke="var(--ink-soft)" stroke-width="1.2" opacity=".6"/>`; } }
  // Nullklinen
  if(E&&o.show.nulls){ const pts=[]; for(let i=0;i<=80;i++){ const x=xm*i/80; const v=yc(x); if(isFinite(v)&&v>=0&&v<=ym*1.02) pts.push([xs(x),ys(v)]); } if(pts.length>1) s+=`<path d="${pathOf(pts)}" fill="none" stroke="var(--prey)" stroke-width="1.4" stroke-dasharray="6 4"/>`; s+=`<line x1="${f1(xs(E.x))}" x2="${f1(xs(E.x))}" y1="${TP}" y2="${TP+ph}" stroke="var(--pred)" stroke-width="1.4" stroke-dasharray="6 4"/>`; }
  // Bahnen
  const orbit=(sm,w,op,dash)=>{ const st=Math.max(1,Math.floor(sm.n/500)); const a=[]; for(let i=0;i<=sm.n;i+=st) a.push([xs(sm.X[i]),ys(sm.Y[i])]); a.push([xs(sm.X[sm.n]),ys(sm.Y[sm.n])]); return `<path d="${pathOf(a)}" fill="none" stroke="var(--ink)" stroke-width="${w}" opacity="${op}" stroke-linejoin="round" ${dash?'stroke-dasharray="5 4"':''}/>`; };
  if(o.nest) o.nest.forEach(n=>{ s+=orbit(n,1.8,.7,false); });
  if(o.ghost) s+=orbit(o.ghost,1.8,.45,true);
  if(o.stoch){ const a=[]; for(let i=0;i<o.stoch.ts.length;i++) a.push([xs(o.stoch.xs[i]),ys(o.stoch.ys[i])]); s+=`<path d="${pathOf(a)}" fill="none" stroke="var(--pred)" stroke-width="1.3" opacity=".8"/>`; }
  s+=orbit(sim,2.6,1,false);
  // Pfeilspitzen
  [0.12,0.37,0.62,0.87].forEach(fr=>{ const i=Math.max(1,Math.min(sim.n-1,Math.round(sim.n*fr))), x1=xs(sim.X[i-1]),y1=ys(sim.Y[i-1]),x2=xs(sim.X[i+1]),y2=ys(sim.Y[i+1]); const l=Math.hypot(x2-x1,y2-y1); if(l<0.05) return; const ux=(x2-x1)/l, uy=(y2-y1)/l, cx=xs(sim.X[i]), cy=ys(sim.Y[i]); s+=`<path d="M${f1(cx+ux*6)} ${f1(cy+uy*6)} L${f1(cx-ux*4+uy*5)} ${f1(cy-uy*4-ux*5)} L${f1(cx-ux*4-uy*5)} ${f1(cy-uy*4+ux*5)} Z" style="fill:var(--ink)"/>`; });
  if(o.data){ const d=o.data, a=[]; for(let i=0;i<d.t.length;i++) a.push([xs(d.x[i]),ys(d.y[i])]); s+=`<path d="${pathOf(a)}" fill="none" stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="2 3"/>`; a.forEach(q=>{ s+=`<circle cx="${f1(q[0])}" cy="${f1(q[1])}" r="3" style="fill:var(--panel);stroke:var(--ink);stroke-width:1.5"/>`; }); }
  s+=`<rect x="${f1(xs(sim.X[0])-4)}" y="${f1(ys(sim.Y[0])-4)}" width="8" height="8" style="fill:var(--panel);stroke:var(--ink);stroke-width:2"/><text x="${f1(xs(sim.X[0])+7)}" y="${f1(ys(sim.Y[0])+14)}" font-size="10" class="tx2">Start</text>`;
  // Gleichgewichte
  const cross=(e,fill)=>`<path d="M${f1(xs(e.x)-6)} ${f1(ys(e.y))} H${f1(xs(e.x)+6)} M${f1(xs(e.x))} ${f1(ys(e.y)-6)} V${f1(ys(e.y)+6)}" stroke="var(--ink)" stroke-width="2.6" fill="none"/>`;
  if(E0&&(!E||Math.abs(E0.x-E.x)>1e-6||Math.abs(E0.y-E.y)>1e-6)) s+=cross(E0)+`<text x="${f1(xs(E0.x)+8)}" y="${f1(ys(E0.y)-6)}" font-size="10.5" font-weight="800">E</text>`;
  if(E) s+=cross(E)+`<text x="${f1(xs(E.x)+8)}" y="${f1(ys(E.y)-6)}" font-size="10.5" font-weight="800">${E0&&Math.abs(E0.x-E.x)>1e-6?"E′":'E'}</text>`;
  if(o.cursor!==false){ const i=Math.min(sim.n,Math.round((o.tcur||0)/sim.dt)); s+=`<circle id="cP" cx="${f1(xs(sim.X[i]))}" cy="${f1(ys(sim.Y[i]))}" r="6" style="fill:var(--pred);stroke:var(--panel);stroke-width:2.4"/>`; }
  return {svg:s+'</svg>',ctx:{L,TP,pw,ph,xm,ym,xs,ys}};
}

function sceneSync(arr,n,mk){ while(arr.length<n) arr.push(mk()); while(arr.length>n) arr.splice(Math.floor(SC.rnd()*arr.length),1); }
function drawScene(){

  const cs=getComputedStyle(cv), prey=cs.getPropertyValue('--prey').trim()||'#0D76A6', pred=cs.getPropertyValue('--pred').trim()||'#D2501C';
  ctx.fillStyle=prey; SC.prey.forEach(a=>{ ctx.beginPath(); ctx.arc(a.x*w,a.y*h,4.2,0,6.283); ctx.fill(); });

}

}
function csvText(){ const sim=S.sim, step=Math.max(1,Math.round(1/sim.dt)/ (S.p.T>60?0.5:1)); let s='Zeit;Beute;Räuber\n'; for(let i=0;i<=sim.n;i+=Math.round(step)) s+=`${de(sim.t[i],1)};${de(sim.X[i],1)};${de(sim.Y[i],1)}\n`; return s; }

function arrow(a,b){ const r=b/a; return r>1.03?'<span class="up">↑</span>':r<0.97?'<span class="dn">↓</span>':'<span class="eq">→</span>'; }
function loadRule(n){
  S.p=copyP(PDEF); S.harv={on:false,h:0.2,t0:30,t1:null}; S.events=[]; S.nest=null; S.ghost=null; S.dataMode=null; S.tcur=0; stopPlay();

  if(n===3){ S.p.T=120; S.harv={on:true,h:0.2,t0:60,t1:null}; S.show.means=true; S.show.phases=false; S.view='time'; }
  S.preset=''; recompute(); }
function renderRules(){
  const p=S.p, E=S.eq0, dirty=S.harv.on||S.events.length>0; let h='';
  const clean=dirty?integrate(p,{}):S.sim, st=dirty?cycleStats(clean,E,0,p.T):S.stats;
  h+=`<div class="card"><h2>Die drei Lotka-Volterra-Regeln</h2><p class="lead">Jede Regel hat ein Experiment. Lade es, sieh dir das Messfenster oben an und lies unten die gemessenen Werte. Die Tabellen rechnen mit den aktuellen Parametern aus dem Reiter Modell.</p>${p.model!=='lv'?'<div class="warn">Aktuell ist ein erweitertes Modell eingestellt. Die Regeln gelten für das klassische Modell: Beim Laden eines Experiments wird es zurückgesetzt.</div>':''}</div>`;
  h+=`<div class="card"><h2>Regel 1: Periodische Schwankung</h2><div class="rule"><b>Die Individuenzahlen von Räuber und Beute schwanken periodisch. Das Maximum der Räuber folgt dem der Beute mit Verzögerung.</b></div>
  <div class="btnrow"><button type="button" class="btn primary" data-act="rule" data-n="1">Experiment laden</button></div>
  <div class="kpis"><div><b>${st.period?de(st.period,1):'–'}</b><small>Periode, gemessen</small></div><div><b>${S.cls.T0?de(S.cls.T0,1):'–'}</b><small>Periode nach T ≈ 2π/√(a·d), gilt für kleine Schwankungen</small></div><div><b>${st.lag!=null?de(st.lag,1):'–'}</b><small>Verzögerung Räubermaximum</small></div><div><b>${st.lagFrac!=null?de(st.lagFrac,2):'–'}</b><small>Verzögerung als Bruchteil der Periode (bei kleinen Schwankungen genau ¼)</small></div></div>
  <p class="note">Beobachte: Zuerst wächst die Beute (Räuber selten), dann folgen die Räuber, dann bricht die Beute ein, und schließlich verhungern die Räuber. Schalte im Reiter Modell „Phasen I bis IV markieren“ ein, um die Abschnitte zu sehen. Ändere a und d: Die Periode hängt von beiden ab.</p></div>`;
  h+=`<div class="card"><h2>Regel 2: Konstanz der Mittelwerte</h2><div class="rule"><b>Über eine Periode gemittelt bleiben die Individuenzahlen gleich. Die Mittelwerte hängen nicht von den Startwerten ab.</b></div>
  <div class="btnrow"><button type="button" class="btn primary" data-act="rule" data-n="2">Experiment laden (drei Startwerte)</button></div>`;
  if(E){ const rows=[]; const starts=[[p.x0,p.y0],[E.x*0.9,E.y*0.85],[E.x*1.4,E.y*1.5]];
    starts.forEach((s0,i)=>{ const sm=i===0?clean:integrate(Object.assign({},p,{x0:s0[0],y0:s0[1]}),{}); const q=cycleStats(sm,E,0,p.T); rows.push(`<tr><td>Lauf ${i+1}</td><td class="n">${fn(s0[0])} | ${fn(s0[1])}</td><td class="n">${fn(q.mx)}</td><td class="n">${fn(q.my)}</td><td class="n">${q.period?de(q.period,1):'–'}</td></tr>`); });
    h+=`<div class="tscroll"><table class="tbl"><thead><tr><th>Lauf</th><th class="n">Start (Beute | Räuber)</th><th class="n">Mittel Beute</th><th class="n">Mittel Räuber</th><th class="n">Periode</th></tr></thead><tbody>${rows.join('')}<tr><td><b>Gleichgewicht</b></td><td class="n">–</td><td class="n"><b>${fn(E.x)}</b></td><td class="n"><b>${fn(E.y)}</b></td><td class="n">–</td></tr></tbody></table></div>`; }
  h+=`<p class="note">Beobachte im Phasendiagramm: Die Bahnen sind geschlossen und liegen ineinander um dasselbe Gleichgewicht E. Die Mittelwerte sind in allen Läufen gleich, nur die Periode ist verschieden. Begründung: Mittelt man dx/dt = 0 und dy/dt = 0 über eine Periode, erhält man y = a/b und x = d/(c·b).</p></div>`;
  h+=`<div class="card"><h2>Regel 3: Störung der Mittelwerte</h2><div class="rule"><b>Werden beide Arten gleichmäßig dezimiert, steigt der Mittelwert der Beute und sinkt der Mittelwert der Räuber.</b></div>
  <div class="btnrow"><button type="button" class="btn primary" data-act="rule" data-n="3">Experiment laden (Insektizid)</button></div>`;
  { const hv=S.harv.on?S.harv:{on:true,h:0.2,t0:60,t1:null}, p3=Object.assign({},p,{T:Math.max(p.T,hv.t0+40)}); const sm=integrate(p3,{harv:hv}), E2=equilibrium(p3,hv.h);
    const pre=cycleStats(sm,E,0,hv.t0), post=cycleStats(sm,E2||E,hv.t0,hv.t1==null?p3.T:hv.t1);
    h+=`<p class="note" style="margin-top:0">Gerechnet: beide Arten verlieren zusätzlich mit der Rate h = ${de(hv.h,2)} ab t = ${hv.t0}${hv.t1!=null?' bis t = '+hv.t1:''}.</p><div class="tscroll"><table class="tbl"><thead><tr><th></th><th class="n">vor dem Eingriff</th><th class="n">nach dem Eingriff</th><th class="n">Theorie danach</th><th>Änderung</th></tr></thead><tbody>
    <tr><td><span class="pb"><b>Beute</b></span></td><td class="n">${fn(pre.mx)}</td><td class="n">${fn(post.mx)}</td><td class="n">${E2?fn(E2.x):'–'}</td><td>${arrow(pre.mx,post.mx)}</td></tr>
    <tr><td><span class="pr"><b>Räuber</b></span></td><td class="n">${fn(pre.my)}</td><td class="n">${fn(post.my)}</td><td class="n">${E2?fn(E2.y):'–'}</td><td>${arrow(pre.my,post.my)}</td></tr></tbody></table></div>
    <p class="note">Mittelwerte jeweils über volle Zyklen. Theorie: x* = (d + h)/(c·b) und y* = (a − h)/b. Ein Breitband-Insektizid, das Schädling (Beute) und Nützling (Räuber) im gleichen Verhältnis trifft, kann den Schädling im Mittel also fördern.</p>`; }
  h+='</div>';
  $('#pane-rules').innerHTML=h;
}

 {afb:'III',t:'Eingriffe bewerten',p:7,op:'Bewerte',text:'Bewerte Eingriffe wie Schädlingsbekämpfung oder Bejagung von Räubern. Nutze die Prognoseaufgaben.',load:'train',sol:['Gleichmäßige Dezimierung kann die Beute fördern, Räuber verlieren (2 P).','Bejagung der Räuber erhöht den Beute-Mittelwert, im Modell ändert sie den Räuber-Mittelwert nicht (2 P).','Bewertung: Eingriffe haben Nebenwirkungen auf das ganze System, Folgen für Artenvielfalt und Nachhaltigkeit, Modelle sind nur Hinweise (3 P).']}
];
function renderInfo(){
  let h=`<div class="card"><h2>Gleichungen</h2><div class="eqn">dx/dt = a·x − b·x·y<br>dy/dt = c·b·x·y − d·y</div><p class="note">x Beute, y Räuber. a: Wachstumsrate der Beute, b: Fangrate, c: Umsetzung der gefressenen Beute in Räubernachwuchs, d: Sterberate der Räuber. Gleichgewicht: x* = d/(c·b), y* = a/b. Periode bei kleinen Schwankungen: T ≈ 2π/√(a·d). Die Zahlen sind Modellwerte und haben keine Einheit.</p></div>`;
  h+=`<div class="card"><h2>Annahmen und Grenzen</h2><ul class="plain"><li>Die Beute findet unbegrenzt Nahrung und wächst exponentiell, solange keine Räuber da sind (im klassischen Modell).</li><li>Räuber fressen nur diese Beute, werden nie satt und reagieren sofort auf Nahrung (ohne Zeitverzögerung durch Altersstruktur).</li><li>Begegnungen sind zufällig und gleichmäßig verteilt, die Umwelt bleibt konstant.</li><li>Die Populationen sind groß genug, dass Zufall keine Rolle spielt (im Reiter Zufall wird das aufgehoben).</li><li>Das Modell zeigt Prinzipien. Reale Zyklen entstehen oft durch mehrere Ursachen zugleich. Die Zahlen sind keine Vorhersagen über echte Populationen.</li></ul></div>`;
  h+=`<div class="card"><h2>Begriffe</h2><dl class="gl">${GLOS.map(([t,d])=>`<dt>${esc(t)}</dt><dd>${esc(d)}</dd>`).join('')}</dl></div>`;
  h+=`<div class="card"><h2>Aufgaben</h2><p class="note">Die Punktzahlen sind ein Vorschlag. Notengebung und Bewertungsmaßstab richten sich nach den Beschlüssen eurer Fachkonferenz.</p>`;
  ITASKS.forEach((t,i)=>{ h+=`<details class="task"><summary><span class="badge">AFB ${t.afb}</span>${i+1}. ${esc(t.t)} <span class="badge">${t.p} P</span></summary><p><b>${t.op}:</b> ${esc(t.text)}</p><div class="btnrow"><button type="button" class="btn sm" data-act="itask" data-load="${t.load}">Passende Einstellung laden</button></div><details><summary style="cursor:pointer;min-height:40px;display:flex;align-items:center;font-weight:700">Erwartungshorizont</summary><div class="sol"><ul class="plain">${t.sol.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></details></details>`; });
  h+='</div>';
  h+=`<div class="card"><details class="mode"><summary>Hinweise für die Lehrkraft</summary><p><b>Einsatz:</b> Einstieg mit dem Grundmodell (Zeitverlauf und Phasen), Erarbeitung der Regeln im Reiter Regeln, Vertiefung mit den Prognoseaufgaben (Vorhersage, dann Rechnung), Modellkritik mit Kapazitätsgrenze, Anreicherung und Zufall.</p><p><b>Typische Fehlvorstellungen:</b> „Die Räuber fressen die Beute auf“; „der Zyklus ist ein Zufall“; „Mittelwert und Maximum sind dasselbe“; „Beute und Räuber schwanken gleichzeitig“; „Ein Eingriff ändert die Mittelwerte immer in die erwartete Richtung“.</p><p><b>Einordnung:</b> Die Zuordnung zu Kompetenzbereichen (Fachwissen, Erkenntnisgewinnung, Kommunikation, Bewertung) und zu den Themenschwerpunkten des Zentralabiturs musst du am aktuellen Kerncurriculum und an den Vorgaben auf nibis.de prüfen. Die Benennung der Regeln kann je nach Schulbuch abweichen.</p><p><b>Bewertung:</b> Die Punktevorschläge sind unverbindlich. Notengebung bleibt deine Verantwortung und folgt den Fachkonferenzbeschlüssen.</p><p><b>Datenschutz:</b> Die App speichert nichts. Eigene Daten bleiben im Browser.</p></details></div>`;
  $('#pane-info').innerHTML=h;
}

/* =============== Steuerung =============== */
function renderTab(){ ({model:renderModel,rules:renderRules,chance:renderChance,data:renderData,train:renderTrain,info:renderInfo}[S.tab])(); requestAnimationFrame(()=>{ if(S.tab==='train') fillPoeCharts(); if(S.tab==='model') drawScene(); }); }
function showTab(t){
  S.tab=t; if(t!=='model') {} $$('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  ['model','rules','chance','data','train','info'].forEach(k=>{ $('#pane-'+k).hidden=k!==t; });
  const vis=!(t==='train'||t==='info'); $('#viewer').hidden=!vis; if(!vis) stopPlay();
  if(t==='data'&&S.p.model!=='lv'){ S.p.model='lv'; recompute(); }
  renderTab(); if(vis) drawCharts(); window.scrollTo({top:0});
}
const PKEYS=['a','b','c','d','x0','y0','T','K','th','R'];
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='scrub'){ stopPlay(); setT(t.value/1000*S.p.T); return; }
  if(t.dataset.p){ const k=t.dataset.p; S.p[k]=parseFloat(t.value); const o=$('#o_'+k); if(o) o.textContent=de(S.p[k],PINFO[k][5]); S.preset=''; S.fit=null; S.st.run=null; if(k==='T'){ S.harv.t0=Math.min(S.harv.t0,S.p.T); } updateLive(); if(S.tab==='data') updateDevLive(); return; }
  if(t.dataset.h){ const k=t.dataset.h; S.harv[k]=parseFloat(t.value); const o=$('#o_h'+(k==='h'?'h':k)); if(o) o.textContent=k==='h'?de(S.harv[k],2):S.harv[k]; S.preset=''; updateLive(); return; }
  if(t.dataset.spd){ S.speed=parseFloat(t.value); $('#o_spd').textContent=S.speed+'×'; return; }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.sh){ S.show[t.dataset.sh]=t.checked; drawCharts(); return; }
  if(t.dataset.act==='harvon'){ S.harv.on=t.checked; S.preset=''; updateLive(); renderModel(); drawScene(); return; }
  if(t.dataset.act==='harvend'){ S.harv.t1=t.checked?Math.min(S.p.T,Math.max(S.harv.t0+20,S.p.T*0.8)):null; updateLive(); renderModel(); drawScene(); return; }
});
document.addEventListener('input',e=>{ if(e.target.dataset&&e.target.dataset.dtxt) S.dtxt=e.target.value; });
function copyText(txt,btn,label){ const done=()=>{ if(btn){ const o=btn.textContent; btn.textContent='Kopiert'; setTimeout(()=>btn.textContent=label||o,1500); } };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,()=>{}); else { const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(err){} ta.remove(); } }
function applyLoad(l){
  if(l==='rules'){ showTab('rules'); return; } if(l==='rule1'||l==='rule2'||l==='rule3'){ loadRule(+l.slice(4)); showTab('rules'); drawCharts(); return; }
  if(l==='cap'){ applyPreset('cap'); showTab('model'); return; } if(l==='data'){ newChallenge(); showTab('data'); return; } if(l==='train'){ showTab('train'); return; }
}
document.addEventListener('click',e=>{
  const v=e.target.closest('[data-v]'); if(v){ const k=v.dataset.v;
    if(k==='play'){ if(S.play) stopPlay(); else startPlay(); }
    else if(k==='rewind'){ stopPlay(); setT(0); }
    else if(k==='view'){ S.view=v.dataset.m; drawCharts(); }
    else if(k==='fold'){ const c=$('#viewer').classList.toggle('collapsed'); v.setAttribute('aria-pressed',c); v.textContent=c?'▼':'▲'; }
    return; }
  const tb=e.target.closest('.tab'); if(tb){ showTab(tb.dataset.tab); return; }
  const a=e.target.closest('[data-act]'); if(!a||a.tagName==='INPUT') return; const act=a.dataset.act;
  switch(act){
    case 'preset': applyPreset(a.dataset.id); renderModel(); drawCharts(); drawScene(); break;
    case 'model': S.p.model=a.dataset.m; S.preset=''; S.st.run=null; recompute(); renderModel(); drawCharts(); drawScene(); break;
    case 'resetp': { const m=S.p.model; S.p=copyP(PDEF); S.p.model=m; S.preset=''; recompute(); renderModel(); drawCharts(); drawScene(); break; }
    case 'ghost': S.ghost={sim:S.sim}; renderModel(); drawCharts(); break;
    case 'noghost': S.ghost=null; renderModel(); drawCharts(); break;
    case 'kick': S.events.push({t:Math.round(S.tcur*10)/10,kx:parseFloat(a.dataset.kx),ky:parseFloat(a.dataset.ky)}); S.preset=''; updateLive(); break;
    case 'delev': S.events.splice(+a.dataset.i,1); updateLive(); break;
    case 'copycsv': copyText(csvText(),a); break;
    case 'copyprot': copyText(protText(),a); break;
    case 'rule': loadRule(+a.dataset.n); renderRules(); drawCharts(); break;
    case 'om': S.st.Om=parseFloat(a.dataset.o); S.st.run=null; renderChance(); drawCharts(); break;
    case 'stochrun': runStoch(); renderChance(); drawCharts(); break;
    case 'stochnew': S.st.seed=Math.floor(Math.random()*90000)+1; runStoch(); renderChance(); drawCharts(); break;
    case 'stochbatch': runBatch(); break;
    case 'dsrc': if(a.dataset.m==='chal'){ if(!S.chal) newChallenge(); else setData(S.chal.data,'chal'); } else { S.dataMode='user'; S.data=null; } renderData(); drawCharts(); break;
    case 'dex': S.dtxt=EXAMPLE_TXT; renderData(); break;
    case 'duse': { const r=parseData(S.dtxt); const msg=$('#dmsg'); if(r.t.length<6){ msg.innerHTML='<div class="fb no">Es wurden weniger als 6 gültige Zeilen gefunden. Prüfe das Format: Zeit; Beute; Räuber.</div>'; break; } if(r.x.some(v=>v<=0)||r.y.some(v=>v<=0)){ msg.innerHTML='<div class="fb no">Beute und Räuber müssen größer als 0 sein.</div>'; break; } setData(r,'user'); renderData(); drawCharts(); break; }
    case 'newchal': newChallenge(); renderData(); drawCharts(); break;
    case 'fit': { a.textContent='Rechnet …'; setTimeout(()=>{ const f=fitLV(S.data); S.fit=f; Object.assign(S.p,{a:clamp(f.a,0.1,2),b:clamp(f.b,0.005,0.1),c:clamp(f.c,0.02,0.5),d:clamp(f.d,0.1,1.5),x0:clamp(Math.round(f.x0),10,400),y0:clamp(Math.round(f.y0),1,60)}); recompute(); renderData(); drawCharts(); },20); break; }
    case 'reveal': S.reveal=true; renderData(); break;
    case 'poe': { const sc=POE.find(q=>q.id===+a.dataset.id), i=+a.dataset.i; if(S.poe[sc.id]) break; S.poe[sc.id]={choice:i,res:poeRun(sc)}; S.score.n++; if(i===sc.ok) S.score.ok++; renderTrain(); requestAnimationFrame(fillPoeCharts); break; }
    case 'itask': applyLoad(a.dataset.load); break;
  }
});
/* Lesezeiger an den Diagrammen */
let dragging=false;
function pick(ev){ const ch=ev.currentTarget, r=ch.getBoundingClientRect(); const x=ev.clientX-r.left, y=ev.clientY-r.top;
  if(ch.id==='chT'&&S.ctx.t){ const c=S.ctx.t; setT((x-c.L)/c.pw*c.T); }
  else if(ch.id==='chP'&&S.ctx.p){ const c=S.ctx.p, sim=S.sim; let best=0,bd=1e18; const st=Math.max(1,Math.floor(sim.n/800)); for(let i=0;i<=sim.n;i+=st){ const dx=c.xs(sim.X[i])-x, dy=c.ys(sim.Y[i])-y, d=dx*dx+dy*dy; if(d<bd){ bd=d; best=i; } } setT(sim.t[best]); } }
['chT','chP'].forEach(id=>{ const el=document.getElementById(id); el.addEventListener('pointerdown',ev=>{ dragging=true; stopPlay(); try{ el.setPointerCapture(ev.pointerId); }catch(e){} pick(ev); }); el.addEventListener('pointermove',ev=>{ if(dragging) pick(ev); }); el.addEventListener('pointerup',()=>{ dragging=false; }); el.addEventListener('pointercancel',()=>{ dragging=false; }); });
let rsz=null; window.addEventListener('resize',()=>{ clearTimeout(rsz); rsz=setTimeout(()=>{ drawCharts(); drawScene(); if(S.tab==='train') fillPoeCharts(); },120); });
$('[data-v="view"][data-m="both"]').setAttribute('aria-pressed',S.view==='both'); $('[data-v="view"][data-m="time"]').setAttribute('aria-pressed',S.view==='time');

/* =============== Start =============== */
(function init(){ recompute(); showTab('model'); })();
})();
</script>
