<style>

  }
}
:root[data-theme="dark"]{
  --bg:#0D1124; --panel:#161B36; --panel-2:#1D2342; --ink:#E9ECFB; --ink-soft:#A9B1D6; --line:#2C3563;
  --grid:#1F2647; --grid2:#2A3360; --accent:#9A91FF; --accent-ink:#0D1124; --focus:#8AB4FF;
  --bad:#FF8FA5; --bad-bg:#431826; --ok:#5ED4C4; --ok-bg:#103A36; --warn:#F2C25B; --warn-bg:#3A2F12; --info:#9DB7FF; --info-bg:#1E2C5C;
}
html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 8px); }

.fact{ border-left:4px solid var(--line); padding:4px 10px; margin:8px 0; }
.fact.y{ border-color:var(--accent); } .fact b{ font-family:var(--display); }
.pun{ border-collapse:collapse; margin:6px 0; } .pun th,.pun td{ border:1px solid var(--line); padding:6px 12px; text-align:center; min-width:64px; }
.pun th{ background:var(--panel-2); }
.legend{ display:grid; gap:8px; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); }
.legend div{ display:flex; gap:10px; align-items:center; font-size:.93rem; }
.legend svg{ flex:none; }
details.task{ border-top:1px solid var(--line); padding:6px 0; }
details.task>summary{ cursor:pointer; font-weight:700; min-height:44px; display:flex; align-items:center; gap:10px; }
details.task .sol{ background:var(--panel-2); border-radius:10px; padding:2px 12px 8px; margin-top:8px; }
details.task ul,.card ul.plain{ margin:4px 0 0; padding-left:1.2em; }
details.task p,details.teacher p,details.teacher li{ max-width:80ch; }

.gl dt{ font-family:var(--display); font-weight:800; margin-top:10px; } .gl dd{ margin:2px 0 0; max-width:75ch; }

@media print{ .tabs,.top p,.btnrow,.viewer .vbar{ display:none !important; } .viewer{ position:static; } }

<script>
(function(){
'use strict';
/* =============== Hilfen =============== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ROM=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const clone=o=>JSON.parse(JSON.stringify(o));
const sleep0=()=>new Promise(r=>setTimeout(r,0));

/* =============== Modell =============== */
function emptyModel(){ return {P:{},C:{},np:1,nc:1}; }
function addP(M,o){ const id='p'+(M.np++); M.P[id]=Object.assign({id,name:'',sex:'u',st:'n',car:false,dead:false,prob:false,cp:null},o||{}); return id; }
function coupleOf(M,pid){ for(const c of Object.values(M.C)) if(c.a===pid||c.b===pid) return c; return null; }
function partnerOf(M,pid){ const c=coupleOf(M,pid); return c?(c.a===pid?c.b:c.a):null; }
function addC(M,a,b,cons){ if(a===b||coupleOf(M,a)||coupleOf(M,b)) return null; const id='c'+(M.nc++); M.C[id]={id,a,b,cons:!!cons,sw:false,kids:[]}; return id; }
function wouldCycle(M,pid,cid){ const c=M.C[cid]; const st=[c.a,c.b], seen=new Set(); while(st.length){ const x=st.pop(); if(x===pid) return true; if(seen.has(x)) continue; seen.add(x); const cp=M.P[x]&&M.P[x].cp; if(cp&&M.C[cp]) st.push(M.C[cp].a,M.C[cp].b); } return false; }
function addKid(M,cid,pid,at){ const c=M.C[cid]; if(!c||!M.P[pid]||M.P[pid].cp||wouldCycle(M,pid,cid)) return false; M.P[pid].cp=cid; if(at==null||at>=c.kids.length) c.kids.push(pid); else c.kids.splice(at,0,pid); return true; }
function roles(M,c){ const A=M.P[c.a], B=M.P[c.b]; if(A.sex==='m'&&B.sex==='f') return {f:c.a,m:c.b,ok:true}; if(A.sex==='f'&&B.sex==='m') return {f:c.b,m:c.a,ok:true}; return {f:c.a,m:c.b,ok:false}; }
function delPerson(M,pid){
  const rm=new Set();
  const kill=id=>{ if(rm.has(id)||!M.P[id]) return; rm.add(id); const c=coupleOf(M,id); if(c){ const other=c.a===id?c.b:c.a; const kids=c.kids.slice(); delete M.C[c.id]; kids.forEach(k=>kill(k)); if(M.P[other]&&!M.P[other].cp) kill(other); } };
  kill(pid);
  rm.forEach(id=>{ const cp=M.P[id].cp; if(cp&&M.C[cp]) M.C[cp].kids=M.C[cp].kids.filter(k=>k!==id); });
  rm.forEach(id=>delete M.P[id]);
  Object.values(M.C).forEach(c=>{ if(!M.P[c.a]||!M.P[c.b]) delete M.C[c.id]; else c.kids=c.kids.filter(k=>M.P[k]); });
  return rm.size;
}

/* Namen */
const LEXF='Anna Maria Emma Mia Hannah Sophie Lena Lea Laura Julia Sarah Lisa Katharina Clara Klara Charlotte Marie Johanna Greta Frieda Ida Elisa Nora Paula Emilia Lina Luise Helene Martha Elsa Erika Ingrid Petra Sabine Monika Ursula Gisela Renate Brigitte Heike Birgit Karin Claudia Andrea Nicole Anke Tanja Jana Svenja Merle Fenja Wiebke Imke Hilke Gesa Antje Inge Hilde Rosa Berta Edith Elke Nina Erna Ilse Gerda Helga Marta Anja Kerstin Sandra Jutta Doris Ruth Eva Elena Amelie Hanna Lotta Mara Sina Tina Ulla Vera Jule Ronja Pia Ella Leni Maja Lilly'.split(' ');
const LEXM='Peter Hans Karl Otto Paul Max Jan Lukas Felix Jonas Finn Leon Ben Tim Tom Nico Niklas David Daniel Stefan Michael Thomas Andreas Markus Jürgen Klaus Wolfgang Werner Heinz Günter Dieter Horst Uwe Bernd Ralf Frank Jens Sven Torben Henrik Hauke Lars Nils Ole Tjark Gerd Heinrich Friedrich Fritz Wilhelm August Ernst Walter Hermann Georg Johann Anton Emil Theo Oskar Erik Matthias Simon Julian Moritz Philipp Jakob Bruno Albert Rudolf Kurt Gustav Alfred Egon Erwin Helmut Manfred Rainer Joachim Christian Tobias Sebastian Jannik Noah Elias Luca Karsten Holger Rolf Detlef Bodo Arne Malte Merten Joost Onno Enno Hinrich Jörg Axel Kai Bastian Marcel Patrick Dennis Marco Mats Piet Tammo Wilko Gerrit'.split(' ');
const SETF=new Set(LEXF), SETM=new Set(LEXM);
function autoNames(M){
  const used=new Set(Object.values(M.P).map(p=>p.name).filter(Boolean)); let a=0,b=0,c=0;
  const next=(pool,ix)=>{ let n; do{ n=pool[ix.v%pool.length]; ix.v++; }while(used.has(n)&&ix.v<pool.length*3); used.add(n); return n; };
  const fi={v:0}, mi={v:0};
  for(const id of Object.keys(M.P)){ const p=M.P[id]; if(p.name) continue; p.name = p.sex==='f'?next(LEXF,fi): p.sex==='m'?next(LEXM,mi): ((c++%2)?next(LEXF,fi):next(LEXM,mi)); }
}

/* =============== Layout =============== */
const LY={D:88,SW:74,ROW:130,TOP:46,NODE:18};
function isotonic(d,w){
  const bl=[]; d.forEach((v,i)=>{ bl.push({s:v*w[i],w:w[i],n:1}); while(bl.length>1){ const b=bl[bl.length-1], a=bl[bl.length-2]; if(a.s/a.w>b.s/b.w){ bl.pop(); a.s+=b.s; a.w+=b.w; a.n+=b.n; } else break; } });
  const z=[]; bl.forEach(b=>{ for(let i=0;i<b.n;i++) z.push(b.s/b.w); }); return z;
}
function layout(M){
  const ids=Object.keys(M.P);
  const res={pos:{},lab:{},gen:{},rows:[],w:320,h:200,maxG:0};
  if(!ids.length) return res;
  const ord={}; ids.forEach((id,i)=>ord[id]=i);
  const gen={}; ids.forEach(id=>gen[id]=0);
  const Cs=Object.values(M.C);
  for(let it=0;it<100;it++){ let ch=false;
    for(const c of Cs){ const g=Math.max(gen[c.a],gen[c.b]); if(gen[c.a]<g){gen[c.a]=g;ch=true;} if(gen[c.b]<g){gen[c.b]=g;ch=true;} for(const k of c.kids){ if(gen[k]<g+1){gen[k]=g+1;ch=true;} } }
    if(!ch) break; }
  const maxG=Math.max(...ids.map(i=>gen[i]));
  const rows=Array.from({length:maxG+1},()=>[]); const unitOf={};
  ids.forEach(id=>{ if(unitOf[id]) return; const c=coupleOf(M,id); let u;
    if(c){ const r=roles(M,c); const m=r.ok?[r.f,r.m]:[c.a,c.b]; u={m,c:c.id,g:gen[c.a]}; unitOf[c.a]=u; unitOf[c.b]=u; }
    else { u={m:[id],c:null,g:gen[id]}; unitOf[id]=u; }
    u.ord=Math.min(...u.m.map(x=>ord[x])); rows[u.g].push(u); });
  const parentUnit=pid=>{ const cp=M.P[pid].cp; if(!cp||!M.C[cp]) return null; const pu=unitOf[M.C[cp].a]; return pu&&pu.np!=null?pu:null; };
  rows.forEach((r,g)=>{
    r.forEach(u=>{ const ps=[]; u.m.forEach(x=>{ const pu=parentUnit(x); if(pu) ps.push(pu.np); });
      u.key=ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:null;
      u.kid=Math.min(...u.m.map(x=>{ const cp=M.P[x].cp; return cp&&M.C[cp]?M.C[cp].kids.indexOf(x):99; })); });
    if(g===0) r.sort((a,b)=>a.ord-b.ord);

/* =============== Stammbaum -> Geschichte =============== */
function numWord(n){ return ['kein','ein','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn'][n]||String(n); }
function joinDe(a){ return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' und '+a[a.length-1]; }
function verbalize(M){
  const m=clone(M); autoNames(m); const lay=layout(m); const seen=new Set();
  const fl=p=>{ const a=[]; a.push(p.sex==='m'?'m':p.sex==='f'?'w':'Geschlecht unbekannt'); if(p.st==='a') a.push('betroffen'); else if(p.st==='u') a.push('Merkmal unbekannt'); if(p.car&&p.st!=='a') a.push(p.sex==='f'?'Überträgerin':'Überträger'); if(p.dead) a.push('verstorben'); if(p.prob) a.push(p.sex==='f'?'Probandin':'Proband'); return a; };
  const me=id=>{ const p=m.P[id]; if(seen.has(id)) return p.name; seen.add(id); return `${p.name} (${fl(p).join(', ')})`; };
  const out=[]; const cs=Object.values(m.C).slice().sort((a,b)=>(lay.gen[a.a]-lay.gen[b.a])||(lay.pos[a.a].x+lay.pos[a.b].x-lay.pos[b.a].x-lay.pos[b.b].x));
  cs.forEach(c=>{ const r=roles(m,c); const A=r.ok?r.f:c.a, B=r.ok?r.m:c.b;
    out.push(`${me(A)} und ${me(B)} sind ${c.cons?'blutsverwandt und ':''}verheiratet.`);
    if(c.kids.length){ const ks=c.kids.slice().sort((x,y)=>lay.pos[x].x-lay.pos[y].x); out.push(`Sie haben ${numWord(ks.length)} Kind${ks.length>1?'er':''}: ${joinDe(ks.map(me))}.`); } });
  Object.keys(m.P).forEach(id=>{ if(!seen.has(id)){ out.push(`${me(id)}.`); } });

/* =============== Analyse: Erbgänge =============== */
const MODES=[

 {k:'AR',nm:'autosomal-rezessiv',kurz:'autosomal rezessiv'},
 {k:'XD',nm:'X-chromosomal-dominant',kurz:'X-chromosomal dominant'},
 {k:'XR',nm:'X-chromosomal-rezessiv',kurz:'X-chromosomal rezessiv'},

const MODEN=Object.fromEntries(MODES.map(m=>[m.k,m]));

          break;
        case 'XD':

          if(K.sex==='f'&&K.st==='n'&&F&&F.st==='a') out.push({ids:[kid,r.f],t:`Die Tochter ${nmOf(kid)} ist nicht betroffen, obwohl ihr Vater ${nmOf(r.f)} betroffen ist. Bei X-chromosomal-dominanter Vererbung wären alle Töchter eines betroffenen Vaters betroffen.`});

          break;
        case 'Y':
          if(K.sex==='m'&&K.st==='a'&&F&&F.st==='n') out.push({ids:[kid,r.f],t:`Der Sohn ${nmOf(kid)} ist betroffen, sein Vater ${nmOf(r.f)} aber nicht. Das Y-Chromosom wird vom Vater an alle Söhne weitergegeben.`});
          if(K.sex==='m'&&K.st==='n'&&F&&F.st==='a') out.push({ids:[kid,r.f],t:`Der Sohn ${nmOf(kid)} ist nicht betroffen, obwohl sein Vater ${nmOf(r.f)} betroffen ist. Alle Söhne eines betroffenen Vaters müssten das Merkmal haben.`});
          break;
        case 'MT':
          if(Mo&&Mo.st==='a'&&K.st==='n') out.push({ids:[kid,r.m],t:`${nmOf(kid)} ist nicht betroffen, obwohl die Mutter ${nmOf(r.m)} betroffen ist. Mitochondrien werden nur von der Mutter vererbt, alle Kinder müssten betroffen sein (Vereinfachung: Homoplasmie).`});

  return out;
}

/* =============== Genotypen =============== */
function dom(mode,sex){
  switch(mode){
    case 'AD': case 'AR': return ['AA','Aa','aa'];
    case 'MT': return ['N','m'];
    case 'XD': case 'XR': return sex==='f'?['AA','Aa','aa']:sex==='m'?['A','a']:null;
    case 'Y': return sex==='m'?['y0','y1']:sex==='f'?['-']:null;
  }
}
function aff(mode,sex,g){
  switch(mode){
    case 'AD': return g!=='aa';
    case 'AR': return g==='aa';
    case 'MT': return g==='m';
    case 'XD': return sex==='f'?g!=='aa':g==='A';
    case 'XR': return sex==='f'?g==='aa':g==='a';
    case 'Y': return g==='y1';
  }
}
function prior(mode,sex,g,q){
  const p=1-q;
  switch(mode){
    case 'AR': return g==='AA'?p*p:g==='Aa'?2*p*q:q*q;
    case 'AD': return g==='aa'?p*p:g==='Aa'?2*p*q:q*q;
    case 'XR': if(sex==='f') return g==='AA'?p*p:g==='Aa'?2*p*q:q*q; return g==='A'?p:q;
    case 'XD': if(sex==='f') return g==='aa'?p*p:g==='Aa'?2*p*q:q*q; return g==='a'?p:q;
    case 'Y': return g==='y1'?q:g==='y0'?p:1;
    case 'MT': return g==='m'?q:p;
  }
}
const gam=g=>g.length===2?(g[0]===g[1]?[[g[0],1]]:[[g[0],.5],[g[1],.5]]):[[g,1]];
const jn=(x,y)=>x<=y?x+y:y+x;
function childDist(mode,fg,mg,cs){
  const acc={}; const add=(g,p)=>{ acc[g]=(acc[g]||0)+p; };
  switch(mode){
    case 'AD': case 'AR': gam(fg).forEach(a=>gam(mg).forEach(b=>add(jn(a[0],b[0]),a[1]*b[1]))); break;
    case 'MT': add(mg,1); break;
    case 'XD': case 'XR': if(cs==='m') gam(mg).forEach(b=>add(b[0],b[1])); else gam(mg).forEach(b=>add(jn(fg,b[0]),b[1])); break;
    case 'Y': add(cs==='m'?fg:'-',1); break;
  }
  return Object.entries(acc);
}
function gtxt(mode,sex,g){
  switch(mode){
    case 'AD': case 'AR': return g;
    case 'XD': case 'XR': return sex==='f'?`X${g[0]}X${g[1]}`:`X${g}Y`;
    case 'Y': return g==='y1'?'Y*':g==='y0'?'Y':'';
    case 'MT': return g==='m'?'mutiert':'normal';
  }
}
function legendAllele(mode){
  switch(mode){
    case 'AD': return 'A = Allel für das Merkmal (dominant), a = Normalallel';
    case 'AR': return 'A = Normalallel (dominant), a = Allel für das Merkmal (rezessiv)';
    case 'XD': return 'XA = Allel für das Merkmal (dominant), Xa = Normalallel';
    case 'XR': return 'XA = Normalallel, Xa = Allel für das Merkmal (rezessiv)';
    case 'Y': return 'Y* = Y-Chromosom mit Merkmalsgen, Y = normal';
    case 'MT': return 'mutiert = mitochondriale Mutation (vereinfacht: alle Mitochondrien betroffen)';

}

/* Faktoren und Variablenelimination */
function fmul(A,B){
  const vars=A.vars.slice(); B.vars.forEach(v=>{ if(!vars.includes(v)) vars.push(v); });

  const n=dims.reduce((a,b)=>a*b,1); const t=new Float64Array(n);

  for(let i=0;i<n;i++){ let ia=0,ib=0; for(let k=0;k<vars.length;k++){ ia+=idx[k]*sA[k]; ib+=idx[k]*sB[k]; } t[i]=A.t[ia]*B.t[ib];
    for(let k=vars.length-1;k>=0;k--){ idx[k]++; if(idx[k]<dims[k]) break; idx[k]=0; } }
  return {vars,dims,t};
}
function sumOut(F,v){
  const k=F.vars.indexOf(v); const vars=F.vars.filter(x=>x!==v), dims=F.dims.filter((_,i)=>i!==k);
  const n=dims.reduce((a,b)=>a*b,1); const t=new Float64Array(n);
  const strideOut=[]; let acc=1; for(let i=vars.length-1;i>=0;i--){ strideOut[i]=acc; acc*=dims[i]; }
  const idx=new Array(F.vars.length).fill(0); const total=F.t.length;
  for(let i=0;i<total;i++){ let o=0,j=0; for(let a=0;a<F.vars.length;a++){ if(a===k) continue; o+=idx[a]*strideOut[j]; j++; } t[o]+=F.t[i];

    for(const v of elim){ const sc=new Set(); let cost=1; F.forEach(f=>{ if(f.vars.includes(v)) f.vars.forEach((x,i)=>{ if(!sc.has(x)){ sc.add(x); cost*=f.dims[i]; } }); }); if(cost<bc){ bc=cost; best=v; } }

}
function buildBN(M,mode,q){

/* Alle Erbgänge prüfen */
function marriedIn(M){ const out=[]; for(const c of Object.values(M.C)){ const A=M.P[c.a],B=M.P[c.b]; if(!A.cp&&B.cp) out.push(c.a); if(!B.cp&&A.cp) out.push(c.b); } return out; }
function analyzeAll(M){
  const res={};
  const mi=marriedIn(M);
  for(const m of MODES){
    const viol=ruleViol(M,m.k); let st='ok', flagged=[], why='';
    let inf=null; try{ inf=inferAll(M,m.k,1e-3,false); }catch(e){ inf={ok:true,Z:1,err:e.message}; }
    if(viol.length||!inf.ok){ st='no'; why=inf.why||''; }
    else if(m.k==='AR'||m.k==='XR'){
      try{ const i2=inferAll(M,m.k,1e-4,false); if(i2.ok){ mi.forEach(id=>{ const p=M.P[id]; if(p.st!=='n') return; if(m.k==='XR'&&p.sex!=='f') return; if(!i2.bn.doms[id]) return; const post=posterior(i2.bn,i2.Z,id); const car=post.find(x=>x.g==='Aa'); if(car&&car.p>.5) flagged.push(id); }); } }catch(e){}

/* Risiko für weiteres Kind */
function riskForCouple(M,cid,mode,q){
  const c=M.C[cid]; const bn=buildBN(M,mode,q); if(bn.bad) return null;
  const Z=ve(bn.fac,[]).t[0]; if(!(Z>0)) return null;
  const auto=(mode==='AD'||mode==='AR'); const r=roles(M,c); if(!auto&&!r.ok) return {err:'Für diesen Erbgang müssen Vater (m) und Mutter (w) bekannt sein.'};
  const fa=auto?c.a:r.f, mo=auto?c.b:r.m; if(!bn.doms[fa]||!bn.doms[mo]) return {err:'Geschlecht der Eltern fehlt.'};
  const need=mode==='MT'?[mo]:mode==='Y'?[fa]:[fa,mo];
  let jt=ve(bn.fac,need); const tot=jt.t.reduce((a,b)=>a+b,0);
  const comb=[]; const dfa=bn.doms[fa], dmo=bn.doms[mo];
  const get=(i,j)=>{ if(mode==='MT') return jt.t[j]; if(mode==='Y') return jt.t[i]; return jt.t[i*dmo.length+j]; };
  dfa.forEach((fg,i)=>dmo.forEach((mg,j)=>{ if(mode==='MT'&&i>0) return; if(mode==='Y'&&j>0) return; const w=get(i,j)/tot; if(w>1e-12) comb.push({fg,mg,w}); }));
  const sexes=(mode==='XD'||mode==='XR'||mode==='Y')?['m','f']:['x'];
  const out={comb,sexes:{}}; 
  sexes.forEach(s=>{ let pa=0,pc=0; const dist={};
    comb.forEach(cb=>{ childDist(mode,cb.fg,cb.mg,s==='x'?'u':s).forEach(([g,pr])=>{ const sx=s==='x'?'u':s; const a=aff(mode,sx==='u'?'m':sx,g); if(mode==='AD'||mode==='AR'||mode==='MT'){ if(aff(mode,'m',g)) pa+=cb.w*pr; } else if(a) pa+=cb.w*pr; if((mode==='AR'&&g==='Aa')||(mode==='XR'&&s==='f'&&g==='Aa')) pc+=cb.w*pr; dist[g]=(dist[g]||0)+cb.w*pr; }); });
    out.sexes[s]={pa,pc,dist}; });

/* Kreuzungsrechner */
function punnett(mode,fg,mg){
  const rows=gam(mg), cols=(mode==='XD'||mode==='XR')?[[fg,.5,'X'],['Y',.5,'Y']]:mode==='Y'?[[fg,1,'Y']]:gam(fg).map(x=>[x[0],x[1],'']);

  if(mode==='AD'||mode==='AR'){ rows.forEach(rw=>{ const row=[]; cols.forEach(cl=>{ const g=jn(rw[0],cl[0]); const a=aff(mode,'m',g); row.push({g,a,p:rw[1]*cl[1]}); all[a?'a':'n']+=rw[1]*cl[1]; }); cells.push(row); }); }
  else if(mode==='XD'||mode==='XR'){ rows.forEach(rw=>{ const row=[]; cols.forEach(cl=>{ if(cl[2]==='X'){ const g=jn(cl[0],rw[0]); const a=aff(mode,'f',g); row.push({g,sex:'f',a,p:rw[1]*cl[1]}); daus[a?'a':'n']+=rw[1]*cl[1]*2; } else { const g=rw[0]; const a=aff(mode,'m',g); row.push({g,sex:'m',a,p:rw[1]*cl[1]}); sons[a?'a':'n']+=rw[1]*cl[1]*2; } }); cells.push(row); }); }

/* Anzeige der Wahrscheinlichkeit */
function fracTxt(p){ if(p<1e-4) return '0'; if(p>1-1e-4) return '1'; for(let d=2;d<=16;d++){ for(let n=1;n<d;n++){ if(Math.abs(p-n/d)<2e-4){ let a=n,b=d; const gg=(x,y)=>y?gg(y,x%y):x; const k=gg(a,b); return `${a/k}/${b/k}`; } } } return ''; }

/* =============== Indizien =============== */
function facts(M,lay){
  CUR={M,lay}; const F=[]; const P=Object.values(M.P);
  const A=P.filter(p=>p.st==='a'); const am=A.filter(p=>p.sex==='m').length, af=A.filter(p=>p.sex==='f').length;

  const gens=new Set(A.map(p=>lay.gen[p.id])); const gl=[...gens].sort().map(g=>ROM[g]||g+1);
  F.push({y:A.length>0,t:`Das Merkmal tritt in ${gens.size} von ${lay.maxG+1} Generationen auf${gl.length?' ('+gl.join(', ')+')':''}.`,h:gens.size===lay.maxG+1&&lay.maxG>=1?'In jeder Generation betroffen: spricht für dominante Vererbung. Bei seltenen rezessiven Merkmalen werden Generationen häufig übersprungen.':''});
  const hh=[],aa=[],tf=[],tm=[],cons=[]; let fS=0,fSa=0,fD=0,fDa=0,mS=0,mSa=0,mD=0,mDa=0;

      if(a.st==='n'&&b.st==='n'&&K.st==='a') hh.push({k,c});
      if(a.st==='a'&&b.st==='a'&&K.st==='n') aa.push({k,c});
      if(r.ok){ const f=M.P[r.f], m=M.P[r.m];
        if(f.st==='a'){ if(K.sex==='m'){ fS++; if(K.st==='a') fSa++; } if(K.sex==='f'){ fD++; if(K.st==='a') fDa++; } if(K.sex==='m'&&K.st==='a') tf.push({k,f:r.f,m:r.m}); }
        if(m.st==='a'){ if(K.sex==='m'){ mS++; if(K.st==='a') mSa++; } if(K.sex==='f'){ mD++; if(K.st==='a') mDa++; } } } } }
  F.push({y:hh.length>0,t:hh.length?`Gesunde Eltern haben ein betroffenes Kind: ${hh.map(x=>`${nmOf(x.k)} (Eltern ${nmOf(x.c.a)}, ${nmOf(x.c.b)})`).join('; ')}.`:'Es gibt kein betroffenes Kind gesunder Eltern.',h:hh.length?'Das Merkmal ist rezessiv (die Eltern sind Überträger). Dominante, Y-chromosomale und mitochondriale Vererbung sind damit ausgeschlossen.':'',ids:hh.flatMap(x=>[x.k,x.c.a,x.c.b])});
  F.push({y:aa.length>0,t:aa.length?`Zwei betroffene Eltern haben ein gesundes Kind: ${aa.map(x=>nmOf(x.k)).join(', ')}.`:'Es gibt kein gesundes Kind zweier betroffener Eltern.',h:aa.length?'Das schließt rezessive Vererbung aus. Bei dominanter Vererbung sind beide Eltern heterozygot.':'',ids:aa.flatMap(x=>[x.k,x.c.a,x.c.b])});

  F.push({y:cons.length>0,t:cons.length?'Es gibt eine Verwandtenehe.':'Keine Verwandtenehe eingezeichnet.',h:cons.length?'Verwandtenehen erhöhen die Chance, dass beide Eltern dasselbe seltene Allel tragen: Das spricht für rezessive Vererbung.':''});
  return F;
}

function musterBegruendung(M,lay,mode,an,infRes){
  CUR={M,lay}; const L=[]; const m=MODEN[mode]; const F=facts(M,lay);
  L.push(`Erbgang: ${m.nm}.`); L.push('');
  L.push('Begründung:');
  let n=1;
  const hh=F[2], aa=F[3];
  if(mode==='AR'||mode==='XR'){ if(hh.y) L.push(`${n++}. ${hh.t.replace(/\.$/,'')}. Die Eltern sind also Überträger (heterozygot), das Merkmal ist rezessiv.`); }
  if(mode==='AD'||mode==='XD'){ const gens=F[1]; L.push(`${n++}. ${gens.t}${gens.h?' '+gens.h:''}`); L.push(`${n++}. Gesunde Eltern haben in diesem Stammbaum keine betroffenen Kinder: Jedes betroffene Kind hat mindestens einen betroffenen Elternteil.`); }
  if(mode==='XR'){ const o=F.find(f=>/Betroffene Mütter/.test(f.t)); if(o&&o.h) L.push(`${n++}. ${o.t} ${o.h}`); if(F.find(f=>/Nur Männer/.test(f.t))) L.push(`${n++}. Nur Männer sind betroffen. Männer besitzen nur ein X-Chromosom, daher zeigt sich ein rezessives Allel bei ihnen immer.`); }
  if(mode==='XD'){ const o=F.find(f=>/Betroffene Väter/.test(f.t)); if(o&&o.h) L.push(`${n++}. ${o.t} ${o.h}`); }
  if(mode==='Y'){ L.push(`${n++}. Nur Männer sind betroffen, und jeder betroffene Mann hat einen betroffenen Vater. Alle Söhne betroffener Väter sind betroffen.`); }
  if(mode==='MT'){ const o=F.find(f=>/Betroffene Mütter/.test(f.t)); L.push(`${n++}. ${o?o.t+' ':''}Mitochondrien werden nur über die Eizelle vererbt: Alle Kinder einer betroffenen Mutter sind betroffen, betroffene Väter geben das Merkmal nicht weiter.`); }
  if(mode==='AR'&&!hh.y) L.push(`${n++}. Es gibt keinen Widerspruch zu rezessiver Vererbung. Gesunde Eltern könnten Überträger sein.`);
  L.push(`${n++}. Mit der Regel „${m.kurz}“ ist der gesamte Stammbaum vereinbar${an&&an[mode]&&an[mode].st==='unlikely'?', allerdings nur, wenn Einheiratende ('+an[mode].flagged.map(nmOf).join(', ')+') Überträger sind. Das ist bei seltenen Merkmalen unwahrscheinlich':''}.`);
  L.push(''); L.push('Ausschluss anderer Erbgänge:');
  MODES.forEach(o=>{ if(o.k===mode) return; const a=an[o.k];
    if(a.st==='no'){ const v=a.viol[0]; L.push(`- ${o.nm}: ausgeschlossen. ${v?v.t:'Der Stammbaum widerspricht diesem Erbgang.'}`); }
    else { const key=[mode+'|'+o.k,o.k+'|'+mode].find(k=>DECIDE[k]); L.push(`- ${o.nm}: nicht auszuschließen${a.st==='unlikely'?' (nur mit Überträgern unter den Einheiratenden, unwahrscheinlich)':''}.${key?' Entscheidend wäre: '+DECIDE[key]:''}`); } });
  if(infRes&&infRes.ok){ L.push(''); L.push('Genotypen ('+legendAllele(mode)+'):'); Object.keys(infRes.post).forEach(id=>{ const p=M.P[id]; const sure=infRes.post[id].filter(x=>x.p>.9995); if(sure.length===1) L.push(`- ${nmOf(id)}: ${gtxt(mode,p.sex,sure[0].g)}`); else { const poss=infRes.post[id].filter(x=>x.p>5e-4); L.push(`- ${nmOf(id)}: ${poss.map(x=>gtxt(mode,p.sex,x.g)+' ('+ptxt(x.p)+')').join(' oder ')}`); } }); }
  return L.join('\n');
}

/* =============== Zufallsgenerator =============== */
function genPedigree(mode,seed){
  for(let att=0;att<80;att++){ const r=tryGen(mode,mulberry32(seed*7919+att*104729+11),false); if(r) return r; }
  return tryGen(mode,mulberry32(seed+3),true);
}
function tryGen(mode,rnd,force){
  const M=emptyModel(), truth={}; const used=new Set();
  const nm=sex=>{ const pool=sex==='f'?LEXF:LEXM; let n,i=0; do{ n=pool[Math.floor(rnd()*pool.length)]; i++; }while(used.has(n)&&i<80); used.add(n); return n; };
  const mk=(sex,g)=>{ const id=addP(M,{sex,name:nm(sex)}); truth[id]=g; M.P[id].st=aff(mode,sex,g)?'a':'n'; return id; };
  const married=sex=>{ const r=rnd(); switch(mode){ case 'AR': return r<.94?'AA':'Aa'; case 'AD': return r<.94?'aa':'Aa'; case 'XR': return sex==='f'?(r<.94?'AA':'Aa'):(r<.96?'A':'a'); case 'XD': return sex==='f'?(r<.94?'aa':'Aa'):(r<.96?'a':'A'); case 'Y': return sex==='m'?(r<.96?'y0':'y1'):'-'; case 'MT': return r<.94?'N':'m'; } };
  let fg,mg;
  switch(mode){ case 'AR': fg='Aa'; mg='Aa'; break; case 'AD': if(rnd()<.5){ fg='Aa'; mg='aa'; } else { fg='aa'; mg='Aa'; } break; case 'XR': fg='A'; mg='Aa'; break; case 'XD': if(rnd()<.5){ fg='A'; mg='aa'; } else { fg='a'; mg='Aa'; } break; case 'Y': fg='y1'; mg='-'; break; case 'MT': fg='N'; mg='m'; break; }
  const f=mk('m',fg), m=mk('f',mg); const top=addC(M,f,m,false);
  const kidsFor=(cid,n)=>{ const c=M.C[cid]; const r=roles(M,c); const out=[]; for(let i=0;i<n;i++){ const sex=rnd()<.5?'m':'f'; const dist=childDist(mode,truth[r.f],truth[r.m],sex); let u=rnd(), g=dist[dist.length-1][0]; for(const [gg,pr] of dist){ if(u<pr){ g=gg; break; } u-=pr; } const id=mk(sex,g); addKid(M,cid,id); out.push(id); } return out; };
  const wed=(id,pp)=>{ const sex=M.P[id].sex==='m'?'f':'m'; const pid=mk(sex,married(sex)); return addC(M,id,pid,false); };
  const k1=kidsFor(top,3+Math.floor(rnd()*2));
  const deep=rnd()<.4;
  k1.forEach(id=>{ if(rnd()<.8){ const cid=wed(id); const k2=kidsFor(cid,1+Math.floor(rnd()*3));
    if(deep) k2.forEach(g2=>{ if(rnd()<.35){ const c2=wed(g2); kidsFor(c2,1+Math.floor(rnd()*2)); } }); } });
  const n=Object.keys(M.P).length, a=Object.values(M.P).filter(p=>p.st==='a').length;
  if(!force&&(n<10||n>24||a<3||a>0.7*n)) return null;
  if(!force&&(mode==='AR'||mode==='XR')&&!Object.values(M.P).some(p=>p.cp&&p.st==='a')) return null;
  return {M,truth,mode};
}

  let h=`<div class="card"><h2>Familiengeschichte und Stammbaum</h2><p class="lead">Schreibe eine Familiengeschichte, und die App baut den Stammbaum. Oder lass dir aus einem Stammbaum die Geschichte schreiben. Unten zeigt ein Protokoll, was die App verstanden hat.</p>
  <div class="warn">Datenschutz: Schreibe über erfundene Familien. Keine echten Namen oder Gesundheitsdaten eintragen.</div>
  <label class="fl" for="st-text">Familiengeschichte</label>
  <textarea id="st-text" data-f="story" spellcheck="false" placeholder="Beispiel: Karl (m, betroffen) und Anna (w) sind verheiratet. Sie haben drei Kinder: Peter (m, betroffen), Lisa (w) und Hans (m).">${esc(S.story)}</textarea>
  <div class="btnrow"><button type="button" class="btn primary" data-act="parse">Stammbaum erzeugen</button><button type="button" class="btn" data-act="verb">Text aus dem Stammbaum</button>
  <select id="st-ex" data-f="stex" aria-label="Beispieltext einfügen" style="width:auto;min-width:11em"><option value="">Beispieltext …</option>${CASES.map(c=>`<option value="${c.id}">Fall ${c.id}: ${esc(c.t)}</option>`).join('')}</select>
  <button type="button" class="btn" data-act="stclear">Leeren</button></div>`;
  if(S.slog){ h+=`<h3>Was die App verstanden hat</h3><p class="note">${S.slog.stats.p} Personen, ${S.slog.stats.c} Paare, ${S.slog.stats.a} betroffen.</p><ul class="logl">${S.slog.log.map(l=>`<li class="${l.k}">${esc(l.t)}</li>`).join('')||'<li class="info">Nichts erkannt.</li>'}</ul>`; }
  h+=`<details class="mode"><summary>Schreibhilfe: So versteht die App deinen Text</summary>
   <ul><li>Nenne Personen mit Vornamen. Gängige Vornamen erkennt die App am Geschlecht. Bei anderen Namen schreibst du <b>(m)</b> oder <b>(w)</b> dahinter.</li>
   <li>Merkmale in Klammern: <b>(m, betroffen)</b>, <b>(w, Überträgerin)</b>, <b>(verstorben)</b>, <b>(Proband)</b>. Wer nichts hat, gilt als gesund.</li>
   <li>Paare: „A und B sind verheiratet.“ Mit „blutsverwandt“ oder „Cousin und Cousine“ im Satz wird eine Verwandtenehe gezeichnet.</li>
   <li>Kinder: „Sie haben drei Kinder: C, D und E.“ oder „Ihr Sohn ist F.“ oder „G ist die Tochter von A und B.“ „Sie/Ihr“ bezieht sich immer auf das zuletzt genannte Paar.</li>
   <li>Geschwister: „H ist der Bruder von C.“ Die Eltern von C müssen vorher genannt sein.</li>
   <li>Pro Person gibt es höchstens ein Paar und ein Elternpaar.</li></ul>
   <p class="note">Satzbausteine zum Einfügen:</p><div class="btnrow">${SNIP.map(([t,s],i)=>`<button type="button" class="btn" data-act="snip" data-i="${i}">${t}</button>`).join('')}</div></details></div>`;
  h+=`<div class="card"><h2>Schreibauftrag mit Prüfung</h2><label class="fl" for="wt">Auftrag</label><select id="wt" data-f="wsel">${WTASKS.map(w=>`<option value="${w.id}" ${w.id===S.wsel?'selected':''}>${w.id}: ${esc(w.t)}</option>`).join('')}</select>
  <p class="lead" style="margin-top:8px">${esc(sel.a)}</p><div class="btnrow"><button type="button" class="btn primary" data-act="wcheck">Meine Geschichte prüfen</button></div>`;
  if(S.wfb) h+=S.wfb.length?`<div class="fb tip"><b>Noch nicht ganz:</b><ul class="plain">${S.wfb.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:`<div class="fb ok">Aufgabe erfüllt. Prüfe unter „Analyse“, wie die App deinen Stammbaum beurteilt.</div>`;
  h+='</div>';
  $('#pane-story').innerHTML=h;
}
function doParse(text){
  const r=parseStory(text); S.slog=r; S.story=text;
  if(r.stats.p>0) setModel(r.M); else { renderStory(); }
  return r;
}

/* =============== Reiter: Analyse =============== */
function ensureGeno(){ const key=S.mode+'|'+S.q; if(!S.genoInf||S.gkey!==key){ const keep=S.showGeno; computeGeno(); S.gkey=key; } }
function punnettHTML(mode,fg,mg){
  const pu=punnett(mode,fg,mg);
  if(mode==='MT') return `<p>Alle Kinder erhalten die Mitochondrien der Mutter (${mg==='m'?'mutiert':'normal'}): ${mg==='m'?'alle Kinder sind betroffen':'alle Kinder sind nicht betroffen'}. Der Vater gibt keine Mitochondrien weiter.</p>`;
  if(mode==='Y') return `<p>Alle Söhne erhalten das Y-Chromosom des Vaters (${fg==='y1'?'mit Merkmal: alle Söhne betroffen':'ohne Merkmal: alle Söhne nicht betroffen'}). Töchter erhalten kein Y-Chromosom und sind nicht betroffen.</p>`;
  const X=(mode==='XD'||mode==='XR');
  const colH=pu.cols.map(c=>X?(c[2]==='X'?`X${sup(c[0])}`:'Y'):sup(c[0])).map(t=>`<th scope="col">${t}</th>`).join('');
  const rowsH=pu.rows.map((r,i)=>`<tr><th scope="row">${X?'X'+sup(r[0]):sup(r[0])}</th>${pu.cells[i].map(c=>`<td>${gh(mode,c.sex||'m',c.g)}<br><small>${X?(c.sex==='f'?'Tochter':'Sohn')+', ':''}${c.a?'betroffen':'gesund'}</small></td>`).join('')}</tr>`).join('');
  let sum='';
  if(X) sum=`Söhne: ${pct(pu.sons.a)} betroffen · Töchter: ${pct(pu.daus.a)} betroffen`; else sum=`Betroffen: ${ptxt(pu.all.a)} · nicht betroffen: ${ptxt(pu.all.n)}`;
  return `<div class="tscroll"><table class="pun"><thead><tr><th></th>${colH}</tr></thead><tbody>${rowsH}</tbody></table></div><p><b>${sum}</b></p>`;
}
function pdoms(mode){ switch(mode){ case 'AD': case 'AR': return {f:['AA','Aa','aa'],m:['AA','Aa','aa']}; case 'XD': case 'XR': return {f:['A','a'],m:['AA','Aa','aa']}; case 'Y': return {f:['y0','y1'],m:null}; case 'MT': return {f:null,m:['N','m']}; } }
function renderAnalyse(){
  const M=S.M, lay=S.lay; CUR={M,lay}; const n=Object.keys(M.P).length;
  let h='';
  if(n<2){ $('#pane-analyse').innerHTML='<div class="card"><h2>Analyse</h2><p class="lead">Lade einen Fall, baue einen Stammbaum oder erzeuge einen aus einer Geschichte. Mindestens zwei Personen sind nötig.</p></div>'; return; }
  const an=getAn(); const F=facts(M,lay);
  h+=`<div class="card"><h2>1. Beobachten: Indizien im Stammbaum</h2><p class="lead">Diese Beobachtungen berechnet die App aus dem Stammbaum. Sie sind Hinweise, noch kein Beweis.</p>${F.map(f=>`<div class="fact${f.y?' y':''}">${esc(f.t)}${f.h?`<br><b>Deutung:</b> ${esc(f.h)}`:''}${f.ids&&f.ids.length?` <button type="button" class="lk" data-act="hl" data-ids="${[...new Set(f.ids)].join(',')}" data-cls="info">Zeigen</button>`:''}</div>`).join('')}
  <p class="note">Annahmen: vollständige Penetranz, keine Neumutation, keine Informationslücken außer „unbekannt“. Kleine Stammbäume erlauben oft keine eindeutige Entscheidung.</p></div>`;
  h+=`<div class="card"><h2>2. Erbgänge prüfen</h2><p class="lead">Für jeden Erbgang sucht die App Widersprüche. „Ausgeschlossen“ heißt: Der Stammbaum kann so nicht entstanden sein. „Unwahrscheinlich“ heißt: nur möglich, wenn Einheiratende Überträger sind.</p>`;
  MODES.forEach(m=>{ const a=an[m.k]; h+=`<details class="mode" ${a.st==='no'?'':'open'}><summary>${m.nm} ${badge(a)}</summary>`;
    if(a.st==='no') h+=`<ul>${a.viol.length?a.viol.map(v=>`<li>${esc(v.t)} <button type="button" class="lk" data-act="hl" data-ids="${v.ids.join(',')}" data-cls="bad">Zeigen</button></li>`).join(''):`<li>${esc(a.why||'Der Stammbaum widerspricht diesem Erbgang.')}</li>`}</ul>`;
    else if(a.st==='unlikely') h+=`<p>Der Stammbaum ist nur dann vereinbar, wenn ${a.flagged.map(nmOf).map(esc).join(', ')} Überträger ${a.flagged.length>1?'sind':'ist'}. Das Allel müsste bei Einheiratenden vorkommen, bei seltenen Merkmalen ist das unwahrscheinlich. <button type="button" class="lk" data-act="hl" data-ids="${a.flagged.join(',')}" data-cls="info">Zeigen</button></p>`;
    else h+=`<p>Kein Widerspruch gefunden. ${MODEN[m.k].nm} lässt sich mit diesem Stammbaum nicht ausschließen.</p>`;
    if(a.st!=='no') h+=`<button type="button" class="lk" data-act="setmode" data-m="${m.k}">Genotypen für diesen Erbgang berechnen</button>`;
    h+='</details>'; });
  const okc=MODES.filter(m=>an[m.k].st==='ok'); 
  h+=`<div class="fb info" role="status">${okc.length===1?`Genau ein Erbgang ist ohne Zusatzannahme vereinbar: <b>${okc[0].nm}</b>.`:okc.length===0?'Kein Erbgang ist ohne Zusatzannahme vereinbar. Prüfe die Eingaben (Geschlecht, Merkmal) oder bedenke Neumutation und unvollständige Penetranz.':`Mehrere Erbgänge sind vereinbar: <b>${okc.map(x=>x.nm).join(', ')}</b>. Der Stammbaum allein entscheidet nicht eindeutig.`}</div></div>`;
  // Genotypen
  ensureGeno(); const inf=S.genoInf;
  h+=`<div class="card"><h2>3. Genotypen bestimmen</h2><p class="lead">Wähle einen Erbgang. Die App rechnet exakt nach den Mendelschen Regeln (Bayes über den ganzen Stammbaum).</p>
  <div class="seg" role="group" aria-label="Erbgang für die Berechnung" style="flex-wrap:wrap">${MODES.map(m=>`<button type="button" data-act="setmode" data-m="${m.k}" aria-pressed="${S.mode===m.k}">${m.k}</button>`).join('')}</div>
  <p class="note" style="margin-top:6px"><b>${MODEN[S.mode].nm}.</b> ${legendAllele(S.mode)}</p>
  <label class="fl" for="qsel">Wie häufig ist das Merkmalsallel in der Bevölkerung? (gilt für Personen ohne Eltern im Stammbaum)</label>
  <select id="qsel" data-f="q">${QOPT.map(([v,t])=>`<option value="${v}" ${v===S.q?'selected':''}>${t}</option>`).join('')}</select>
  <div class="btnrow"><button type="button" class="btn" data-act="togeno" aria-pressed="${S.showGeno}">Genotypen im Stammbaum anzeigen</button></div>`;
  if(!inf||!inf.ok) h+=`<div class="fb no">Mit „${MODEN[S.mode].nm}“ ist der Stammbaum nicht vereinbar. ${esc((inf&&inf.why)||'')}</div>`;
  else h+=`<div class="tscroll"><table class="tbl"><thead><tr><th>Person</th><th>Merkmal</th><th>Genotyp (Wahrscheinlichkeit)</th></tr></thead><tbody>${personList().filter(id=>inf.post[id]).map(id=>{ const p=M.P[id]; const post=inf.post[id].filter(x=>x.p>5e-4); const sure=post.length===1; return `<tr><td>${esc(nmOf(id))}</td><td>${STTXT[p.st]}</td><td>${sure?`<b>${gh(S.mode,p.sex,post[0].g)}</b> sicher`:post.map(x=>`${gh(S.mode,p.sex,x.g)} ${ptxt(x.p)}`).join(' · ')}</td></tr>`; }).join('')}</tbody></table></div><p class="note">Eingeklammerte Brüche sind exakt, gerundete Prozentwerte folgen der gewählten Allelhäufigkeit.</p>`;
  h+='</div>';
  // Risiko
  const cps=Object.values(M.C); 
  h+=`<div class="card"><h2>4. Risiko für ein weiteres Kind</h2>`;
  if(!cps.length) h+='<p>Es gibt noch kein Paar im Stammbaum.</p>';
  else{ if(!S.riskC||!M.C[S.riskC]) S.riskC=cps[0].id;
    h+=`<label class="fl" for="rsel">Paar</label><select id="rsel" data-f="risk">${cps.map(c=>`<option value="${c.id}" ${c.id===S.riskC?'selected':''}>${esc(nmOf(c.a))} und ${esc(nmOf(c.b))}</option>`).join('')}</select>`;
    let rk=null; try{ rk=riskForCouple(M,S.riskC,S.mode,S.q); }catch(e){ rk={err:e.message}; }
    h+=`<p class="note">Rechnung für: ${MODEN[S.mode].nm} (oben unter 3. wählbar).</p>`;
    if(!rk) h+=`<div class="fb no">Mit diesem Erbgang nicht vereinbar.</div>`;
    else if(rk.err) h+=`<div class="fb tip">${esc(rk.err)}</div>`;
    else{
      const cb=rk.comb.slice().sort((a,b)=>b.w-a.w); const fS=M.P[rk.fa], mS=M.P[rk.mo];
      h+=`<p><b>Mögliche Genotypen des Paares:</b></p><ul class="plain">${cb.map(x=>`<li>${S.mode==='MT'?'':`Vater ${gh(S.mode,fS.sex,x.fg)}, `}${S.mode==='Y'?'':`Mutter ${gh(S.mode,mS.sex,x.mg)}`} : ${ptxt(x.w)}</li>`).join('')}</ul>`;
      const sx=rk.sexes; const lines=[];
      if(sx.x) lines.push(`Kind ist betroffen: <b>${ptxt(sx.x.pa)}</b>`+((S.mode==='AR')?` · Kind ist Überträger (Aa): ${ptxt(sx.x.pc)}`:''));
      else { lines.push(`Sohn ist betroffen: <b>${ptxt(sx.m.pa)}</b>`); lines.push(`Tochter ist betroffen: <b>${ptxt(sx.f.pa)}</b>`); if(S.mode==='XR') lines.push(`Tochter ist Überträgerin: ${ptxt(sx.f.pc)}`); }
      h+=`<div class="fb info">${lines.join('<br>')}</div>`;
      if(cb.length===1) h+=`<h3>Kreuzungsschema</h3>${punnettHTML(S.mode,cb[0].fg,cb[0].mg)}`;
      else h+=`<p class="note">Mehrere Genotypen sind für das Paar möglich. Die Wahrscheinlichkeit oben gewichtet sie nach dem Stammbaum.</p>`;
    } }
  h+='</div>';
  // Kreuzungsrechner
  const pd=pdoms(S.pm); if(pd.f&&!pd.f.includes(S.pf)) S.pf=pd.f[0]; if(pd.m&&!pd.m.includes(S.pmg)) S.pmg=pd.m[0];
  h+=`<div class="card"><h2>5. Kreuzungsrechner</h2><p class="lead">Freie Kreuzung, unabhängig vom Stammbaum.</p>
  <div class="seg" role="group" aria-label="Erbgang für den Kreuzungsrechner" style="flex-wrap:wrap">${MODES.map(m=>`<button type="button" data-act="pmode" data-m="${m.k}" aria-pressed="${S.pm===m.k}">${m.k}</button>`).join('')}</div>
  <div class="grid2">${pd.f?`<div><label class="fl" for="pf">Vater</label><select id="pf" data-f="pf">${pd.f.map(g=>`<option value="${g}" ${g===S.pf?'selected':''}>${gtxt(S.pm,'m',g)||'Y'}${aff(S.pm,'m',g)?' (betroffen)':''}</option>`).join('')}</select></div>`:''}
  ${pd.m?`<div><label class="fl" for="pmg">Mutter</label><select id="pmg" data-f="pmg">${pd.m.map(g=>`<option value="${g}" ${g===S.pmg?'selected':''}>${gtxt(S.pm,'f',g)}${aff(S.pm,'f',g)?' (betroffen)':''}</option>`).join('')}</select></div>`:''}</div>
  <p class="note">${legendAllele(S.pm)}</p>${punnettHTML(S.pm,S.pf,S.pmg)}</div>`;
  // Begründung
  const txt=musterBegruendung(M,lay,S.mode,an,inf&&inf.ok?inf:null);
  h+=`<div class="card"><h2>6. Begründung formulieren</h2><p class="lead">So könnte eine vollständige Antwort in einer Klausur aussehen (für den oben gewählten Erbgang: ${MODEN[S.mode].nm}). Prüfe jeden Satz selbst und formuliere in eigenen Worten.</p><pre style="white-space:pre-wrap;font-family:var(--body);background:var(--panel-2);border-radius:12px;padding:10px 14px;margin:0;overflow-wrap:anywhere">${esc(txt)}</pre>
  <div class="btnrow"><button type="button" class="btn" data-act="copytxt">Text kopieren</button><button type="button" class="btn" data-act="copysvg">Stammbaum als SVG kopieren</button></div></div>`;
  $('#pane-analyse').innerHTML=h;
  S._txt=txt;
}

/* =============== Reiter: Üben =============== */
function trInit(modeSel,seed){
  const mode=modeSel==='any'?MODES[Math.floor(mulberry32(seed*13+5)()*6)].k:modeSel;
  const r=genPedigree(mode,seed); S.tr={mode:r.mode,seed,modeSel,truth:r.truth,sel:{},done:false,gq:null,gans:null}; S.trFb=null;
  setModel(r.M); S.caseId=null; S.tr.an=getAn();
}
function trGenoQ(){
  const tr=S.tr; const inf=inferAll(S.M,tr.mode,1e-6,true); if(!inf.ok) return null; const rnd=mulberry32(tr.seed*31+7);
  const cand=Object.keys(inf.post).filter(id=>{ const sure=inf.post[id].filter(x=>x.p>.9995); return sure.length===1&&dom(tr.mode,S.M.P[id].sex).length>1; });
  if(!cand.length) return null; const id=cand[Math.floor(rnd()*cand.length)]; const p=S.M.P[id];
  return {id,opts:dom(tr.mode,p.sex),ans:inf.post[id].find(x=>x.p>.9995).g,inf};
}
function renderTrain(){
  const tr=S.tr; let h=`<div class="card"><h2>Üben mit Zufallsfällen</h2><p class="lead">Die App erzeugt einen Stammbaum zu einem versteckten Erbgang. Bestimme alle möglichen Erbgänge. Mit demselben Startwert bekommen alle in der Klasse denselben Fall.</p>
  <div class="grid2"><div><label class="fl" for="tm">Erbgang des Falls</label><select id="tm" data-f="trmode"><option value="any" ${!tr||tr.modeSel==='any'?'selected':''}>zufällig</option>${MODES.map(m=>`<option value="${m.k}" ${tr&&tr.modeSel===m.k?'selected':''}>${m.nm}</option>`).join('')}</select></div>
  <div><label class="fl" for="ts">Startwert (Zahl)</label><input type="number" id="ts" data-f="trseed" min="1" max="99999" value="${tr?tr.seed:Math.floor(Math.random()*9000)+1}" inputmode="numeric"></div></div>
  <div class="btnrow"><button type="button" class="btn primary" data-act="trnew">Neuer Fall</button><button type="button" class="btn" data-act="trseed">Fall zu diesem Startwert</button>${S.score.n?`<span class="badge">Richtig: ${S.score.ok} von ${S.score.n}</span>`:''}</div></div>`;
  if(tr){
    h+=`<div class="card"><h3 style="margin-top:0">Aufgabe 1: Welche Erbgänge sind möglich?</h3><p class="note">Kreuze alle an, die der Stammbaum nicht ausschließt. Unwahrscheinliche Erbgänge (nur mit einheiratenden Überträgern) gelten als möglich, wenn du sie begründest, und zählen hier nicht als Fehler.</p>
    ${MODES.map(m=>`<label class="ck"><input type="checkbox" data-f="trsel" value="${m.k}" ${tr.sel[m.k]?'checked':''} ${tr.done?'disabled':''}> ${m.nm}</label>`).join('')}
    <div class="btnrow"><button type="button" class="btn primary" data-act="trcheck" ${tr.done?'disabled':''}>Prüfen</button></div>`;
    if(S.trFb) h+=`<div class="fb ${S.trFb.cls}" role="status">${S.trFb.t}</div>`;
    if(tr.done){ const an=tr.an; h+=`<div class="tscroll"><table class="tbl"><tbody>${MODES.map(m=>`<tr><th scope="row">${m.nm}</th><td>${badge(an[m.k])}</td><td>${an[m.k].st==='no'&&an[m.k].viol[0]?esc(an[m.k].viol[0].t):an[m.k].st==='unlikely'?'Nur mit Überträgern unter den Einheiratenden: '+esc(an[m.k].flagged.map(nmOf).join(', ')):''}</td></tr>`).join('')}</tbody></table></div><p class="note">Tatsächlich erzeugt wurde: <b>${MODEN[tr.mode].nm}</b>.</p>`; }
    h+='</div>';
    if(tr.done){
      if(!tr.gq) tr.gq=trGenoQ();
      if(tr.gq){ const q=tr.gq, p=S.M.P[q.id];
        h+=`<div class="card"><h3 style="margin-top:0">Aufgabe 2: Genotyp bestimmen</h3><p>Der Erbgang ist ${MODEN[tr.mode].nm}. Welchen Genotyp hat <b>${esc(nmOf(q.id))}</b> (${STTXT[p.st]}, ${SEXTXT[p.sex]})? <button type="button" class="lk" data-act="hl" data-ids="${q.id}" data-cls="info">Zeigen</button></p><p class="note">${legendAllele(tr.mode)}</p>
        <div class="seg" role="group" aria-label="Genotyp wählen" style="flex-wrap:wrap">${q.opts.map(g=>`<button type="button" data-act="trgeno" data-g="${g}" ${tr.gans!=null?'disabled':''} aria-pressed="${tr.gans===g}">${gh(tr.mode,p.sex,g)}</button>`).join('')}</div>`;
        if(tr.gans!=null){ const ok=tr.gans===q.ans; h+=`<div class="fb ${ok?'ok':'no'}" role="status">${ok?'Richtig.':'Nicht ganz.'} Richtig ist <b>${gh(tr.mode,p.sex,q.ans)}</b>.</div>`; }
        h+='</div>'; }
      h+=`<div class="card"><div class="btnrow"><button type="button" class="btn" data-act="trreveal">Genotypen aller Personen im Stammbaum zeigen</button><button type="button" class="btn" data-act="trnew">Nächster Fall</button></div></div>`;
    }
  }
  $('#pane-train').innerHTML=h;
}

/* =============== Reiter: Info und Aufgaben =============== */
function legendSVG(kind){
  const P={name:'',sex:'m',st:'n',car:false,dead:false,prob:false};
  const mk=o=>`<svg width="64" height="54" viewBox="0 0 64 54" aria-hidden="true">${nodeSVG(Object.assign({},P,o),32,27,{ids:false,names:false})}</svg>`;
  switch(kind){ case 'm': return mk({}); case 'f': return mk({sex:'f'}); case 'ma': return mk({st:'a'}); case 'fa': return mk({sex:'f',st:'a'}); case 'u': return mk({sex:'u'}); case 'car': return mk({sex:'f',car:true}); case 'dead': return mk({dead:true}); case 'prob': return mk({sex:'f',st:'a',prob:true}); case 'unk': return mk({st:'u'});
    case 'cp': return '<svg width="64" height="54" viewBox="0 0 64 54" aria-hidden="true"><line x1="4" y1="27" x2="60" y2="27" style="stroke:var(--ink);stroke-width:2"/></svg>';
    case 'cons': return '<svg width="64" height="54" viewBox="0 0 64 54" aria-hidden="true"><line x1="4" y1="24.4" x2="60" y2="24.4" style="stroke:var(--ink);stroke-width:2"/><line x1="4" y1="29.6" x2="60" y2="29.6" style="stroke:var(--ink);stroke-width:2"/></svg>';
    case 'kids': return '<svg width="64" height="54" viewBox="0 0 64 54" aria-hidden="true"><path d="M32 4 V24 M12 24 H52 M12 24 V48 M52 24 V48" style="stroke:var(--ink);stroke-width:2;fill:none"/></svg>'; }
}
const LEG=[['m','Mann, nicht betroffen'],['f','Frau, nicht betroffen'],['ma','Mann, betroffen (gefüllt)'],['fa','Frau, betroffen (gefüllt)'],['u','Geschlecht unbekannt (Raute)'],['unk','Merkmal unbekannt (Fragezeichen)'],['car','Überträgerin (Punkt)'],['dead','verstorben (Schrägstrich)'],['prob','Proband(in) (Pfeil, hier betroffen)'],['cp','Paar (Verbindungslinie)'],['cons','Verwandtenehe (Doppellinie)'],['kids','Kinder (Geschwisterlinie)']];
const GLOS=[
 ['Stammbaum (Pedigree)','Grafische Darstellung der Verwandtschaft und eines Merkmals über mehrere Generationen. Generationen werden mit römischen Zahlen nummeriert, Personen von links nach rechts mit arabischen Zahlen (zum Beispiel II-3).'],
 ['Proband(in)','Die Person, bei der die Untersuchung der Familie begonnen hat. Im Stammbaum mit einem Pfeil markiert.'],
 ['Merkmalsträger(in)','Person, die das untersuchte Merkmal zeigt (Phänotyp). Im Stammbaum gefüllt gezeichnet.'],
 ['Überträger(in), Konduktorin','Person, die ein rezessives Allel trägt, ohne das Merkmal zu zeigen (heterozygot, bei X-chromosomalen Merkmalen meist Frauen).'],
 ['homozygot, heterozygot, hemizygot','Gleiche Allele (AA, aa), verschiedene Allele (Aa). Hemizygot: nur ein Allel vorhanden, zum Beispiel bei Männern für X-chromosomale Gene (XaY).'],
 ['autosomal, gonosomal','Autosomal: Gen liegt auf einem Körperchromosom. Gonosomal: Gen liegt auf einem Geschlechtschromosom (X oder Y).'],
 ['dominant, rezessiv','Dominantes Allel prägt das Merkmal auch bei Heterozygotie aus. Rezessives Allel zeigt sich nur bei Homozygotie (oder Hemizygotie).'],
 ['mitochondriale Vererbung','Mitochondrien mit eigener DNA stammen fast nur aus der Eizelle. Das Merkmal wird nur über die Mutter weitergegeben. Realistisch gibt es oft Heteroplasmie, hier wird vereinfacht.'],
 ['Verwandtenehe (Konsanguinität)','Ehe zwischen Blutsverwandten, zum Beispiel Cousin und Cousine. Beide können dasselbe seltene Allel von gemeinsamen Vorfahren geerbt haben.'],
 ['Penetranz','Anteil der Genträger, die das Merkmal tatsächlich zeigen. Bei unvollständiger Penetranz kann ein Genträger gesund sein. Die App nimmt vollständige Penetranz an.'],
 ['Expressivität','Wie stark das Merkmal bei Genträgern ausgeprägt ist. Sie kann auch innerhalb einer Familie schwanken.'],
 ['Neumutation','Neu entstandene Veränderung im Erbgut. Sie kann ein betroffenes Kind gesunder Eltern erklären, auch bei dominanten Merkmalen. Die App schließt Neumutationen aus.'],
 ['Allelhäufigkeit q','Anteil eines Allels im Genpool. Bei seltenen Merkmalen ist q klein, daher sind Überträger unter Einheiratenden unwahrscheinlich.']
];
const ITASKS=[
 {afb:'I',t:'Symbole nennen',p:3,op:'Nenne',text:'Nenne die Bedeutung der folgenden Symbole im Stammbaum: ausgefülltes Quadrat, Kreis mit Punkt, Doppellinie zwischen zwei Personen.',load:null,sol:['Ausgefülltes Quadrat: betroffener Mann (1 P).','Kreis mit Punkt: Überträgerin, klinisch gesund (1 P).','Doppellinie: Verwandtenehe (1 P).']},
 {afb:'I',t:'Hinweise sammeln',p:4,op:'Beschreibe',text:'Beschreibe an Fall A, in welchen Generationen das Merkmal auftritt und wie die betroffenen Personen verwandt sind.',load:'A',sol:['Betroffen sind Karl (I), Peter (II) sowie Tom und Nina (III) (2 P).','Das Merkmal tritt in drei Generationen auf, jedes betroffene Kind hat einen betroffenen Elternteil (2 P).']},
 {afb:'II',t:'Erbgang bestimmen und begründen',p:8,op:'Bestimme … und begründe',text:'Bestimme den Erbgang in Fall B und begründe, warum andere Erbgänge ausgeschlossen sind.',load:'B',sol:['Autosomal-rezessiv (2 P).','Gesunde Eltern haben eine betroffene Tochter, die Eltern sind heterozygot (2 P).','Dominanter Erbgang ausgeschlossen, weil gesunde Eltern ein betroffenes Kind haben (1 P).','X-chromosomal-rezessiv ausgeschlossen, weil die betroffene Tochter einen gesunden Vater hat (2 P).','Mitochondrial und Y-chromosomal ausgeschlossen (betroffene Frau, gesunde Mutter) (1 P).']},
 {afb:'II',t:'Genotypen ermitteln',p:7,op:'Ermittle',text:'Ermittle in Fall D die Genotypen von Karl, Rosa, Greta und Lena. Begründe jeweils kurz.',load:'D',sol:['Karl ist betroffen: XaY (1 P).','Rosa ist die Mutter des betroffenen Karl, ihr Mann Emil ist gesund (XAY): Rosa ist XAXa (2 P).','Greta ist die Mutter von Lukas, ihr Mann Jan ist gesund: XAXa (2 P).','Lena erhält von ihrem betroffenen Vater Karl das Xa und von Petra ein XA (Petra ist Einheiratende ohne Hinweis auf Überträgerschaft): XAXa (2 P).']},
 {afb:'II',t:'Wahrscheinlichkeiten berechnen',p:6,op:'Berechne',text:'Berechne für Fall B die Wahrscheinlichkeit, dass Hans Überträger ist, und das Risiko, dass ein weiteres Kind von Wilhelm und Berta betroffen ist.',load:'B',sol:['Wilhelm und Berta sind Aa × Aa (1 P).','Das Risiko für ein weiteres Kind beträgt 1/4 (25 %) (2 P).','Hans ist gesund: AA, Aa oder Aa. Wahrscheinlichkeit für Überträger 2/3 (≈ 67 %) (3 P).']},
 {afb:'III',t:'Entscheidbarkeit beurteilen',p:7,op:'Beurteile',text:'Beurteile an Fall H, ob der Erbgang eindeutig bestimmt werden kann. Nenne eine Information, die die Entscheidung ermöglichen würde.',load:'H',sol:['Zwei betroffene Söhne gesunder Eltern: rezessiv, dominante Vererbung ausgeschlossen (2 P).','Autosomal-rezessiv und X-chromosomal-rezessiv sind mit dem Stammbaum vereinbar, eine eindeutige Zuordnung ist nicht möglich (3 P).','Entscheidende Zusatzinformation, zum Beispiel: eine betroffene Tochter gesunder Eltern (autosomal) oder ein Gentest der Mutter (2 P).']},
 {afb:'III',t:'Eigene Familiengeschichte entwickeln',p:8,op:'Entwickle',text:'Entwickle eine Familiengeschichte über drei Generationen, bei der nur ein Erbgang übrig bleibt (Schreibauftrag S5). Erzeuge den Stammbaum und begründe, warum die anderen Erbgänge ausgeschlossen sind.',load:'story',sol:['Stammbaum ist formal korrekt (Paare, Kinder, drei Generationen) (2 P).','Mindestens ein Erbgang wird mit einer konkreten Beobachtung im Stammbaum eindeutig ausgeschlossen, zum Beispiel „betroffene Tochter, gesunder Vater“ (3 P).','Begründung nennt die Personen und die Vererbungsregel (3 P).']},
 {afb:'III',t:'Grenzen der Methode beurteilen',p:6,op:'Beurteile',text:'Beurteile die Aussagekraft einer Stammbaumanalyse. Gehe auf unvollständige Penetranz, Neumutation, kleine Stammbäume und den Datenschutz ein.',load:null,sol:['Unvollständige Penetranz kann Genträger gesund erscheinen lassen und dominante Merkmale „überspringen“ lassen (1 P).','Neumutationen erklären betroffene Kinder gesunder Eltern, ohne dass die Eltern Überträger sind (1 P).','Kleine Stammbäume erlauben oft mehrere Erbgänge; Muster können zufällig entstehen (2 P).','Familiäre Gesundheitsdaten sind sensibel; genetische Beratung und Diagnostik gehören in ärztliche Hände (2 P).']}
];
function renderInfo(){
  let h=`<div class="card"><h2>Symbole im Stammbaum</h2><div class="legend">${LEG.map(([k,t])=>`<div>${legendSVG(k)}<span>${t}</span></div>`).join('')}</div></div>`;
  h+=`<div class="card"><h2>Begriffe</h2><dl class="gl">${GLOS.map(([t,d])=>`<dt>${esc(t)}</dt><dd>${esc(d)}</dd>`).join('')}</dl></div>`;
  h+=`<div class="card"><h2>Annahmen und Grenzen der App</h2><ul class="plain"><li>Vollständige Penetranz: Wer das Genotyp-Merkmal trägt, zeigt es auch.</li><li>Keine Neumutationen und keine Verwechslung der Vaterschaft.</li><li>Mitochondrial: Alle Mitochondrien einer Person sind gleich (Homoplasmie).</li><li>Eine Person hat höchstens einen Partner und ein Elternpaar. Zwillinge und mehrere Partner sind nicht vorgesehen.</li><li>Genotypen werden exakt berechnet. Personen ohne Eltern im Stammbaum erhalten die Allelhäufigkeit q als Vorwissen.</li><li>Die Wahl „Schulannahme“ setzt q so klein, dass Einheiratende praktisch nie das Allel tragen.</li><li>Die Fälle sind didaktisch konstruiert. Die Zuordnung der Krankheitsbeispiele zu Erbgängen ist vereinfacht.</li><li>Das ist ein Lernwerkzeug und keine genetische Beratung.</li></ul></div>`;
  h+=`<div class="card"><h2>Aufgaben</h2><p class="note">Die Punktzahlen sind ein Vorschlag. Notengebung und Bewertungsmaßstab richten sich nach den Beschlüssen eurer Fachkonferenz.</p>`;
  ITASKS.forEach((t,i)=>{ h+=`<details class="task"><summary><span class="badge">AFB ${t.afb}</span>${i+1}. ${esc(t.t)} <span class="badge">${t.p} P</span></summary><p><b>${t.op}:</b> ${esc(t.text)}</p>${t.load?`<div class="btnrow"><button type="button" class="btn" data-act="itask" data-load="${t.load}">${t.load==='story'?'Zum Schreibauftrag':'Fall '+t.load+' laden'}</button></div>`:''}<details><summary style="cursor:pointer;min-height:40px;display:flex;align-items:center;font-weight:700">Erwartungshorizont</summary><div class="sol"><ul class="plain">${t.sol.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></details></details>`; });
  h+='</div>';
  h+=`<div class="card"><details class="teacher"><summary>Hinweise für die Lehrkraft</summary>
  <p><b>Einsatz:</b> Einstieg mit Fall B (Hypothesentest in Partnerarbeit), Vertiefung mit Fall C und H (Verwandtenehe, Grenzen), Transfer mit Schreibauftrag und Zufallsfällen. Mit gleichem Startwert bekommt die Lerngruppe denselben Fall.</p>
  <p><b>Typische Fehlvorstellungen:</b> „Dominant heißt häufig“; „Rezessive Merkmale überspringen immer eine Generation“; „Ein X-chromosomales Merkmal kann vom Vater auf den Sohn kommen“; „Überträger sind krank“. Die App begründet Ausschlüsse mit konkreten Personen und hilft, diese Vorstellungen zu klären.</p>
  <p><b>Einordnung:</b> Die Zuordnung zu Kompetenzbereichen (Fachwissen, Erkenntnisgewinnung, Kommunikation, Bewertung) und zu den Themenschwerpunkten des Zentralabiturs musst du am aktuellen Kerncurriculum und an den Vorgaben auf nibis.de prüfen.</p>
  <p><b>Bewertung:</b> Die Punktevorschläge sind unverbindlich. Notengebung bleibt deine Verantwortung und folgt den Fachkonferenzbeschlüssen.</p>
  <p><b>Datenschutz:</b> Die App speichert nichts. Lasse Lernende keine echten Familien oder Gesundheitsdaten eintragen.</p></details></div>`;
  $('#pane-info').innerHTML=h;
}

/* =============== Steuerung =============== */
function renderTab(){ ({cases:renderCases,build:renderBuild,story:renderStory,analyse:renderAnalyse,train:renderTrain,info:renderInfo}[S.tab])(); }
function showTab(t){
  S.tab=t; S.hl={}; S.delArm=null; $$('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  ['cases','build','story','analyse','train','info'].forEach(k=>{ $('#pane-'+k).hidden=k!==t; });
  renderViewer(); renderTab();
}
function selectP(id,focus){ S.sel=id; S.delArm=null; renderViewer(); if(S.tab==='build') renderBuild(); if(focus){ const el=$(`[data-p="${id}"]`); if(el) el.focus(); } }
function loadCase(id){ const c=CASEI[id]; const r=parseStory(c.story); S.caseId=id; S.story=c.story; S.slog=r; setModel(r.M); }

document.addEventListener('click',e=>{
  const nd=e.target.closest('#svgHost .nd'); if(nd){ selectP(nd.dataset.p,false); return; }
  const v=e.target.closest('[data-v]'); if(v){ const k=v.dataset.v;
    if(k==='zin') S.zoom=Math.min(2.4,S.zoom*1.2); else if(k==='zout') S.zoom=Math.max(.4,S.zoom/1.2); else if(k==='fit') fitZoom();
    else if(k==='names') S.names=!S.names;
    else if(k==='geno'){ S.showGeno=!S.showGeno; if(S.showGeno){ computeGeno(); S.gkey=S.mode+'|'+S.q; } }
    else if(k==='fold'){ const c=$('#viewer').classList.toggle('collapsed'); v.setAttribute('aria-pressed',c); v.textContent=c?'▼':'▲'; }
    renderViewer(); if(S.tab==='analyse'&&k==='geno') renderAnalyse(); return; }
  const tb=e.target.closest('.tab'); if(tb){ showTab(tb.dataset.tab); return; }
  const a=e.target.closest('[data-act]'); if(!a) return; const act=a.dataset.act; const sel=S.sel;
  switch(act){
    case 'loadcase': loadCase(a.dataset.id); break;
    case 'tipcheck': { const c=CASEI[S.caseId]; const t=S.tip[c.id]||{}; if(!t.k){ S.tip[c.id]={k:null,fb:{cls:'tip',t:'Wähle zuerst einen Erbgang.'}}; } else { t.fb=checkTip(c,t.k); S.tip[c.id]=t; if(t.fb.ids) S.hl=Object.fromEntries(t.fb.ids.map(i=>[i,t.fb.cls==='no'?'bad':'info'])); } renderViewer(); renderCases(); break; }
    case 'solshow': S.solOpen[S.caseId]=!S.solOpen[S.caseId]; renderCases(); break;
    case 'goto': showTab(a.dataset.tab); break;
    case 'hl': { const ids=a.dataset.ids.split(',').filter(Boolean); setHl(ids,a.dataset.cls||'bad'); break; }
    case 'undo': undo(); break; case 'redo': redo(); break;
    case 'autonames': mut(M=>autoNames(M)); break;
    case 'selfirst': { const id=personList()[0]; if(id) selectP(id); break; }
    case 'desel': S.sel=null; S.delArm=null; renderViewer(); renderBuild(); break;
    case 'setsex': mut(M=>{ M.P[sel].sex=a.dataset.val; }); break;
    case 'setst': mut(M=>{ M.P[sel].st=a.dataset.val; if(a.dataset.val==='a') M.P[sel].car=false; }); break;
    case 'addpartner': mut(M=>{ const p=M.P[sel]; const o=addP(M,{sex:p.sex==='m'?'f':p.sex==='f'?'m':'u'}); addC(M,sel,o); S.sel=o; }); break;
    case 'addson': case 'adddaughter': mut(M=>{ let c=coupleOf(M,sel); if(!c){ const p=M.P[sel]; const o=addP(M,{sex:p.sex==='m'?'f':p.sex==='f'?'m':'u'}); c=M.C[addC(M,sel,o)]; } const k=addP(M,{sex:act==='addson'?'m':'f'}); addKid(M,c.id,k); S.sel=k; }); break;
    case 'addparents': mut(M=>{ const f=addP(M,{sex:'m'}), m=addP(M,{sex:'f'}); const c=addC(M,f,m); addKid(M,c,sel); }); break;
    case 'addbro': case 'addsis': mut(M=>{ const p=M.P[sel]; const c=M.C[p.cp]; const k=addP(M,{sex:act==='addbro'?'m':'f'}); addKid(M,c.id,k,c.kids.indexOf(sel)+1); S.sel=k; }); break;
    case 'left': case 'right': mut(M=>{ const c=M.C[M.P[sel].cp]; const i=c.kids.indexOf(sel), j=act==='left'?i-1:i+1; if(j>=0&&j<c.kids.length){ [c.kids[i],c.kids[j]]=[c.kids[j],c.kids[i]]; } }); break;
    case 'swap': mut(M=>{ const c=coupleOf(M,sel); c.sw=!c.sw; }); break;
    case 'cons': mut(M=>{ const c=coupleOf(M,sel); c.cons=!c.cons; }); break;
    case 'del': S.delArm=sel; renderBuild(); break;
    case 'delno': S.delArm=null; renderBuild(); break;
    case 'delgo': S.delArm=null; mut(M=>{ delPerson(M,sel); if(!Object.keys(M.P).length) addP(M,{sex:'f',name:''}); }); break;
    case 'parse': doParse($('#st-text').value); if(S.tab==='story') renderStory(); break;
    case 'verb': { const t=verbalize(S.M); S.story=t; S.slog=null; renderStory(); break; }
    case 'stclear': S.story=''; S.slog=null; S.wfb=null; renderStory(); break;
    case 'snip': { const ta=$('#st-text'); S.story=ta.value+(ta.value&&!/\s$/.test(ta.value)?' ':'')+SNIP[+a.dataset.i][1]; renderStory(); break; }
    case 'wcheck': { const r=doParse($('#st-text').value); const w=WTASKS.find(x=>x.id===S.wsel); if(!r.stats.p){ S.wfb=['Aus dem Text konnte kein Stammbaum erzeugt werden. Schau ins Protokoll und in die Schreibhilfe.']; } else { const an=getAn(); S.wfb=w.chk(S.M,an,S.lay); } renderStory(); break; }
    case 'setmode': S.mode=a.dataset.m; S.genoInf=null; if(S.showGeno){ computeGeno(); S.gkey=S.mode+'|'+S.q; } renderViewer(); if(S.tab==='analyse') renderAnalyse(); break;
    case 'togeno': S.showGeno=!S.showGeno; if(S.showGeno){ computeGeno(); S.gkey=S.mode+'|'+S.q; } renderViewer(); renderAnalyse(); break;
    case 'pmode': S.pm=a.dataset.m; renderAnalyse(); break;
    case 'copytxt': copyText(S._txt||'',a); break;
    case 'copysvg': copyText(renderSVG(S.M,S.lay,{inline:true,names:true,zoom:1}),a); break;
    case 'trnew': { const ms=$('#tm')?$('#tm').value:'any'; const seed=Math.floor(Math.random()*9000)+1; trInit(ms,seed); showTab('train'); break; }
    case 'trseed': { const ms=$('#tm').value, seed=Math.max(1,Math.min(99999,parseInt($('#ts').value,10)||1)); trInit(ms,seed); showTab('train'); break; }
    case 'trcheck': { const tr=S.tr, an=tr.an; const okSet=MODES.filter(m=>an[m.k].st==='ok').map(m=>m.k); const unl=MODES.filter(m=>an[m.k].st==='unlikely').map(m=>m.k); const pick=MODES.filter(m=>tr.sel[m.k]).map(m=>m.k);
      const miss=okSet.filter(k=>!pick.includes(k)); const wrong=pick.filter(k=>an[k].st==='no'); S.score.n++;
      let ok=!miss.length&&!wrong.length; if(ok) S.score.ok++; tr.done=true;
      let t=ok?'Richtig. Du hast alle vereinbaren Erbgänge erkannt und keinen ausgeschlossenen gewählt.':'Nicht ganz. ';
      if(miss.length) t+=`Noch vereinbar: ${miss.map(k=>MODEN[k].nm).join(', ')}. `; if(wrong.length) t+=`Ausgeschlossen, aber angekreuzt: ${wrong.map(k=>MODEN[k].nm).join(', ')} (Begründung siehe Tabelle). `;
      S.trFb={cls:ok?'ok':'no',t:esc(t)}; renderTrain(); break; }
    case 'trgeno': { const tr=S.tr; tr.gans=a.dataset.g; S.score.n++; if(tr.gans===tr.gq.ans) S.score.ok++; renderTrain(); break; }
    case 'trreveal': { S.mode=S.tr.mode; S.showGeno=true; computeGeno(); S.gkey=S.mode+'|'+S.q; renderViewer(); break; }
    case 'itask': { const l=a.dataset.load; if(l==='story'){ showTab('story'); S.wsel='S5'; renderStory(); } else { loadCase(l); showTab('cases'); } break; }
  }
});
document.addEventListener('keydown',e=>{
  const nd=e.target.closest&&e.target.closest('#svgHost .nd'); if(nd&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); selectP(nd.dataset.p,true); }
});
document.addEventListener('input',e=>{
  const t=e.target; const f=t.dataset&&t.dataset.f; if(!f) return;
  if(f==='name'&&S.sel){ if(!S.nameSnap) S.nameSnap=clone(S.M); S.M.P[S.sel].name=t.value; S.an=null; renderViewer(); }
  else if(f==='story') S.story=t.value;
});
document.addEventListener('change',e=>{
  const t=e.target; const f=t.dataset&&t.dataset.f; if(!f) return;
  switch(f){
    case 'name': if(S.nameSnap){ S.hist.push(S.nameSnap); S.fut=[]; S.nameSnap=null; relayoutKeep(); } break;
    case 'car': case 'dead': case 'prob': mut(M=>{ M.P[S.sel][f]=t.checked; if(f==='prob'&&t.checked) Object.values(M.P).forEach(p=>{ if(p.id!==S.sel) p.prob=false; }); }); break;
    case 'tmpl': if(t.value){ if(t.value==='one'){ const M=emptyModel(); addP(M,{sex:'f',name:'Anna'}); setModel(M); } else { const r=parseStory(TMPL[t.value]); setModel(r.M); } S.caseId=null; renderTab(); } break;
    case 'stex': if(t.value){ S.story=CASEI[t.value].story; S.slog=null; renderStory(); } break;
    case 'wsel': S.wsel=t.value; S.wfb=null; renderStory(); break;
    case 'q': S.q=parseFloat(t.value); S.genoInf=null; if(S.showGeno){ computeGeno(); S.gkey=S.mode+'|'+S.q; } renderViewer(); renderAnalyse(); break;
    case 'risk': S.riskC=t.value; renderAnalyse(); break;
    case 'pf': S.pf=t.value; renderAnalyse(); break;
    case 'pmg': S.pmg=t.value; renderAnalyse(); break;
    case 'tip': { const c=CASEI[S.caseId]; S.tip[c.id]={k:t.value,fb:null}; renderCases(); break; }
    case 'trsel': S.tr.sel[t.value]=t.checked; break;
    case 'trmode': break;
  }
});
function relayoutKeep(){ const keep=S.sel; relayout(); S.sel=keep; renderViewer(); if(S.tab==='build') renderBuild(); }

/* =============== Start =============== */
(function init(){
  loadCase('B'); S.caseId='B'; showTab('cases');
  window.addEventListener('resize',()=>{ });
})();
})();
</script>
