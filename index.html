<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lehrraum</title>
    <meta name="description" content="Quiz, Abstimmungen, Lernangebote und Werkzeuge für den Unterricht" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="gemeinsam/tokens.css" />
    <link rel="stylesheet" href="gemeinsam/grundlage.css" />
    <link rel="stylesheet" href="startseite.css" />
    <script src="gemeinsam/design.js"></script>
  </head>
  <body>
    <header class="kopfleiste">
      <div class="kopfleiste-innen">
        <h1 class="marke"><a href="./" id="titel">Lehrraum</a></h1>
        <nav class="hauptnavigation" aria-label="Hauptnavigation">
          <ul id="navigation"></ul>
        </nav>
        <button type="button" class="rund-knopf" id="design-knopf" aria-label="Zum dunklen Modus wechseln"></button>
      </div>
    </header>

    <main class="inhalt">
      <p id="untertitel" class="untertitel"></p>

      <section class="mitmachen" id="mitmachen" aria-labelledby="mitmachen-titel">
        <h2 id="mitmachen-titel">Mitmachen</h2>
        <form id="pin-form" class="pin-form" novalidate>
          <label for="pin">PIN vom Beamer</label>
          <input id="pin" type="text" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="123456" aria-describedby="pin-fehler" />
          <div class="pin-knoepfe">
            <button class="knopf" type="button" data-ziel="quiz">Zum Quiz</button>
            <button class="knopf" type="button" data-ziel="abstimmung">Zur Abstimmung</button>
          </div>
          <p id="pin-fehler" class="fehler" role="alert" hidden></p>
        </form>
      </section>

      <section id="interaktion" aria-labelledby="links-titel">
        <h2 id="links-titel">Schnellstart</h2>
        <ul id="links" class="kacheln"></ul>
      </section>

      <section aria-labelledby="werkzeuge-titel" class="werkzeuge" id="werkzeuge-bereich">
        <h2 id="werkzeuge-titel">Werkzeuge</h2>
        <ul id="werkzeuge" class="werkzeug-liste"></ul>
      </section>

      <section aria-labelledby="material-titel" class="material" id="material-bereich">
        <div class="material-kopf">
          <h2 id="material-titel">Materialien</h2>
          <label class="suche">
            <span class="unsichtbar">Materialien durchsuchen</span>
            <input id="suche" type="search" placeholder="Suchen …" autocomplete="off" />
          </label>
        </div>
        <div id="faecher" class="faecher" role="group" aria-label="Nach Fach filtern"></div>
        <div id="materialien"></div>
      </section>
    </main>

    <footer class="fuss">
      <p>Diese Seite setzt keine Cookies und lädt nichts von fremden Servern. Einstellungen merkt sich nur dieses Gerät.</p>
      <p><a href="impressum.html">Impressum &amp; Datenschutz</a></p>
    </footer>

    <dialog id="qr-dialog" aria-labelledby="qr-titel">
      <h2 id="qr-titel"></h2>
      <div id="qr-bild"></div>
      <p id="qr-adresse"></p>
      <button type="button" id="qr-schliessen" class="knopf">Schließen</button>
    </dialog>

    <script src="gemeinsam/symbole.js"></script>
    <script src="js/inhalte.js"></script>
    <script src="js/qrcode.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
