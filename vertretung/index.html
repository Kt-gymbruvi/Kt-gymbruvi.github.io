<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vertretung</title>
    <meta name="description" content="Rätsel und Spiele für Vertretungsstunden: Sudoku, Slitherlink, Einstein-Rätsel, Vier gewinnt, Mühle und Schach" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <script src="../gemeinsam/design.js"></script>
    <link rel="stylesheet" href="../gemeinsam/tokens.css" />
    <link rel="stylesheet" href="../gemeinsam/grundlage.css" />
    <link rel="stylesheet" href="../lernen/lernen.css" />
    <link rel="stylesheet" href="vertretung.css" />
  </head>
  <body>
    <header class="navleiste">
      <div class="navleiste-innen">
        <a class="zurueck" href="../" aria-label="Zurück zur Startseite Lehrraum"><span id="zurueck-symbol" aria-hidden="true">‹</span>Lehrraum</a>
        <span class="navleiste-titel" aria-hidden="true">Vertretung</span>
        <button class="rund-knopf" id="design-knopf" type="button" aria-label="Hell oder dunkel umschalten"></button>
      </div>
    </header>

    <main class="lernen">
      <nav class="baum" id="baum" aria-label="Nach Art filtern"></nav>
      <section class="spalte" aria-labelledby="ueberschrift">
        <div class="kopfzeile">
          <div class="titelblock">
            <p class="pfad" id="pfad"></p>
            <h1 id="ueberschrift">Vertretung</h1>
            <p class="einleitung" id="einleitung">Rätsel und Spiele, die man ohne Vorbereitung und ohne Fachwissen mit einer Klasse machen kann – am Beamer gemeinsam oder am Handy und Tablet allein. Es wird nichts gespeichert.</p>
          </div>
          <button class="knopf zweit klein" id="qr-auswahl" type="button" title="QR-Code zu dieser Auswahl für den Beamer">QR zu dieser Auswahl</button>
        </div>
        <div class="werkzeugleiste">
          <label class="suchfeld">
            <span class="unsichtbar">Angebote durchsuchen</span>
            <span id="such-symbol"></span>
            <input id="suche" type="search" placeholder="Suchen, z. B. Schach, Rätsel, online …" autocomplete="off" />
          </label>
        </div>
        <div class="karten" id="karten"></div>
      </section>
    </main>

    <dialog id="qr-dialog" aria-labelledby="qr-titel">
      <h2 id="qr-titel"></h2>
      <div id="qr-bild"></div>
      <p id="qr-adresse"></p>
      <button type="button" id="qr-schliessen" class="knopf">Schließen</button>
    </dialog>

    <script src="../gemeinsam/symbole.js"></script>
    <script src="angebote.js"></script>
    <script src="../js/qrcode.min.js"></script>
    <script src="vertretung.js"></script>
  </body>
</html>
