function init3D(){
  if(typeof THREE==='undefined') return false;
  let renderer;
  try{renderer=new THREE.WebGLRenderer({canvas:$('#c'),antialias:true});}catch(e){return false;}
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(42,1,.1,200);
  Object.assign(R3,{renderer,scene,camera});
  applySky();
  scene.add(new THREE.HemisphereLight(0xfff4e0,0x5d7d4c,.95));
  const sun=new THREE.DirectionalLight(0xffffff,.75);
  sun.position.set(9,20,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
  Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20,near:1,far:70});
  scene.add(sun);

  // track: hairpin like the board (29 fields + finish), two corners at 12 and 15
  const S=1.95,X=3.1,zb=11.5,pts=[];
  for(let i=0;i<=12;i++) pts.push(new THREE.Vector3(X,0,zb-(12-i)*S));
  pts.push(new THREE.Vector3(X/3,0,zb));pts.push(new THREE.Vector3(-X/3,0,zb));
  for(let j=15;j<=29;j++) pts.push(new THREE.Vector3(-X,0,zb-(j-15)*S));
  pts.push(new THREE.Vector3(-X,0,zb-15*S-.25));
  const head=pts.map((p,i)=>{const a=pts[Math.max(0,i-1)],b=pts[Math.min(T,i+1)];const d=i===0?pts[1].clone().sub(p):i===T?p.clone().sub(pts[T-1]):b.clone().sub(a);return Math.atan2(d.x,d.z);});
  head[12]=Math.atan2(-1,1);head[15]=Math.atan2(-1,-1);
  R3.pts=pts;R3.head=head;G.K2=15;
  const size=1.78;R3.size=size;

  // ground
  const gtex=canvasTex(256,256,(g,w,h)=>{for(let i=0;i<8;i++){g.fillStyle=i%2?'#8cc96f':'#7dbb63';g.fillRect(0,i*32,w,32);}for(let k=0;k<420;k++){g.fillStyle=Math.random()<.5?'rgba(255,255,255,.07)':'rgba(0,40,0,.06)';g.fillRect(Math.random()*w,Math.random()*h,2,3);}});
  gtex.wrapS=gtex.wrapT=THREE.RepeatWrapping;gtex.repeat.set(9,9);
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(90,90),new THREE.MeshStandardMaterial({map:gtex,roughness:1}));
  ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
  // dark track bed like a board
  const bedM=new THREE.MeshStandardMaterial({color:0x2b1b3d,roughness:.9});
  const bed=(x,z,w,d)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,.12,d),bedM);m.position.set(x,.06,z);m.receiveShadow=true;scene.add(m);};
  bed(X,(pts[0].z+pts[12].z)/2,size+.5,pts[12].z-pts[0].z+size+.5);
  bed(-X,(pts[15].z+pts[30].z)/2,size+.5,pts[15].z-pts[30].z+size+.5);
  bed(0,zb,2*X+size+.5,size+.5);
  // infield plate with the track name
  R3.plate=new THREE.Mesh(new THREE.BoxGeometry(2*X-size-.7,.1,pts[12].z-pts[0].z-.4),new THREE.MeshStandardMaterial({color:0x6a4a8c,roughness:.9}));
  R3.plate.position.set(0,.05,(pts[0].z+pts[12].z)/2-.6);R3.plate.receiveShadow=true;scene.add(R3.plate);

  // arches
  const side=new THREE.MeshStandardMaterial({color:0x2b1b3d,roughness:.8});
  R3.side=side;
  const arch=(i,text,checkered)=>{
    const p=pts[i],h=head[i],px=Math.cos(h),pz=-Math.sin(h),w=size*.62;
    const postM=new THREE.MeshStandardMaterial({color:0x2b1b3d,roughness:.6});
    for(const sg of [-1,1]){const post=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,2.6,10),postM);post.position.set(p.x+px*w*sg,1.3,p.z+pz*w*sg);post.castShadow=true;scene.add(post);}
    const bt=canvasTex(256,64,(g,W,H)=>{if(checkered){const q=16;for(let y=0;y<H/q;y++)for(let x=0;x<W/q;x++){g.fillStyle=(x+y)%2?'#2b1b3d':'#fff6e3';g.fillRect(x*q,y*q,q,q);}g.fillStyle='#f4b728';g.fillRect(64,10,128,44);}else{g.fillStyle='#e0457b';g.fillRect(0,0,W,H);}g.fillStyle='#2b1b3d';g.font='800 38px \"Bricolage Grotesque\", sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(text,W/2,H/2+3);});
    const bm=new THREE.MeshStandardMaterial({map:bt});
    const beam=new THREE.Mesh(new THREE.BoxGeometry(w*2+.3,.5,.14),[postM,postM,postM,postM,bm,bm]);
    beam.position.set(p.x,2.5,p.z);beam.rotation.y=h+Math.PI/2;beam.castShadow=true;scene.add(beam);
  };
  arch(0,'START',false);arch(T,'ZIEL',true);
  // curve signs
  [[12,'Kurve 1',1],[15,'Kurve 2',-1]].forEach(([i,label,sg])=>{
    const p=pts[i];
    const tex=canvasTex(128,64,(g,W,H)=>{g.fillStyle='#fff6e3';g.fillRect(0,0,W,H);g.strokeStyle='#2b1b3d';g.lineWidth=6;g.strokeRect(3,3,W-6,H-6);g.fillStyle='#2b1b3d';g.font='800 26px \"Bricolage Grotesque\", sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(label,W/2,H/2+2);});
    const x=p.x+sg*1.55,z=p.z+1.45;
    const post=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,1.3,8),side);post.position.set(x,.65,z);scene.add(post);
    const tm=new THREE.MeshStandardMaterial({map:tex});
    const board=new THREE.Mesh(new THREE.BoxGeometry(.95,.48,.06),[side,side,side,side,tm,tm]);
    board.position.set(x,1.35,z);board.castShadow=true;scene.add(board);
  });
  // podium between start and finish
  const pz0=pts[T].z-1.2;
  R3.podium=[[0,.62],[-1.05,.42],[1.05,.24]].map(([sx,hgt])=>{
    const v=new THREE.Vector3(sx,hgt,pz0);
    const b=new THREE.Mesh(new THREE.BoxGeometry(1,hgt,1),new THREE.MeshStandardMaterial({color:sx===0?0xf4b728:sx<0?0xd5d8e0:0xd98b4a,roughness:.6}));
    b.position.set(sx,hgt/2,pz0);b.castShadow=true;b.receiveShadow=true;scene.add(b);
    return v;
  });
  const pf=pts[T],tx=0,tz=0;

  // trees
  let seed=7;const rr=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const trunkM=new THREE.MeshStandardMaterial({color:0x8a5a3c,roughness:.9});
  const leafM=[0x3f9a5a,0x56b06a,0x2f7d4a].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.85,flatShading:true}));
  let placed=0;
  for(let k=0;k<200&&placed<26;k++){
    const x=(rr()-.5)*36,z=(rr()-.5)*40-3;
    if(Math.abs(x)<X+size+1.2&&z>pts[30].z-3&&z<zb+size+1) continue;
    const t=new THREE.Group();const s=.7+rr()*.7;
    const tr=new THREE.Mesh(new THREE.CylinderGeometry(.1,.14,.6,6),trunkM);tr.position.y=.3;t.add(tr);
    if(rr()<.5){const c=new THREE.Mesh(new THREE.ConeGeometry(.6,1.3,7),leafM[placed%3]);c.position.y=1.15;t.add(c);}
    else{const c=new THREE.Mesh(new THREE.IcosahedronGeometry(.62,0),leafM[placed%3]);c.position.y=1.05;t.add(c);}
    t.children.forEach(m=>m.castShadow=true);
    t.position.set(x,0,z);t.scale.setScalar(s);scene.add(t);placed++;
  }
  buildTiles();
  resize();addEventListener('resize',resize);
  setupPointer();
  requestAnimationFrame(loop);
  return true;
}
function buildTiles(){
  if(!R3.scene) return;
  if(R3.tiles) R3.scene.remove(R3.tiles);
  const grp=new THREE.Group();R3.tiles=grp;
  const wild=G.side==='wild',size=R3.size,side=R3.side;
  const TC=['#f2552c','#e979c0','#f4a62a','#3a9a4a','#5b8fe0'];
  const geo=new THREE.BoxGeometry(size,.3,size);
  const checker=canvasTex(128,128,(g,w)=>{const n=8,q=w/n;for(let y=0;y<n;y++)for(let x=0;x<n;x++){g.fillStyle=(x+y)%2?'#2b1b3d':'#fff6e3';g.fillRect(x*q,y*q,q,q);}});
  R3.pts.forEach((p,i)=>{
    let topMat;
    if(i===T) topMat=new THREE.MeshStandardMaterial({map:checker,roughness:.7});
    else{
      const fx=wild?WILD[i]:null;
      const col=i===0?'#5b8fe0':TC[i%5];
      const tex=canvasTex(128,128,(g,w,h)=>{
        g.fillStyle=col;g.fillRect(0,0,w,h);
        g.strokeStyle='rgba(43,27,61,.45)';g.lineWidth=6;g.strokeRect(5,5,w-10,h-10);
        g.textAlign='center';g.textBaseline='middle';
        if(fx&&fx.t==='arrow'){
          g.fillStyle=fx.n>0?'#9fe3a0':'#ffb0b8';g.fillRect(12,12,w-24,h-24);
          g.save();g.translate(w/2,h/2);g.rotate(Math.PI-R3.head[i]+(fx.n<0?Math.PI:0));
          g.fillStyle='#2b1b3d';g.beginPath();g.moveTo(0,-48);g.lineTo(34,-10);g.lineTo(13,-10);g.lineTo(13,40);g.lineTo(-13,40);g.lineTo(-13,-10);g.lineTo(-34,-10);g.closePath();g.fill();
          g.fillStyle='#fff6e3';g.font='800 34px \"Bricolage Grotesque\", sans-serif';g.fillText(String(Math.abs(fx.n)),0,14);g.restore();
        }else if(fx&&fx.t==='upsi'){
          g.fillStyle='#fff6e3';g.beginPath();g.moveTo(w/2,16);g.lineTo(w-16,h-22);g.lineTo(16,h-22);g.closePath();g.fill();
          g.strokeStyle='#2b1b3d';g.lineWidth=6;g.stroke();
          g.fillStyle='#2b1b3d';g.font='800 54px \"Bricolage Grotesque\", sans-serif';g.fillText('!',w/2,h/2+14);
        }else if(fx&&fx.t==='star'){
          g.fillStyle='#ffe066';g.strokeStyle='#2b1b3d';g.lineWidth=6;g.beginPath();
          for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rad=k%2?22:50;g.lineTo(w/2+Math.cos(a)*rad,h/2+Math.sin(a)*rad);}
          g.closePath();g.fill();g.stroke();
          g.fillStyle='#2b1b3d';g.font='800 30px \"Bricolage Grotesque\", sans-serif';g.fillText('1',w/2,h/2+6);
        }else{
          g.fillStyle='#2b1b3d';
          g.font=i===0?'800 36px \"Bricolage Grotesque\", sans-serif':'800 58px \"Bricolage Grotesque\", sans-serif';
          if(i===0||i%5===0) g.fillText(i===0?'START':String(i),w/2,h/2+4);
          else{g.globalAlpha=.35;g.font='800 34px \"Bricolage Grotesque\", sans-serif';g.fillText(String(i),w/2,h/2+4);g.globalAlpha=1;}
        }
      });
      topMat=new THREE.MeshStandardMaterial({map:tex,roughness:.75});
    }
    const m=new THREE.Mesh(geo,[side,side,topMat,side,side,side]);
    m.position.set(p.x,.27,p.z);m.receiveShadow=true;
    grp.add(m);
  });
  const pt=canvasTex(512,128,(g,W,H)=>{g.fillStyle=wild?'#3f2a5c':'#4f7d3e';g.fillRect(0,0,W,H);g.fillStyle='#fff6e3';g.font='800 64px \"Bricolage Grotesque\", sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(SIDES[G.side],W/2,H/2+4);});
  const pm=new THREE.Mesh(new THREE.PlaneGeometry(10,2.5),new THREE.MeshStandardMaterial({map:pt,roughness:.9}));
  pm.rotation.x=-Math.PI/2;pm.rotation.z=Math.PI/2;pm.position.set(0,.11,R3.plate.position.z);
  grp.add(pm);
  R3.plate.material.color.set(wild?0x3f2a5c:0x4f7d3e);
  R3.scene.add(grp);
}
function applySky(){
  if(!R3.scene) return;
  const sky=getComputedStyle(document.documentElement).getPropertyValue('--sky').trim()||'#9fd9d3';
  R3.scene.background=new THREE.Color(sky);
  R3.scene.fog=new THREE.Fog(sky,40,85);
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applySky);
function resize(){
  if(!R3.renderer) return;
  const w=innerWidth,h=innerHeight;
  R3.renderer.setSize(w,h,false);R3.camera.aspect=w/h;R3.camera.updateProjectionMatrix();
}

const SHAPE={ball:{y:.46,front:.38},egg:{y:.56,front:.33},pill:{y:.62,front:.28},cone:{y:.5,front:.22},box:{y:.38,front:.35},tall:{y:1.13,front:.24},blob:{y:.38,front:.48},big:{y:.66,front:.5}};
function makeFig(r){
  const d=r.def,g=new THREE.Group(),body=new THREE.Group();g.add(body);
  const mat=new THREE.MeshStandardMaterial({color:d.c,roughness:.5});
  const add=(geo,x,y,z,m=mat,sx=1,sy=1,sz=1)=>{const me=new THREE.Mesh(geo,m);me.position.set(x,y,z);me.scale.set(sx,sy,sz);me.castShadow=true;me.userData.r=r;body.add(me);return me;};
  let top=1;
  switch(d.s){
    case 'ball':add(new THREE.SphereGeometry(.42,24,18),0,.48,0);top=.92;break;
    case 'egg':add(new THREE.SphereGeometry(.37,24,18),0,.55,0,mat,1,1.38,1);top=1.06;break;
    case 'pill':add(new THREE.CylinderGeometry(.3,.3,.5,20),0,.55,0);add(new THREE.SphereGeometry(.3,20,14),0,.8,0);add(new THREE.SphereGeometry(.3,20,14),0,.3,0);top=1.12;break;
    case 'cone':add(new THREE.ConeGeometry(.44,1,22),0,.52,0);top=1.04;break;
    case 'box':{const b=add(new THREE.BoxGeometry(.7,.7,.7),0,.4,0);b.rotation.y=.02;top=.77;break;}
    case 'tall':add(new THREE.CylinderGeometry(.22,.3,.95,18),0,.52,0);add(new THREE.SphereGeometry(.28,20,14),0,1.13,0);top=1.42;break;
    case 'blob':add(new THREE.SphereGeometry(.46,24,16),0,.36,0,mat,1.22,.76,1.22);top=.72;break;
    case 'big':add(new THREE.SphereGeometry(.56,24,18),0,.62,0);top=1.2;break;
  }
  const sh=SHAPE[d.s];
  const white=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.3}),black=new THREE.MeshStandardMaterial({color:0x1a1024,roughness:.3});
  for(const sx of [-1,1]){
    add(new THREE.SphereGeometry(.105,14,10),sx*.13,sh.y,sh.front,white);
    add(new THREE.SphereGeometry(.055,10,8),sx*.13,sh.y,sh.front+.075,black);
  }
  const footM=new THREE.MeshStandardMaterial({color:0x2b1b3d,roughness:.7});
  for(const sx of [-1,1]) add(new THREE.SphereGeometry(.11,10,8),sx*.17,.06,.06,footM,1,.6,1.3);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.5,.06,8,28),new THREE.MeshStandardMaterial({color:PCOL[r.owner],roughness:.4}));
  ring.rotation.x=Math.PI/2;ring.position.y=.03;g.add(ring);
  const bt=canvasTex(128,128,(c,w,h)=>{c.beginPath();c.arc(64,64,56,0,Math.PI*2);c.fillStyle='#fffaf0';c.fill();c.lineWidth=12;c.strokeStyle=PCOL[r.owner];c.stroke();c.font='64px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(d.e,64,70);});
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:bt,depthTest:true}));
  sp.scale.set(.62,.62,.62);sp.position.y=top+.42;g.add(sp);
  g.scale.setScalar(.85);
  return {g,body,top:top*.85,busy:false,ring};
}
function clearFigs(){
  if(!R3.scene) return;
  for(const r of G.racers) if(r.fig){R3.scene.remove(r.fig.g);r.fig=null;}
  if(R3.attract){R3.attract.forEach(f=>R3.scene.remove(f.r.fig.g));R3.attract=null;}
}
function attract(){
  if(!R3.scene) return;
  const ds=shuffle(RACERS.slice()).slice(0,8);
  R3.attract=ds.map((d,i)=>{const r=mkRacer(d,i%6);r.pos=[0,2,5,9,13,18,23,27][i];r.fig=makeFig(r);R3.scene.add(r.fig.g);return {r};});
  R3.attract.forEach(({r})=>r.fig.g.position.copy(slotPosFor(r,R3.attract.map(a=>a.r))));
  CAM.mode='over';G.focus=null;
}
function slotPosFor(r,list){
  const v=new THREE.Vector3();
  if(!R3.pts) return v;
  if(r.fin){
    const k=r.place-1;
    if(k<3){v.copy(R3.podium[k]);return v;}
    const p=R3.podium[2];v.set(p.x+.9*(k-2),0,p.z);return v;
  }
  if(r.out){if(r.fig) v.copy(r.fig.g.position);return v;}
  const grp=list.filter(x=>!x.fin&&!x.out&&x.pos===r.pos),n=grp.length,k=grp.indexOf(r);
  const p=R3.pts[Math.min(r.pos,T)],h=R3.head[Math.min(r.pos,T)];
  let ox=0,oz=0;
  if(n>1){const rad=n<=3?R3.size*.24:R3.size*.32;const a=k/n*Math.PI*2+h;ox=Math.cos(a)*rad;oz=Math.sin(a)*rad;}
  v.set(p.x+ox,.42,p.z+oz);
  return v;
}
const slotPos=r=>slotPosFor(r,G.racers);
async function hopTo(r,p){
  r.pos=p;
  const f=r.fig;
  if(!f||TEST||!R3.renderer) return;
  const from=f.g.position.clone(),to=slotPos(r);
  f.busy=true;sfx('hop');
  await tween(230,t=>{f.g.position.lerpVectors(from,to,t);f.g.position.y=from.y+(to.y-from.y)*t+Math.sin(Math.PI*t)*.75;});
  f.busy=false;
}

/* bubbles */
const bubbles=[];
function bubble(r,text,cls=''){
  if(TEST||!r||!r.fig||!R3.renderer) return;
  const el=document.createElement('div');el.className='bub '+cls;el.textContent=text;
  $('#bubs').appendChild(el);
  const stack=bubbles.filter(b=>b.r===r).length;
  bubbles.push({el,r,t:0,stack});
}

/* pointer: orbit, zoom, tap */
function setupPointer(){
  const c=$('#c'),ptrs=new Map();let moved=0,pinch0=0,zoom0=1;
  c.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;c.setPointerCapture(e.pointerId);
    if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);zoom0=CAM.zoom;}});
  c.addEventListener('pointermove',e=>{
    const p=ptrs.get(e.pointerId);if(!p) return;
    const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
    if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0) CAM.zoom=Math.min(2.2,Math.max(.45,zoom0*pinch0/d));return;}
    CAM.yaw-=dx*.008;CAM.pitch=Math.min(1.35,Math.max(.4,CAM.pitch+dy*.005));
  });
  const up=e=>{
    if(ptrs.size===1&&moved<8) tapAt(e.clientX,e.clientY);
    ptrs.delete(e.pointerId);if(ptrs.size<2) pinch0=0;
  };
  c.addEventListener('pointerup',up);c.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);});
  c.addEventListener('wheel',e=>{e.preventDefault();CAM.zoom=Math.min(2.2,Math.max(.45,CAM.zoom*(1+e.deltaY*.0012)));},{passive:false});
}
function tapAt(x,y){
  if(!G.racers.length||$('#panel').hidden) return;
  const ray=new THREE.Raycaster(),v=new THREE.Vector2(x/innerWidth*2-1,-(y/innerHeight)*2+1);
  ray.setFromCamera(v,R3.camera);
  const objs=[];G.racers.forEach(r=>{if(r.fig&&r.fig.g.visible) r.fig.body.children.forEach(m=>objs.push(m));});
  const hit=ray.intersectObjects(objs,false)[0];
  if(hit&&hit.object.userData.r) renderList(hit.object.userData.r);
}

/* render loop */
let lastT=performance.now();
const tmpV=new THREE.Vector3(),focusV=new THREE.Vector3();
function damp(a,b,k,dt){return a+(b-a)*(1-Math.exp(-k*dt));}
function dampAngle(a,b,k,dt){let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return a+d*(1-Math.exp(-k*dt));}
function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i];tw.t+=dt*1000;const k=Math.min(1,tw.t/tw.d);tw.fn(ease(k));
    if(k>=1){tweens.splice(i,1);tw.res();}
  }
  const list=R3.attract?R3.attract.map(a=>a.r):G.racers;
  for(const r of list){
    const f=r.fig;if(!f) continue;
    if(r.out&&!f.busy){f.g.visible=false;continue;}
    if(!f.busy){
      tmpV.copy(slotPosFor(r,list));
      f.g.position.x=damp(f.g.position.x,tmpV.x,9,dt);f.g.position.y=damp(f.g.position.y,tmpV.y,9,dt);f.g.position.z=damp(f.g.position.z,tmpV.z,9,dt);
    }
    const h=r.fin?R3.head[T]+Math.PI:R3.head[Math.min(r.pos,T)];
    f.g.rotation.y=dampAngle(f.g.rotation.y,r.fin?h:h,7,dt);
    f.body.rotation.z=damp(f.body.rotation.z,r.trip?1.35:0,8,dt);
    const active=G.focus===r;
    f.body.position.y=active?Math.abs(Math.sin(now/170))*.14:(R3.attract?Math.abs(Math.sin(now/300+r.pos))*.06:0);
    f.ring.material.emissive=f.ring.material.emissive||new THREE.Color();
    f.ring.material.emissive.setRGB(active?.35:0,active?.35:0,active?.35:0);
  }
  // camera
  const aspect=innerWidth/innerHeight,portrait=aspect<1;
  if(CAM.mode==='follow'&&G.focus&&G.focus.fig&&!R3.attract){focusV.copy(G.focus.fig.g.position);focusV.y=.4;}
  else focusV.set(0,0,-3.5);
  if(R3.attract) CAM.yaw+=dt*.06;
  const base=(CAM.mode==='follow'&&!R3.attract)?(portrait?13:10):(portrait?66:37);
  const dist=base*CAM.zoom;
  const desired=tmpV.set(focusV.x+Math.sin(CAM.yaw)*Math.cos(CAM.pitch)*dist,focusV.y+Math.sin(CAM.pitch)*dist,focusV.z+Math.cos(CAM.yaw)*Math.cos(CAM.pitch)*dist);
  if(!CAM.pos){CAM.pos=desired.clone();CAM.look=focusV.clone();}
  const kp=2.6,kl=3.4;
  CAM.pos.set(damp(CAM.pos.x,desired.x,kp,dt),damp(CAM.pos.y,desired.y,kp,dt),damp(CAM.pos.z,desired.z,kp,dt));
  CAM.look.set(damp(CAM.look.x,focusV.x,kl,dt),damp(CAM.look.y,focusV.y,kl,dt),damp(CAM.look.z,focusV.z,kl,dt));
  const cam=R3.camera;cam.position.copy(CAM.pos);cam.lookAt(CAM.look);
  const panel=$('#panel'),topb=$('#top');
  const evEl=$('#ev'),ph=(panel.hidden?0:panel.getBoundingClientRect().height+8)+(evEl.hidden?0:evEl.getBoundingClientRect().height+18),th=topb.hidden?0:topb.getBoundingClientRect().height;
  const off=Math.round((ph-th)/2);
  if(off!==R3.off){R3.off=off;if(off) cam.setViewOffset(innerWidth,innerHeight,0,off,innerWidth,innerHeight); else cam.clearViewOffset();}
  // bubbles
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i];b.t+=dt/Math.max(.5,G.speed);
    if(b.t>1.9||!b.r.fig){b.el.remove();bubbles.splice(i,1);continue;}
    tmpV.copy(b.r.fig.g.position);tmpV.y+=b.r.fig.top+.95+b.t*.35;tmpV.project(cam);
    const x=(tmpV.x*.5+.5)*innerWidth,y=(-tmpV.y*.5+.5)*innerHeight-b.stack*28;
    b.el.style.transform=`translate(${x}px,${y}px) translate(-50%,-100%) scale(${b.t<.15?b.t/.15:1})`;
    b.el.style.opacity=b.t>1.5?String(Math.max(0,(1.9-b.t)/.4)):'1';
  }
  R3.renderer.render(R3.scene,cam);
  requestAnimationFrame(loop);
}

/* ---------- wiring ---------- */
$('#bCam').onclick=()=>{CAM.mode=CAM.mode==='follow'?'over':'follow';CAM.zoom=1;if(CAM.mode==='over'){CAM.yaw=0;CAM.pitch=1.1;}else{CAM.yaw=-.55;CAM.pitch=.92;}sfx('click');};
$('#bSnd').onclick=()=>{soundOn=!soundOn;$('#bSnd').textContent=soundOn?'🔊':'🔇';};
$('#bHelp').onclick=showRules;
$('#bExp').onclick=()=>{const k=Object.keys(EXPL);G.explain=k[(k.indexOf(G.explain)+1)%k.length];sfx('click');
  const t=document.createElement('div');t.className='bub';t.textContent=EXPL[G.explain];t.style.cssText='position:fixed;left:50%;top:80px;transform:translateX(-50%);z-index:9';document.body.appendChild(t);setTimeout(()=>t.remove(),1600);};
$('#bLog').onclick=renderLog;
$('#bList').onclick=()=>renderList();
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#pop').hidden) closePop();});
window.onerror=(m,s,l,c,e)=>{G.errors.push(String(m)+' @'+l+':'+c);};
window.onunhandledrejection=e=>{G.errors.push('rej: '+(e.reason&&e.reason.stack||e.reason));};

async function boot(){
  try{await Promise.race([Promise.all([document.fonts.load('800 20px "Bricolage Grotesque"'),document.fonts.load('700 16px "Atkinson Hyperlegible"'),document.fonts.load('400 16px "Atkinson Hyperlegible"')]),new Promise(r=>setTimeout(r,1500))]);}catch(e){}
  if(!TEST){
    const ok=init3D();
    if(!ok) document.body.style.background='var(--bg)';
  }else{
    // headless engine test: no 3D, just geometry for K2
    G.K2=+qs.get('k2')||15;
  }
  if(TEST){
    const n=+qs.get('test')||4;
    G.players=Array.from({length:n},(_,i)=>({name:'CPU'+(i+1),cpu:true}));
    G.speed=0;
    startGame();
    return;
  }
  showSetup();
}
boot();
})();
