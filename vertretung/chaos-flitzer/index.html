<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chaos-Flitzer 3000</title>
<meta name="description" content="Chaos-Flitzer 3000: Würfel-Rennspiel für 2 bis 6 Personen mit verrückten Läufern">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<!-- Schriften liegen im Repo (lernen/schriften), nichts kommt von fremden Servern -->
<link rel="stylesheet" href="../../lernen/schriften/schriften.css">
<script>
/* hell/dunkel wie auf der übrigen Plattform (Auswahl „lehrraum-design“), sonst nach dem Gerät */
try{var d=localStorage.getItem('lehrraum-design');if(d==='hell')document.documentElement.setAttribute('data-theme','light');else if(d==='dunkel')document.documentElement.setAttribute('data-theme','dark');}catch(e){}
</script>
<style>
:root{
  --ink:#2b1b3d;--paper:#fff3dc;--card:#fffaf0;--text:#2b1b3d;--muted:#6b5880;
  --mag:#e0457b;--mus:#f4b728;--tur:#18a6a0;--tom:#f2552c;--vio:#7b5cd6;
  --bg:#a8dcd6;--scrim:rgba(43,27,61,.42);--sky:#9fd9d3;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ink:#0f0a18;--paper:#2b1f40;--card:#362850;--text:#fff1d6;--muted:#cbb8e6;--bg:#1d1532;--scrim:rgba(10,6,18,.62);--sky:#2a2048;color-scheme:dark}
}
:root[data-theme="dark"]{--ink:#0f0a18;--paper:#2b1f40;--card:#362850;--text:#fff1d6;--muted:#cbb8e6;--bg:#1d1532;--scrim:rgba(10,6,18,.62);--sky:#2a2048;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:600;color:var(--text);background:var(--bg);overflow:hidden;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.brand,.btn,.disp{font-family:'Bricolage Grotesque','Arial Rounded MT Bold',sans-serif;font-weight:800;letter-spacing:.01em}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
a.ibtn{text-decoration:none;color:inherit;font-size:24px;line-height:1}
.back{display:inline-block;margin:0 0 6px;color:var(--muted);font-weight:900;font-size:14px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px dashed var(--mag);outline-offset:3px}

/* top bar */
#top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 6px;pointer-events:none}
#top>*{pointer-events:auto}
#top[hidden]{display:none}
.brand{font-size:19px;background:var(--mus);color:#2b1b3d;border:3px solid var(--ink);border-radius:14px;padding:3px 10px 2px;box-shadow:0 4px 0 var(--ink);transform:rotate(-2deg)}
.pill{background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:3px 10px;font-weight:900;font-size:14px;box-shadow:0 3px 0 var(--ink)}
#scores{display:flex;gap:6px;flex-wrap:wrap}
.sc{display:flex;align-items:center;gap:5px;background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:2px 9px 2px 4px;font-weight:900;font-size:13px;box-shadow:0 3px 0 var(--ink)}
.sc b{font-family:'Bricolage Grotesque','Arial Rounded MT Bold',sans-serif;font-weight:800;font-size:15px}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);flex:none;vertical-align:-2px}
.sp{flex:1}
.ibtn{width:40px;height:40px;border-radius:12px;border:3px solid var(--ink);background:var(--card);font-size:17px;box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

/* bottom panel */
#panel{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,calc(100% - 16px));margin-bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:5;background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:12px 12px 10px}
#who{display:flex;gap:12px;align-items:flex-start;min-height:56px}
.who-e{flex:none;width:56px;height:56px;border-radius:16px;border:3px solid var(--ink);background:var(--rc);display:grid;place-items:center;font-size:30px;box-shadow:0 3px 0 var(--ink)}
.who-n{font-family:'Bricolage Grotesque','Arial Rounded MT Bold',sans-serif;font-weight:800;font-size:21px;line-height:1.05}
.who-p{font-size:13px;color:var(--muted);font-weight:800;margin:2px 0 3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.who-t{font-size:14px;line-height:1.35;max-width:62ch}
#actions{margin-top:10px;display:flex;flex-direction:column;gap:8px}
#actions:empty{display:none}
.q{font-weight:900;font-size:15px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.wait{font-weight:800;color:var(--muted);font-size:14px}
.pfoot{display:flex;align-items:center;gap:8px;margin-top:10px;border-top:2px dashed color-mix(in srgb,var(--ink) 30%,transparent);padding-top:8px}
#lastlog{flex:1;font-size:13px;line-height:1.35;min-height:18px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mini{border:2px solid var(--ink);background:var(--paper);border-radius:10px;padding:5px 9px;font-weight:900;font-size:13px;flex:none}
.nm{font-weight:900;white-space:nowrap}
.nm i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:1px;border:1.5px solid var(--ink)}

/* buttons */
.btn{border:3px solid var(--ink);border-radius:14px;background:#0f7b76;color:#fff;font-size:17px;padding:9px 15px 8px;box-shadow:0 4px 0 var(--ink);line-height:1.1;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--mag)}
.btn.warm{background:var(--mus);color:#2b1b3d}
.btn.ghost{background:var(--card);color:var(--text)}
.btn.big{font-size:21px;padding:12px 22px 11px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* overlays */
.ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--scrim)}
.ov[hidden]{display:none}
.sheet{width:min(1000px,100%);max-height:100%;overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:20px 20px 0;-webkit-overflow-scrolling:touch}
.sheet.narrow{width:min(560px,100%)}
.sheet h2{font-size:28px;margin:0 0 4px}
.sub{margin:0 0 12px;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stick{position:sticky;bottom:0;background:linear-gradient(to top,var(--paper) 70%,transparent);padding:14px 0 16px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}

/* title */
.title{font-size:clamp(46px,11vw,92px);line-height:.86;margin:4px 0 10px;color:var(--mus);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--mag),8px 8px 0 var(--tur);transform:rotate(-2.5deg);transform-origin:left}
.title span{color:var(--mag);text-shadow:4px 4px 0 var(--mus),8px 8px 0 var(--ink)}
.lead{font-size:17px;line-height:1.45;max-width:58ch;margin:14px 0 18px}
.prow{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.prow input{flex:1;min-width:120px;font:inherit;font-weight:800;font-size:16px;padding:9px 12px;border:3px solid var(--ink);border-radius:12px;background:var(--card);color:var(--text)}
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:8px 11px;font-weight:900;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
/* dunkel: sonst steht dunkle Schrift auf dunkler Fläche */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:var(--mus);color:#2b1b3d}}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--mus);color:#2b1b3d}
.xbtn{width:38px;height:38px;border-radius:10px;border:3px solid var(--ink);background:var(--card);font-weight:900}
.settings{display:flex;flex-wrap:wrap;gap:14px 22px;margin:16px 0 4px;align-items:center}
.settings label{display:flex;align-items:center;gap:8px;font-weight:900;font-size:14px}
.settings input[type=number]{width:58px;font:inherit;font-weight:900;padding:6px 8px;border:3px solid var(--ink);border-radius:10px;background:var(--card);color:var(--text)}
.fine{font-size:13px;color:var(--muted);margin:6px 0 0;max-width:70ch;line-height:1.4}

/* racer cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;padding-bottom:6px}
.rc{position:relative;text-align:left;display:flex;flex-direction:column;border:3px solid var(--ink);border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--ink);padding:0;overflow:hidden;transition:transform .1s}
.rc-top{display:flex;align-items:center;gap:8px;background:var(--rc);padding:8px 10px;border-bottom:3px solid var(--ink)}
.rc-e{font-size:28px;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.rc-n{font-family:'Bricolage Grotesque','Arial Rounded MT Bold',sans-serif;font-weight:800;font-size:17px;color:#2b1b3d;line-height:1.05;background:rgba(255,255,255,.78);padding:2px 7px;border-radius:8px}
.rc-t{font-size:13px;line-height:1.38;padding:8px 10px 10px;color:var(--text)}
.rc.sel{transform:translateY(-4px);box-shadow:0 8px 0 var(--mag);border-color:var(--mag)}
.rc.sel::after{content:'✓';position:absolute;top:6px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--mag);color:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-weight:900}
.rc.taken{opacity:.35;pointer-events:none}
.teams{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 14px;font-size:14px;font-weight:800}
.team{display:flex;align-items:center;gap:6px}
.team .em{font-size:18px;letter-spacing:1px}

/* results */
.res{display:flex;flex-direction:column;gap:8px;margin:10px 0 16px}
.resrow{display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;box-shadow:0 3px 0 var(--ink)}
.resrow .pl{font-family:'Bricolage Grotesque','Arial Rounded MT Bold',sans-serif;font-weight:800;font-size:24px;width:38px;text-align:center}
.resrow .pt{margin-left:auto;font-family:'Bricolage Grotesque','Arial Rounded MT Bold',sans-serif;font-weight:800;font-size:20px}
.tbl{width:100%;border-collapse:separate;border-spacing:0 6px;margin:4px 0 8px}
.tbl td{background:var(--card);border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);padding:8px 10px;font-weight:900}
.tbl td:first-child{border-left:3px solid var(--ink);border-radius:12px 0 0 12px}
.tbl td:last-child{border-right:3px solid var(--ink);border-radius:0 12px 12px 0;text-align:right;font-family:'Bricolage Grotesque','Arial Rounded MT Bold',sans-serif;font-weight:800;font-size:20px;font-weight:400}
.win{font-size:clamp(34px,8vw,60px);margin:6px 0 4px;color:var(--mus);-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--mag)}

/* list / log */
.lst{display:flex;flex-direction:column;gap:8px;padding-bottom:16px}
.li{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:8px 10px}
.li .e{font-size:26px;width:38px;height:38px;border-radius:10px;border:2px solid var(--ink);display:grid;place-items:center;background:var(--rc);flex:none}
.li .n{font-weight:900}
.li .s{font-size:13px;color:var(--muted);font-weight:800}
.li .t{font-size:13px;line-height:1.35;margin-top:2px}
.logl{font-size:14px;line-height:1.45;padding:6px 0;border-bottom:2px dashed color-mix(in srgb,var(--ink) 25%,transparent)}
.rules p,.rules li{font-size:15px;line-height:1.5;max-width:70ch}
.rules ul{padding-left:20px;margin:6px 0 12px}
.rules h3{font-size:20px;margin:14px 0 4px}

/* dice */
#dice{position:fixed;left:50%;top:26%;transform:translateX(-50%);z-index:6;display:flex;gap:18px;pointer-events:none;perspective:700px;transition:opacity .25s}
#dice.hide{opacity:0}
.die{width:64px;height:64px;position:relative;transform-style:preserve-3d}
.face{position:absolute;inset:0;background:#fffaf0;border:3px solid #2b1b3d;border-radius:14px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:7px;backface-visibility:hidden}
.pip{width:11px;height:11px;border-radius:50%;background:#2b1b3d;place-self:center}
.dlab{position:absolute;top:74px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:'Bricolage Grotesque','Arial Rounded MT Bold',sans-serif;font-weight:800;font-size:15px;color:#2b1b3d;background:var(--mus);border:2px solid #2b1b3d;border-radius:8px;padding:1px 7px}

/* event card */
#ev{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--ph,180px) + env(safe-area-inset-bottom,0px) + 18px);width:min(520px,calc(100% - 24px));z-index:8}
#ev[hidden]{display:none}
.ev{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink);overflow:hidden;animation:evIn .28s cubic-bezier(.2,.9,.3,1.3)}
@keyframes evIn{from{transform:translateY(24px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.ev-h{display:flex;gap:12px;align-items:center;padding:12px 14px 10px;background:var(--rc);border-bottom:3px solid var(--ink)}
.ev-e{flex:none;width:52px;height:52px;border-radius:14px;border:3px solid var(--ink);background:#fffaf0;display:grid;place-items:center;font-size:30px;box-shadow:0 3px 0 var(--ink)}
.ev-k{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#2b1b3d;opacity:.8}
.ev-t{font-family:'Bricolage Grotesque','Arial Rounded MT Bold',sans-serif;font-weight:800;font-size:22px;line-height:1.05;color:#2b1b3d;background:rgba(255,255,255,.75);display:inline-block;padding:2px 8px;border-radius:8px;margin-top:2px}
.ev-b{padding:12px 16px 4px;display:flex;flex-direction:column;gap:7px}
.ev-l{font-size:14px;line-height:1.4;padding-left:10px;border-left:3px solid transparent;color:var(--muted)}
.ev-l .nm{white-space:normal}
.ev-l.now{font-size:16px;font-weight:800;color:var(--text);border-left-color:var(--tur)}
.ev-why{margin:6px 16px 0;padding:8px 10px;border-radius:12px;background:var(--paper);border:2px dashed color-mix(in srgb,var(--ink) 35%,transparent);font-size:13px;line-height:1.4;color:var(--muted)}
.ev-why b{color:var(--text)}
.ev-f{display:flex;align-items:center;gap:10px;padding:12px 14px 14px;justify-content:space-between;flex-wrap:wrap}
.ev-auto{font-size:13px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:6px}
.ev-bar{height:5px;background:var(--tur);transform-origin:left;transform:scaleX(0)}
.ev-bar.run{animation:evBar linear forwards}
@keyframes evBar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.ev{animation:none}}
/* Handys als Mitspieler */
.hbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:10px 0 4px;padding:12px;border:3px dashed color-mix(in srgb,var(--ink) 40%,transparent);border-radius:18px;background:var(--card)}
.hqr{flex:none;width:150px;height:150px;background:#fff;border-radius:12px;padding:6px;border:3px solid var(--ink)}
.hqr svg{display:block;width:100%;height:100%}
.hcode{font-size:34px;letter-spacing:.14em;line-height:1.1}
.hnames{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.hnames span{border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:1px 9px;font-weight:900;font-size:13px}
.prow input[readonly]{opacity:.75}
/* bubbles */#bubs{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.bub{position:absolute;left:0;top:0;font-family:'Bricolage Grotesque','Arial Rounded MT Bold',sans-serif;font-weight:800;font-size:15px;color:#2b1b3d;background:var(--mus);border:2.5px solid #2b1b3d;border-radius:12px;padding:3px 9px 2px;white-space:nowrap;box-shadow:0 3px 0 #2b1b3d;will-change:transform}
.bub.good{background:#9fe3a0}.bub.bad{background:#ffb0b8}.bub.gold{background:#ffe066}
@media (prefers-reduced-motion:reduce){.rc,.btn{transition:none}}
@media (max-width:560px){
  .brand{font-size:16px}
  .who-e{width:46px;height:46px;font-size:24px}
  .who-n{font-size:18px}
  .who-t{font-size:13px}
  .sheet{padding:16px 14px 0;border-radius:22px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
}
</style>
</head>
<body>
<canvas id="c" aria-label="3D-Rennstrecke" tabindex="-1"></canvas>
<div id="bubs" aria-hidden="true"></div>
<header id="top" hidden>
  <a class="ibtn" href="../" title="Zurück zur Vertretung" aria-label="Zurück zur Vertretung">‹</a>
  <div class="brand">Chaos-Flitzer</div>
  <div id="raceLbl" class="pill"></div>
  <div id="scores"></div>
  <span class="sp"></span>
  <button class="ibtn" id="bCam" title="Kamera umschalten" aria-label="Kamera umschalten">🎥</button>
  <button class="ibtn" id="bExp" title="Erklärungen" aria-label="Erklärungen umschalten">💬</button>
  <button class="ibtn" id="bSnd" title="Ton an/aus" aria-label="Ton an oder aus">🔊</button>
  <button class="ibtn" id="bHelp" title="Regeln" aria-label="Regeln">?</button>
</header>
<section id="panel" hidden aria-live="polite">
  <div id="who"></div>
  <div id="actions"></div>
  <div class="pfoot"><div id="lastlog"></div><button class="mini" id="bList">Läufer</button><button class="mini" id="bLog">Protokoll</button></div>
</section>
<div id="dice" class="hide" aria-hidden="true"></div>
<div id="screen" class="ov"></div>
<div id="ev" hidden role="dialog" aria-live="assertive" aria-label="Was passiert gerade"></div>
<div id="pop" class="ov" hidden></div>
<script src="three.min.js"></script>
<script src="../../js/qrcode.min.js"></script>
<script src="../../spielen/echtzeit.js"></script>
<script src="../../spielen/raum.js"></script>
<script>
(()=>{
'use strict';
const qs=new URLSearchParams(location.search);
const TEST=qs.has('test');
const $=s=>document.querySelector(s);
const T=30;
const PCOL=['#e0457b','#18a6a0','#f4b728','#7b5cd6','#f2552c','#3fa34d'];
const RACERS=[
 {id:'klette',n:'Klett-Klara',e:'🐙',c:'#4caf50',s:'egg',r:3,k:'Nachgerückt!',t:'Zieht ein Läufer von meinem Feld los, darf ich danach auf sein neues Feld nachrücken, auch über die Ziellinie.'},
 {id:'skipper',n:'Matrosen-Mo',e:'⚓',c:'#3f6fbf',s:'pill',r:2,k:'Ahoi, ich bin dran!',t:'Würfelt ein anderer Läufer für seinen Hauptzug eine 1, bin ich direkt danach am Zug. Danach geht es ab mir weiter.'},
 {id:'zentaur',n:'Rempel-Rolf',e:'🐂',c:'#d0533a',s:'box',r:4,k:'Rums!',t:'Jeder Läufer, den ich überhole, muss 2 Felder zurück.'},
 {id:'schmodder',n:'Schleim-Sepp',e:'🦠',c:'#9bc53d',s:'blob',r:4,k:'Schleim: −1',t:'Alle anderen Läufer bekommen −1 auf ihren Hauptzug.'},
 {id:'superhirn',n:'Orakel-Olga',e:'🔮',c:'#9a68cf',s:'tall',r:3,k:'Vorhergesehen!',t:'Zu Beginn meines ersten Zugs tippe ich auf den Sieger des Rennens. Gewinnt er, endet das Rennen sofort und ich werde Zweite.'},

/* ---------- utils ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=n=>1+Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sleep=ms=>new Promise(res=>setTimeout(res,TEST?0:ms*G.speed));
const pc=p=>PCOL[p];
const nm=r=>`<span class="nm"><i style="background:${pc(r.owner)}"></i>${r.def.e} ${esc(r.def.n)}</span>`;

const txt=d=>d.t.replace('{K2}',G.K2);

/* ---------- sound ---------- */
let AC=null,soundOn=true;
function sfx(k){
  if(!soundOn||TEST) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const now=AC.currentTime;
    const play=(f,dur,type,t0=0,f2)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,now+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,now+t0+dur);g.gain.setValueAtTime(.07,now+t0);g.gain.exponentialRampToValueAtTime(.001,now+t0+dur);o.connect(g).connect(AC.destination);o.start(now+t0);o.stop(now+t0+dur+.02);};
    if(k==='hop')play(420,.09,'triangle',0,640);
    else if(k==='dice'){for(let i=0;i<5;i++)play(160+Math.random()*120,.04,'square',i*.06);}
    else if(k==='fin'){play(523,.14,'triangle');play(659,.14,'triangle',.12);play(784,.3,'triangle',.24);}
    else if(k==='trig')play(700,.12,'sine',0,980);
    else if(k==='bad')play(300,.22,'sawtooth',0,120);
    else play(600,.05,'triangle');
  }catch(e){}
}

/* ---------- ability core ---------- */
const act=()=>G.racers.filter(r=>!r.fin&&!r.out);
const at=(p,ex)=>act().filter(r=>r.pos===p&&r!==ex);
function ab(r){
  if(!r||r.fin||r.out) return null;
  const id=r.copy||r.base;
  if(id!=='katze') return id;
  let best=null;
  for(const o of act()) if(o!==r&&(!best||o.pos>best.pos)) best=o;
  if(!best||best.pos<r.pos) return 'katze';
  const lid=best.copy||best.base;
  if(lid==='katze'||PRE.has(lid)) return 'katze';
  return lid;
}
const has=(r,id)=>ab(r)===id;
const isCPU=r=>G.players[r.owner].cpu;
const team=(a,b)=>a.owner===b.owner;

function log(html){
  G.log.unshift(html); if(G.log.length>160) G.log.pop();
  G.pend.push(html); if(G.pend.length>8) G.pend.shift();
  if(TEST&&qs.has('trace')) console.log(html.replace(/<[^>]+>/g,''));
  const ll=$('#lastlog'); if(ll) ll.innerHTML=html;
  if(popMode==='log') renderLog();
}

/* ---------- explanations ---------- */
const EXPL={all:'Alles erklären',abil:'Fähigkeiten erklären',off:'Keine Erklärungen'};
const MODS=new Set(['hase','zeppelin','schmodder','coach']);
// kind: 'abil' (ability fires), 'field', 'info' (stand up, finish), 'main' (plain main move), 'mod' (constant modifier)
async function pause(r,kind,o={}){
  const lines=G.pend.splice(0);
  if(TEST||!R3.renderer||G.explain==='off'||G.over&&kind!=='info') return;
  if((kind==='main'||kind==='mod')&&G.explain!=='all') return;
  const ev=$('#ev');
  const def=o.id?D[o.id]:r.def;
  const kick=o.kick||(kind==='abil'?(o.id&&r.base!==o.id?`Fähigkeit (kopiert von ${def.n})`:'Fähigkeit'):kind==='field'?'Spielfeld':kind==='main'?'Hauptzug':'Was passiert');
  const title=o.title||(kind==='abil'||kind==='mod'?def.k:'');
  const shown=lines.slice(-4);
  const why=o.why!==undefined?o.why:(kind==='abil'||kind==='mod'?`<b>${esc(def.n)}:</b> ${esc(txt(def))}`:'');
  const cpuTurn=G.focus&&isCPU(G.focus);
  const remTurn=!!G.players[r.owner].remote;
  const auto=(G.autoCPU&&cpuTurn)||remTurn;
  const prevFocus=G.focus;
  G.focus=r;
  ev.innerHTML=`<div class="ev" style="--rc:${r.def.c}">
    <div class="ev-h"><div class="ev-e">${r.def.e}</div><div><div class="ev-k">${esc(kick)}: ${esc(r.def.n)} <span style="opacity:.75">(${esc(G.players[r.owner].name)})</span></div>${title?`<div class="ev-t">${esc(title)}</div>`:''}</div></div>
    <div class="ev-b">${shown.length?shown.map((l,i)=>`<div class="ev-l ${i===shown.length-1?'now':''}">${l}</div>`).join(''):`<div class="ev-l now">${nm(r)} ist dran.</div>`}</div>
    ${why?`<div class="ev-why">${why}</div>`:''}
    <div class="ev-f"><span class="ev-auto">${auto?'Geht gleich von allein weiter':cpuTurn?'Computerzug':'Tippe OK, wenn alles klar ist'}</span><button class="btn" id="evOk">OK</button></div>
    ${auto?'<div class="ev-bar run" style="animation-duration:4s"></div>':''}
  </div>`;
  ev.style.setProperty('--ph',($('#panel').hidden?0:$('#panel').getBoundingClientRect().height)+'px');
  ev.hidden=false;
  await new Promise(res=>{
    let done=false;const fin=()=>{if(done) return;done=true;clearTimeout(tm);removeEventListener('keydown',key);res();};
    const key=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fin();}};
    addEventListener('keydown',key);
    $('#evOk').onclick=()=>{sfx('click');fin();};
    $('#evOk').focus({preventScroll:true});
    const tm=auto?setTimeout(fin,4000):null;
  });
  ev.hidden=true;ev.innerHTML='';
  G.focus=prevFocus||r;
}

async function trig(src,id,quiet){
  if(!src) return;
  G.stat[id]=(G.stat[id]||0)+1;
  sfx('trig'); bubble(src,(D[id]||src.def).k||'!');
  if(!G.over) await pause(src,quiet?'mod':'abil',{id});
  if(G.over||G.depth>6||++G.budget>400) return;
  for(const x of act().filter(x=>x!==src&&has(x,'rudi'))){
    if(G.over) return;
    const key=x.def.id+'@'+x.pos+'<'+id+'@'+src.pos;
    if(G.seen.has(key)) continue;
    G.seen.add(key);
    G.depth++;
    log(`${nm(x)} rutscht 1 Feld hinterher, weil gerade eine Fähigkeit ausgelöst wurde.`);
    bubble(x,D.rudi.k);
    await pause(x,'abil',{id:'rudi'});
    await move(x,1);
    G.depth--;
  }
}

/* choices: humans get buttons, CPU uses pick function */
function choose(r,title,opts,cpuPick){
  if(!TEST&&G.players[r.owner].remote){
    // Handy-Spieler: Frage geht an sein Handy; fällt das Handy aus, entscheidet der Computer
    renderWho(r);
    return askRemote(r.owner,{art:'wahl',titel:plain(title),optionen:opts.map(o=>({l:plain(o.l),k:o.k||''}))})
      .then(i=>i===null?(cpuPick?cpuPick(opts):opts[0].v):opts[i].v);
  }
  if(isCPU(r)||TEST){
    showWait(r);
    return sleep(420).then(()=>cpuPick?cpuPick(opts):opts[0].v);
  }
  return new Promise(res=>{
    renderWho(r);
    const box=$('#actions');
    box.innerHTML=`<div class="q">${title}</div><div class="opts"></div>`;
    const o=box.querySelector('.opts');
    opts.forEach((op,i)=>{
      const b=document.createElement('button');
      b.className='btn '+(op.k||'');
      b.innerHTML=op.l;
      b.onclick=()=>{box.innerHTML='';sfx('click');res(op.v);};
      o.appendChild(b);
      if(i===0) setTimeout(()=>b.focus({preventScroll:true}),30);
    });
  });
}
function showWait(r){
  const box=$('#actions'); if(!box) return;
  const pl=G.players[r.owner];
  if(pl.remote){
    box.innerHTML=`<div class="wait">${esc(pl.name)} überlegt am Handy … <button class="mini" id="takeover">Computer übernimmt</button></div>`;
    const t=$('#takeover');if(t) t.onclick=()=>remTakeover(r.owner,'vom Spielleiter ersetzt');
  }else box.innerHTML=`<div class="wait">${esc(pl.name)} überlegt …</div>`;
  remStatus(`${pl.name} (${r.def.n}) ist dran.`);
}

/* ---------- movement ---------- */
async function move(r,n,o={}){
  if(G.over||r.fin||r.out||!n) return;
  if(++G.ops>20000){if(TEST) throw new Error('Schleife: '+G.log.slice(0,12).join(' | ').replace(/<[^>]+>/g,''));forceEnd();return;}
  const dir=Math.sign(n),start=r.pos,others=act().filter(x=>x!==r);
  const frog=!o.exact&&has(r,'frosch');
  const pedant=dir>0?others.find(x=>has(x,'besser')):null;
  let left=Math.abs(n),p=start;const path=[];
  while(left>0){
    const q=p+dir;
    if(q<0) break;
    if(q>=T){
      if(pedant&&left>1){
        log(`${nm(r)} bräuchte die genaue Zahl fürs Ziel und bleibt stehen.`);
        await trig(pedant,'besser');
        return;
      }
      p=T;path.push(T);break;
    }
    p=q;path.push(p);
    if(frog&&others.some(x=>x.pos===p)) continue;
    left--;
  }
  if(!path.length) return;
  const fin=path[path.length-1];
  if(frog&&path.length>Math.abs(n)) bubble(r,D.frosch.k);
  const passed=dir>0?others.filter(x=>x.pos>start&&x.pos<fin):[];
  const kl=start>0?others.filter(x=>x.pos===start&&has(x,'klette')):[];
  for(const q of path) await hopTo(r,q);
  if(fin>=T) await finish(r); else await babyCheck(r);
  if(G.over) return;
  if(passed.length){
    const ban=passed.find(x=>has(x,'banane'));
    if(ban&&!r.fin&&!r.out){r.trip=true;log(`${nm(r)} überholt ${nm(ban)} und stolpert.`);await trig(ban,'banane');}
    if(has(r,'zentaur')){
      for(const x of passed){
        if(G.over) return;
        if(x.fin||x.out) continue;
        log(`${nm(r)} rempelt ${nm(x)} 2 Felder zurück.`);
        await trig(r,'zentaur');
        await move(x,-2);
      }
    }
  }
  if(!G.over&&!r.fin&&!r.out) await landed(r);
  for(const k of kl){
    if(G.over) return;
    if(k.fin||k.out||!has(k,'klette')) continue;
    const target=r.fin?T:r.pos;
    if(target===k.pos) continue;
    const yes=await choose(k,`${dn(k.def)}: auf das neue Feld von ${dn(r.def)} nachrücken (Feld ${target})?`,
      [{l:'Nachrücken',v:1},{l:'Bleiben',v:0,k:'ghost'}],()=>target>k.pos?1:0);
    if(G.over) return;
    if(yes&&!k.fin&&!k.out){log(`${nm(k)} rückt nach.`);await trig(k,'klette');await move(k,target-k.pos,{exact:true});}
  }
}

async function babyCheck(r){
  if(G.over||r.pos<=0||r.fin||r.out) return;
  if(has(r,'baby')){
    const here=at(r.pos,r);
    if(here.length){
      log(`${nm(r)} landet bei anderen: alle 1 zurück.`);
      await trig(r,'baby');
      for(const x of here){if(G.over) return; await move(x,-1);}
    }
    return;
  }
  const b=act().find(x=>x!==r&&x.pos===r.pos&&has(x,'baby'));
  if(b){
    log(`${nm(b)} lässt niemanden auf ihr Feld: ${nm(r)} landet eins dahinter.`);
    await trig(b,'baby');
    await hopTo(r,r.pos-1);
    await babyCheck(r);
  }
}

async function landed(r){
  if(G.over||r.pos<=0||r.fin||r.out) return;
  const fx=fieldAt(r.pos);
  if(fx){
    if(fx.t==='arrow'){
      const key='arrow:'+r.def.id+'@'+r.pos;
      if(!G.seen.has(key)){
        G.seen.add(key);
        log(`${nm(r)} landet auf einem Pfeil: ${fx.n>0?'+':'−'}${Math.abs(fx.n)} Felder.`);
        bubble(r,fx.n>0?`Pfeil +${fx.n}`:`Pfeil −${-fx.n}`,fx.n>0?'good':'bad');
        await pause(r,'field',{title:fx.n>0?`Pfeil: ${fx.n} vor`:`Pfeil: ${-fx.n} zurück`,why:'Pfeilfelder schicken jeden, der darauf landet, sofort weiter. Das zählt nicht zum Hauptzug.'});
        await move(r,fx.n);
        return;
      }
    }else if(fx.t==='upsi'){
      r.trip=true;log(`${nm(r)} landet auf einem Hoppla-Feld und stolpert.`);bubble(r,'Hoppla!','bad');sfx('bad');
      await pause(r,'field',{title:'Hoppla-Feld',why:'Wer hier landet, stolpert: Der nächste Hauptzug fällt aus.'});
    }else if(fx.t==='star'){
      r.stars++;log(`${nm(r)} landet auf einem Sternfeld: +1 Stern.`);bubble(r,'+1 ★','gold');
      await pause(r,'field',{title:'Sternfeld',why:'Jeder Stern zählt am Ende des Rennens einen Punkt.'});
    }
  }
  let here=at(r.pos,r);
  if(has(r,'mund')&&here.length===1){
    const v=here[0];
    log(`${nm(r)} verschluckt ${nm(v)}. Ausgeschieden!`);
    await trig(r,'mund');
    await eat(v);
    if(G.over) return;
    here=at(r.pos,r);
  }
  if(has(r,'baba')&&here.length){
    here.forEach(x=>{x.trip=true;bubble(x,'Gestolpert!','bad');});
    log(`${nm(r)} landet bei ${here.map(nm).join(', ')}: Stolperfluch!`);
    await trig(r,'baba');
  }
  const hx=here.find(x=>has(x,'baba'));
  if(hx){r.trip=true;log(`${nm(r)} landet bei ${nm(hx)} und stolpert.`);bubble(r,'Gestolpert!','bad');await trig(hx,'baba');}
  if(at(r.pos,r).length===1){
    for(const h of act().filter(x=>has(x,'romantiker'))){
      if(G.over) return;
      log(`Zwei auf einem Feld: ${nm(h)} zieht 2 Felder.`);
      await trig(h,'romantiker');
      await move(h,2);
    }
  }
}

async function teleport(r,p,land=true){
  if(G.over||r.fin||r.out) return;
  const f=r.fig;
  if(f&&!TEST){f.busy=true;await tween(170,t=>f.g.scale.setScalar(.85*(1-t)+.01));}
  r.pos=p;
  if(f){f.g.position.copy(slotPos(r));if(!TEST)await tween(200,t=>f.g.scale.setScalar(.85*t+.01));f.g.scale.setScalar(.85);f.busy=false;}
  if(land){await babyCheck(r);await landed(r);}
}
async function swap(a,b){
  const pa=a.pos,pb=b.pos;
  if(a.fig&&!TEST){a.fig.busy=b.fig.busy=true;await tween(170,t=>{a.fig.g.scale.setScalar(.85*(1-t)+.01);b.fig.g.scale.setScalar(.85*(1-t)+.01);});}
  a.pos=pb;b.pos=pa;
  for(const x of [a,b]) if(x.fig) x.fig.g.position.copy(slotPos(x));
  if(a.fig&&!TEST) await tween(200,t=>{a.fig.g.scale.setScalar(.85*t+.01);b.fig.g.scale.setScalar(.85*t+.01);});
  for(const x of [a,b]) if(x.fig){x.fig.g.scale.setScalar(.85);x.fig.busy=false;}
}
async function eat(v){
  v.out=true;v.outAt=++G.outCount;sfx('bad');
  if(v.fig&&!TEST){const f=v.fig;f.busy=true;await tween(380,t=>{f.g.scale.setScalar(.85*(1-t)+.001);f.g.rotation.y+=.3;});f.g.visible=false;}
  checkEnd();
}
async function finish(r){
  r.fin=true;r.pos=T;G.placed.push(r);r.place=G.placed.length;
  sfx('fin');bubble(r,`${r.place}. Platz!`,'gold');
  log(`${nm(r)} ist im Ziel: <b>${r.place}. Platz</b>!`);
  await pause(r,'info',{title:`${r.place}. Platz!`,kick:'Im Ziel',why:r.place===1?'Sobald ein zweiter Läufer ins Ziel kommt, ist das Rennen vorbei.':''});
  if(r.place===1){
    const s=G.racers.find(x=>x.pred===r&&!x.fin&&!x.out);
    if(s){
      log(`${nm(s)} hat es vorhergesagt! Das Rennen endet, ${esc(s.def.n)} wird Zweite.`);
      await trig(s,'superhirn');
      s.fin=true;s.pos=T;G.placed.push(s);s.place=2;
    }
  }
  checkEnd();
}
function checkEnd(){
  if(G.placed.length>=2){G.over=true;return;}
  const a=act();
  if(!a.length){G.over=true;return;}
  if(a.length===1){
    const x=a[0];x.fin=true;x.pos=T;G.placed.push(x);x.place=G.placed.length;
    log(`${nm(x)} ist als Einzige übrig und bekommt Platz ${x.place}.`);
    G.over=true;
  }
}

/* ---------- turn ---------- */
async function turn(r){
  const start=r.pos;
  renderWho(r);
  if(r.trip){
    r.trip=false;
    log(`${nm(r)} steht nach dem Stolpern wieder auf. Kein Hauptzug.`);
    bubble(r,'Aufstehen …');
    await pause(r,'info',{title:'Aufstehen',kick:'Gestolpert',why:'Wer gestolpert ist, setzt den nächsten Hauptzug aus. Fähigkeiten wirken trotzdem weiter.'});
    await sleep(650);
    await endTurn(r,start);return;
  }
  if(has(r,'superhirn')&&!r.predDone){
    r.predDone=true;
    const opts=act().filter(x=>x!==r);
    if(opts.length){
      const v=await choose(r,'Vorhersage: Wer gewinnt dieses Rennen?',opts.map(x=>({l:`${x.def.e} ${esc(x.def.n)}`,v:x,k:'ghost'})),
        os=>{const c=os.map(o=>o.v).filter(x=>!team(r,x));const pool=c.length?c:os.map(o=>o.v);return pool.sort((a,b)=>b.def.r-a.def.r||Math.random()-.5)[0];});
      r.pred=v;log(`${nm(r)} sagt den Sieg von ${nm(v)} voraus.`);bubble(r,'Ich sehe …');
    }
  }
  if(has(r,'hase')){
    const o=act().filter(x=>x!==r);
    if(o.length&&o.every(x=>x.pos<r.pos)){
      log(`${nm(r)} liegt allein vorne und macht ein Nickerchen.`);
      bubble(r,'Zzz …');await trig(r,'hase');await sleep(400);
      await endTurn(r,start);return;
    }
  }
  await preMain(r);
  if(G.over||r.fin||r.out) return;
  await mainMove(r);
  if(G.over) return;
  await endTurn(r,start);
}

async function preMain(r){
  const a=ab(r);
  if(a==='loser'){
    const o=act().filter(x=>x!==r);
    if(o.length&&o.every(x=>x.pos>r.pos)){r.stars++;log(`${nm(r)} ist allein Letzter und bekommt einen Stern.`);await trig(r,'loser');}
  }else if(a==='party'){
    log(`${nm(r)} feiert: Alle rücken 1 Feld heran.`);
    await trig(r,'party');
    const os=act().filter(x=>x!==r).sort((x,y)=>Math.abs(y.pos-r.pos)-Math.abs(x.pos-r.pos));
    for(const x of os){
      if(G.over||r.fin||r.out) return;
      if(x.fin||x.out) continue;
      if(x.pos<r.pos) await move(x,1); else if(x.pos>r.pos) await move(x,-1);
    }
    r.partyBonus=at(r.pos,r).length;
  }else if(a==='hypno'){
    const ts=act().filter(x=>x!==r&&x.pos!==r.pos);
    if(ts.length){
      const v=await choose(r,'Einen Läufer auf dein Feld beamen?',[{l:'Niemanden',v:null,k:'ghost'},...ts.sort((x,y)=>y.pos-x.pos).map(x=>({l:`🌀 ${x.def.e} ${esc(x.def.n)} (Feld ${x.pos})`,v:x,k:'alt'}))],
        os=>{const c=os.filter(o=>o.v&&!team(r,o.v)&&o.v.pos>r.pos).sort((x,y)=>y.v.pos-x.v.pos);return c.length?c[0].v:null;});
      if(v){log(`${nm(r)} beamt ${nm(v)} auf Feld ${r.pos}.`);await trig(r,'hypno');await teleport(v,r.pos,true);}
    }
  }else if(a==='cheer'){
    const min=Math.min(...act().map(x=>x.pos));
    const lasts=act().filter(x=>x.pos===min);
    const v=await choose(r,`Die Letzten anfeuern (${lasts.map(x=>x.def.e).join(' ')} +2, du +1)?`,[{l:'📣 Anfeuern',v:1},{l:'Lieber nicht',v:0,k:'ghost'}],
      ()=>lasts.some(x=>team(r,x))?1:0);
    if(v){
      log(`${nm(r)} feuert die Letzten an.`);await trig(r,'cheer');
      for(const x of lasts){if(G.over) return; await move(x,2);}
      if(!G.over) await move(r,1);
    }
  }else if(a==='rad'){
    const spots=[...new Set(act().filter(x=>x!==r).map(x=>x.pos))].filter(p=>p>0&&p!==r.pos&&at(p,r).length===2).sort((x,y)=>y-x);
    if(spots.length){
      const v=await choose(r,'Dich auf ein Feld mit genau 2 Läufern beamen?',[{l:'Bleiben',v:null,k:'ghost'},...spots.map(p=>({l:`🧳 Feld ${p}`,v:p,k:'alt'}))],
        os=>{const c=os.filter(o=>o.v!==null&&o.v>r.pos+2);return c.length?c[0].v:null;});
      if(v!==null&&v!==undefined){log(`${nm(r)} beamt sich auf Feld ${v}.`);await trig(r,'rad');await teleport(r,v,true);}
    }
  }
}

async function roll(r,label){
  const d=rnd(6);
  await showDice([d],label||r.def.e);
  return d;
}

async function mainMove(r){
  const a=ab(r);
  const human=!isCPU(r)&&!TEST;
  if(a==='lulatsch'){
    const v=await choose(r,'Würfeln oder genau 5 Felder ziehen?',[{l:'🎲 Würfeln',v:'roll'},{l:'🦒 Genau 5 ziehen',v:'five',k:'alt'}],
      ()=>(T-r.pos<5&&act().some(x=>x!==r&&has(x,'besser')))?'roll':'five');
    if(v==='five'){log(`${nm(r)} nimmt den Stelzschritt.`);await trig(r,'lulatsch');return doMain(r,5);}
  }else if(a==='flip'){
    const ts=act().filter(x=>x!==r&&x.pos!==r.pos).sort((x,y)=>y.pos-x.pos);
    if(ts.length){
      const v=await choose(r,'Würfeln oder Platz tauschen?',[{l:'🎲 Würfeln',v:null},...ts.map(x=>({l:`⇄ ${x.def.e} ${esc(x.def.n)} (Feld ${x.pos})`,v:x,k:'alt'}))],
        os=>{const c=os.filter(o=>o.v&&!team(r,o.v)&&o.v.pos-r.pos>=4);return c.length?c[0].v:null;});
      if(v){log(`${nm(r)} tauscht den Platz mit ${nm(v)}.`);await trig(r,'flip');await swap(r,v);return;}
    }
  }
  let guess=null;
  if(a==='genie'){
    guess=await choose(r,'Tipp: Welche Zahl würfelst du?',[1,2,3,4,5,6].map(n=>({l:String(n),v:n,k:'warm'})),()=>rnd(6));
    log(`${nm(r)} tippt auf eine ${guess}.`);
  }else if(human&&a!=='lulatsch'&&a!=='flip'){
    await choose(r,'Du bist dran.',[{l:'🎲 Würfeln',v:1}]);
  }
  if(G.over||r.fin||r.out) return;
  let d=await roll(r);
  log(`${nm(r)} würfelt eine ${d}.`);
  let mag=a==='magier'?2:0,dealt=false;
  for(;;){
    const dealers=act().filter(x=>has(x,'dealer'));
    const canDeal=!dealt&&dealers.length>0;
    if(mag<=0&&!canDeal) break;
    const v=await choose(r,`Gewürfelt: ${d}. Neu würfeln?${mag>0?` (noch ${mag}× Zauber)`:''}`,[{l:`Behalten (${d})`,v:0,k:'ghost'},{l:'🎲 Neu würfeln',v:1,k:'alt'}],
      ()=>d<=(a==='magier'?3:2)?1:0);
    if(!v) break;
    if(mag>0){mag--;await trig(r,'magier');}
    else{
      dealt=true;
      for(const w of dealers){if(G.over) return; log(`${nm(w)} zieht beim Neuwurf 1 Feld.`);await trig(w,'dealer');await move(w,1);}
      if(G.over||r.fin||r.out) return;
    }
    d=await roll(r);
    log(`${nm(r)} würfelt neu: ${d}.`);
  }
  let cancel=false;
  if(d===1){
    const sk=act().find(x=>x!==r&&has(x,'skipper'));
    if(sk){G.skipNext=sk;log(`Eine 1! ${nm(sk)} ist als Nächstes dran.`);await trig(sk,'skipper');}
    const rp=act().filter(x=>x!==r&&has(x,'raupe'));
    if(rp.length){
      cancel=true;log(`Eine 1! Der Zug von ${nm(r)} fällt aus.`);
      for(const x of rp){if(G.over) return; await trig(x,'raupe');await move(x,1);}
    }
  }
  if(d===6&&!G.over){
    for(const x of act().filter(x=>x!==r&&has(x,'diener'))){if(G.over) return; log(`${nm(x)} eilt bei der 6 voraus.`);await trig(x,'diener');await move(x,2);}
    if(a==='sisyphos'&&!r.fin&&!r.out){
      cancel=true;
      if(r.stars>0){r.stars--;log(`${nm(r)} würfelt die 6: zurück zum Start, ein Stern weg.`);}
      else{const pl=G.players[r.owner];pl.score=Math.max(0,pl.score-1);log(`${nm(r)} würfelt die 6: zurück zum Start, keine Sterne mehr, 1 Punkt weg.`);renderScores();}
      await trig(r,'sisyphos');await teleport(r,0,false);
    }
  }
  if(guess!==null){
    if(guess===d&&!G.skipNext){r.extra=true;log(`${nm(r)} hat richtig getippt und ist gleich noch einmal dran.`);await trig(r,'genie');}
    else if(guess!==d) log(`${nm(r)} lag daneben.`);
  }
  if(cancel||G.over||r.fin||r.out) return;
  let base=d;
  if(a==='alchemist'&&d<=2){
    const v=await choose(r,`Eine ${d}! Stattdessen 4 ziehen?`,[{l:`${d} ziehen`,v:0,k:'ghost'},{l:'🍀 4 ziehen',v:1,k:'alt'}],()=>1);
    if(v){base=4;log(`${nm(r)} macht aus der ${d} eine 4.`);await trig(r,'alchemist');}
  }
  if(a==='raketen'){
    const v=await choose(r,`${d} verdoppeln auf ${d*2}? Danach stolperst du.`,[{l:`${d} ziehen`,v:0,k:'ghost'},{l:`💥 ${d*2} ziehen`,v:1,k:'alt'}],()=>d>=4||T-r.pos<=d*2?1:0);
    if(v){base=d*2;r.tripAfter=true;log(`${nm(r)} zündet die Rakete: ${d*2}!`);await trig(r,'raketen');}
  }
  if(G.over||r.fin||r.out) return;
  await doMain(r,base);
}

async function doMain(r,base){
  const a=ab(r);let n=base;const parts=[String(base)];
  if(a==='hase'){n+=2;parts.push('+2 Turbo');await trig(r,'hase',true);}
  if(a==='zeppelin'){
    if(r.pos<G.K2){n+=3;parts.push('+3 Wind');}else{n-=1;parts.push('−1 Gegenwind');}
    await trig(r,'zeppelin',true);
  }
  for(const s of act().filter(x=>x!==r&&has(x,'schmodder'))){n-=1;parts.push('−1 Schleim');await trig(s,'schmodder',true);}
  for(const c of act().filter(x=>x.pos===r.pos&&has(x,'coach'))){n+=1;parts.push('+1 Coach');await trig(c,'coach',true);}
  if(a==='party'&&r.partyBonus){n+=r.partyBonus;parts.push(`+${r.partyBonus} Party`);}
  n=Math.max(0,n);
  if(G.over||r.fin||r.out) return;
  log(parts.length>1?`${nm(r)} zieht ${parts.join(' ')} = <b>${n}</b> Felder, ab Feld ${r.pos}.`:`${nm(r)} zieht <b>${n}</b> Felder, ab Feld ${r.pos}.`);
  if(parts.length>1&&G.explain==='abil') await pause(r,'abil',{title:`${n} statt ${base} Felder`,kick:'Hauptzug mit Zuschlägen',why:'Zu- und Abschläge kommen von Fähigkeiten im Rennen. Wer sie auslöst, steht in der Zeile darüber.'});
  else await pause(r,'main',{title:`${n} Felder`});
  r.lastMove=n;
  await move(r,n,{main:true});
  if(r.tripAfter){r.tripAfter=false;if(!r.fin&&!r.out){r.trip=true;bubble(r,'Gestolpert!','bad');}}
}

async function endTurn(r,start){
  if(G.over) return;
  if(!r.fin&&!r.out&&Math.abs(r.pos-start)<=1){
    for(const h of act().filter(x=>has(x,'laester'))){
      if(G.over) return;
      log(`${nm(r)} kommt kaum vom Fleck. ${nm(h)} lacht und zieht 2 Felder.`);
      await trig(h,'laester');await move(h,2);
    }
  }
  await duels();
}

async function duels(){
  for(let guard=0;guard<6&&!G.over;guard++){
    let found=false;
    for(const d of act().filter(x=>has(x,'duell'))){
      if(G.over) return;
      if(d.fin||d.out||d.pos<=0) continue;
      for(const o of at(d.pos,d)){
        if(G.over||d.fin||d.out||o.pos!==d.pos) break;
        const key=d.def.id+'|'+o.def.id;
        if(G.duelled.has(key)) continue;
        G.duelled.add(key);found=true;
        const v=await choose(d,`${o.def.e} ${esc(o.def.n)} steht auf deinem Feld. Duell?`,[{l:'🤺 Duell!',v:1,k:'alt'},{l:'Lieber nicht',v:0,k:'ghost'}],()=>1);
        if(!v||G.over) continue;
        await trig(d,'duell');
        const x=rnd(6),y=rnd(6);
        await showDice([x,y],`${d.def.e} gegen ${o.def.e}`);
        const w=x>=y?d:o;
        log(`Duell: ${nm(d)} ${x} gegen ${nm(o)} ${y}. ${nm(w)} zieht 2 Felder.`);
        await pause(w,'abil',{id:'duell',title:'Duell entschieden',kick:'Duell gewonnen'});
        await move(w,2);
      }
    }
    if(!found) break;
  }
}

/* ---------- race flow ---------- */
function mkRacer(def,owner){
  return {def,base:def.id,owner,pos:0,fin:false,out:false,trip:false,tripAfter:false,copy:null,stars:0,pred:null,predDone:false,extra:false,place:0,lastMove:0,partyBonus:0,fig:null};
}

async function preRace(){
  for(const r of G.order){
    if(r.base==='zwilling'){
      const ws=[...new Set(G.winners)].filter(id=>id!=='zwilling'&&id!=='ei');
      if(ws.length){
        const v=await choose(r,`${dn(r.def)}: Welche Siegerfähigkeit übernimmst du?`,[{l:'Keine',v:null,k:'ghost'},...ws.map(id=>({l:dn(D[id]),v:id,k:'alt'}))],
          os=>{const c=os.filter(o=>o.v).sort((a,b)=>D[b.v].r-D[a.v].r);return c.length?c[0].v:null;});
        if(v){r.copy=v;log(`${nm(r)} übernimmt die Fähigkeit von ${dn(D[v])}.`);await trig(r,'zwilling');}
      }else log(`${nm(r)} findet noch keinen Sieger zum Kopieren.`);
    }
    if(r.base==='ei'){
      const three=G.deck.splice(0,3);
      if(three.length){
        const v=await choose(r,`${dn(r.def)}: Welche Fähigkeit nimmst du?`,three.map(d=>({l:`${d.e} ${esc(d.n)}`,v:d.id,k:'alt'})),
          os=>os.slice().sort((a,b)=>D[b.v].r-D[a.v].r)[0].v);
        r.copy=v;G.deck.push(...three);
        log(`${nm(r)} zieht ${three.map(d=>d.e).join(' ')} und nimmt ${dn(D[v])}.`);await trig(r,'ei');
      }
    }
  }
  for(const r of G.order) if((r.copy||r.base)==='sisyphos'){r.stars=4;log(`${nm(r)} startet mit 4 Sternen.`);}
}

async function runRace(){
  G.idx=0;G.ops=0;G.outCount=0;G.over=false;G.turns=0;G.skipNext=null;G.placed=[];
  while(!G.over){
    if(++G.turns>500){forceEnd();break;}
    const r=G.order[G.idx];
    if(!r.fin&&!r.out){
      G.duelled=new Set();G.seen=new Set();G.budget=0;G.pend=[];r.extra=false;r.partyBonus=0;G.focus=r;
      await turn(r);
      renderWho(r);
      await sleep(320);
    }
    if(G.over) break;
    if(G.skipNext){
      const s=G.skipNext;G.skipNext=null;
      if(!s.fin&&!s.out){G.idx=G.order.indexOf(s);continue;}
    }
    if(r.extra&&!r.fin&&!r.out){r.extra=false;continue;}
    G.idx=(G.idx+1)%G.order.length;
  }
}
function forceEnd(){
  G.over=true;log('Endlosschleife: Das Rennen endet sofort, offene Plätze bringen keine Punkte.');
}

function scoreRace(){
  const res=[];
  G.placed.slice(0,2).forEach((r,i)=>{
    const pts=(i===0?G.P1:G.P2)+G.inc*(G.race-1);
    G.players[r.owner].score+=pts;
    if(i===0){G.players[r.owner].firsts++;G.winners.push(r.base);}
    res.push({r,pts,place:i+1});
  });
  const stars=G.racers.filter(r=>r.stars>0);
  stars.forEach(r=>G.players[r.owner].score+=r.stars);
  // who starts next race: first eliminated, else furthest behind
  const outs=G.racers.filter(r=>r.out).sort((a,b)=>a.outAt-b.outAt);
  if(outs.length) G.nextStart=outs[0].owner;
  else{
    const rest=G.racers.filter(r=>!r.fin);
    const pool=rest.length?rest:G.racers;
    const min=Math.min(...pool.map(r=>r.fin?99:r.pos));
    const cand=pool.filter(r=>(r.fin?99:r.pos)===min);
    G.nextStart=cand[Math.floor(Math.random()*cand.length)].owner;
  }
  return {res,stars};
}

/* ---------- game flow ---------- */
async function startGame(){
  try{
    const n=G.players.length;
    G.per=n===2?8:4;G.perRace=n===2?2:1;
    G.players.forEach(p=>{p.team=[];p.used=new Set();p.score=0;p.firsts=0;});
    REM.inGame=true;REM.onChange=null;lobbyAngebot();
    G.players.forEach((pl,i)=>{if(pl.remote) remSend('platz',{an:pl.remote,name:pl.name,farbe:PCOL[i]});});
    remStatus('Das Spiel startet …');
    G.winners=[];G.race=0;G.log=[];G.nextStart=Math.floor(Math.random()*n);
    await draft();
    for(G.race=1;G.race<=4;G.race++){
      G.side=G.race%2===1?'ruhig':'wild';
      const chosen=await selectRacers();
      buildRace(chosen);
      showRaceUI();
      log(`<b>Rennen ${G.race} startet ${SIDEAT[G.side]}!</b> ${esc(G.players[G.nextStart].name)} beginnt.`);
      await sleep(500);
      await preRace();
      await runRace();
      G.raceTurns.push(G.turns);
      await sleep(900);
      const sr=scoreRace();
      renderScores();
      await showRaceEnd(sr);
    }
    await showFinal();
  }catch(e){
    console.error(e);G.errors.push(String(e&&e.stack||e));
    if(TEST){window.__done=true;return;}
    screen(`<h2>Da ist etwas schiefgelaufen</h2><p class="lead">${esc(e.message||e)}</p><div class="stick"><button class="btn big" id="again">Zurück zum Start</button></div>`,'narrow');
    $('#again').onclick=showSetup;
  }
}

async function draft(){
  const n=G.players.length;
  let all=shuffle(RACERS.slice());
  if(TEST&&qs.get('force')){const f=qs.get('force').split(',');all=[...f.map(id=>D[id]),...all.filter(d=>!f.includes(d.id))];}
  G.deck=all;
  const rounds=G.per/2,total=n*G.per;let k=0;
  let startP=Math.floor(Math.random()*n);
  for(let round=0;round<rounds;round++){
    G.pool=G.deck.splice(0,2*n);
    const seq=[];
    for(let i=0;i<n;i++) seq.push((startP+i)%n);
    for(let i=n-1;i>=0;i--) seq.push((startP+i)%n);
    for(const p of seq) await pickDraft(p,++k,total,round+1,rounds);
    G.deck.push(...G.pool);G.pool=[];
    startP=(startP+1)%n;
  }
  shuffle(G.deck);
}

}

function pickDraft(p,k,total,round,rounds){
  return new Promise(res=>{
    const pl=G.players[p];
    screen(`<h2>Läufer wählen</h2>
      <p class="sub"><i class="dot" style="background:${pc(p)}"></i><b>${esc(pl.name)}</b> ${pl.cpu?'wählt …':pl.remote?'wählt am Handy …':'ist dran.'} Auslage ${round} von ${rounds}: Es wird hin und wieder zurück gewählt (Wahl ${k} von ${total}).</p>
      ${teamsHTML()}
      <div class="grid">${G.pool.map(d=>cardHTML(d)).join('')}</div>
      ${pl.cpu?'<div class="stick"></div>':pl.remote?'<div class="stick"><button class="btn ghost" id="takeover">Computer übernimmt</button></div>':`<div class="stick"><button class="btn big" id="take" disabled>Tippe einen Läufer an</button></div>`}`);
    const take=id=>{const d=D[id];G.pool=G.pool.filter(x=>x.id!==id);pl.team.push(d);sfx('click');res();};
    const cpuWahl=()=>{
      const F=TEST&&qs.get('force')?qs.get('force').split(','):[];const best=G.pool.slice().sort((a,b)=>(b.r+Math.random()*1.6+(F.includes(b.id)?99:0))-(a.r+Math.random()*1.6+(F.includes(a.id)?99:0)))[0];
      const el=$(`#screen .rc[data-id="${best.id}"]`);
      sleep(380).then(()=>{if(el){el.classList.add('sel');el.scrollIntoView({block:'nearest',behavior:'smooth'});}return sleep(520);}).then(()=>take(best.id));
    };
    if(pl.cpu||TEST){cpuWahl();return;}
    if(pl.remote){
      remStatus(`${pl.name} wählt einen Läufer (Wahl ${k} von ${total}).`);
      const t=$('#takeover');if(t) t.onclick=()=>remTakeover(p,'vom Spielleiter ersetzt');
      askRemote(p,{art:'karten',titel:`Wahl ${k} von ${total}: Wähle einen Läufer für dein Team.`,anzahl:1,karten:G.pool.map(cardData)})
        .then(ids=>{if(ids===null) cpuWahl(); else take(ids[0]);});
      return;
    }
    let sel=null;const btn=$('#take');
    $('#screen .grid').addEventListener('click',e=>{
      const c=e.target.closest('.rc');if(!c) return;
      $('#screen .grid').querySelectorAll('.rc.sel').forEach(x=>x.classList.remove('sel'));
      c.classList.add('sel');sel=c.dataset.id;sfx('click');
      btn.disabled=false;btn.textContent=`${D[sel].n} nehmen`;
    });
    btn.onclick=()=>{if(sel) take(sel);};
  });
}

async function selectRacers(){
  const n=G.players.length,chosen=Array.from({length:n},()=>[]);
  const localHumans=G.players.filter(p=>!p.cpu&&!p.remote).length;
  const remotes=G.players.filter(p=>p.remote).length;
  G.secret=(localHumans+remotes>1)&&!TEST;
  for(let k=0;k<n;k++){
    const p=(G.nextStart+k)%n;
    if(G.secret&&localHumans>1&&!G.players[p].cpu&&!G.players[p].remote) await passTo(p);
    chosen[p]=await pickForRace(p,chosen);
  }
  return chosen;
}
function passTo(p){
  return new Promise(res=>{
    screen(`<h2>Gerät weitergeben</h2><p class="lead">Rennen ${G.race} ${SIDEAT[G.side]}. Gib das Gerät an <b>${esc(G.players[p].name)}</b>. Die Wahl ist geheim, bis alle gewählt haben.</p>

    $('#ok').onclick=()=>{sfx('click');res();};

}
function pickForRace(p,chosen){
  return new Promise(res=>{
    const pl=G.players[p],need=G.perRace;
    const avail=pl.team.filter(d=>!pl.used.has(d.id));
    const others=chosen.map((c,i)=>c.length?`<div class="team"><i class="dot" style="background:${pc(i)}"></i>${esc(G.players[i].name)} ${G.secret?'hat geheim gewählt':`schickt <span class="em">${c.map(d=>d.e).join('')}</span>`}</div>`:'').join('');
    screen(`<h2>Rennen ${G.race} von 4: ${SIDES[G.side]}</h2>
      <p class="sub"><i class="dot" style="background:${pc(p)}"></i><b>${esc(pl.name)}</b> ${pl.cpu?'wählt …':pl.remote?'wählt am Handy …':`wählt ${need===1?'einen Läufer':'zwei Läufer'} für dieses Rennen.`}</p>
      <div class="teams">${others||'<span class="team">Noch hat niemand gewählt.</span>'}</div>
      <div class="grid">${avail.map(d=>cardHTML(d)).join('')}</div>
      ${pl.cpu?'<div class="stick"></div>':pl.remote?'<div class="stick"><button class="btn ghost" id="takeover">Computer übernimmt</button></div>':`<div class="stick"><button class="btn big" id="take" disabled>${need===1?'Tippe einen Läufer an':'Tippe zwei Läufer an'}</button></div>`}`);
    const done=ids=>{ids.forEach(id=>pl.used.add(id));sfx('click');res(ids.map(id=>D[id]));};
    const cpuWahl=()=>{
      const pick=shuffle(avail.slice()).slice(0,need);
      sleep(450).then(()=>{pick.forEach(d=>{const el=$(`#screen .rc[data-id="${d.id}"]`);if(el)el.classList.add('sel');});return sleep(550);}).then(()=>done(pick.map(d=>d.id)));
    };
    if(pl.cpu||TEST){cpuWahl();return;}
    if(pl.remote){
      remStatus(`${pl.name} wählt ${need===1?'einen Läufer':'zwei Läufer'} für Rennen ${G.race}.`);
      const t=$('#takeover');if(t) t.onclick=()=>remTakeover(p,'vom Spielleiter ersetzt');
      askRemote(p,{art:'karten',titel:`Rennen ${G.race}: ${need===1?'Wähle einen Läufer':'Wähle zwei Läufer'} für dieses Rennen. Die Wahl bleibt geheim.`,anzahl:need,karten:avail.map(cardData)})
        .then(ids=>{if(ids===null) cpuWahl(); else done(ids);});
      return;
    }
    const sel=[];const btn=$('#take');
    $('#screen .grid').addEventListener('click',e=>{
      const c=e.target.closest('.rc');if(!c) return;
      const id=c.dataset.id,i=sel.indexOf(id);
      if(i>=0){sel.splice(i,1);c.classList.remove('sel');}
      else{
        if(sel.length>=need){const old=sel.shift();$(`#screen .rc[data-id="${old}"]`).classList.remove('sel');}
        sel.push(id);c.classList.add('sel');
      }
      sfx('click');
      btn.disabled=sel.length!==need;
      btn.textContent=sel.length===need?`Mit ${sel.map(id=>D[id].n).join(' und ')} starten`:(need===1?'Tippe einen Läufer an':`Noch ${need-sel.length} antippen`);
    });
    btn.onclick=()=>{if(sel.length===need) done(sel.slice());};
  });
}

function buildRace(chosen){

/* ---------- Handys als Mitspieler ----------
   Das Spiel läuft nur auf diesem Gerät (Beamer/Tablet). Handys treten über einen Raum bei (Echtzeit-Kanal, nichts wird gespeichert)
   und bekommen nur die Entscheidungen ihres Spielers gestellt: Frage → Antwort. Fällt ein Handy aus, spielt der Computer weiter. */
const REM={kanal:null,code:null,id:null,phones:new Map(),qid:0,pending:null,gone:new Map(),onChange:null,inGame:false};
const plain=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim();};
const cardData=d=>({id:d.id,e:d.e,n:d.n,t:txt(d),c:d.c});
const remUrl=()=>new URL('handy/?raum='+REM.code,location.href).href;
function remSend(ev,d){if(REM.kanal) REM.kanal.sende(ev,d);}
function remStatus(text){remSend('status',{text});}
function remOpen(){
  if(REM.kanal||!window.Echtzeit||!window.Spielraum) return;
  REM.code=window.Spielraum.neuerCode();REM.id=window.Spielraum.meineId();
  REM.phones=new Map();
  REM.kanal=window.Echtzeit.oeffnen('chaosflitzer-'+REM.code,{schluessel:REM.id,beiNachricht:remMsg,beiAnwesenheit:remPresence});
  REM.kanal.verfolge({id:REM.id,rolle:'host'});
}
function remClose(){
  if(REM.kanal) REM.kanal.schliessen();
  REM.kanal=null;REM.code=null;REM.phones=new Map();REM.pending=null;REM.inGame=false;
  if(LOBBY) LOBBY.setze({angebot:null,spielt:null});
  REM.gone.forEach(t=>clearTimeout(t));REM.gone.clear();
}
function remPresence(liste){
  const neu=new Map();
  liste.forEach(x=>{if(x&&x.rolle==='spieler'&&typeof x.id==='string') neu.set(x.id,{id:x.id,name:window.Spielraum.bereinige(x.name)||'Gast'});});
  REM.phones=neu;
  if(REM.inGame){
    // Plätze, deren Handy fehlt: nach 20 Sekunden übernimmt der Computer
    G.players.forEach((pl,i)=>{
      if(!pl.remote) return;
      if(neu.has(pl.remote)){clearTimeout(REM.gone.get(pl.remote));REM.gone.delete(pl.remote);}
      else if(!REM.gone.has(pl.remote)) REM.gone.set(pl.remote,setTimeout(()=>remTakeover(i,'Handy nicht mehr verbunden'),20000));
    });
  }
  if(REM.onChange) REM.onChange();
  if(!REM.inGame) lobbyAngebot();
}
function remMsg(ev,d){
  if(!d||typeof d!=='object') return;
  if(ev==='antwort'&&REM.pending&&d.qid===REM.pending.qid){
    const pl=G.players[REM.pending.p];
    if(!pl||!pl.remote||pl.remote!==d.von) return; // nur vom richtigen Handy
    const f=REM.pending.frage;let wahl=null;
    if(f.art==='wahl'){if(Number.isInteger(d.wahl)&&d.wahl>=0&&d.wahl<f.optionen.length) wahl=d.wahl;}
    else if(f.art==='karten'){
      const ids=Array.isArray(d.wahl)?[...new Set(d.wahl.map(String))]:[];
      if(ids.length===f.anzahl&&ids.every(id=>f.karten.some(k=>k.id===id))) wahl=ids;
    }
    if(wahl===null) return;
    const res=REM.pending.res;REM.pending=null;res(wahl);
  }else if(ev==='sync'&&typeof d.von==='string') remSync(d.von);
}
// Ein Handy meldet sich (neu geladen): Platz, offene Frage oder Wartetext noch einmal senden
function remSync(von){
  const i=G.players.findIndex(p=>p.remote===von);
  if(i>=0){
    remSend('platz',{an:von,name:G.players[i].name,farbe:PCOL[i]});
    if(REM.pending&&REM.pending.p===i) remSendQuestion(); else remSend('status',{an:von,text:'Du bist dabei. Weiter geht es am Beamer …'});
  }else if(REM.onChange) REM.onChange(); // Startbild: Platz neu zuweisen
}
function askRemote(i,frage){
  return new Promise(res=>{
    REM.pending={qid:++REM.qid,p:i,frage,res};
    remSendQuestion();
  });
}
function remSendQuestion(){
  const q=REM.pending;if(!q) return;
  const pl=G.players[q.p];if(!pl||!pl.remote) return;
  remSend('frage',Object.assign({an:pl.remote,qid:q.qid},q.frage));
}
function remTakeover(i,grund){
  const pl=G.players[i];if(!pl||!pl.remote) return;
  const id=pl.remote;
  pl.remote=null;pl.cpu=true;
  clearTimeout(REM.gone.get(id));REM.gone.delete(id);
  log(`${esc(pl.name)} wird vom Computer übernommen${grund?` (${esc(grund)})`:''}.`);
  remSend('status',{an:id,text:'Der Computer spielt jetzt für dich.'});
  if(REM.pending&&REM.pending.p===i){const res=REM.pending.res;REM.pending=null;res(null);}
}

/* ---------- Gastgeber in der Lobby der Klasse ----------
   Aufruf aus dem Spielraum: ?lobby=<Raumcode der Lobby>&host=1. Dann bleibt dieses Gerät in der Lobby (Anwesenheit) und zeigt dort
   „Anna sucht Mitspieler: Chaos-Flitzer“ mit der Zahl der Handys; wer in der Lobby einsteigt, öffnet die Handy-Seite dieses Spiels.
   Läuft das Spiel, steht es unter „Laufende Spiele“. */
const LOBBY_CODE=(qs.get('lobby')||'').toUpperCase();
const HOST_MODE=qs.get('host')==='1'&&!!window.Spielraum&&window.Spielraum.istCode(LOBBY_CODE);

function lobbyOpen(){
  if(LOBBY||!HOST_MODE) return;
  LOBBY=window.Spielraum.betreten(LOBBY_CODE,{name:window.Spielraum.meinName()||'Gastgeber'});
  window.addEventListener('pagehide',()=>{if(LOBBY) LOBBY.verlassen();});
}
function lobbyAngebot(){
  if(!LOBBY) return;
  if(REM.kanal&&!REM.inGame) LOBBY.setze({spielt:null,angebot:{partie:REM.code,spiel:'chaos-flitzer',code:REM.code,belegt:REM.phones.size}});
  else if(REM.kanal&&REM.inGame) LOBBY.setze({angebot:null,spielt:{partie:REM.code,spiel:'chaos-flitzer',gegner:`${G.players.length} Spieler`}});
}

      <div class="fine"><b>${REM.phones.size}</b> ${REM.phones.size===1?'Handy ist':'Handys sind'} verbunden. Mit „Handy“ bei einem Platz lässt du es mitspielen.</div>
      <div class="hnames">${namen}</div></div></div>`;
    window.QRCode.toString(remUrl(),{type:'svg',margin:0,errorCorrectionLevel:'M'},(f,svg)=>{const q=$('#hqr');if(!f&&q) q.innerHTML=svg;});
  };

  $('#handyB').onclick=()=>{
    sfx('click');
    if(REM.kanal){
      remClose();REM.userClosed=true;

      row.cpu=c==='1';row.handy=c==='2';if(c!=='2') row.phone=null;

  $('#tempo').onclick=e=>{const b=e.target.closest('button');if(!b) return;G.tempo=b.dataset.t;$('#tempo').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));};
  $('#rulesB').onclick=showRules;

    G.speed=TEMPO[G.tempo];
    G.players=setupPlayers.map((p,i)=>{
      const handy=!!(p.handy&&p.phone&&REM.phones.has(p.phone)); // ein Handy-Platz ohne Handy spielt der Computer
      return {name:(p.name||'').trim()||`Spieler ${i+1}`,cpu:!!p.cpu||(!!p.handy&&!handy),remote:handy?p.phone:null};
    });

  };
}

function showRules(){

  openPop(`<h2>So geht’s</h2><div class="rules">
    <p>Zuerst stellt jeder sein Team zusammen. Dafür werden doppelt so viele Läufer aufgedeckt, wie Leute mitspielen, und reihum gewählt: erst in der einen, dann in der anderen Richtung. Das passiert zweimal, danach hat jeder 4 Läufer (zu zweit: 8). Jeder Läufer läuft nur ein einziges Rennen.</p>
    <h3>Vier Rennen</h3>
    <ul>
      <li>Rennen 1 und 3 laufen auf der ruhigen ${SIDES.ruhig}, Rennen 2 und 4 im wilden ${SIDES.wild}.</li>
      <li>Vor jedem Rennen wählt jeder geheim seinen Läufer. Wer im letzten Rennen am weitesten hinten lag oder zuerst ausgeschieden ist, beginnt.</li>
      <li>Wer dran ist, würfelt und zieht so viele Felder: Das ist der <b>Hauptzug</b>. Fähigkeiten mit „darf“ sind freiwillig, alle anderen passieren immer.</li>
      <li>Sobald der zweite Läufer die Ziellinie überquert, ist das Rennen vorbei.</li>
    </ul>
    <h3>Felder im ${SIDES.wild}</h3>
    <ul>
      <li><b>Pfeil:</b> Wer darauf landet, zieht sofort die angezeigte Zahl weiter, grün nach vorn, rot zurück. Das ist ein eigener Zug, kein Teil des Hauptzugs.</li>
      <li><b>Warndreieck:</b> Wer darauf landet, stolpert.</li>
      <li><b>Stern:</b> Wer darauf landet, bekommt einen Stern (1 Punkt).</li>

    <h3>Begriffe</h3>

const R3={};

function canvasTex(w,h,draw){
